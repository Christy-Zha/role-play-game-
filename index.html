<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灵潮修仙录">
<meta name="theme-color" content="#16140f">
<title>灵潮修仙录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-screen phone game — status header, painted stage per tab, bottom tab rail; ink-and-ash wasteland. Single dark look by choice. */
:root{
  --bg:#16140f; --panel:#1f1c15; --panel2:#29251c; --line:#3a3427;
  --bone:#ece3cf; --mist:#a0967f; --dim:#6d6555;
  --jade:#8fd6b5; --jade-d:#2c6652; --cin:#cf4a3c; --cin-d:#5e231d; --gold:#e3b862;
  --r-fan:#bdb5a4; --r-ling:#7cc6e3; --r-bao:#c9a0f0; --r-xian:#e3b862; --r-chuan:#ff9a4a;
  --good:#8fd6b5; --bad:#e0705f;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
b,.num{font-variant-numeric:tabular-nums}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 6px}
.who{min-width:0}
.who .nm{font-size:12px;color:var(--mist);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .rl{font-family:var(--f-brush);font-size:25px;line-height:1.1;white-space:nowrap}
.res{display:flex;gap:14px;text-align:right;flex-shrink:0}
.res .lbl{display:block;font-size:11px;color:var(--dim);letter-spacing:.12em}
.res b{font-size:15px}
#hStones{color:var(--gold)}
.qi{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.qif{height:100%;width:0;background:linear-gradient(90deg,var(--jade-d),var(--jade));transition:width .2s}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:12px 18px;-webkit-overflow-scrolling:touch;min-height:0}

.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);padding-block:5px 3px}
.tab{position:relative;background:none;border:0;padding:3px 0;display:flex;flex-direction:column;align-items:center;color:var(--dim);min-width:0}
.tab .g{font-family:var(--f-brush);font-size:23px;line-height:1.15}
.tab .l{font-size:10.5px;letter-spacing:.12em;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--jade)}
.tab:disabled{opacity:.3}
.dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--cin);box-shadow:0 0 8px var(--cin)}

h2.sec{font-family:var(--f-brush);font-weight:400;font-size:22px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;text-wrap:balance;flex-wrap:wrap}
h2.sec small{font-family:var(--f-body);font-size:12px;color:var(--dim);letter-spacing:.04em}
h2.sec:first-child{margin-top:0}
.btn{border:1px solid var(--jade);background:var(--jade-d);color:var(--bone);padding:9px 16px;border-radius:4px;font-size:15px;letter-spacing:.08em}
.btn:disabled{opacity:.38;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mist)}
.btn.red{background:var(--cin-d);border-color:var(--cin)}
.btn.gold{background:rgba(227,184,98,.08);border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:var(--jade);color:var(--bg)}

/* 画面舞台 */
.stage{position:relative;width:100%;border-radius:6px;overflow:hidden;background:#0d0c09;border:1px solid var(--line);isolation:isolate}
.stage>canvas.bgc{position:absolute;inset:0;width:100%;height:100%;display:block}
.cstage{aspect-ratio:1/1;max-height:54vh;margin-inline:auto}
.hp{height:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;transition:width .2s}
.hp.p i{background:linear-gradient(90deg,var(--jade-d),var(--jade))}
.hp.e i{background:linear-gradient(90deg,#8a2a20,var(--cin))}
.b.r .hp i{margin-left:auto}
.banner{display:flex;align-items:center;gap:12px;border:1px solid var(--cin);background:linear-gradient(90deg,rgba(207,74,60,.18),transparent);padding:10px 12px;border-radius:6px;margin-bottom:10px}
.banner .t{flex:1;font-size:14px}
.banner .t small{display:block;font-size:12px;color:var(--mist)}

/* 修炼 */
.cult{display:flex;flex-direction:column;align-items:center;text-align:center}
.cstage{width:100%;cursor:pointer;touch-action:manipulation}
.sit{position:absolute;left:50%;bottom:4%;width:56%;transform:translateX(-50%)}
.sit svg{width:100%;display:block;overflow:visible}
.ring{position:absolute;left:50%;bottom:8%;width:74%;aspect-ratio:1;transform:translateX(-50%);pointer-events:none}
.ring svg{width:100%;height:100%;overflow:visible}
.spin{transform-origin:100px 100px;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cstage.full .sit{filter:drop-shadow(0 0 14px rgba(227,184,98,.7))}
.plus{position:absolute;pointer-events:none;font-family:var(--f-brush);font-size:22px;color:#c8ffe6;animation:up .9s ease-out forwards;white-space:nowrap;text-shadow:0 2px 4px #000}
.cname{position:absolute;top:10px;left:0;right:0;font-family:var(--f-brush);font-size:30px;text-shadow:0 2px 8px #000}
.ctap{position:absolute;bottom:10px;left:0;right:0;font-size:12px;color:rgba(236,227,207,.7);text-shadow:0 1px 3px #000}
.qi-num{color:var(--mist);font-size:14px;margin-top:10px}
.qi-num b{color:var(--bone)}
.rates{display:flex;gap:18px;justify-content:center;font-size:13px;color:var(--mist)}
.rates b{color:var(--jade)}
.break{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel)}
.break .t{font-size:13px;color:var(--mist);margin-bottom:8px}
.break .t em{font-style:normal;color:var(--bone)}
.break .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.gate{color:var(--cin)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mist)}
.pill input{accent-color:var(--jade);width:18px;height:18px}
.tip{font-size:12px;color:var(--dim);margin-top:12px;max-width:30em}

/* 玉简 */
.jstage{aspect-ratio:16/9}
.jinfo{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;text-shadow:0 1px 3px #000}
.expo{width:46%}
.expo .l{font-size:12px;color:var(--bone)}
.expo .hp i{background:linear-gradient(90deg,#8a6a2a,var(--cin))}
.jslots{display:grid;gap:10px;margin-top:12px}
.jslot{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel);display:flex;gap:12px;align-items:center}
.jslot .ic{width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-family:var(--f-brush);font-size:24px;border:1px solid var(--jade-d);background:radial-gradient(circle,rgba(143,214,181,.18),transparent);color:var(--jade)}
.jslot.ready .ic{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(227,184,98,.4)}
.jslot .in{flex:1;min-width:0}
.jslot .nm{font-size:15px}
.jslot .sub{font-size:12px;color:var(--mist)}
.jslot .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.jslot .bar i{display:block;height:100%;background:var(--jade)}
.picker{border:1px dashed var(--jade-d);border-radius:6px;padding:8px 12px;margin-top:-4px}
.picker .row2:last-child{border-bottom:0}

/* 列表 */
.karma{font-size:13px;color:var(--mist);margin-bottom:12px}
.karma b{color:var(--bone)}
.ch{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ch .th{width:52px;height:38px;border-radius:4px;overflow:hidden;position:relative;background:#0d0c09;border:1px solid var(--line)}
.ch .th canvas{position:absolute;inset:0;width:100%;height:100%}
.ch .th span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-brush);font-size:20px;text-shadow:0 1px 4px #000}
.ch .ct{font-size:15px}
.ch .ch-h{font-size:12px;color:var(--dim)}
.ch.new .ct{color:var(--gold)}
.ch.lock .ct{color:var(--dim)}
.ch.lock .th{filter:grayscale(1) brightness(.35)}
.ch.side .ct{font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:6px;padding:10px 8px;background:var(--panel);min-width:0;min-height:86px}
.slot .sl{font-size:11px;color:var(--dim);letter-spacing:.15em}
.slot .sn{font-size:14px;line-height:1.35;margin:2px 0}
.slot .ss{font-size:11px;color:var(--mist);line-height:1.4}
.r-fan .iname,.r-fan .sn{color:var(--r-fan)}
.r-ling .iname,.r-ling .sn{color:var(--r-ling)}
.r-bao .iname,.r-bao .sn{color:var(--r-bao)}
.r-xian .iname,.r-xian .sn{color:var(--r-xian)}
.r-chuan .iname,.r-chuan .sn{color:var(--r-chuan)}
.row2{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row2 .in{flex:1;min-width:0}
.row2 .iname{font-size:15px}
.row2 .istat{font-size:12px;color:var(--mist)}
.row2 .ibtn{display:flex;gap:6px;flex-shrink:0}
.up{color:var(--good);font-size:11px;margin-left:4px}
.empty{color:var(--dim);font-size:13px;padding:14px 0}
.lv{font-size:12px;color:var(--jade);margin-left:6px}
.save textarea{width:100%;height:84px;background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;resize:vertical;-webkit-user-select:text;user-select:text}
.save .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:12px;color:var(--dim);margin:6px 0}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--line);color:var(--bone);font-size:13px;padding:7px 14px;border-radius:4px;max-width:440px;display:flex;gap:10px;align-items:center;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.big{border-color:var(--gold);color:var(--gold);font-family:var(--f-brush);font-size:20px}
.toast.bad{border-color:var(--cin)}
.toast.big2{border-color:var(--gold);color:var(--gold)}
.toast button{background:none;border:1px solid var(--jade);color:var(--jade);border-radius:3px;padding:2px 8px;font-size:12px}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* 视觉小说 */
#ov{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:rgba(10,8,6,.92)}
#ov.vn{background:#000}
#ov .vbg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .4s}
#ov .inner{position:relative;width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--bone);letter-spacing:.1em;text-shadow:0 1px 4px #000;position:relative;z-index:3}
.st-top .tt{font-family:var(--f-brush);font-size:20px}
.st-skip{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:var(--bone);border-radius:3px;padding:3px 10px;font-size:12px}
.st-sp{flex:1}
.port{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);height:min(52vh,420px);aspect-ratio:200/240;transition:opacity .3s,transform .3s;pointer-events:none;z-index:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.port svg{width:100%;height:100%;display:block}
.port.l{left:-4%}
.port.r{right:-4%}
.port.hide{opacity:0}
.port.l.hide{transform:translateX(-12%)}
.port.r.hide{transform:translateX(12%)}
.port.dim{filter:brightness(.45) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.st-choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;position:relative;z-index:3}
.st-choices button{text-align:left;border:1px solid var(--jade);background:rgba(20,40,32,.88);color:var(--bone);padding:12px 14px;border-radius:4px;font-size:15px;animation:tin .3s ease-out both}
.st-box{position:relative;z-index:2;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(18,15,11,.88),rgba(10,8,6,.96));border-radius:6px;padding:12px 16px 18px;min-height:136px}
.st-s{position:absolute;top:-16px;left:14px;font-family:var(--f-brush);font-size:20px;line-height:1;color:var(--bg);background:var(--jade);padding:6px 14px 5px;border-radius:3px}
.st-s.cin{background:var(--cin);color:var(--bone)}
.st-s.gold{background:var(--gold)}
.st-x{font-size:16.5px;line-height:1.85;max-width:34em;white-space:pre-wrap;margin-top:8px}
.st-x.narr{color:#cfc6b2}
.st-more{position:absolute;right:12px;bottom:4px;color:var(--dim);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.modal{margin:auto 0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:22px 18px;text-align:center;position:relative;z-index:2}
.modal h3{font-family:var(--f-brush);font-weight:400;font-size:30px;margin:0 0 8px;color:var(--gold)}
.modal p{color:var(--mist);margin:6px 0;font-size:14px}
.modal p b{color:var(--bone)}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.intro{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:2}
.intro h1{font-family:var(--f-brush);font-weight:400;font-size:clamp(50px,17vw,80px);line-height:1;margin:0;text-shadow:0 4px 20px #000}
.intro h1 span{color:var(--jade)}
.intro p{color:#d8cfbb;margin:0;max-width:22em;font-size:14px;text-shadow:0 1px 4px #000}
.intro input{background:rgba(0,0,0,.4);border:0;border-bottom:1px solid var(--jade);color:var(--bone);font:inherit;font-size:20px;text-align:center;padding:6px;width:min(220px,80vw);-webkit-user-select:text;user-select:text}
.intro .yr{font-size:12px;letter-spacing:.3em;color:var(--mist)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:rgba(0,0,0,.4);border:0;padding:6px 18px;color:var(--mist)}
.seg button[aria-pressed="true"]{background:var(--jade-d);color:var(--bone)}

@media (prefers-reduced-motion:reduce){
  .spin,.st-more,.wl .mk{animation:none}
  .plus,.pt,.toast,.st-choices button,.healfx,.bpop{animation-duration:.01s}
}

.qcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.qcard.ready{border-color:var(--gold)}
.qcard .in{flex:1;min-width:0}
.qcard .iname{font-size:15px}
.qcard .istat{font-size:12px;color:var(--mist)}
.qcard .qp{color:var(--jade)}
@media (prefers-reduced-motion:reduce){.reach{animation:none}}


/* 江湖：等距地图 */
#view.full{padding:0;overflow:hidden;margin-left:calc(-1 * max(12px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(12px,env(safe-area-inset-right,0px)))}
.wv{position:relative;width:100%;height:100%;overflow:hidden;background:#050605;touch-action:none}
.wv canvas,#bt canvas,.travel canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.wlab{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wl{position:absolute;left:0;top:0;width:0;height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;will-change:transform}
.wl span{white-space:nowrap}
.wl>span:not(.bub):not(.pl):not(.bn){font-size:11px;color:var(--bone);background:rgba(8,7,5,.7);border-radius:3px;padding:0 5px;line-height:1.5;text-shadow:0 1px 2px #000}
.wl .mk{width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:13px;line-height:18px;text-align:center;box-shadow:0 0 10px rgba(227,184,98,.8);animation:mkb 1.2s ease-in-out infinite;font-weight:700}
.wl .mk.rd{background:var(--jade);box-shadow:0 0 10px rgba(143,214,181,.8)}
@keyframes mkb{50%{translate:0 -3px}}
.wl .pl{font-size:10.5px;color:var(--jade);background:rgba(8,7,5,.72);border:1px solid rgba(143,214,181,.45);border-radius:10px;padding:0 7px;line-height:1.55}
.wl .pl.g{color:var(--gold);border-color:rgba(227,184,98,.6)}
.wl .bn{font-family:var(--f-brush);font-size:15px;color:#ff8a70;text-shadow:0 0 6px rgba(255,60,40,.7),0 1px 2px #000}
.wl .bub{font-size:12px;color:#1b1712;background:#ece3cf;border-radius:8px;padding:3px 9px;max-width:200px;white-space:normal;text-align:center;line-height:1.4;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.5);animation:tin .2s ease-out;width:max-content}
.wl .bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#ece3cf;border-bottom:0}
.wl.b{z-index:2}
.whud{position:absolute;top:8px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none;text-shadow:0 1px 3px #000;max-width:58%}
.wloc b{display:block;font-family:var(--f-brush);font-weight:400;font-size:22px;line-height:1.1}
.wloc small{font-size:11px;color:var(--mist)}
.wbars{display:grid;gap:3px;width:132px}
.wb{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mist)}
.wb>i,.bb>i{flex:1;display:block;height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.wb>i>i,.bb>i>i,.li .hb>i{display:block;height:100%;transition:width .25s}
.hb>i{background:linear-gradient(90deg,#3f8a5a,#9ae0a0)}
.mb>i{background:linear-gradient(90deg,#2e5a8a,#7cc6e3)}
.wmeds{font-size:10.5px;color:var(--mist)}
.wbtns{position:absolute;top:8px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.wbtns .btn{background:rgba(20,40,32,.85);backdrop-filter:blur(2px)}
.wbtns .btn.ghost{background:rgba(10,8,6,.75)}
.whint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:rgba(236,227,207,.6);text-shadow:0 1px 3px #000;pointer-events:none}

const PHX=new Map();
function pHx(c){let v=PHX.get(c);if(v)return v;let s=String(c).replace('#','');if(s.length===3)s=[...s].map(x=>x+x).join('');v=[parseInt(s.slice(0,2),16)||0,parseInt(s.slice(2,4),16)||0,parseInt(s.slice(4,6),16)||0];PHX.set(c,v);return v;}
function pRgb(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function pSh(c,k){const [r,g,b]=pHx(c);return k>=0?pRgb(r+(255-r)*k,g+(255-g)*k,b+(255-b)*k):pRgb(r*(1+k),g*(1+k),b*(1+k));}
function pMx(a,b,t){const A=pHx(a),B=pHx(b);return pRgb(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
const OUT='#17110c';
class PX{
 constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(0);}
 set(x,y,c){x=Math.round(x);y=Math.round(y);if(!c||x<0||y<0||x>=this.w||y>=this.h)return this;this.d[y*this.w+x]=c;return this;}
 get(x,y){if(x<0||y<0||x>=this.w||y>=this.h)return 0;return this.d[y*this.w+x];}
 rect(x,y,w,h,c){x=Math.round(x);y=Math.round(y);for(let j=0;j<Math.round(h);j++)for(let i=0;i<Math.round(w);i++)this.set(x+i,y+j,c);return this;}
 ell(cx,cy,rx,ry,c){rx=Math.max(.5,rx);ry=Math.max(.5,ry);for(let y=Math.floor(-ry);y<=Math.ceil(ry);y++)for(let x=Math.floor(-rx);x<=Math.ceil(rx);x++)if((x*x)/(rx*rx+.2)+(y*y)/(ry*ry+.2)<=1)this.set(cx+x,cy+y,c);return this;}
 line(x0,y0,x1,y1,c,t){t=Math.max(1,Math.round(t||1));const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;if(t>1)this.rect(Math.round(x-(t-1)/2),Math.round(y-(t-1)/2),t,t,c);else this.set(x,y,c);}return this;}
 poly(p,c){let y0=1e9,y1=-1e9;p.forEach(q=>{y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const xs=[],yy=y+.5;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];if((a[1]<=yy&&b[1]>yy)||(b[1]<=yy&&a[1]>yy))xs.push(a[0]+(yy-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
   xs.sort((m,n)=>m-n);for(let k=0;k+1<xs.length;k+=2)for(let x=Math.round(xs[k]);x<Math.round(xs[k+1]);x++)this.set(x,y,c);}return this;}
 shadeEdges(l,d){l=l??.2;d=d??-.28;const o=this.d.slice(),w=this.w;for(let y=0;y<this.h;y++)for(let x=0;x<w;x++){const c=o[y*w+x];if(!c||c===OUT)continue;
   const up=y>0?o[(y-1)*w+x]:0,dn=y<this.h-1?o[(y+1)*w+x]:0,lf=x>0?o[y*w+x-1]:0,rt=x<w-1?o[y*w+x+1]:0;
   if(!up||!lf)this.d[y*w+x]=pSh(c,l);else if(!dn||!rt)this.d[y*w+x]=pSh(c,d);}return this;}
 outline(c){c=c||OUT;const o=this.d.slice(),w=this.w;for(let y=0;y<this.h;y++)for(let x=0;x<w;x++){if(o[y*w+x])continue;
   if((x>0&&o[y*w+x-1])||(x<w-1&&o[y*w+x+1])||(y>0&&o[(y-1)*w+x])||(y<this.h-1&&o[(y+1)*w+x]))this.d[y*w+x]=c;}return this;}
 canvas(){const cv=mkCv(this.w,this.h),c=cv.getContext('2d'),im=c.createImageData(this.w,this.h);
  for(let i=0;i<this.d.length;i++){const v=this.d[i];if(!v)continue;const [r,g,b]=pHx(v);im.data[i*4]=r;im.data[i*4+1]=g;im.data[i*4+2]=b;im.data[i*4+3]=255;}c.putImageData(im,0,0);return cv;}
}

function monCv(look,s,tint){const id=look+'|'+s+'|'+(tint?1:0);let c=MCC.get(id);if(c)return c;let d=LOOK[look]||LOOK['天魔影'];d=Object.assign({},d);if(tint){d.c='#3a2a5a';d.c2='#20163a';d.e='#e0b8ff';}
 if(monIsHuman(look)){const key=d.k==='cult'?(d.mask?'zhou2':'zhou'):MON_CH[d.k];c=chCanvas(CH[key],0,0);MCC.set(id,c);return c;}
 const X=v=>Math.round(v*s);const g=new PX(X(36)+1,X(32)+1);const post=(MONDRAW[d.a]||MONDRAW.ghost)(g,d,X);g.shadeEdges(.22,-.3);if(post)post();
 const g2=trimPX(pad(g,1));g2.outline(OUT);c=g2.canvas();MCC.set(id,c);return c;}
function trimPX(g){let x0=g.w,y0=g.h,x1=-1,y1=-1;for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++)if(g.d[y*g.w+x]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}if(x1<0)return g;
 const n=new PX(x1-x0+3,y1-y0+3);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const v=g.d[y*g.w+x];if(v)n.d[(y-y0+1)*n.w+x-x0+1]=v;}return n;}

function tIns(x,y){return Math.abs(x+.5-16)/16+Math.abs(y+.5-8)/8<=1.001;}
const tp=(u,w)=>[16+16*(u-w),8+8*(u+w)];
function tLine(g,a,b,c){const n=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]),1);for(let i=0;i<=n;i++){const x=Math.round(a[0]+(b[0]-a[0])*i/n),y=Math.round(a[1]+(b[1]-a[1])*i/n);if(tIns(x,y))g.set(x,y,c);}}
const TPAT={
 grid(g,T){for(let y=0;y<16;y++)for(let x=0;x<32;x++){if(!tIns(x,y))continue;const d=Math.abs(x+.5-16)/16+Math.abs(y+.5-8)/8;if(d>.84)g.set(x,y,T.gc);}},
 stripe(g){for(const w of [.3,.36,.42])tLine(g,tp(-.5,w),tp(.5,w),'#c9a23a');tLine(g,tp(-.5,.25),tp(.5,.25),'#323a36');},

 speck(g,T,R){const b=T.c[0];for(let i=0;i<14;i++){const x=Math.floor(R()*32),y=Math.floor(R()*16);if(tIns(x,y))g.set(x,y,pSh(b,R()<.5?.18:-.22));}},
 ripple(g,T,R){const b=T.c[0];for(let i=0;i<5;i++){const x=4+Math.floor(R()*22),y=3+Math.floor(R()*10),l=2+Math.floor(R()*4);for(let j=0;j<l;j++)if(tIns(x+j,y))g.set(x+j,y,pSh(b,.3));}},
 crack(g,T,R){const b=T.c[0];TPAT.speck(g,T,R);if(R()<.6){let x=8+R()*16,y=4+R()*8;for(let i=0;i<9;i++){if(tIns(x,y))g.set(x,y,pSh(b,-.35));x+=R()<.5?1:-1;y+=R()<.6?(R()<.5?1:-1):0;}}},
 lane(g,T,R){TPAT.crack(g,T,R);tLine(g,tp(-.45,0),tp(-.12,0),'#c9b45a');tLine(g,tp(.12,0),tp(.45,0),'#c9b45a');},
 tuft(g,T,R){const b=T.c[0];for(let i=0;i<8;i++){const x=2+Math.floor(R()*28),y=2+Math.floor(R()*12);if(!tIns(x,y))continue;g.set(x,y,pSh(b,.28));g.set(x-1,y-1,pSh(b,.2));g.set(x+1,y-1,pSh(b,.35));}
  if(R()<.3){const x=6+Math.floor(R()*20),y=5+Math.floor(R()*6);if(tIns(x,y))g.set(x,y,R()<.5?'#e8d870':'#e89a9a');}},
 plank(g,T,R){for(const w of [-.25,0,.25])tLine(g,tp(-.5,w),tp(.5,w),pSh(T.c[0],-.35));for(let i=0;i<3;i++){const p=tp(-.4+R()*.8,-.37+Math.floor(R()*4)*.25);if(tIns(p[0],p[1]))g.set(p[0],p[1],'#a89070');}},
 plate(g,T){const d=pSh(T.c[0],-.3);tLine(g,tp(-.5,0),tp(.5,0),d);tLine(g,tp(0,-.5),tp(0,.5),d);[[-.3,-.3],[.3,-.3],[-.3,.3],[.3,.3]].forEach(([u,w])=>{const p=tp(u,w);g.set(p[0],p[1],pSh(T.c[0],.35));});},
 hazard(g){for(let y=0;y<16;y++)for(let x=0;x<32;x++){if(!tIns(x,y))continue;const a=(x+.5-16)/16,b=(y+.5-8)/8,u=(a+b)/2,w=(b-a)/2;if(Math.abs(w)<.18)g.set(x,y,Math.floor((u+1)*7)%2?'#c9a23a':'#2a2a2a');}},

const TCC=new Map();
function tileCv(type,v){const id=type+'|'+v;let cv=TCC.get(id);if(cv)return cv;const T=TL[type]||TL.tile;const g=new PX(32,16);const R=rng(v*97+type.length*31+type.charCodeAt(0)*7+1);
 if(!T.none){for(let y=0;y<16;y++)for(let x=0;x<32;x+=2){const col=T.c[Math.floor(R()*T.c.length)];if(tIns(x,y))g.set(x,y,col);if(tIns(x+1,y))g.set(x+1,y,col);}
  (TPAT[T.pat]||(()=>{}))(g,T,R,v);
  const o=g.d.slice();for(let y=0;y<16;y++)for(let x=0;x<32;x++){const c=o[y*32+x];if(!c)continue;if(!tIns(x,y-1))g.d[y*32+x]=pSh(c,.12);else if(!tIns(x,y+1))g.d[y*32+x]=pSh(c,-.28);}}
 cv=g.canvas();TCC.set(id,cv);return cv;}
function trapType(z){const base=z<0?'tile':ZBASE[z];const k='trap'+z;if(!TL[k])TL[k]={c:TL[base].c,pat:'crackBig'};return k;}
const FCC=new Map();
function faceCv(type,side){const id=type+'|'+side;let cv=FCC.get(id);if(cv)return cv;const T=TL[type]||TL.tile;const D=11,g=new PX(32,16+D),b=T.c[0];
 const L=side==='L';const c1=pSh(b,L?-.42:-.58),c2=pSh(b,L?-.55:-.68);
 g.poly(L?[[0,8],[16,16],[16,16+D],[0,8+D]]:[[16,16],[32,8],[32,8+D],[16,16+D]],c1);
 for(let k=4;k<D;k+=4){const a=L?[0,8+k]:[16,16+k],e=L?[16,16+k]:[32,8+k];g.line(a[0],a[1],e[0],e[1],c2);}
 cv=g.canvas();FCC.set(id,cv);return cv;}

  ['mo','好了。往北走，锈蚀高架上有一支商队，专门倒卖妖兽材料。你要筑基，得去那里换资源。'],
  {fx:{pills:1,stones:40}},
  ['','铁叔塞给你一个布包。获得 破境丹 ×1、灵石 ×40。']
 ]},
 {id:'z1',title:'行路·锈蚀高架',g:'桥',bg:'overpass',side:1,cond:()=>S.visited.includes(1),hint:'前往锈蚀高架',lines:[
  ['','断掉的高架桥悬在半空，像一条被斩断的龙。'],
  ['','桥墩上挂着锈透的汽车。风一吹，钢筋就嗡嗡地响，像有人在远处吹哨。'],
  ['mo','小心头顶。这里的东西，喜欢从上面掉下来。']
 ]},
 {id:'caravan',title:'第六章·锈色商队',g:'商',bg:'overpass',cond:()=>S.bossDown.includes(1),hint:'击败「钢骨百足」',lines:[
  ['','钢骨百足的尸体卡在两段断桥之间。几辆改装卡车从桥另一头的灰尘里开了出来。'],
  ['hong','好身手。我是红姐，红鹞商队管事的。那条百足的甲壳，卖不卖？'],
  ['hong','顺便提醒你一句。你这种身上带灵光的人，天黑以后最好别落单。'],
  ['hong','有一伙人叫“天穹会”，专抓有灵根的活人。听说是拿去炼丹。'],
  ['hong','前几天我还看见一个小子，手上冒火，跟着他们的人走了。'],
  ['@','……周烈。'],
  ['mo','天穹会。他们居然还在。'],
  {c:[
   {t:'把玉简的事告诉红姐',k:1,fx:{stones:120,flags:{trustHong:1}},r:[['hong','带着前辈残魂的玉简？你心可真大。行，这份信任我记下了。'],['hong','以后在我这儿买东西，给你打九折。'],['','获得 灵石 ×120']]},
   {t:'什么都不说，卖掉甲壳就走',k:0,fx:{stones:80},r:[['hong','嘴严是好事。这世道，嘴严的人活得久。'],['','获得 灵石 ×80']]}
  ]},
  ['','卡车开远了。你问墨老天穹会是什么，他很久都没有回答。']
 ]},
 {id:'exposed',title:'第七章·灵光',g:'眼',bg:'shelter',cond:()=>F('dongtian')&&S.expo>=100,hint:'温养时灵光外泄满盈',lines:[
  ['','你从洞天里取出温养好的东西时，玉简的裂纹里漏出一缕青光，直冲隧道顶。'],
  ['mo','糟了。'],
  ['','三天后的夜里，站台的灯一盏接一盏地灭了。'],
  ['tq','青石站的诸位，不必惊慌。'],
  ['tq','天穹会只找一个人。身上带着洞天法宝的那一位。'],
  ['','执事身后站着一个人。他脸上戴着半张白色面具，面具中间，画着一只眼睛。'],
  ['zhou2','好久不见啊，拾荒的。'],
  ['@','周烈？'],
  ['zhou2','天穹会给了我新的功法。现在，该轮到你跪了。'],
  {c:[
   {t:'「冲我来，别碰站里的人。」',k:1},
   {t:'「上次没打够？」',k:0},
   {t:'「正好。你的灵根，我也拿来温养一下。」',k:-1}
  ]},
  ['','【迎战：天穹追兵。追兵就在青石站站台东侧，走过去迎战。】']
 ],after:()=>{S.special='hunter';}},
 {id:'hunted',title:'第八章·面具',g:'面',bg:'shelter',cond:()=>F('hunter1'),hint:'击退天穹追兵',lines:[
  ['','面具裂成了两半。周烈捂着脸，退进了黑暗的隧道里。'],
  ['zhou2','天穹会不会放过你的。你那块玉简，长老们找了三百年。'],
  ['','他走了。那个执事，早就不见了。'],
  ['@','墨老，你认识天穹会？'],
  ['mo','……以后再说。'],
  ['mo','从今往后，洞天少用。用了，就别怕他们找上门。'],
  ['','【灵光外泄满盈后，天穹追兵会再次找上门，击退即可清零。修习「敛息诀」能减少外泄。】']
 ]},
 {id:'z2',title:'行路·旧城妖林',g:'林',bg:'forest',side:1,cond:()=>S.visited.includes(2),hint:'前往旧城妖林',lines:[
  ['','人民公园不见了。原地长出一片你叫不出名字的森林，树干粗得十个人都抱不过来。'],
  ['','一栋商场被藤蔓整个吞了下去，橱窗里还摆着三年前的假人。'],
  ['mo','这里的灵气……太浓了。浓得不对劲。']
 ]},
 {id:'locust',title:'第九章·槐下旧事',g:'槐',bg:'forest',cond:()=>S.bossDown.includes(2),hint:'击败「千年槐妖」',lines:[
  ['','千年槐妖的根系一寸寸枯死，露出埋在地下的一块石碑。'],
  ['','碑上刻着一个篆字：墨。'],
  ['mo','……'],
  ['mo','这棵槐树，是老夫三百年前亲手种下的。'],
  ['mo','那时候这里还是一座道观，叫太一观。我和师兄常在树下论道。'],
  ['mo','师兄说，修仙不该只是少数人的事。他想让天下人都能修。'],
  ['mo','我信了他。然后我们一起，做了一件蠢事。'],
  ['','他没有再说下去。玉简上的裂纹，好像又深了一点。'],
  {fx:{pills:1}},
  ['','你在石碑下找到一个陶罐。获得 破境丹 ×1。']
 ]},
 {id:'zhuji',title:'第十章·筑基',g:'基',bg:'shelter',cond:()=>S.stage>=9,hint:'突破至筑基期',lines:[
  ['','灵气在丹田里旋转、压缩，最后凝成一座看不见的台基。你筑基了。'],
  ['mo','好。从今天起，你才算真正踏上了这条路。'],
  ['','你回到青石站时，站台上摆了一桌菜。说是一桌，其实是几个罐头和一锅野菜汤。'],
  ['tie','站里的人凑的。别嫌寒碜。'],
  ['he','{bro}，这个给你！'],
  ['','阿禾塞给你一个歪歪扭扭的平安结，红绳编的，还缠着一根她自己的头发。'],
  ['he','我编了好几天。戴着它，就不会受伤了。'],
  {fx:{gift:'平安结'}},
  ['','获得 佩饰「平安结」。']
 ]},
 {id:'z3',title:'行路·沉没港口',g:'港',bg:'port',side:1,cond:()=>S.visited.includes(3),hint:'前往沉没港口',lines:[
  ['','海平面涨了十米。原来的港口只剩下吊机的上半截，从雾里伸出来。'],
  ['','雾里有船灯在晃。可这一带，早就没有渔船了。'],
  ['mo','那盏灯……是白色的。']
 ]},
 {id:'port',title:'第十一章·雾港',g:'雾',bg:'port',cond:()=>S.bossDown.includes(3),hint:'击败「海眼蛟」',lines:[
  ['','海眼蛟沉下去之后，雾散了。港口里停着一艘挂白旗的船。'],
  ['','旗上是一只眼睛，天穹会的标记。船舱里关着二十几个人，手腕上都烙着编号。'],
  ['','你认出了其中一个。是阿禾的妈妈，李婶。去年冬天，她出门找药，就再也没回来。'],
  ['mo','他们在收集灵根。船上那几箱灵石，够你修很久。'],
  ['mo','船员马上就回来了。你只来得及做一件事。'],
  {c:[
   {t:'劈开牢门，放人',k:1,fx:{pills:2,flags:{freed:1}},r:[['','你劈开铁锁。人们涌向码头，散进了雾里。'],['','李婶临走前塞给你两颗丹药：“我以前在药厂上班。拿着。”'],['','获得 破境丹 ×2']]},
   {t:'搬走灵石',k:-1,fx:{stones:4000},r:[['','你扛起箱子离开的时候，身后有人在喊救命。你听出了那是李婶的声音。'],['mo','……走吧。'],['','获得 灵石 ×4000']]}
  ]}
 ]},
 {id:'jindan',title:'第十二章·金丹',g:'丹',bg:'dongtian',cond:()=>S.stage>=13,hint:'突破至金丹期',lines:[
  ['','台基崩碎，灵气凝成一颗浑圆的丹，悬在你的丹田正中。'],
  ['mo','金丹成了。三百年前，太一观里能结丹的，不超过十个人。'],
  ['@','那你师兄呢？'],
  ['mo','他是第一个。比我早了整整二十年。'],
  ['mo','他天赋太好了。好到觉得，没有什么事是他做不成的。']
 ]},
 {id:'z4',title:'行路·坠星研究所',g:'星',bg:'lab',side:1,cond:()=>S.visited.includes(4),hint:'前往坠星研究所',lines:[
  ['','灵潮那天，第一块“星”就砸在这里。研究所的穹顶裂开一道口子，往外渗着蓝光。'],
  ['','围墙上的警示牌还在：生物安全四级，闲人勿入。下面有人用红漆补了一句：天穹会接管。']
 ]},
 {id:'zero',title:'第十三章·零号',g:'零',bg:'lab',cond:()=>S.bossDown.includes(4),hint:'击败「零号」',lines:[
  ['','研究所最深处，一个少女模样的东西跪在碎玻璃里。她的胸口在发光，那是一枚人造金丹。'],
  ['zero','你……打赢了我。'],
  ['zero','天穹会造了我。他们想用我当钥匙，打开灵源。'],
  ['zero','我不想当钥匙。可除了这个，我没有别的用处。'],
  ['mo','她那枚金丹，是用三百个人的灵根炼出来的。吞了它，你的丹田会立刻满盈。'],
  {c:[
   {t:'放过她',k:1,fx:{flags:{zeroSaved:1}},r:[['zero','……为什么？'],['','你说不出为什么。你只是觉得，她不该只是一把钥匙。'],['zero','我会记住你的名字，{name}。']]},
   {t:'吞噬金丹',k:-2,fx:{qiFill:1},r:[['','光熄灭了。那股力量冲进你的经脉，滚烫，发苦。'],['mo','……你终究还是走了这条路。'],['','丹田灵气已满。']]}
  ]}
 ]},
 {id:'z5',title:'行路·天坑',g:'坑',bg:'pit',side:1,cond:()=>S.visited.includes(5),hint:'前往天坑',lines:[
  ['','市中心塌出了一个直径两公里的坑。坑底在发光，像一只烧红的眼睛。'],
  ['','坑边的楼都斜着，随时会滑下去。热风从坑里往上吹，带着硫磺和血的味道。']
 ]},
 {id:'zhoufate',title:'第十四章·火灭',g:'灰',bg:'pit',cond:()=>F('hunter1')&&S.kills[5]>=5,hint:'击退天穹追兵后，在天坑斩妖五只',lines:[
  ['','坑壁上的一处岩洞里，你找到了周烈。'],
  ['','他的半边身体已经变成了石头，裂缝里渗着天坑的红光。面具碎了一地。'],
  ['zhou2','……哈。拾荒的。'],
  ['zhou2','天穹会给的功法，是拿人当炉子烧的。我才是那颗被炼的丹。'],
  ['zhou2','我输给你一次，他们就把我扔进了这里。'],
  ['mo','他的灵根快烧干了。要救，得耗你大半灵气；不救，他撑不过今晚。'],
  {c:[
   {t:'救他',k:2,fx:{qiMul:.4,flags:{zhouSaved:1}},r:[['','你把手按在他胸口，把灵气一点点渡过去。石化停了。'],['zhou2','……为什么？我以前那样对你。'],['@','因为青石站的人，不该死在这种地方。'],['','周烈没再说话。很久以后，他低声说了一句：“谢了。”']]},
   {t:'给他一个痛快',k:0,r:[['','你拔出剑。周烈闭上了眼睛。'],['zhou2','……挺好。比烧干了强。'],['','你在坑边给他堆了一座石头坟。']]},
   {t:'吸走他残余的火灵根',k:-2,fx:{qiFill:1},r:[['','火灵根离体的时候，他叫了一声，然后就安静了。'],['mo','……'],['','丹田灵气已满。玉简一整夜都没有再说话。']]}
  ]}
 ]},
 {id:'fallen',title:'第十五章·堕仙',g:'堕',bg:'pit',cond:()=>S.bossDown.includes(5),hint:'击败「堕仙残躯」',lines:[
  ['','堕仙残躯倒下，露出一张苍老的脸。玉简在你怀里剧烈地震了一下。'],
  ['mo','师兄……'],
  ['sx','……墨……师弟……'],
  ['sx','灵源……关不上了……'],
  ['','他的身体碎成了灰。'],
  ['mo','{name}，是时候告诉你了。'],
  ['mo','三百年前，我和师兄想把灵源里的灵气引出来，分给天下人。'],
  ['mo','我们失败了。灵源反噬，师兄成了堕仙，我只剩一缕残魂，被封进了玉简。'],
  ['mo','我们留下的封印撑了三百年。二〇四九年，它裂开了。'],
  ['mo','天穹会，就是当年师兄的门人。他们想做完他没做完的事。'],
  ['mo','灵潮，是我们闯的祸。'],
  {c:[
   {t:'「你想补救，我就陪你走完」',k:1,r:[['mo','……谢谢你，娃娃。']]},
   {t:'「那些死掉的人，你拿什么还？」',k:0,r:[['mo','还不了。所以我才要你走到最后。']]},
   {t:'「那灵源，就由我来拿」',k:-1,r:[['mo','你和当年的我，真像。']]}
  ]}
 ]},
 {id:'z6',title:'行路·灵源核心',g:'源',bg:'core',side:1,cond:()=>S.visited.includes(6),hint:'前往灵源核心',lines:[
  ['','空气浓得像水。每呼吸一口，丹田都在发烫。'],
  ['','碎石悬在半空，绕着一道通天的光柱慢慢转动。'],
  ['',()=>F('zeroSaved')?'光柱下面站着一个白发的身影。零号回过头，朝你点了点头：“我来带路。”':'光柱下面空无一人。你突然有点想念那个白头发的少女，虽然你没能留住她。'],
  {fx:()=>F('zeroSaved')?{stones:Math.ceil(4*Math.pow(2.6,6))}:null},
  ['',()=>F('zeroSaved')?'零号把一袋灵石塞给你：“天穹会的仓库，我知道在哪。”':'你握紧剑，独自走了进去。']
 ]},
 {id:'finale',title:'终章·灵源',g:'源',bg:'core',cond:()=>S.bossDown.includes(6),hint:'击败「灵潮之主」',lines:[
  ['','灵潮之主化作光尘。灵源就在你面前，像一颗跳动的心脏。'],
  ['mo','走到这一步了。封了它，灵气会慢慢退去，世界会变回原样。'],
  ['mo','或者，你可以成为它的主人。'],
  {c:[
   {t:'封印灵源',k:1,r:[['','你把手按在灵源上。墨老的残魂从玉简里飘出来，挡在你前面。'],['mo','封印，用我来补。你还年轻，修为留着，替我看看以后的世界。'],['mo','还有……谢谢你，没让老夫的三百年白等。'],['','玉简碎了。']]},
   {t:'驯服灵源，让灵气留在人间',k:0,r:[['','你没有封它，也没有占它。你在灵源四周布下阵法，让灵气一点点流出去。'],['mo','让天下人都能修仙……三百年前我和师兄想做的事，你做成了。']]},
   {t:'吞下灵源',k:-2,r:[['','灵源涌进你的身体。那一刻，你听见了全城所有妖物的心跳。'],['mo','{name}——！'],['','玉简在你掌心沉默了。']]}
  ]},
  {bg:'shelter'},
  ['',()=>S.karma>=3?'后来，青石站的孩子们都学会了吐纳。阿禾成了站里第一个筑基的人，她说是跟{name}学的。':S.karma<=-3?'后来，城里的人提起{name}这个名字，都会压低声音。':'后来，废墟上长出了一座新的城。很少有人记得灵潮那年发生过什么，你也不常提起。'],
  ['',()=>F('zhouSaved')?'周烈留在了青石站。他教孩子们生火，从来不提天穹会。':''],
  ['',()=>F('zeroSaved')?(S.flags.zeroName?'零号有了名字，叫'+S.flags.zeroName+'。':'零号')+'去了红姐的商队。听说她负责算账，从没算错过一笔。':''],
  ['',()=>F('momHome')?'李婶在站台尽头开了个小药铺。阿禾每天放学都去帮忙，说长大了要当药师，也要当仙师。':''],
  ['','—— 灵潮平息 ——'],
  ['','可是灵源之下，还有一道更深的裂缝。'],
  ['','【「灵源深渊」已开启：层数无尽，越深越强。修到渡劫圆满后可以飞升轮回，带着仙缘重修。】']
 ]},
 {id:'z7',title:'行路·灵源深渊',g:'渊',bg:'abyss',side:1,cond:()=>S.visited.includes(7),hint:'进入灵源深渊',lines:[
  ['','裂缝往下延伸，看不见底。石台一级一级盘旋着沉进黑暗。'],
  ['','最深处，有什么东西睁开了眼睛。']
 ]}
];

 const start=[2,2],end=[W-4,H-4],path=new Set();
 const carve=(c,r)=>{for(let a=0;a<2;a++)for(let b=0;b<2;b++)if(inMap(M,c+a,r+b))path.add(K(c+a,r+b));};
 const wps=[start,[3+Math.floor(R()*6),9+Math.floor(R()*6)],[10+Math.floor(R()*6),3+Math.floor(R()*6)],[11+Math.floor(R()*7),13+Math.floor(R()*5)],end];
 for(let i=0;i<wps.length-1;i++){let [c,r]=wps[i];const [tc,tr]=wps[i+1];let n=0;while((c!==tc||r!==tr)&&n++<300){carve(c,r);if(c!==tc&&(r===tr||R()<.5))c+=Math.sign(tc-c);else r+=Math.sign(tr-r);}carve(c,r);}
 const nearPath=(c,r)=>path.has(K(c,r))||path.has(K(c+1,r))||path.has(K(c-1,r))||path.has(K(c,r+1))||path.has(K(c,r-1));
 if(D.hz)for(let i=0;i<5;i++){const hc=1+R()*(W-2),hr=1+R()*(H-2),rad=1.5+R()*2.2;for(let r=1;r<H-1;r++)for(let c=1;c<W-1;c++)if(Math.hypot(c-hc,r-hr)<rad&&!nearPath(c,r))M.g[gi(M,c,r)]=D.hz;}
 const far=(c,r,p,d)=>Math.abs(c-p[0])+Math.abs(r-p[1])>d;
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(c&&r&&c<W-1&&r<H-1)continue;const e=(c===W-1||r===H-1)?D.front:D.edge;if(TL[e])M.g[gi(M,c,r)]=e;else addProp(M,c,r,e,{v:Math.floor(R()*4)});}
 for(let r=1;r<H-1;r++)for(let c=1;c<W-1;c++){if(path.has(K(c,r))||!far(c,r,start,2)||!far(c,r,end,2))continue;const T=TL[M.g[gi(M,c,r)]];if(T&&T.nw)continue;if(R()<D.dens)addProp(M,c,r,pick2(R,D.props),{v:Math.floor(R()*4)});}

 const s0=gi(M,sc,sr);const q=[s0];prev[s0]=-1;let h=0,found=-1;
 while(h<q.length){const i=q[h++],c=i%W,r=(i/W)|0;if(goal(c,r)){found=i;break;}for(const [dc,dr] of DIRV){const nc=c+dc,nr=r+dr;if(!inMap(M,nc,nr))continue;const j=gi(M,nc,nr);if(prev[j]!==-2||!passable(M,nc,nr)||occ.has(j))continue;prev[j]=i;q.push(j);}}

function wWalk(tc,tr,adj,act){const M=WD.M,P=WD.P;const from=P.path.length?P.path[0]:[Math.round(P.x),Math.round(P.y)];

function btDrawFx(x,f,p){x.save();

 if(f.k==='proj'){const X=f.x0+(f.x1-f.x0)*p,Y=f.y0+(f.y1-f.y0)*p,a=Math.atan2(f.y1-f.y0,f.x1-f.x0);x.globalCompositeOperation='lighter';x.strokeStyle=f.col;x.globalAlpha=.6;x.lineWidth=3;x.beginPath();x.moveTo(X-Math.cos(a)*18,Y-Math.sin(a)*18);x.lineTo(X,Y);x.stroke();

/* ---------- 五子棋 ---------- */
const GN_N=11;
function gmInit(){MG.b=new Array(GN_N*GN_N).fill(0);MG.turn=1;MG.last=-1;
 $('#mgArea').innerHTML=`<canvas id="gmc" class="gmc"></canvas>`;$('#mgCtl').innerHTML=`<button class="btn sm ghost" id="gmGive">认输</button>`;
 $('#gmGive').onclick=()=>{if(MG.done)return;mgMsg('你投子认输。','bad');mgEnd(false);};
 mgMsg('轮到你落子。');requestAnimationFrame(gmDraw);const cv=$('#gmc');
 cv.onpointerdown=e=>{if(MG.done||MG.turn!==1)return;const r=cv.getBoundingClientRect(),cell=r.width/GN_N;const x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);
  if(x<0||y<0||x>=GN_N||y>=GN_N||MG.b[y*GN_N+x])return;gmPut(x,y,1);if(MG.done)return;MG.turn=2;mgMsg('对手在想……');setTimeout(()=>{if(!MG||MG.done)return;const m=gmAI(MG.lv);gmPut(m%GN_N,Math.floor(m/GN_N),2);if(!MG.done){MG.turn=1;mgMsg('轮到你落子。');}},380+Math.random()*300);};}
function gmPut(x,y,c){const i=y*GN_N+x;MG.b[i]=c;MG.last=i;gmDraw();if(gmWin(x,y,c)){mgMsg(c===1?'五子连珠，你赢了！':'对手连成五子。','',);if(c===1)$('#mgMsg').classList.add('good');else $('#mgMsg').classList.add('bad');mgEnd(c===1);return;}
 if(MG.b.every(v=>v))mgMsg('棋盘下满了，和棋。'),mgEnd(false);}
function gmWin(x,y,c){const B=MG.b;for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(const s of [1,-1]){let k=1;while(true){const X=x+dx*k*s,Y=y+dy*k*s;if(X<0||Y<0||X>=GN_N||Y>=GN_N||B[Y*GN_N+X]!==c)break;n++;k++;}}if(n>=5)return true;}return false;}
function gmDraw(){const cv=$('#gmc');if(!cv)return;const r=cv.getBoundingClientRect(),dpr=Math.min(3,devicePixelRatio||1),W=Math.round(r.width*dpr);cv.width=W;cv.height=W;const x=cv.getContext('2d'),c=W/GN_N;
 x.fillStyle='#c9a46a';x.fillRect(0,0,W,W);x.strokeStyle='#5a3e1e';x.lineWidth=Math.max(1,dpr*.8);
 for(let i=0;i<GN_N;i++){x.beginPath();x.moveTo(c/2,c/2+i*c);x.lineTo(W-c/2,c/2+i*c);x.stroke();x.beginPath();x.moveTo(c/2+i*c,c/2);x.lineTo(c/2+i*c,W-c/2);x.stroke();}
 [[2,2],[8,2],[5,5],[2,8],[8,8]].forEach(([a,b])=>{x.fillStyle='#5a3e1e';x.beginPath();x.arc(c/2+a*c,c/2+b*c,c*.09,0,6.28);x.fill();});
 MG.b.forEach((v,i)=>{if(!v)return;const cx=c/2+(i%GN_N)*c,cy=c/2+Math.floor(i/GN_N)*c,g=x.createRadialGradient(cx-c*.12,cy-c*.12,c*.05,cx,cy,c*.44);
  if(v===1){g.addColorStop(0,'#5a5a5a');g.addColorStop(1,'#0a0a0a');}else{g.addColorStop(0,'#ffffff');g.addColorStop(1,'#c8c2b4');}
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,c*.42,0,6.28);x.fill();if(i===MG.last){x.fillStyle='#cf4a3c';x.beginPath();x.arc(cx,cy,c*.1,0,6.28);x.fill();}});}
function gmLine(B,x,y,c){let tot=0;for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1,open=0;
  for(const s of [1,-1]){let k=1;while(true){const X=x+dx*k*s,Y=y+dy*k*s;if(X<0||Y<0||X>=GN_N||Y>=GN_N)break;const v=B[Y*GN_N+X];if(v===c){n++;k++;continue;}if(v===0)open++;break;}}
  tot+=n>=5?1e6:n===4?(open===2?5e4:open===1?6e3:0):n===3?(open===2?4e3:open===1?300:0):n===2?(open===2?260:open===1?40:0):(open===2?12:2);}return tot;}
function gmCands(B){const out=[];for(let i=0;i<B.length;i++){if(B[i])continue;const x=i%GN_N,y=(i/GN_N)|0;let near=false;
  for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<GN_N&&Y<GN_N&&B[Y*GN_N+X]){near=true;break;}}if(near)out.push(i);}
 if(!out.length)out.push(Math.floor(GN_N*GN_N/2));return out;}
function gmScore(B,i,lv){const x=i%GN_N,y=(i/GN_N)|0;const a=gmLine(B,x,y,2),d=gmLine(B,x,y,1);return lv===1?a+d*.55:lv===2?a+d*.95:a*1.1+d;}
function gmAI(lv){const B=MG.b,C=gmCands(B);let sc=C.map(i=>({i,s:gmScore(B,i,lv)})).sort((a,b)=>b.s-a.s);
 if(lv===1){if(Math.random()<.28)return pick(C);const top=sc.slice(0,5);return pick(top).i;}
 if(lv===2){const top=sc.filter(o=>o.s>=sc[0].s*.9);return pick(top).i;}
 if(sc[0].s>=1e6)return sc[0].i;const block=sc.find(o=>gmLine(B,o.i%GN_N,(o.i/GN_N)|0,1)>=1e6);if(block)return block.i;
 let best=sc[0].i,bv=-1e18;sc.slice(0,9).forEach(o=>{B[o.i]=2;let rep=0;gmCands(B).forEach(j=>{const v=gmLine(B,j%GN_N,(j/GN_N)|0,1)+gmLine(B,j%GN_N,(j/GN_N)|0,2)*.5;if(v>rep)rep=v;});B[o.i]=0;const v=o.s-rep*.75;if(v>bv){bv=v;best=o.i;}});return best;}

  if(es()<ps&&(MG.lv>=2&&Math.random()<(MG.lv===3?.9:.5))){mgMsg('对手不服，重摇了一次……');setTimeout(()=>{e=[d6(),d6(),d6()];if(MG.lv===3&&es()<ps&&Math.random()<.25)e=e.map(v=>Math.max(v,d6()));rollAnim('dlE',e,fin);},500);}else fin();});}

function mmInit(){const L=[[3,4,8,2200],[4,4,9,1100],[4,5,11,0]][MG.lv-1];MG.cols=L[0];MG.miss=L[2];const n=L[0]*L[1]/2;

 mmDraw();mgMsg(L[3]?'记住它们……':'凭感觉翻吧。');setTimeout(()=>{if(!MG)return;MG.cards.forEach(c=>c.up=false);MG.lock=false;mmDraw();mgMsg('还能错 '+MG.miss+' 次。');},L[3]||10);}

   ()=>{S.meds+=2;return '。顺手采了草药，丹房多了两颗疗伤药';}]);s+=sp();}
  s+='。';}
 else{m.exp+=Math.round(8*T.m);m.busy={rest:1,until:Date.now()+20*60*1000};s=m.name+'在「'+ZONES[z].n+'」吃了亏，负伤回来，要养二十分钟。';}
 while(m.exp>=m.lv*40&&m.lv<60){m.exp-=m.lv*40;m.lv++;}
 clLog(s);return s;}
let clAcc=0;
function clanTick(dt,off){const c=S.clan;if(!c||!S.started)return;
 if(c.bld.tian)c.store=Math.min(tianRate(c.bld.tian)*12,c.store+tianRate(c.bld.tian)*dt/3600);
 if(c.bld.dan){c.medT+=dt;const ev=danEvery(c.bld.dan);while(c.medT>=ev){c.medT-=ev;if(c.medS<4+c.bld.dan)c.medS++;}}
 clAcc+=dt;if(clAcc<1&&!off)return;clAcc=0;clanSync();const now=Date.now(),done=[];
 c.mem.forEach(m=>{if(m.busy&&!m.gone&&now>=m.busy.until){const r=clResolve(m);if(r)done.push(r);}});
 if(done.length){if(off)setTimeout(()=>toast('家族：'+done.length+' 位族人回来了，去「家族」页看看'),1500);else done.forEach(t=>toast(t,'big'));if(TAB==='clan')render();save();}

function fmt(n){n=Math.floor(n);if(n<1e4)return String(n);const t=(v,u)=>v.toFixed(2).replace(/\.?0+$/,'')+u;
  if(n<1e8)return t(n/1e4,'万');if(n<1e12)return t(n/1e8,'亿');if(n<1e16)return t(n/1e12,'万亿');return n.toExponential(2);}
function fmtT(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}时${m}分`:m?`${m}分${s}秒`:`${s}秒`;}

  for(;;){const need=req(S.stage);if(S.qi<need)break;const ni=nextInfo();if(ni.final||ni.major){S.qi=need;break;}S.qi-=need;S.stage++;moved=true;}

  if(ni.gate){toast(ni.fs?'瓶颈：需先走完主线终章「灵源」':'瓶颈：需先在「'+ZONES[ni.gz].n+'」探索尽头击败「'+ni.gate+'」','bad');return;}

function modal(html,btns,bg){const ov=$('#ov');ov.hidden=false;ov.className='';if(TAB==='world')bg=null;

function toast(t,a,b){let act=null,fn=null,cls='';if(typeof b==='function'){act=a;fn=b;}else if(a==='big'||a==='bad')cls=a;if(cls==='big'&&t.length>16)cls='big2';
  const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();const d=document.createElement('div');d.className='toast '+cls;d.textContent=t;
  if(fn){const bt=document.createElement('button');bt.textContent=act;bt.onclick=()=>{d.remove();fn();};d.appendChild(bt);}
  box.appendChild(d);setTimeout(()=>d.remove(),fn?7000:2800);}

    return `<div class="sl3 ${cur?'cur':''}"><div class="no">${n}</div><div class="in">${inf?`<div class="iname">${esc(inf.name)}<span class="lv">${inf.realm}${inf.reb?' · 第'+(inf.reb+1)+'世':''}</span></div><div class="istat">${cur?'正在游玩':'上次游玩 '+ago(inf.last)}</div>`:'<div class="iname dim">空存档位</div><div class="istat">从头开一个新角色</div>'}</div>
     <div class="ibtn">${cur?'<span class="curtag">当前</span>':inf?`<button class="btn sm" data-act="slot" data-arg="${n}">读取</button><button class="btn sm ${delArm===n?'red':'ghost'}" data-act="slotDel" data-arg="${n}">${delArm===n?'确认删除':'删除'}</button>`:`<button class="btn sm gold" data-act="slot" data-arg="${n}">新开</button>`}</div></div>`;}).join('')}</div>
  <p class="note">每个存档位是一段独立的修行：境界、剧情、委托、装备互不影响。切换时会先保存当前进度；没在玩的存档也会照常累积闭关收益。</p>
  <div class="save"><p class="note">清理浏览器数据会丢档。换手机或想备份时，导出存档码，存到备忘录里。</p>
   <textarea id="saveBox" placeholder="点「导出」生成存档码；或把存档码粘贴到这里再点「导入」"></textarea>
   <div class="row"><button class="btn sm" data-act="export">导出并复制</button><button class="btn sm ghost" data-act="import">${importArm?'确认覆盖当前进度':'导入'}</button><button class="btn sm ${resetArm?'red':'ghost'}" data-act="reset">${resetArm?'再点一次，清空存档 '+SLOT:'清空当前存档重来'}</button></div>
   <p class="note">已斩妖 ${fmt(S.slain)} · 引气 ${fmt(S.taps)} 次 · 击退追兵 ${S.hunts} 次 · 深渊 ${S.abyss} 层 · 第 ${S.rebirth+1} 世</p></div>`;;};

function paintAll(){view.querySelectorAll('canvas[data-scene]').forEach(cv=>paintTo(cv,cv.dataset.scene));}
function render(){const prev=view.dataset.tab===TAB?view.scrollTop:0;view.innerHTML=VIEWS[TAB]();view.dataset.tab=TAB;view.classList.toggle('full',TAB==='world');view.scrollTop=TAB==='world'?0:prev;
  document.querySelectorAll('.tab').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===TAB);});
  breakSig='';if(TAB==='world')wBind();requestAnimationFrame(()=>{paintAll();});live();}
function live(){const need=req(S.stage);
  $('#hName').textContent=(S.name||'无名')+(S.rebirth?' · 第'+(S.rebirth+1)+'世':'');$('#hRealm').textContent=STAGES[S.stage].name;
  $('#hStones').textContent=fmt(S.stones);$('#hKarma').textContent=karmaName();$('#hQi').style.width=Math.min(100,S.qi/need*100)+'%';
  if(TAB==='cult'){const el=$('#cQi');if(!el)return;const p=Math.min(1,S.qi/need);el.textContent=fmt(S.qi);$('#cReq').textContent=fmt(need);
    const ir=idleRate(),tg=tapGain();$('#cIdle').textContent=ir<10?ir.toFixed(1):fmt(ir);$('#cTap').textContent=tg<10?tg.toFixed(1):fmt(tg);
    $('#dtP').setAttribute('stroke-dashoffset',540.35*(1-p));$('#cstage').classList.toggle('full',p>=1);
    const sig=[S.stage,p>=1,S.pills,S.usePill,S.bossDown.length,S.karma>=3].join();if(sig!==breakSig){breakSig=sig;$('#cBreak').innerHTML=breakHTML();}}
  if(TAB==='jade'){S.dt.slots.forEach((o,i)=>{const t=view.querySelector(`[data-jt="${i}"]`),b=view.querySelector(`[data-jb="${i}"]`);if(!t)return;
    if(o.left<=0){if(t.textContent!=='温养完成')render();return;}t.textContent=(jHalted()?'已停滞 · ':'')+'还需 '+fmtT(o.left);if(b)b.style.width=(1-o.left/o.dur)*100+'%';});}
  $('#tabJade').disabled=!F('dongtian');const tc=$('#tabClan');if(tc)tc.disabled=!S.clan;if(TAB==='clan')clanLive();}

/* ---------- 交互 ---------- */
const ACT={
 break:()=>breakthrough(),
 play:a=>playStory(a),talk:a=>npcTalk(a),
 travel:()=>wTravel(),tclose:()=>{const t=$('#travel');if(t)t.hidden=true;},
 tz:a=>{const t=$('#travel');if(t)t.hidden=true;if(a==='town'){if(!WD.M||WD.M.kind!=='town')goTown();}else{const z=+a;if(WD.M&&WD.M.kind!=='town'&&WD.M.z===z)return;goZone(z);}},
 home:()=>{if(BT)return;goTown();},
 goz:a=>{if(BT)return;TAB='world';render();goZone(+a);},
 goTalk:a=>{if(BT)return;if(TAB!=='world'||!WD.M||WD.M.kind!=='town'){TAB='world';render();if(WD.M&&WD.M.kind!=='town')goTown();}setTimeout(()=>{const e=WD.M&&WD.M.ents.find(x=>x.k===a&&x.kind==='npc');if(a==='mo'||!e){npcTalk(a);return;}wWalk(Math.round(e.x),Math.round(e.y),true,()=>{faceTo(WD.P,e);faceTo(e,WD.P);npcTalk(a);});},400);},
 equip:a=>{const i=S.bag.findIndex(x=>x.id===+a);if(i<0)return;const it=S.bag[i];S.bag.splice(i,1);if(S.gear[it.slot])S.bag.push(S.gear[it.slot]);S.gear[it.slot]=it;toast('装备 '+itemName(it));render();save();},
 sell:a=>{const i=S.bag.findIndex(x=>x.id===+a);if(i<0)return;S.stones+=S.bag[i].sell;S.bag.splice(i,1);render();save();},
 sellWorse:()=>{let g=0,n=0;S.bag=S.bag.filter(it=>{if(!better(it)&&!it.uniq&&!(it.gems&&it.gems.length)){g+=it.sell;n++;return false;}return true;});S.stones+=g;toast('出售 '+n+' 件，灵石 +'+fmt(g));render();save();},
 buyPill:()=>{const c=pillCost();if(S.stones<c)return;S.stones-=c;S.pills++;render();save();},
 buyQi:()=>{const c=qiPillCost();if(S.stones<c)return;S.stones-=c;S.qiPills++;render();save();},
 buyMed:()=>{const c=medCost();if(S.stones<c)return;S.stones-=c;S.meds++;render();save();},
 buyMp:()=>{const c=medCost();if(S.stones<c)return;S.stones-=c;S.mps++;render();save();},
 useMed:()=>{if(S.meds<1)return;S.meds--;S.hpF=1;toast('伤口好了');render();save();},
 useQi:()=>{if(S.qiPills<1)return;S.qiPills--;addQi(req(S.stage)*.25);toast('服下聚气丹');render();save();},
 up:a=>{const u=UPS.find(x=>x.k===a),c=upCost(u);if(S.stones<c||(u.max&&S.ups[a]>=u.max))return;S.stones-=c;S.ups[a]++;toast(u.n+' 精进至第 '+S.ups[a]+' 重');render();save();},
 jpick:()=>{JPICK=!JPICK;render();},
 jput:a=>{if(jHalted()){toast('洞天停转中，先击退天穹追兵','bad');return;}if(a.startsWith('item:'))jPut('item',a.slice(5));else jPut(a);},
 jtake:a=>jTake(+a),
 jup:()=>{const c=jUpCost();if(S.stones<c||S.dt.lv>=9)return;S.stones-=c;S.dt.lv++;toast('玉简洞天 第 '+S.dt.lv+' 重');render();save();},
 export:()=>{save();let code='';try{code='LC1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){}const box=$('#saveBox');box.value=code;
   const fail=()=>{box.focus();box.select();toast('已生成，请长按全选后手动复制');};try{navigator.clipboard.writeText(code).then(()=>toast('存档码已复制，粘贴到备忘录保存'),fail);}catch(e){fail();}},
 import:()=>{const v=$('#saveBox').value.trim();if(!v){toast('先把存档码粘贴进上面的框里','bad');return;}let d=null;
   try{d=JSON.parse(decodeURIComponent(escape(atob(v.replace(/^LC1\./,'')))));}catch(e){}if(!d||typeof d.stage!=='number'){toast('存档码无法识别，请检查是否复制完整','bad');return;}
   if(!importArm){importArm=true;render();$('#saveBox').value=v;return;}importArm=false;S=hydrate(d);WD.M=null;save();toast('存档已导入：'+STAGES[S.stage].name,'big');dotUpdate();render();},
 slot:a=>switchSlot(+a),
 qgame:a=>qGame(a),farm:()=>farmPick(),inlay:a=>inlayOpen(+a),learn:a=>learnBook(a),fuse:a=>gemFuse(a),
 tsky:()=>{WD.tmode=WD.tmode==='sky'?'city':'sky';wTravel();},
 slotDel:a=>{const n=+a;if(n===SLOT)return;if(delArm!==n){delArm=n;render();setTimeout(()=>{if(delArm===n){delArm=0;if(TAB==='story')render();}},4000);return;}delArm=0;try{localStorage.removeItem(slotKey(n));}catch(e){}toast('存档 '+n+' 已删除');render();},
 reset:()=>{if(!resetArm){resetArm=true;render();setTimeout(()=>{if(resetArm){resetArm=false;if(TAB==='story')render();}},4000);return;}
   resetArm=false;try{localStorage.removeItem(slotKey(SLOT));}catch(e){}S=fresh();WD.M=null;TAB='world';render();intro();}
};

Object.assign(ACT,CLAN_ACT);
view.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.dataset.act!=='import')importArm=false;if(b.dataset.act!=='slotDel')delArm=0;ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.arg,b);});
view.addEventListener('change',e=>{if(e.target.id==='usePill'){S.usePill=e.target.checked;breakSig='';live();}});
view.addEventListener('pointerdown',e=>{const st=e.target.closest('#cstage');if(!st||e.target.closest('button'))return;e.preventDefault();
  const g=tapGain();S.taps++;addQi(g);const r=st.getBoundingClientRect();
  const p=document.createElement('span');p.className='plus';p.textContent='+'+(g<10?g.toFixed(1):fmt(g));p.style.left=(e.clientX-r.left-14)+'px';p.style.top=(e.clientY-r.top-24)+'px';st.appendChild(p);setTimeout(()=>p.remove(),920);
  if(!reduce){const cx=r.width/2,cy=r.height*.62;for(let i=0;i<7;i++){const q=document.createElement('span');q.className='pt';const a=Math.random()*6.28,d=r.width*(.35+Math.random()*.2);
    q.style.cssText=`left:${cx}px;top:${cy}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;animation-delay:${i*30}ms`;st.appendChild(q);setTimeout(()=>q.remove(),900);}}
  live();});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;TAB=b.dataset.tab;resetArm=false;importArm=false;JPICK=false;view.scrollTop=0;render();}));
let rsT=0;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{paintAll();if(TAB==='world')wBind();if(BT){btFit();btLayout();}if(SC&&$('#vbg'))paintTo($('#vbg'),SC.bg);},200);});

/* ---------- 随机奇遇 / 每日补给 ---------- */
function idleEventTick(dt){if(!S.started||document.hidden||!OV_FREE()||BT)return;S.evClock=(S.evClock||0)+dt;if(S.evClock<270)return;S.evClock=0;
  const pool=IDLE_EVENTS.concat(IDLE2).filter(k=>{const ee=EVENTS[k];if(!ee||(ee.need&&!safe(ee.need)))return false;const e=EVENTS[k];if(e.once&&S.seenEv.includes(k))return false;if(k==='ahe_lunch'&&!S.seen.includes('ahe'))return false;if(k==='moremory'&&S.stage<6)return false;return true;});
  if(!pool.length)return;const k=pick(pool);toast('奇遇：'+EVENTS[k].title,'查看',()=>{if(OV_FREE())playEvent(k,{});});}
function daily(){const d=new Date().toDateString();if(!S.started||S.lastDaily===d)return;const first=!S.lastDaily;S.lastDaily=d;if(first)return;
  const g=Math.ceil(zsAt(maxZone(),3)*(1+.15*Math.max(0,S.rep.station)));S.stones+=g;setTimeout(()=>toast('铁叔送来了今天的补给：灵石 +'+fmt(g)),1200);save();}

/* ---------- 主循环 ---------- */
let lastT=performance.now(),uiAcc=0;
function loop(t){const dt=Math.min(.1,(t-lastT)/1000),big=Math.min(1,(t-lastT)/1000);lastT=t;if(S.started){addQi(idleRate()*big);jTick(big);idleEventTick(big);clanTick(big);omenTick(big);}
  if(BT)btFrame(dt);else if(TAB==='world'&&WD.cx&&WD.M){if(OV_FREE()&&S.started)wUpdate(dt);else WD.t+=dt;wRender();}
  uiAcc+=dt;if(uiAcc>.2){uiAcc=0;live();}requestAnimationFrame(loop);}
function offline(){const now=Date.now(),sec=(now-S.last)/1000;S.last=now;if(!S.started||sec<5)return;jTick(sec);clanTick(sec,1);daily();if(sec<90)return;
  const capH=8+S.ups.juling,eff=.6+.04*S.ups.juling,t=Math.min(sec,capH*3600),before=STAGES[S.stage].name,gain=idleRate()*t*eff;addQi(gain,true);
  const h=Math.floor(t/3600),m=Math.floor(t%3600/60),ready=S.dt.slots.filter(o=>o.left<=0).length;
  modal(`<h3>闭关归来</h3><p>你闭关了 <b>${h?h+' 小时 ':''}${m} 分</b>${sec>capH*3600?'（上限 '+capH+' 小时）':''}</p><p>吸纳灵气 <b>${fmt(gain)}</b></p>${before!==STAGES[S.stage].name?`<p>境界 ${before} → <b>${STAGES[S.stage].name}</b></p>`:''}${ready?`<p>玉台上有 <b>${ready}</b> 样东西温养好了。</p>`:''}${nextInfo().major&&S.qi>=req(S.stage)?'<p>丹田已满，可以冲关了。</p>':''}`,
   [{t:'出关',cls:'gold',fn:()=>{render();const p=S.pending.find(id=>{const c=STORY.find(x=>x.id===id);return c&&!c.side;});if(p)toast('有新剧情可看','观看',()=>playStory(p));}}],cultScene());save();}
function intro(){const ov=$('#ov');ov.hidden=false;ov.className='vn';let g=S.gender||'m';
  let back=null;for(let n=1;n<=SLOTS;n++){if(n===SLOT)continue;const inf=slotInfo(n);if(inf&&(!back||inf.last>back.last))back=Object.assign({n},inf);}
  ov.innerHTML=`<canvas class="vbg" id="vbg"></canvas><div class="inner"><div class="intro"><div class="yr">二〇四九 · 灵潮${SLOT>1?' · 存档 '+SLOT:''}</div><h1>灵潮<span>修仙</span>录</h1>
   <p>天裂之后第三年。你是地铁避难所里的一个拾荒者。</p><div class="seg"><button data-g="m" aria-pressed="${g==='m'}">少年</button><button data-g="f" aria-pressed="${g==='f'}">少女</button></div>
   <input id="nmIn" maxlength="6" placeholder="你的名字" autocomplete="off"><button class="btn gold" id="nmGo">踏入灵潮</button>${back?`<button class="btn sm ghost" id="nmBack">返回存档 ${back.n}（${esc(back.name)}）</button>`:''}</div></div>`;
  requestAnimationFrame(()=>paintTo($('#vbg'),'sky'));
  ov.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{g=b.dataset.g;ov.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  const go=()=>{const v=($('#nmIn').value||'').trim().replace(/[<>&"]/g,'');S.gender=g;S.name=v||pick(g==='f'?['苏迟','沈青','林晚','顾宁']:['林砚','陆川','沈野','顾行']);S.lastDaily=new Date().toDateString();save();playStory('prologue');};
  $('#nmGo').onclick=go;if(back)$('#nmBack').onclick=()=>switchSlot(back.n);$('#nmIn').addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{lastT=performance.now();offline();}});
addEventListener('pagehide',save);setInterval(()=>{if(S.started)save();},5000);
function start(data){S=data&&data.S?hydrate(data.S):load();TAB='world';render();dotUpdate();
  if(!S.name||!S.started){if(S.name&&!S.seen.includes('prologue'))playStory('prologue');else intro();}else{offline();daily();checkStory(true);}
  requestAnimationFrame(t=>{lastT=t;loop(t);});}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
if(location.hash==='#debug')window.__lc={get S(){return S;},set S(v){S=v;},WD,get BT(){return BT;},ACT,playStory,playEvent,checkStory,render,jTick,save,npcTalk,startBattle,mkEnemy,goZone,goTown,wEncounter,btCmdTap,mkCustom,openMini,farmStart,guiShop,enterRift,mkUnique,mkItem,clRecruit,openClanFound,clanHydrate,clSend,get FARM(){return FARM;}};

})();
</script>

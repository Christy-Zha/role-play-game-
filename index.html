<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灵潮修仙录">
<meta name="theme-color" content="#16140f">
<title>灵潮修仙录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-screen phone game — status header, painted stage per tab, bottom tab rail; ink-and-ash wasteland. Single dark look by choice. */
:root{
  --bg:#16140f; --panel:#1f1c15; --panel2:#29251c; --line:#3a3427;
  --bone:#ece3cf; --mist:#c2b7a1; --dim:#b2a68f;
  --jade:#8fd6b5; --jade-d:#2c6652; --cin:#cf4a3c; --cin-d:#5e231d; --gold:#e3b862;
  --r-fan:#bdb5a4; --r-ling:#7cc6e3; --r-bao:#c9a0f0; --r-xian:#e3b862; --r-chuan:#ff9a4a;
  --good:#8fd6b5; --bad:#e0705f;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:dark;
}
html{height:100%;height:100dvh;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
b,.num{font-variant-numeric:tabular-nums}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 6px}
.who{min-width:0}
.who .nm{font-size:12px;color:var(--mist);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .rl{font-family:var(--f-brush);font-size:25px;line-height:1.1;white-space:nowrap}
.res{display:flex;gap:14px;text-align:right;flex-shrink:0}
.res .lbl{display:block;font-size:11px;color:var(--dim);letter-spacing:.12em}
.res b{font-size:15px}
#hStones{color:var(--gold)}
.qi{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.qif{height:100%;width:0;background:linear-gradient(90deg,var(--jade-d),var(--jade));transition:width .2s}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:12px 18px;-webkit-overflow-scrolling:touch;min-height:0}

.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);padding-block:5px 3px}
.tab{position:relative;background:none;border:0;padding:3px 0;display:flex;flex-direction:column;align-items:center;color:var(--dim);min-width:0}
.tab .g{font-family:var(--f-brush);font-size:23px;line-height:1.15}
.tab .l{font-size:10.5px;letter-spacing:.12em;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--jade)}
.tab:disabled{opacity:.5}
.dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--cin);box-shadow:0 0 8px var(--cin)}

h2.sec{font-family:var(--f-brush);font-weight:400;font-size:22px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;text-wrap:balance;flex-wrap:wrap}
h2.sec small{font-family:var(--f-body);font-size:12px;color:var(--dim);letter-spacing:.04em}
h2.sec:first-child{margin-top:0}
.btn{border:1px solid var(--jade);background:var(--jade-d);color:var(--bone);padding:9px 16px;border-radius:4px;font-size:15px;letter-spacing:.08em}
.btn:disabled{opacity:.38;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mist)}
.btn.red{background:var(--cin-d);border-color:var(--cin)}
.btn.gold{background:rgba(227,184,98,.08);border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:var(--jade);color:var(--bg)}

/* 画面舞台 */
.stage{position:relative;width:100%;border-radius:6px;overflow:hidden;background:#0d0c09;border:1px solid var(--line);isolation:isolate}
.stage>canvas.bgc{position:absolute;inset:0;width:100%;height:100%;display:block}
.cstage{aspect-ratio:1/1;max-height:54vh;margin-inline:auto}
.hp{height:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;transition:width .2s}
.hp.p i{background:linear-gradient(90deg,var(--jade-d),var(--jade))}
.hp.e i{background:linear-gradient(90deg,#8a2a20,var(--cin))}
.b.r .hp i{margin-left:auto}
.banner{display:flex;align-items:center;gap:12px;border:1px solid var(--cin);background:linear-gradient(90deg,rgba(207,74,60,.18),transparent);padding:10px 12px;border-radius:6px;margin-bottom:10px}
.banner .t{flex:1;font-size:14px}
.banner .t small{display:block;font-size:12px;color:var(--mist)}

/* 修炼 */
.cult{display:flex;flex-direction:column;align-items:center;text-align:center}
.cstage{width:100%;cursor:pointer;touch-action:manipulation}
.sit{position:absolute;left:50%;bottom:8%;width:44%;transform:translateX(-50%);pointer-events:none}
.sit img{width:100%;height:auto;display:block}
.ring{position:absolute;left:50%;bottom:8%;width:74%;aspect-ratio:1;transform:translateX(-50%);pointer-events:none}
.ring svg{width:100%;height:100%;overflow:visible}
.spin{transform-origin:100px 100px;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cstage.full .sit{filter:drop-shadow(0 0 14px rgba(227,184,98,.7))}
.plus{position:absolute;pointer-events:none;font-family:var(--f-brush);font-size:22px;color:#c8ffe6;animation:up .9s ease-out forwards;white-space:nowrap;text-shadow:0 2px 4px #000}
.cname{position:absolute;top:10px;left:0;right:0;font-family:var(--f-brush);font-size:30px;text-shadow:0 2px 8px #000}
.ctap{position:absolute;bottom:10px;left:0;right:0;font-size:12px;color:rgba(236,227,207,.7);text-shadow:0 1px 3px #000}
.qi-num{color:var(--mist);font-size:14px;margin-top:10px}
.qi-num b{color:var(--bone)}
.rates{display:flex;gap:18px;justify-content:center;font-size:13px;color:var(--mist)}
.rates b{color:var(--jade)}
.break{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel)}
.break .t{font-size:13px;color:var(--mist);margin-bottom:8px}
.break .t em{font-style:normal;color:var(--bone)}
.break .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.gate{color:var(--cin)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mist)}
.pill input{accent-color:var(--jade);width:18px;height:18px}
.tip{font-size:12px;color:var(--dim);margin-top:12px;max-width:30em}

/* 玉简 */
.jstage{aspect-ratio:16/9}
.jinfo{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;text-shadow:0 1px 3px #000}
.expo{width:46%}
.expo .l{font-size:12px;color:var(--bone)}
.expo .hp i{background:linear-gradient(90deg,#8a6a2a,var(--cin))}
.jslots{display:grid;gap:10px;margin-top:12px}
.jslot{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel);display:flex;gap:12px;align-items:center}
.jslot .ic{width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-family:var(--f-brush);font-size:24px;border:1px solid var(--jade-d);background:radial-gradient(circle,rgba(143,214,181,.18),transparent);color:var(--jade)}
.jslot.ready .ic{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(227,184,98,.4)}
.jslot .in{flex:1;min-width:0}
.jslot .nm{font-size:15px}
.jslot .sub{font-size:12px;color:var(--mist)}
.jslot .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.jslot .bar i{display:block;height:100%;background:var(--jade)}
.picker{border:1px dashed var(--jade-d);border-radius:6px;padding:8px 12px;margin-top:-4px}
.picker .row2:last-child{border-bottom:0}

/* 列表 */
.karma{font-size:13px;color:var(--mist);margin-bottom:12px}
.karma b{color:var(--bone)}
.ch{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ch .th{width:52px;height:38px;border-radius:4px;overflow:hidden;position:relative;background:#0d0c09;border:1px solid var(--line)}
.ch .th canvas{position:absolute;inset:0;width:100%;height:100%}
.ch .th span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-brush);font-size:20px;text-shadow:0 1px 4px #000}
.ch .ct{font-size:15px}
.ch .ch-h{font-size:12px;color:var(--dim)}
.ch.new .ct{color:var(--gold)}
.ch.lock .ct{color:var(--dim)}
.ch.lock .th{filter:grayscale(1) brightness(.35)}
.ch.side .ct{font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:6px;padding:10px 8px;background:var(--panel);min-width:0;min-height:86px}
.slot .sl{font-size:11px;color:var(--dim);letter-spacing:.15em}
.slot .sn{font-size:14px;line-height:1.35;margin:2px 0}
.slot .ss{font-size:11px;color:var(--mist);line-height:1.4}
.r-fan .iname,.r-fan .sn{color:var(--r-fan)}
.r-ling .iname,.r-ling .sn{color:var(--r-ling)}
.r-bao .iname,.r-bao .sn{color:var(--r-bao)}
.r-xian .iname,.r-xian .sn{color:var(--r-xian)}
.r-chuan .iname,.r-chuan .sn{color:var(--r-chuan)}
.row2{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row2 .in{flex:1;min-width:0}
.row2 .iname{font-size:15px}
.row2 .istat{font-size:12px;color:var(--mist)}
.row2 .ibtn{display:flex;gap:6px;flex-shrink:0}
.up{color:var(--good);font-size:11px;margin-left:4px}
.empty{color:var(--dim);font-size:13px;padding:14px 0}
.lv{font-size:12px;color:var(--jade);margin-left:6px}
.save textarea{width:100%;height:84px;background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;resize:vertical;-webkit-user-select:text;user-select:text}
.save .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:13px;color:var(--dim);margin:6px 0}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--line);color:var(--bone);font-size:13px;padding:7px 14px;border-radius:4px;max-width:440px;display:flex;gap:10px;align-items:center;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.big{border-color:var(--gold);color:var(--gold);font-family:var(--f-brush);font-size:20px}
.toast.bad{border-color:var(--cin)}
.toast.big2{border-color:var(--gold);color:var(--gold)}
.toast button{background:none;border:1px solid var(--jade);color:var(--jade);border-radius:3px;padding:2px 8px;font-size:12px}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* 视觉小说 */
#ov{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:rgba(10,8,6,.92)}
#ov.vn{background:#000}
#ov .vbg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .4s}
#ov .inner{position:relative;width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--bone);letter-spacing:.1em;text-shadow:0 1px 4px #000;position:relative;z-index:3}
.st-top .tt{font-family:var(--f-brush);font-size:20px}
.st-skip{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:var(--bone);border-radius:3px;padding:3px 10px;font-size:12px}
.st-sp{flex:1}
#ov .inner>.st-top,#ov .inner>.st-choices,#ov .inner>.st-box,#ov .inner>.modal,#ov .inner>.intro{flex-shrink:0}
.port{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);height:min(52vh,420px);aspect-ratio:200/240;transition:opacity .3s,transform .3s;pointer-events:none;z-index:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.port svg{width:100%;height:100%;display:block}
.port.l{left:-4%}
.port.r{right:-4%}
.port.hide{opacity:0}
.port.l.hide{transform:translateX(-12%)}
.port.r.hide{transform:translateX(12%)}
.port.dim{filter:brightness(.45) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.st-choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;position:relative;z-index:3}
.st-choices button{text-align:left;border:1px solid var(--jade);background:rgba(20,40,32,.88);color:var(--bone);padding:12px 14px;border-radius:4px;font-size:15px;animation:tin .3s ease-out both}
.st-box{position:relative;z-index:2;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(18,15,11,.88),rgba(10,8,6,.96));border-radius:6px;padding:12px 16px 18px;min-height:136px}
.st-s{position:absolute;top:-16px;left:14px;font-family:var(--f-brush);font-size:20px;line-height:1;color:var(--bg);background:var(--jade);padding:6px 14px 5px;border-radius:3px}
.st-s.cin{background:var(--cin);color:var(--bone)}
.st-s.gold{background:var(--gold)}
.st-x{font-size:16.5px;line-height:1.85;max-width:34em;white-space:pre-wrap;margin-top:8px}
.st-x.narr{color:#cfc6b2}
.st-more{position:absolute;right:12px;bottom:4px;color:var(--dim);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.modal{margin:auto 0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:22px 18px;text-align:center;position:relative;z-index:2}
.modal h3{font-family:var(--f-brush);font-weight:400;font-size:30px;margin:0 0 8px;color:var(--gold)}
.modal p{color:var(--mist);margin:6px 0;font-size:14px}
.modal p b{color:var(--bone)}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.intro{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:2}
.intro h1{font-family:var(--f-brush);font-weight:400;font-size:clamp(50px,17vw,80px);line-height:1;margin:0;text-shadow:0 4px 20px #000}
.intro h1 span{color:var(--jade)}
.intro p{color:#d8cfbb;margin:0;max-width:22em;font-size:14px;text-shadow:0 1px 4px #000}
.intro input{background:rgba(0,0,0,.4);border:0;border-bottom:1px solid var(--jade);color:var(--bone);font:inherit;font-size:20px;text-align:center;padding:6px;width:min(220px,80vw);-webkit-user-select:text;user-select:text}
.intro .yr{font-size:12px;letter-spacing:.3em;color:var(--mist)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:rgba(0,0,0,.4);border:0;padding:6px 18px;color:var(--mist)}
.seg button[aria-pressed="true"]{background:var(--jade-d);color:var(--bone)}

@media (prefers-reduced-motion:reduce){
  .spin,.st-more,.wl .mk{animation:none}
  .plus,.pt,.toast,.st-choices button,.healfx,.bpop{animation-duration:.01s}
}

.qcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.qcard.ready{border-color:var(--gold)}
.qcard .in{flex:1;min-width:0}
.qcard .iname{font-size:15px}
.qcard .istat{font-size:12px;color:var(--mist)}
.qcard .qp{color:var(--jade)}
@media (prefers-reduced-motion:reduce){.reach{animation:none}}


/* 江湖：等距地图 */
#view.full{padding:0;overflow:hidden;margin-left:calc(-1 * max(12px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(12px,env(safe-area-inset-right,0px)))}
.wv{position:relative;width:100%;height:100%;overflow:hidden;background:#050605}
#wc{touch-action:none}
.wv canvas,#bt canvas,.travel canvas{position:absolute;display:block}
.travel canvas{image-rendering:pixelated}
.wlab{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wl{position:absolute;left:0;top:0;width:0;height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;will-change:transform}
.wl span{white-space:nowrap}
.wl>span:not(.bub):not(.pl):not(.bn){font-size:11px;color:var(--bone);background:rgba(8,7,5,.7);border-radius:3px;padding:0 5px;line-height:1.5;text-shadow:0 1px 2px #000}
.wl .mk{width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:13px;line-height:18px;text-align:center;box-shadow:0 0 10px rgba(227,184,98,.8);animation:mkb 1.2s ease-in-out infinite;font-weight:700}
.wl .mk.rd{background:var(--jade);box-shadow:0 0 10px rgba(143,214,181,.8)}
@keyframes mkb{50%{translate:0 -3px}}
.wl .pl{font-size:10.5px;color:var(--jade);background:rgba(8,7,5,.72);border:1px solid rgba(143,214,181,.45);border-radius:10px;padding:0 7px;line-height:1.55}
.wl .pl.g{color:var(--gold);border-color:rgba(227,184,98,.6)}
.wl .bn{font-family:var(--f-brush);font-size:15px;color:#ff8a70;text-shadow:0 0 6px rgba(255,60,40,.7),0 1px 2px #000}
.wl .bub{font-size:12px;color:#1b1712;background:#ece3cf;border-radius:8px;padding:3px 9px;max-width:200px;white-space:normal;text-align:center;line-height:1.4;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.5);animation:tin .2s ease-out;width:max-content}
.wl .bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#ece3cf;border-bottom:0}
.wl.b{z-index:2}
.whud{position:absolute;top:8px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none;text-shadow:0 1px 3px #000;max-width:58%}
.wloc b{display:block;font-family:var(--f-brush);font-weight:400;font-size:22px;line-height:1.1}
.wloc small{font-size:11px;color:var(--mist)}
.wbars{display:grid;gap:3px;width:132px}
.wb{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mist)}
.wb>i,.bb>i{flex:1;display:block;height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.wb>i>i,.bb>i>i,.li .hb>i{display:block;height:100%;transition:width .25s}
.hb>i{background:linear-gradient(90deg,#3f8a5a,#9ae0a0)}
.mb>i{background:linear-gradient(90deg,#2e5a8a,#7cc6e3)}
.wmeds{font-size:10.5px;color:var(--mist)}
.wbtns{position:absolute;top:8px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-height:calc(100% - 52px);overflow-y:auto;touch-action:pan-y;padding-left:4px}
.wbtns .btn{background:rgba(20,40,32,.85);backdrop-filter:blur(2px);flex-shrink:0}
.wbtns .btn.ghost{background:rgba(10,8,6,.75)}

  ['','周烈从队伍前面走过来，一脚踢翻了你手里的碗。'],
  ['zhou','听说你最近天天躲在通风道里打坐？学我修仙？'],
  ['zhou','灵根这东西，有就是有，没有就是没有。你这种人，一辈子就是捡破烂的命。'],
  ['','周围有人笑了，也有人别过脸去。'],
  ['mo','这小子是火灵根，单灵根，资质不错。可惜心浮气躁，底子打得太急。'],
  {c:[
   {t:'捡起饼干，一句话也不说',k:1,fx:{flags:{endure:1}},r:[['','你弯腰把饼干捡起来，拍掉上面的灰。'],['zhou','……没劲。'],['mo','能忍，好。忍不是怕，是还没到时候。']]},
   {t:'「三个月。三个月后，你会把碗捡起来还我。」',k:0,fx:{flags:{vow:1}},r:[['zhou','哈！行，我等着。'],['','周烈走了。他掌心的火苗跳得更凶了。'],['mo','话放出去了，就得做到。']]},
   {t:'一拳砸在他脸上',k:-1,fx:{flags:{punch:1}},r:[['','你的拳头比你想的还快。周烈踉跄了两步，鼻血流了下来。'],['zhou','你……你找死！'],['tie','都给我住手！'],['','铁叔把你们拉开。周烈盯着你，眼神像要吃人。']]}
  ]}
 ]},
 {id:'ahe',title:'第二章·阿禾',g:'禾',bg:'shelter',cond:()=>S.stage>=4,hint:'修炼至炼气五层',lines:[
  ['','你回到站台时，铁叔在通风口下面等你，脸色很难看。'],
  ['tie','阿禾烧了两天了。不是普通的烧，她身上在冒蓝光。'],
  ['','帐篷里，七岁的阿禾缩在毯子下面。她的手背上，细细的血管泛着荧蓝。'],
  ['tie','她妈妈去年冬天出去找药，再也没回来。这孩子要是再出事……'],
  ['mo','灵毒入体。这么小的娃娃扛不住浓灵气，经脉会被撑裂。'],
  ['mo','以你现在的修为，可以渡一缕灵气进去，把毒引出来。代价是你丹田里的灵气要散掉一半。'],
  ['he','{bro}……我是不是要变成外面那些怪物了？'],
  {c:[
   {t:'渡灵气给她',k:1,fx:{qiMul:.5,pills:1,flags:{saveHe:1}},r:[['','你握住她的手腕，把丹田里的灵气一点一点渡过去。蓝光熄了。'],['he','……不烫了。{bro}的手好暖。'],['mo','修为丢了还能再修，人丢了就没了。这颗破境丹，算老夫给你的。'],['','获得 破境丹 ×1']]},
   {t:'「我先去隧道深处猎妖，换药回来」',k:-1,fx:{stones:30},r:[['','你把阿禾交给铁叔，独自下了隧道。'],['','你带回了药，还有一袋多出来的灵石。阿禾的烧退了，可她看你的眼神里，多了一点害怕。'],['','获得 灵石 ×30']]}
  ]}
 ]},
 {id:'dongtian',title:'第三章·玉简洞天',g:'玉',bg:'shelter',cond:()=>S.stage>=6||S.kills[0]>=6,hint:'修炼至炼气七层，或在地铁站斩妖六只',lines:[
  ['','这天夜里，贴身放着的玉简烫得厉害。'],
  ['mo','闭眼。进来。'],
  {bg:'dongtian'},
  ['','你眼前一黑，再睁眼时，站在一片青色的雾里。脚下是一座悬空的小岛，岛中央立着一方玉台。'],
  ['mo','这是玉简里的洞天。三百年前，老夫靠它温养丹药。'],
  ['mo','东西放上玉台，借洞天的灵气慢慢养着。丹药一颗变两颗，兵器脱胎换骨，灵石也会自己长。'],
  ['@','这么好的东西，为什么现在才告诉我？'],
  ['mo','因为你之前太弱，养不起它。洞天要靠持有者的修为才转得动。'],
  ['mo','还有一件事，你给我记牢了。'],
  ['mo','洞天每转一次，都会漏出一丝灵光。漏得多了，会被人闻到味道。'],
  ['mo','这世上，有人专门在找这种味道。'],
  {fx:{qiPills:2,flags:{dongtian:1}}},
  ['','获得 聚气丹 ×2'],
  ['','【「玉简」已开启：放入丹药、装备或灵石温养，按现实时间成熟。每次收取都会让灵光外泄。】']
 ]},
 {id:'ratking',title:'第四章·鼠王',g:'王',bg:'metro',cond:()=>S.bossDown.includes(0),hint:'击败「鼠王·裂齿」',lines:[
  ['','鼠王倒下的时候，整条隧道都安静了。'],
  {bg:'shelter'},
  ['','你拖着鼠王的獠牙回到青石站。站台上没有一个人说话。'],
  ['tie','三年了……那畜生叼走了我们十一个人。'],
  ['tie','{name}，从今天起，你就是青石站的仙师。'],
  ['he','{bro}好厉害！'],
  ['','人群后面，周烈的脸涨得通红。'],
  ['zhou','一只老鼠而已，谁杀不了？'],
  ['zhou','敢不敢跟我打一场？就在站台上，让大家都看看，谁才是青石站最强的。'],
  {c:[
   {t:'「好。」',k:0},
   {t:'「我没兴趣跟你争。不过你要打，我奉陪。」',k:1},
   {t:'「打完了，你从这里滚出去。」',k:-1}
  ]},
  ['mo','这小子底子是虚的。打他，别留情，也别下死手。'],
  ['','【约战：周烈。他在青石站的站台中央等你，走过去和他说话即可迎战。】']
 ],after:()=>{S.special='zhou';}},
 {id:'zhouleave',title:'第五章·你等着',g:'烈',bg:'shelter',cond:()=>F('duel_zhou'),hint:'约战中击败周烈',lines:[
  ['','周烈跪在站台的水泥地上。掌心的火苗，灭了。'],
  ['zhou','……不可能。你明明是杂灵根。'],
  ['',()=>F('vow')?'你把一只空碗放在他面前。三个月前，他踢翻的就是这只。':F('endure')?'你什么都没说，转身去扶被震倒的帐篷。':'你看着他。上一回，是他看着你。'],
  ['zhou','你等着。'],
  ['','当天夜里，周烈背着包离开了青石站。没人知道他去了哪里。'],
  ['tie','由他去吧。这世道，有本事的人留不住。'],
  ['mo','……那小子走的时候，眼神不对。'],
  ['mo','好了。往北走，锈蚀高架上有一支商队，专门倒卖妖兽材料。你要筑基，得去那里换资源。'],
  {fx:{pills:1,stones:40}},
  ['','铁叔塞给你一个布包。获得 破境丹 ×1、灵石 ×40。']
 ]},
 {id:'z1',title:'行路·锈蚀高架',g:'桥',bg:'overpass',side:1,cond:()=>S.visited.includes(1),hint:'前往锈蚀高架',lines:[
  ['','断掉的高架桥悬在半空，像一条被斩断的龙。'],
  ['','桥墩上挂着锈透的汽车。风一吹，钢筋就嗡嗡地响，像有人在远处吹哨。'],
  ['mo','小心头顶。这里的东西，喜欢从上面掉下来。']
 ]},
 {id:'caravan',title:'第六章·锈色商队',g:'商',bg:'overpass',cond:()=>S.bossDown.includes(1),hint:'击败「钢骨百足」',lines:[
  ['','钢骨百足的尸体卡在两段断桥之间。几辆改装卡车从桥另一头的灰尘里开了出来。'],
  ['hong','好身手。我是红姐，红鹞商队管事的。那条百足的甲壳，卖不卖？'],
  ['hong','顺便提醒你一句。你这种身上带灵光的人，天黑以后最好别落单。'],
  ['hong','有一伙人叫“天穹会”，专抓有灵根的活人。听说是拿去炼丹。'],
  ['hong','前几天我还看见一个小子，手上冒火，跟着他们的人走了。'],
  ['@','……周烈。'],
  ['mo','天穹会。他们居然还在。'],
  {c:[
   {t:'把玉简的事告诉红姐',k:1,fx:{stones:120,flags:{trustHong:1}},r:[['hong','带着前辈残魂的玉简？你心可真大。行，这份信任我记下了。'],['hong','以后在我这儿买东西，给你打九折。'],['','获得 灵石 ×120']]},
   {t:'什么都不说，卖掉甲壳就走',k:0,fx:{stones:80},r:[['hong','嘴严是好事。这世道，嘴严的人活得久。'],['','获得 灵石 ×80']]}
  ]},
  ['','卡车开远了。你问墨老天穹会是什么，他很久都没有回答。']
 ]},
 {id:'exposed',title:'第七章·灵光',g:'眼',bg:'shelter',cond:()=>F('dongtian')&&S.expo>=100,hint:'温养时灵光外泄满盈',lines:[
  ['','你从洞天里取出温养好的东西时，玉简的裂纹里漏出一缕青光，直冲隧道顶。'],
  ['mo','糟了。'],
  ['','三天后的夜里，站台的灯一盏接一盏地灭了。'],
  ['tq','青石站的诸位，不必惊慌。'],
  ['tq','天穹会只找一个人。身上带着洞天法宝的那一位。'],
  ['','执事身后站着一个人。他脸上戴着半张白色面具，面具中间，画着一只眼睛。'],
  ['zhou2','好久不见啊，拾荒的。'],
  ['@','周烈？'],
  ['zhou2','天穹会给了我新的功法。现在，该轮到你跪了。'],
  {c:[
   {t:'「冲我来，别碰站里的人。」',k:1},
   {t:'「上次没打够？」',k:0},
   {t:'「正好。你的灵根，我也拿来温养一下。」',k:-1}
  ]},
  ['','【迎战：天穹追兵。追兵就在青石站站台东侧，走过去迎战。】']
 ],after:()=>{S.special='hunter';}},
 {id:'hunted',title:'第八章·面具',g:'面',bg:'shelter',cond:()=>F('hunter1'),hint:'击退天穹追兵',lines:[
  ['','面具裂成了两半。周烈捂着脸，退进了黑暗的隧道里。'],
  ['zhou2','天穹会不会放过你的。你那块玉简，长老们找了三百年。'],
  ['','他走了。那个执事，早就不见了。'],
  ['@','墨老，你认识天穹会？'],
  ['mo','……以后再说。'],
  ['mo','从今往后，洞天少用。用了，就别怕他们找上门。'],
  ['','【灵光外泄满盈后，天穹追兵会再次找上门，击退即可清零。修习「敛息诀」能减少外泄。】']
 ]},
 {id:'z2',title:'行路·旧城妖林',g:'林',bg:'forest',side:1,cond:()=>S.visited.includes(2),hint:'前往旧城妖林',lines:[
  ['','人民公园不见了。原地长出一片你叫不出名字的森林，树干粗得十个人都抱不过来。'],
  ['','一栋商场被藤蔓整个吞了下去，橱窗里还摆着三年前的假人。'],
  ['mo','这里的灵气……太浓了。浓得不对劲。']
 ]},
 {id:'locust',title:'第九章·槐下旧事',g:'槐',bg:'forest',cond:()=>S.bossDown.includes(2),hint:'击败「千年槐妖」',lines:[
  ['','千年槐妖的根系一寸寸枯死，露出埋在地下的一块石碑。'],
  ['','碑上刻着一个篆字：墨。'],
  ['mo','……'],
  ['mo','这棵槐树，是老夫三百年前亲手种下的。'],
  ['mo','那时候这里还是一座道观，叫太一观。我和师兄常在树下论道。'],
  ['mo','师兄说，修仙不该只是少数人的事。他想让天下人都能修。'],
  ['mo','我信了他。然后我们一起，做了一件蠢事。'],
  ['','他没有再说下去。玉简上的裂纹，好像又深了一点。'],
  {fx:{pills:1}},
  ['','你在石碑下找到一个陶罐。获得 破境丹 ×1。']
 ]},
 {id:'zhuji',title:'第十章·筑基',g:'基',bg:'shelter',cond:()=>S.stage>=9,hint:'突破至筑基期',lines:[
  ['','灵气在丹田里旋转、压缩，最后凝成一座看不见的台基。你筑基了。'],
  ['mo','好。从今天起，你才算真正踏上了这条路。'],
  ['','你回到青石站时，站台上摆了一桌菜。说是一桌，其实是几个罐头和一锅野菜汤。'],
  ['tie','站里的人凑的。别嫌寒碜。'],
  ['he','{bro}，这个给你！'],
  ['','阿禾塞给你一个歪歪扭扭的平安结，红绳编的，还缠着一根她自己的头发。'],
  ['he','我编了好几天。戴着它，就不会受伤了。'],
  {fx:{gift:'平安结'}},
  ['','获得 佩饰「平安结」。']
 ]},
 {id:'z3',title:'行路·沉没港口',g:'港',bg:'port',side:1,cond:()=>S.visited.includes(3),hint:'前往沉没港口',lines:[
  ['','海平面涨了十米。原来的港口只剩下吊机的上半截，从雾里伸出来。'],
  ['','雾里有船灯在晃。可这一带，早就没有渔船了。'],
  ['mo','那盏灯……是白色的。']
 ]},
 {id:'port',title:'第十一章·雾港',g:'雾',bg:'port',cond:()=>S.bossDown.includes(3),hint:'击败「海眼蛟」',lines:[
  ['','海眼蛟沉下去之后，雾散了。港口里停着一艘挂白旗的船。'],
  ['','旗上是一只眼睛，天穹会的标记。船舱里关着二十几个人，手腕上都烙着编号。'],
  ['','你认出了其中一个。是阿禾的妈妈，李婶。去年冬天，她出门找药，就再也没回来。'],
  ['mo','他们在收集灵根。船上那几箱灵石，够你修很久。'],
  ['mo','船员马上就回来了。你只来得及做一件事。'],
  {c:[
   {t:'劈开牢门，放人',k:1,fx:{pills:2,flags:{freed:1}},r:[['','你劈开铁锁。人们涌向码头，散进了雾里。'],['','李婶临走前塞给你两颗丹药：“我以前在药厂上班。拿着。”'],['','获得 破境丹 ×2']]},
   {t:'搬走灵石',k:-1,fx:{stones:4000},r:[['','你扛起箱子离开的时候，身后有人在喊救命。你听出了那是李婶的声音。'],['mo','……走吧。'],['','获得 灵石 ×4000']]}
  ]}
 ]},
 {id:'jindan',title:'第十二章·金丹',g:'丹',bg:'dongtian',cond:()=>S.stage>=13,hint:'突破至金丹期',lines:[
  ['','台基崩碎，灵气凝成一颗浑圆的丹，悬在你的丹田正中。'],
  ['mo','金丹成了。三百年前，太一观里能结丹的，不超过十个人。'],
  ['@','那你师兄呢？'],
  ['mo','他是第一个。比我早了整整二十年。'],
  ['mo','他天赋太好了。好到觉得，没有什么事是他做不成的。']
 ]},
 {id:'z4',title:'行路·坠星研究所',g:'星',bg:'lab',side:1,cond:()=>S.visited.includes(4),hint:'前往坠星研究所',lines:[
  ['','灵潮那天，第一块“星”就砸在这里。研究所的穹顶裂开一道口子，往外渗着蓝光。'],
  ['','围墙上的警示牌还在：生物安全四级，闲人勿入。下面有人用红漆补了一句：天穹会接管。']
 ]},
 {id:'zero',title:'第十三章·零号',g:'零',bg:'lab',cond:()=>S.bossDown.includes(4),hint:'击败「零号」',lines:[
  ['','研究所最深处，一个少女模样的东西跪在碎玻璃里。她的胸口在发光，那是一枚人造金丹。'],
  ['zero','你……打赢了我。'],
  ['zero','天穹会造了我。他们想用我当钥匙，打开灵源。'],
  ['zero','我不想当钥匙。可除了这个，我没有别的用处。'],
  ['mo','她那枚金丹，是用三百个人的灵根炼出来的。吞了它，你的丹田会立刻满盈。'],
  {c:[
   {t:'放过她',k:1,fx:{flags:{zeroSaved:1}},r:[['zero','……为什么？'],['','你说不出为什么。你只是觉得，她不该只是一把钥匙。'],['zero','我会记住你的名字，{name}。']]},
   {t:'吞噬金丹',k:-2,fx:{qiFill:1},r:[['','光熄灭了。那股力量冲进你的经脉，滚烫，发苦。'],['mo','……你终究还是走了这条路。'],['','丹田灵气已满。']]}
  ]}
 ]},
 {id:'z5',title:'行路·天坑',g:'坑',bg:'pit',side:1,cond:()=>S.visited.includes(5),hint:'前往天坑',lines:[
  ['','市中心塌出了一个直径两公里的坑。坑底在发光，像一只烧红的眼睛。'],
  ['','坑边的楼都斜着，随时会滑下去。热风从坑里往上吹，带着硫磺和血的味道。']
 ]},
 {id:'zhoufate',title:'第十四章·火灭',g:'灰',bg:'pit',cond:()=>F('hunter1')&&S.kills[5]>=5,hint:'击退天穹追兵后，在天坑斩妖五只',lines:[
  ['','坑壁上的一处岩洞里，你找到了周烈。'],
  ['','他的半边身体已经变成了石头，裂缝里渗着天坑的红光。面具碎了一地。'],
  ['zhou2','……哈。拾荒的。'],
  ['zhou2','天穹会给的功法，是拿人当炉子烧的。我才是那颗被炼的丹。'],
  ['zhou2','我输给你一次，他们就把我扔进了这里。'],
  ['mo','他的灵根快烧干了。要救，得耗你大半灵气；不救，他撑不过今晚。'],
  {c:[
   {t:'救他',k:2,fx:{qiMul:.4,flags:{zhouSaved:1}},r:[['','你把手按在他胸口，把灵气一点点渡过去。石化停了。'],['zhou2','……为什么？我以前那样对你。'],['@','因为青石站的人，不该死在这种地方。'],['','周烈没再说话。很久以后，他低声说了一句：“谢了。”']]},
   {t:'给他一个痛快',k:0,r:[['','你拔出剑。周烈闭上了眼睛。'],['zhou2','……挺好。比烧干了强。'],['','你在坑边给他堆了一座石头坟。']]},
   {t:'吸走他残余的火灵根',k:-2,fx:{qiFill:1},r:[['','火灵根离体的时候，他叫了一声，然后就安静了。'],['mo','……'],['','丹田灵气已满。玉简一整夜都没有再说话。']]}
  ]}
 ]},
 {id:'fallen',title:'第十五章·堕仙',g:'堕',bg:'pit',cond:()=>S.bossDown.includes(5),hint:'击败「堕仙残躯」',lines:[
  ['','堕仙残躯倒下，露出一张苍老的脸。玉简在你怀里剧烈地震了一下。'],
  ['mo','师兄……'],
  ['sx','……墨……师弟……'],
  ['sx','灵源……关不上了……'],
  ['','他的身体碎成了灰。'],
  ['mo','{name}，是时候告诉你了。'],

 const k=z*dpr,x=cv.getContext('2d');x.setTransform(k,0,0,k,0,0);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';return {W:r.width/z,H:r.height/z,k,dpr,ox:0,oy:0};}
function fitCanvasPx(cv,host,target){const r=host.getBoundingClientRect(),dpr=Math.min(3,window.devicePixelRatio||1);const k=Math.max(2,Math.round(r.width*dpr/target));

 const ox=(r.width-W*k/dpr)/2,oy=(r.height-H*k/dpr)/2;cv.style.left=ox+'px';cv.style.top=oy+'px';return {W,H,k,dpr,ox,oy};}

/* ---------- 鬼手的货 ---------- */
function guiStock(){const day=new Date().toDateString()+(new Date().getHours()<12?'a':'b');if(S.guiStock&&S.guiStock.day===day)return S.guiStock.items;const z=maxZone(),items=[];
 const t=Math.min(5,gemTierFor(z)+1);items.push({k:'gem',g:pick(['a','d','h','c'])+t,p:zsAt(z,6*t)});items.push({k:'gem',g:pick(['a','d','h','c'])+Math.max(1,t-1),p:zsAt(z,4*t)});
 const bl=Object.keys(BOOKS).filter(b=>!S.learned.includes(b)&&BOOKS[b].lv<=S.stage+6);if(bl.length)items.push({k:'book',b:pick(bl),p:zsAt(z,25)});
 items.push({k:'item',p:zsAt(z,30)});items.push({k:'box',p:zsAt(z,8)});S.guiStock={day,items};return items;}
function guiShop(){const L=guiStock();const nm=o=>o.sold?'（已售出）':o.k==='gem'?gemName(o.g)+'（'+gemText(o.g)+'）':o.k==='book'?BOOKS[o.b].n:o.k==='item'?'一件仙品装备（三条词条）':'盲盒（什么都可能有）';
 modal(`<h3>鬼手的货</h3><p>今天的货，明天就没了。身上灵石 <b>${fmt(S.stones)}</b></p>`,L.map((o,i)=>({t:nm(o)+(o.sold?'':' · '+fmt(o.p)+' 灵石'),cls:o.k==='box'?'gold':'',fn:()=>{if(o.sold||S.stones<o.p){if(!o.sold)toast('灵石不够','bad');setTimeout(guiShop,30);return;}S.stones-=o.p;S.cnt=S.cnt||{};S.cnt.gui=(S.cnt.gui||0)+1;
  if(o.k!=='box')o.sold=1;EVZ=maxZone();let t='';
  if(o.k==='gem'){S.gems[o.g]=(S.gems[o.g]||0)+1;t='买下 '+gemName(o.g);}else if(o.k==='book')t=gBook(o.b);else if(o.k==='item'){t=pushItem(mkItem(maxZone(),true,{r:3,slot:pick(SLOT5)}));}
  else{const r=Math.random(),z=maxZone();if(r<.05){save();setTimeout(()=>startBattle([mkCustom(z,{look:'宝箱怪',name:'盲盒里的东西',m:2.4,boss:true,after:()=>gGem(null,gemTierFor(z)+1)+gS(zsAt(z,10))})],{noFlee:true}),200);toast('盲盒在你手里动了一下……','bad');return;}
   if(r<.1){const zs2=ZORD.filter(x=>S.bossDown.includes(x)),U=zs2.length?ZONES[pick(zs2)].boss:null,it=U&&mkUnique(U,z);t=it?'盲盒里竟然是传说装备！'+pushItem(it):gS(zsAt(z,20));}
   else if(r<.45)t=gS(zsAt(z,r<.2?20:9));else if(r<.7)t=gGem(null,gemTierFor(z));else if(r<.85)t=gItem(rollRar(true));else if(r<.93)t=gBook();else t='盲盒里只有一张纸条：“谢谢惠顾。”';}
  toast(String(t).trim(),'big');live();save();setTimeout(guiShop,30);}})).concat([{t:'走了',cls:'ghost'}]));}

function bfsPath(M,sc,sr,goal){const W=M.W,prev=new Int32Array(W*M.H).fill(-2),occ=new Set();M.ents.forEach(e=>{if(e.kind==='npc'&&!e.dead)occ.add(gi(M,Math.round(e.x),Math.round(e.y)));});
 const s0=gi(M,sc,sr);const q=[s0];prev[s0]=-1;let h=0,found=-1;
 while(h<q.length){const i=q[h++],c=i%W,r=(i/W)|0;if(goal(c,r)){found=i;break;}for(const [dc,dr] of DIRV){const nc=c+dc,nr=r+dr;if(!inMap(M,nc,nr))continue;const j=gi(M,nc,nr);if(prev[j]!==-2||!passable(M,nc,nr)||occ.has(j))continue;prev[j]=i;q.push(j);}}
 if(found<0)return null;const out=[];let i=found;while(prev[i]!==-1){out.push([i%W,(i/W)|0]);i=prev[i];}return out.reverse();}

function wWalk(tc,tr,adj,act){const M=WD.M,P=WD.P;const from=P.path.length?P.path[0]:[Math.round(P.x),Math.round(P.y)];

 const test=(x0,y0,w,h,d,o)=>{if(gx>=x0&&gx<=x0+w&&gy>=y0&&gy<=y0+h&&d>bd){bd=d;best=o;}};
 M.ents.forEach(e=>{if(e.dead)return;const sx=(e.x-e.y)*16+ox,sy=(e.x+e.y)*8+oy;if(e.kind==='foe'){const cv=monCv(e.look,e.boss?1.1:.72,e.tint);test(sx-dw(cv)/2-3,sy-dh(cv)-3,dw(cv)+6,dh(cv)+6,e.x+e.y,e);}else test(sx-10,sy-30,20,32,e.x+e.y,e);});

 return best;}

 if(d<=s){e.x=tc;e.y=tr;e.path.shift();if(onTile)onTile(tc,tr);if(!e.path.length)e.moving=false;}else{e.x+=Math.sign(dx)*Math.min(Math.abs(dx),s);e.y+=Math.sign(dy)*Math.min(Math.abs(dy),s);}}

  if(dist<=4&&!(e.stun>0)&&P.inv<=0&&!WD.fly){let best=null,bd=dist;DIRV.forEach(([dc,dr])=>{const nc=c+dc,nr=r+dr,nd=Math.abs(nc-pc)+Math.abs(nr-pr);if(nd<bd&&passable(M,nc,nr)){bd=nd;best=[nc,nr];}});if(best){e.path=[best];e.spd=2.5;}}

 const [m,tag]=elMul(a,t,el);d*=m;if(o.mul)d*=o.mul;if(a.big>0)d*=1.8;if(s.expose)d*=1.5;
 if(o.phys&&t.frozen>0){d*=2.5*(a.key==='hero'&&hasRoot('jin')?1.2:1);t.frozen=0;combo='碎冰';}
 else if(el==='jin'&&t.frozen>0){d*=2.2;t.frozen=0;combo='碎冰';}
 if(el==='lei'&&s.burn>0){const n=s.burn,k=comboK(a,o);s.burn=0;combo='爆燃';extra=()=>{BT.foes.filter(f=>f.alive).forEach(f=>btHit(f,a.atk*.5*n*k*(f===t?1:.55),'combo',a));};}

 if(el==='huo'&&s.root>0){s.root=0;combo='燎原';extra=()=>BT.foes.filter(f=>f.alive).forEach(f=>stAdd(f,'burn',f===t?4:2,a));}
 if(el==='bing'&&s.wet>0){s.wet=0;combo='冰封';extra=()=>{if(t.alive){t.frozen=1;btPop(t,'冻结','st chill');}};}

 const ok=realmIdx()>=2&&c.fame>=150;return `<div class="row2"><div class="in"><div class="iname">开宗立派</div><div class="istat">把家族立为宗门：需金丹境界、家族声望 150（现 ${c.fame}）。宗门能多收一名弟子，也会被其他宗门当成对手。</div></div><button class="btn sm ${ok?'gold':''}" data-act="zong" ${ok?'':'disabled'}>立宗</button></div>`;}
function zongFound(){const c=S.clan;if(!c||c.zong||realmIdx()<2||c.fame<150)return;const base=c.name.replace(/家$/,'');
 modal(`<h3>开宗立派</h3><p>族人们在祠堂前站成两排。新的牌匾已经刻好了，只差你给它起个名字。</p>`,[base+'宗',base+'门',base+'派'].map(n=>({t:n,cls:'gold',fn:()=>{c.name=n;c.zong=1;c.zongY=S.year;c.fame+=50;S.dao.zong+=3;news(S.name+'开宗立派，立「'+n+'」。',1);sfx('bell');toast('「'+n+'」立宗！','big');save();render();}})).concat([{t:'再等等',cls:'ghost'}]));}

 tiegu:{n:'铁骨帮',el:'tu',st:10,mech:'jinshen',book:'tiegu',form:'jingang',align:'中',d:'以力入道，横练筋骨。长老以上「金身」刀枪难入——先破其甲。',ally:{defP:.08},lt:'帮主'},
 baicao:{n:'百草谷',el:'mu',st:13,mech:'heal',book:'baicao',form:'liangyi',align:'正',d:'丹道世家。谷主每回合回春——灼烧能断她的生机。',ally:{healP:.15},lt:'谷主'},
 chixiao:{n:'赤霄宗',el:'huo',st:16,mech:'fireImm',book:'chixiao',form:'tiangang',align:'正',d:'以火入剑，不惧灼烧，出手带火——水能克之。',ally:{atkP:.06},lt:'宗主'},
 xuanshui:{n:'玄水门',el:'shui',st:20,mech:'shuijing',book:'xuanshuij',form:'juling',align:'正',d:'水镜反射三成伤害——先用雷让她感电，水镜即破。',ally:{mp:.15},lt:'门主'},
 youming:{n:'幽冥殿',el:'bing',st:24,mech:'summon',book:'youming',form:'jiugong',align:'魔',d:'不惧霜冻，每三回合招来鬼仆——速战速决。',ally:{ls:.05},lt:'殿主'},
 tianqiong:{n:'天穹会',el:'lei',st:29,mech:'shuijing',book:'tianqiong',form:'wuxing',align:'魔',d:'会首两重真身，水镜护体——雷破镜，五行轮转压之。',ally:{critA:.05},lt:'会首'}
};
const SECT_ORD=['tiegu','baicao','chixiao','xuanshui','youming','tianqiong'];
const SECT_LOOK={tiegu:['铁骨帮众','铁骨长老'],baicao:['百草弟子','百草长老'],chixiao:['赤霄弟子','赤霄长老'],xuanshui:['玄水弟子','玄水长老'],youming:['幽冥鬼卒','幽冥护法'],tianqiong:['天穹追兵','天穹长老']};
const RANKN=['弟子','长老','宗主'];
const sectBeat=k=>!!(S.sects[k]&&S.sects[k].beat>=3);
const zOfStage=st=>st>=38?Math.min(10,8+Math.floor((st-38)/5)):Math.max(0,Math.min(6,Math.floor((st-1)/5)));
function sectLead(k){return S.ppl.find(p=>p.sect===k&&p.lead&&p.alive);}
function sectFoe(k,rank){const D=SECTS[k],lead=sectLead(k);const st=rank===2&&lead?Math.max(lead.st,D.st+2):D.st+[-3,0,3][rank];
 const nm=rank===2?(lead?lead.n:D.n+D.lt):D.n+RANKN[rank],look=rank===2&&lead&&LOOK[lead.n]?lead.n:SECT_LOOK[k][rank?1:0];
 const e=mkCustom(zOfStage(st),{look,name:nm,st,m:[1.05,1.4,1.9][rank],boss:rank===2});e.el=D.el;e.human=1;e.sect=k;if(rank>=1)e.mech=D.mech;
 if(rank===2&&k==='tianqiong'){e.p2=1;e.n2='顾长风·雷霆真身';}if(k==='youming')e.demon=1;
 e.atkSt={huo:['burn',1],bing:['chill',1],shui:['wet',2],lei:['shock',1]}[D.el]||null;return e;}
function sectFight(k){const R=S.sects[k]||(S.sects[k]={beat:0,rel:null});if(R.rel==='vassal'||R.rel==='gone'){toast('这个宗门已经不在了','bad');return;}const rank=Math.min(2,R.beat);
 const foes=[sectFoe(k,rank)];if(rank===2)foes.push(sectFoe(k,1));if(rank===0)foes.push(sectFoe(k,0));jhClose();
 startBattle(foes,{bg:'market',noFlee:rank===2,onWin:()=>sectWin(k,rank),onLose:()=>{S.injury=Date.now()+5*60*1000;toast(SECTS[k].n+'：「回去再练几年吧。」（轻伤五分钟）','bad');save();}});}
function sectWin(k,rank){const D=SECTS[k],R=S.sects[k];const first=R.beat<=rank;if(first)R.beat=rank+1;S.fame+=[3,8,25][rank];let L=[];
 if(first&&rank===0)L.push(gS(zsAt(zOfStage(D.st),8)),gMat('he',3));
 if(first&&rank===1){L.push(learnForm(D.form)||gS(zsAt(zOfStage(D.st),12)));}
 if(first&&rank===2){S.books[D.book]=(S.books[D.book]||0)+1;L.push(' 获得'+D.n+'镇派绝学 '+BOOKS[D.book].n+'（在「囊」里研读）。');news(S.name+'挑落'+D.n+D.lt+'，名动江湖。',1);if(SECT_ORD.every(sectBeat))checkStory();}
 save();const msg=L.join('').trim();
 if(rank===2&&first)setTimeout(()=>sectChoice(k,msg),300);else setTimeout(()=>{modal(`<h3>${D.n} · 胜</h3><p>${rank===0?'弟子们面面相觑。':'长老收起兵刃，抱了抱拳。'}${msg?'<br>'+esc(msg):''}</p><p class="note">江湖声望 +${[3,8,25][rank]}${first&&rank<2?' · 下一阵：'+D.n+RANKN[rank+1]:''}</p>`,[{t:'好',cls:'gold'}]);},300);}
function sectChoice(k,msg){const D=SECTS[k],R=S.sects[k],lead=sectLead(k);
 modal(`<h3>${D.n} · 宗主落败</h3><p>${lead?esc(lead.n):D.lt}半跪在地，满座寂然。所有人都在等你开口。</p><p class="note">${esc(msg)}</p>`,[
  {t:'点到为止，结为盟友',cls:'gold',fn:()=>{R.rel='ally';if(lead)lead.att=Math.min(100,lead.att+30);S.dao.zheng+=2;kar(1);news(S.name+'与'+D.n+'结盟。',1);toast('与'+D.n+'结盟：获得盟友加成','big');save();render();}},
  {t:'索要镇派之宝',cls:'',fn:()=>{R.rel='hostile';if(lead)lead.att=-70;S.dao.mo+=1;const t=gItem(4)+gS(zsAt(zOfStage(D.st),40));seedAdd('sect',null,S.year+10+Math.floor(Math.random()*10),{sect:k});news(D.n+'被'+S.name+'强取镇派之宝，'+D.n+'上下引为奇耻。',1);modal('<h3>强取</h3><p>他们把东西捧了出来。没有人说话。'+esc(t)+'</p><p class="note">'+D.n+'记住了这件事。</p>',[{t:'走',cls:'red'}]);save();render();}},
  ...(S.clan?[{t:'吞并，纳入'+esc(S.clan.name),cls:'',fn:()=>{R.rel='vassal';S.dao.zong+=2;S.dao.mo+=1;const c=S.clan;c.fame+=60;for(let i=0;i<2;i++){const m=clRecruit(true);if(m)m.role='降众';}if(lead){lead.sect=null;lead.lead=0;lead.att=-80;seedAdd('revenge',lead.id,S.year+15+Math.floor(Math.random()*10),{why:''+D.n+'的牌匾，是你亲手摘下来的。'});}news(D.n+'并入'+c.name+'，从此除名。',1);toast(D.n+'并入家族','big');save();render();}}]:[]),
  ...(S.path==='mo'?[{t:'吞其修为',cls:'red',fn:()=>{R.rel='hostile';S.dao.mo+=3;kar(-2);addQi(req(S.stage)*1.5,true);if(lead){lead.alive=false;lead.dy=S.year;lead.lead=0;}const heir=S.ppl.filter(p=>p.alive&&p.sect===k).sort((a,b)=>b.st-a.st)[0];if(heir){heir.att=-90;heir.tal=Math.min(1,heir.tal+.2);seedAdd('revenge',heir.id,S.year+20+Math.floor(Math.random()*15),{why:'师父的修为，你用得还顺手吗？'});}
    news(S.name+'吞尽'+D.n+D.lt+'的修为。'+(heir?heir.n+'当夜出走，不知所踪。':''),1);toast('魔道：吞噬修为','big');save();render();}}]:[])]);}

/* ---------- 江湖榜 ---------- */
function jhList(){const L=S.ppl.filter(p=>p.alive&&p.known&&p.st>=0).map(p=>({n:p.n,st:p.st,p,sect:p.sect}));L.push({n:S.name,st:S.stage,me:1,sect:null});
 return L.sort((a,b)=>b.st-a.st||(a.me?1:0)-(b.me?1:0));}
const JH_POP=20000,jhVirt=()=>Math.round(JH_POP*Math.pow(.72,S.stage+1));
const jhRank=()=>jhList().findIndex(x=>x.me)+1+jhVirt();

/* ---------- 悬赏 ---------- */
const BNT_K=[{k:'mo',n:'魔修',why:['血祭了两个村子','专挑孩子下手','在城外布下噬魂阵'],look:'虚无行者',demon:1},{k:'rob',n:'劫修',why:['劫了红鹞商队的货','在官道上杀人越货','抢了百草谷的药'],look:'黑市打手'},{k:'trait',n:'叛徒',why:['盗走了宗门秘典','出卖了同门','投了天穹会'],look:'天穹追兵'}];
function bntList(){const d=new Date().toDateString();if(S.bnt&&S.bnt.day===d)return S.bnt.L;const L=[];for(let i=0;i<3;i++){const K=pick(BNT_K),st=Math.max(1,Math.min(LAST,S.stage+[-2,0,3][i]));
  L.push({id:i,k:K.k,n:pick(CL_SUR.split(''))+pick(['屠','枭','煞','狼','七','九','蛇','鬼'])+pick(['','子','郎','娘']),why:pick(K.why),look:K.look,demon:K.demon,st,done:0,tier:i});}S.bnt={day:d,L};return L;}
function bntFight(i){const b=bntList()[i];if(!b||b.done)return;jhClose();const e=mkCustom(zOfStage(b.st),{look:b.look,name:b.n,st:b.st,m:[1.2,1.6,2.1][b.tier],boss:b.tier===2});e.human=1;if(b.demon)e.demon=1;
 startBattle([e],{bg:WD.M&&WD.M.kind!=='town'?WD.M.z:'market',onWin:()=>{b.done=1;const k=S.path==='zheng'?1.5:1;S.stones+=Math.ceil(zsAt(zOfStage(b.st),[6,10,18][b.tier])*k);S.fame+=[2,4,8][b.tier];
   let extra='';if(b.k==='mo'){S.dao.zheng+=1;kar(1);news(b.n+'伏诛。附近的村子保住了。');if(Math.random()<.4){const p=mkPerson({n:pick(CL_SUR.split(''))+pick(['无','血','夜','孤'])+pick(['尘','衣','生','影']),st:Math.max(0,b.st-8),age:14,tal:.95,att:-80,known:false,goal:'为师父报仇'});seedAdd('modis',p.id,S.year+15+Math.floor(Math.random()*20),{mname:b.n});extra='\n（逃走的人里，好像有一个孩子。）';}}
   if(b.k==='trait'){const sk=pick(SECT_ORD);S.sects[sk]=S.sects[sk]||{beat:0,rel:null};const lead=sectLead(sk);if(lead)lead.att=Math.min(100,lead.att+10);extra='\n'+SECTS[sk].n+'记下了你的人情。';}
   save();modal(`<h3>悬赏 · ${esc(b.n)}</h3><p>赏金已到手。江湖声望 +${[2,4,8][b.tier]}${esc(extra)}</p>`,[{t:'好',cls:'gold'}]);}});}

const SHOP_MATS=['cao','he','gu','tie'];
const matPrice=k=>Math.ceil(zsAt(maxZone(),{cao:.5,he:.7,gu:.5,tie:.9,huo:1.2,lei:1.4,xing:1.8,xue:3,ru:4}[k]||1));
const fuPrice=k=>Math.ceil(zsAt(maxZone(),{lei:2,huo:1.6,ding:2.4,hu:1.8,po:2}[k]));
function qiStock(){const d=new Date().toDateString();if(S.qiS&&S.qiS.day===d)return S.qiS.L;const z=maxZone();S.qiS={day:d,L:[0,1,2].map(i=>{const it=mkItem(z,true,{r:i===2?3:2,slot:pick(SLOT5)});return {it,p:Math.ceil(it.sell*(i===2?6:4))};})};return S.qiS.L;}
function aucStock(){const d=new Date().toDateString();if(S.auc&&S.auc.day===d)return S.auc.L;const L=[],z=maxZone(),rv=()=>{const P=S.ppl.filter(p=>p.alive&&p.known&&p.st>=0&&!p.fr);return P.length?pick(P).id:null;};
 if((S.xf||0)<5&&!F('xf_auc'))L.push({k:'xf',n:'一卷残破的古图',d:'上面画着一座看不懂的山。卖家说是从废城里挖出来的',p:zsAt(z,30)});
 const fl=Object.keys(FORMS).filter(f=>!S.forms.includes(f)&&f!=='jiugong');if(fl.length)L.push({k:'form',f:pick(fl),n:'阵图',d:'',p:zsAt(z,40)});
 L.push({k:'item',n:'传世之兵',d:'仙品之上，有传说的气息',p:zsAt(z,70)});if(L.length<3)L.push({k:'gem',n:'绝品宝石',d:'',p:zsAt(z,35)});
 L.forEach(l=>{l.rv=rv();l.max=Math.ceil(l.p*(1.25+Math.random()*1.1));l.cur=l.p;l.st=0;if(l.k==='form'){l.n='阵图 ·《'+FORMS[l.f].n+'》';l.d=FORMS[l.f].d;}});S.auc={day:d,L:L.slice(0,3)};return S.auc.L;}
function aucBid(i,pct){const l=aucStock()[i];if(!l||l.st)return;const bid=Math.ceil(l.cur*(1+pct));if(S.stones<bid){toast('灵石不够','bad');return;}const rv=P_(l.rv);
 if(bid>=l.max||!rv){S.stones-=bid;l.st=1;let t='';if(l.k==='xf')t=xfGet('auc');else if(l.k==='form')t=learnForm(l.f);else if(l.k==='item')t=pushItem(mkItem(maxZone(),true,{r:4,slot:pick(SLOT5)}));else{const g=pick(['a','d','h','c'])+Math.min(5,gemTierFor(maxZone())+2);S.gems[g]=(S.gems[g]||0)+1;t='获得 '+gemName(g);}
  if(rv){rv.att-=8;news(S.name+'在拍卖行压过'+rv.n+'，以 '+fmt(bid)+' 灵石拍下'+l.n+'。');}sfx('coin');toast('拍下了！'+(rv?rv.n+'的脸色不太好看。':''),'big');save();jhRender();return;}
 l.cur=Math.min(l.max,Math.ceil(bid*(1.05+Math.random()*.15)));sfx('tap');toast(rv.n+'：「'+fmt(l.cur)+'。」');save();jhRender();}
function aucPass(i){const l=aucStock()[i];if(!l||l.st)return;l.st=2;const rv=P_(l.rv);if(rv){rv.att+=3;news(rv.n+'拍下了'+l.n+'。');}save();jhRender();}

function personTalk(p){if(!p||!p.alive)return;const Y=S.year;const rel=attName(p);
 const line=p.att<=-40?'“'+(p.goal.includes('仇')||p.goal.includes('后悔')?'等着。':'你怎么还没死？')+'”':p.att>=40?'“又见面了。”':'“'+pick(['最近江湖不太平。','有事？','我在等人。','听说你也在找东西？'])+'”';
 modal(`<h3>${esc(p.n)}</h3><p>${realmOf(p.st)}${p.sect?' · '+SECTS[p.sect].n+(p.lead?SECTS[p.sect].lt:''):''} · ${p.age} 岁（寿元 ${lifeText(pLife(p))}）</p><p>心愿：${esc(p.goal)}<br>对你：<b>${rel}</b></p><p>${esc(line)}</p>`,[
  {t:'切磋',cls:p.st>=0?'':'ghost',fn:()=>{if(p.st<0){toast(p.n+'是凡人');return;}const e=mkCustom(zOfStage(p.st),{look:LOOK[p.n]?p.n:'无名剑客',name:p.n,st:p.st,m:1.4});e.human=1;e.noLoot=1;startBattle([e],{bg:'town',onWin:()=>{p.att+=p.att<-20?-5:6;toast(p.att<-20?p.n+'更恨你了':p.n+'：「好身手。」');save();},onLose:()=>{p.att+=3;toast(p.n+'：「承让。」');save();}});}},
  {t:'赠礼 · '+fmt(zsAt(maxZone(),3))+' 灵石',fn:()=>{const c=zsAt(maxZone(),3);if(S.stones<c){toast('灵石不够','bad');return;}S.stones-=c;p.att=Math.min(100,p.att+(p.att<-40?3:10));toast(p.n+'收下了。（'+attName(p)+'）');save();}},
  {t:'告辞',cls:'ghost'}]);}
function pplHTML(){const L=S.ppl.filter(p=>p.known&&(!p.bg||p.lead||p.att)).sort((a,b)=>(b.alive-a.alive)||Math.abs(b.att)-Math.abs(a.att));
 return `<p class="note">${yearName()} · 你 ${S.age} 岁（寿元 ${lifeText(myLife())}）。人会老，会变强，也会记仇。</p>${L.map(p=>{const dead=!p.alive,mortal=p.st<0;return `<div class="row2 ppl ${dead?'dim':''} ${p.att<=-40?'foe':p.att>=40?'friend':''}"><img class="mini" src="${clSprite(p.ch&&CH[p.ch]?p.ch:'tie')}" alt=""><div class="in"><div class="iname">${esc(p.n)}<span class="lv">${dead?yearName(p.dy)+'故去':realmOf(p.st)+' · '+p.age+' 岁 / 寿元 '+lifeText(pLife(p))}</span></div>
  <div class="istat">${p.sect?SECTS[p.sect].n+(p.lead?SECTS[p.sect].lt:'')+' · ':''}${attName(p)} · ${esc(p.goal)}</div></div><div class="ibtn">${!dead&&mortal&&p.fr&&S.lifeP>0?`<button class="btn sm gold" data-act="giveLife" data-arg="${p.id}">赠寿元丹</button>`:''}${dead&&p.fr&&S.hhDan>0?`<button class="btn sm gold" data-act="revive" data-arg="${p.id}">还魂</button>`:''}</div></div>`;}).join('')}`;}
function giveLife(id){const p=P_(id);if(!p||!(S.lifeP>0))return;S.lifeP--;p.life=(p.life||75)+15;p.att=Math.min(100,p.att+20);news(S.name+'送给'+p.n+'一颗寿元丹。');toast(p.n+'多了十五年阳寿','big');save();jhRender();}

 <div class="jh-tabs">${Object.keys(T).map(k=>`<button class="${JH.tab===k?'on':''}" data-jt="${k}">${T[k]}</button>`).join('')}</div><div class="jh-body">${jhBody()}</div></div>`;
 el.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.jx==='close'){jhClose();return;}if(b.dataset.jt){JH.tab=b.dataset.jt;jhRender();return;}if(b.dataset.js){JH.sub=b.dataset.js;jhRender();return;}if(b.dataset.ja){const [a,arg]=[b.dataset.ja,b.dataset.arg];JH_ACT[a]&&JH_ACT[a](arg);}};}

const JH_ACT={

function goMarket(){WD.prev=null;wFade(()=>{S.loc='market';wLoad(buildMarket(),[3,7]);const t=$('#travel');if(t)t.hidden=true;wHud();});}
function buildMarket(){const W=24,H=16,M=newMap('town',-1,W,H,'dirt');Object.assign(M,{name:'南街坊市',dark:.05,bg:'#2a2418',amb:'mist',mk:1});
 for(let c=0;c<W;c++)for(let r=0;r<H;r++){const i=gi(M,c,r);M.gv[i]=(c*7+r*13)%4;if(r===7||r===8)M.g[i]='flag';else if((c===11||c===12)&&r>8)M.g[i]='flag';else if((c+r*3)%7===0)M.g[i]='grassV';}
 const shop=(c,r,type,lab,fn,o)=>{const p=addProp(M,c,r,type,Object.assign({extra:[[c-1,r],[c,r-1],[c-1,r-1]]},o||{}));p.lab=lab;p.act=fn;return p;};
 shop(4,5,'shop','丹铺',()=>jhOpen('shop','dan'),{v:0});shop(9,5,'shop','器铺',()=>jhOpen('shop','qi'),{v:1});shop(14,5,'shop','符箓铺',()=>jhOpen('shop','fu'),{v:2});shop(20,5,'house','拍卖行',()=>jhOpen('shop','auc'),{v:3});
 shop(5,12,'house','茶馆 · 传闻',()=>jhOpen('news'),{v:1});shop(19,12,'house','收购铺',()=>jhOpen('shop','sell'),{v:2});
 const b=addProp(M,8,10,'board');b.lab='悬赏榜';b.act=()=>jhOpen('bounty');
 const st=addProp(M,15,11,'leitai',{extra:[[14,11],[15,10],[14,10]]});st.lab='擂台 · 宗门挑战';st.act=()=>jhOpen('sect');
 const sl=addProp(M,22,9,'stele');sl.lab='江湖榜';sl.act=()=>jhOpen('rank');
 const gt=addProp(M,0,7,'paifang',{extra:[[0,8]]});gt.lab='出坊市';gt.act=()=>wTravel();
 addProp(M,11,10,'well');[[1,2],[2,13],[7,1],[12,1],[17,1],[23,2],[23,13],[1,14],[10,14],[16,14]].forEach(([c,r],i)=>addProp(M,c,r,'treeB',{v:i}));
 [[3,9],[7,9],[13,9],[17,9],[21,9],[6,6],[11,6],[16,6]].forEach(([c,r])=>addProp(M,c,r,'lantern'));[[2,10],[9,13],[13,13],[18,10],[22,14]].forEach(([c,r],i)=>addProp(M,c,r,'flowers',{blocks:false,v:i}));
 [[17,8],[6,15]].forEach(([c,r])=>addProp(M,c,r,'cart'));[[3,6],[8,6],[13,6],[19,6]].forEach(([c,r],i)=>addProp(M,c,r,'jars',{v:i}));
 propLights(M);const add=(k,c,r,o)=>M.ents.push(mkEnt(Object.assign({kind:'npc',k,c,r,dir:1},o||{})));
 add('p_gen2',5,6,{name:'丹铺掌柜',fn:()=>jhOpen('shop','dan')});add('p_gen4',10,6,{name:'器铺伙计',fn:()=>jhOpen('shop','qi')});add('p_gen5',15,6,{name:'画符的老道',fn:()=>jhOpen('shop','fu')});add('p_gen1',20,6,{name:'拍卖师',fn:()=>jhOpen('shop','auc')});
 for(let i=0;i<6;i++){const c=3+i*3,r=i%2?8:7;add(villager(i+20),c,r,{gen:1,vill:1,name:'行人',home:[c,r],spd:1.3});}
 const vis=S.ppl.filter(p=>p.alive&&p.known&&p.st>=0&&!p.fr&&!p.bg&&p.ch&&CH[p.ch]).sort((a,b)=>(!!rwNext(b))-(!!rwNext(a)));for(let i=0;i<Math.min(3,vis.length);i++){const p=vis.splice(rwNext(vis[0])?0:Math.floor(Math.random()*vis.length),1)[0];const pos=[[12,9],[17,7],[7,8]][i];add(p.ch,pos[0],pos[1],{name:p.n+(p.att<=-40?' ⚔':p.att>=40?' ♥':''),fn:()=>personTalk(p)});}
 return M;}

 return t+'\n\n“这个给你。赤霄宗的《天罡剑阵》，师父说，该给配得上的人。”'+(learnForm('tiangang')||'');}

/* ================= 赤阳真人 · 传剑 ================= */
R('chiyang',{t:'一盏茶',g:'茶',bg:'xianshan',need:()=>S.stage>=13||!!(S.sects.chixiao&&S.sects.chixiao.beat>=1),hint:'结丹之后，或去赤霄宗走一趟',lines:[

 ['chiyang','老夫活了两百多年，见过的天才，两只手数不过来。活到最后的，一只手就数得过来。'],
 ['chiyang','无咎那孩子，你见过了吧？'],
 ['chiyang',()=>S.flags.rw_lie==='win'?'他输给你那天回来，在剑坪上站了一整夜。':S.flags.rw_lie?'他天天把你的名字挂在嘴上。':'他迟早会去找你的。那孩子见不得别人比他快。'],
 ['chiyang','你说，他缺的是什么？'],
 rwC([
  {t:'「一个对手。」',fx:()=>{S.flags.rw_cy='rival';},r:[['chiyang','对手……他眼里只有对手。也罢，那就让他有一个配得上的。'],['chiyang','老夫拜托你：别让他输得太难看，也别让他赢得太容易。']]},

  {t:'「一句话——就算他不是第一，你也认他。」',fx:()=>{S.flags.rw_cy='trust';rwAtt('chiyang',15);},r:[['','老人端着茶盏，很久没有喝。'],['chiyang','老夫教了他二十年剑，从来没说过这句话。'],['chiyang','就算他永远不是第一，也是我最好的徒弟。……你若见到他，替老夫说吧。我说不出口。']]}]),
 ['chiyang','这盏茶，不白喝。'],{fn:()=>{rwAtt('chiyang',10);toast(gMat('huo',3).trim());}}]});

R('chiyang',{t:'化神劫',g:'劫',bg:'leijie',gap:2,need:()=>S.stage>=17,hint:'元婴之后',lines:[

 ['chiyang','老夫想请你在峰下替我护法。劫雷之下有心魔，也有趁火打劫的人。'],
 rwC([
  {t:'「我守着。」',fx:()=>rwFight({title:'护法',bg:'jie',many:[{look:'天穹追兵',name:'趁劫而来的散修',st:S.stage+1,m:1.3},{look:'天魔影',name:'心魔',st:S.stage+2,m:1.6,boss:1,beast:1}],
    win:()=>{const p=P_('chiyang');if(p){p.st=Math.max(p.st,21);p.lifeB=(p.lifeB||0)+100;}rwAtt('chiyang',40);S.flags.rw_cyOk=1;news('赤阳真人渡过化神天劫。赤霄峰上的云散了，露出三百年没见过的晴天。',1);return '最后一道雷落下来的时候，你听见峰顶传来一声长啸。\n赤阳真人，化神了。'+gS(zsAt(maxZone(),15));},
    lose:()=>rwCyDie('你被心魔逼退了半步。就是这半步，劫雷劈穿了峰顶。')})},
  {t:'「我还有事，抱歉。」',fx:()=>{S.flags.rw_cyNo=1;},r:[['chiyang','……也是。人各有命。']]}])],

function rwCyDie(pre){S.flags.rw_cyD=1;rwKill(P_('chiyang'),'赤阳真人渡劫失败，身死道消。赤霄宗挂白三月。');rwEnd('chiyang','他没能渡过化神劫。');return pre+'\n赤阳真人没能渡过这一劫。\n赤霄宗的弟子在峰顶找到他的时候，他手里还握着那只没喝完的茶盏。';}

R('chiyang',{t:'传剑',g:'传',bg:'xianshan',gap:2,need:()=>S.stage>=17,hint:'赤阳真人渡劫之后',lines:[

   {t:'「我出灵石，请你替他洗去焚心剑意。」',need:()=>S.stones>=zsAt(maxZone(),30),fx:()=>{S.stones-=zsAt(maxZone(),30);const l=P_('lie');l.lifeB=0;l.goal='站在榜首——用自己的剑';rwAtt('lie',40);rwAtt('chiyang',20);rwSetLead('chixiao',l);rwEnd('chiyang','他耗了三十年修为，洗去徒弟的焚心剑意，把赤霄宗交给了他。');news('赤阳真人耗三十年修为，为烈无咎洗髓伐脉。',1);},r:[['chiyang','……洗髓伐脉，要老夫三十年修为。'],['chiyang','值。']]}])],
 [['chiyang',()=>{const l=P_('lie');return l&&l.alive?'无咎是我选的人。他如今，配得上这把剑了。':'无咎不在了。老夫选了一个资质平平、但从不偷懒的孩子。';}],
  {fn:()=>{const l=P_('lie');if(l&&l.alive){rwSetLead('chixiao',l);news('赤阳真人传位烈无咎。',1);}rwEnd('chiyang','他把赤霄宗传了下去。');}}]),
 ['chiyang','赤霄宗欠你一份情。从今往后，赤霄的剑，不会指向你。'],
 {fn:()=>{rwAlly('chixiao');S.books.chixiao=(S.books.chixiao||0)+1;toast('赤霄宗成为盟友 · 获得镇派剑经','big');}}]});

/* ================= 云漪 · 寻师 ================= */
R('yun',{t:'寻人启事',g:'寻',bg:'market',need:()=>S.stage>=9,hint:'筑基之后，看看坊市的告示墙',lines:[

 ['yun','……你也在看这个？'],['','一个蓝衣女子站在你身后，手里拿着一叠新印的启事。'],
 ['yun','她是我师父。我七岁那年，她把我从灵潮里抱出来。我十二岁那年，她去了东海，再也没回来。'],
 ['yun','门里的人都说她死了。门主说，不许再找。'],['yun','可她走之前跟我说过，「等师父回来」。她从来不骗我。'],
 rwC([
  {t:'「我帮你留意。」',fx:()=>{S.flags.rw_yun=1;rwAtt('yun',15);},r:[['yun','……谢谢。'],['','她把一张启事折好，塞进你手里。背面画着一枚水滴形的玉令。'],['yun','这是玄水门长老的令牌。如果你见到它——无论在谁身上——告诉我。']]},
  {t:'「这么多年了，你该放下了。」',fx:()=>{rwAtt('yun',-5);},r:[['yun','门主也这么说。'],['','她把启事贴好，抹平，转身走了。'],['','第二天你路过告示墙，那张启事上又多了一张新的。']]}])]});

R('yun',{t:'玄水令',g:'令',bg:'market',gap:1,need:()=>S.stage>=13,hint:'结丹之后',lines:[

 ['yun','这是……师父的令牌。'],['','云漪握着玉令的手在抖。'],['yun','在幽冥殿的人身上？她被幽冥殿抓了？这么多年？'],['yun','我现在就去。'],
 rwC([
  {t:'「我陪你去。」',fx:()=>rwFight({title:'幽冥外殿',bg:5,many:[{look:'幽冥护法',name:'幽冥护法',st:SECTS.youming.st,m:1.5,boss:1,demon:1},{look:'幽冥鬼卒',name:'幽冥鬼卒',st:SECTS.youming.st-3,m:1,demon:1}],
    win:()=>{rwAtt('yun',25);S.flags.rw_yunK=1;rwYunCold();return '护法倒在地上，吐出最后一句话：\n“洛清霜……在冥池……殿主不许任何人碰她……”\n云漪的脸一下子白了：“她还活着。”\n回去的路上，她咳了很久。她说是老毛病，天生经脉带寒毒，不碍事。'+gS(zsAt(maxZone(),8));},
    lose:()=>{rwAtt('yun',10);S.flags.rw_yunK=1;rwYunCold();return '你们没能闯进去。云漪替你挡了一掌。\n可她听见了——那些鬼卒说，「冥池里那个玄水门的女人」。\n“她还活着。”她咳着血说。';}})},
  {t:'「先别冲动。去问问你们门主。」',fx:()=>{S.flags.rw_yunK=1;S.flags.rw_yunTruth=1;rwAtt('yun',15);rwYunCold();},r:[
    ['','玄水门的大殿里，水月仙子看着那枚玉令，很久没有说话。'],['shuiyue','……她不是被抓走的。是她自己去的。'],['yun','什么？'],
    ['shuiyue','你生来经脉带寒毒，活不过而立之年。清霜去找能救你的东西。'],['shuiyue','幽冥殿有一门「换寿」的邪术。她去求阎九娘。之后……再也没有消息。'],
    ['shuiyue','我不许你找，是怕你知道了，会觉得是自己害了她。'],['','云漪站在原地，一句话都说不出来。']]}])]});
function rwYunCold(){const p=P_('yun');if(p&&!F('rw_yunC')){S.flags.rw_yunC=1;p.lifeB=(p.lifeB||0)+(p.age+14-pLife(p));}}

R('yun',{t:'冥池',g:'池',bg:'pit',gap:1,need:()=>F('rw_luoFree')||S.stage>=21,hint:'化神之后——或者先解开阎九娘的心结（她的寒毒等不了太久）',lines:[

  ['','洛清霜从袖子里摸出一只玉瓶，塞进她手里。'],['luo','这些年，九娘逼着我想办法给她女儿续命。续命的法子没想出来，解寒毒的，倒让我想出来了。'],['luo','服了它。你会活得比师父长。'],

 [['','冥池在幽冥殿最深处。池水是黑的，冷得能冻住魂魄。'],['','池心锁着一个白发的女人。'],['yun','师父！'],
  ['yan',()=>{const y=P_('yan');return y&&y.alive?'站住。':'';}],
  rwIf(()=>{const y=P_('yan');return y&&y.alive;},[
   ['','阎九娘挡在池前。'],['yan','她欠我一样东西，还没还完。谁也带不走她。'],
   rwC([
    {t:'「那就打。」',fx:()=>rwFight({pid:'yan',m:1.7,boss:1,demon:1,noFlee:1,bg:5,title:'冥池',
      win:()=>{rwAtt('yan',-40);S.flags.rw_luoFree=1;rwYunCure('云漪从冥池里抢回了师父。寒毒已解。');return '阎九娘退开了。她没有再拦。\n“带走吧。……她答应我的东西，我也用不上了。”\n洛清霜被扶出冥池，把一只玉瓶塞进云漪手里。寒毒，解了。';},
      lose:()=>{S.flags.rw_luoDead=1;const p=P_('yun');if(p){p.lifeB=0;rwAtt('yun',30);p.goal='替师父活下去';}rwEnd('yun','云漪的寒毒解了。她的师父死在了冥池里。');news('玄水门长老洛清霜死于幽冥殿冥池。',1);
       return '你们败了。\n洛清霜在池心挣断了锁链。她用最后的力气，把一只玉瓶扔到云漪脚边。\n“漪儿……活下去。”\n冥池的水合上了。云漪抱着那只玉瓶，一直没有哭。';}})},
    {t:'「她欠你的，我替她还。」（一颗寿元丹）',need:()=>S.lifeP>0,fx:()=>{S.lifeP--;S.flags.rw_luoFree=1;rwAtt('yan',15);rwYunCure('你用一颗寿元丹，从阎九娘手里换回了洛清霜。');},r:[
      ['yan','……寿元丹。'],['','她接过去，攥在手心里，很久没有松开。'],['yan','带她走吧。'],['','洛清霜被扶出冥池，把一只玉瓶塞进云漪手里。'],['luo','漪儿。寒毒……能解了。']]}])],
  [['','冥池没有人守。幽冥殿的殿主已经不在了。'],['','你们砸开了锁链。洛清霜醒过来的第一件事，是摸索着把一只玉瓶塞进云漪手里。'],['luo','漪儿……寒毒能解了。'],{fn:()=>{S.flags.rw_luoFree=1;rwYunCure('云漪找回了师父。寒毒已解。');}}])]),
 ['',()=>F('rw_luoDead')?'':'那天回玄水门的路上，云漪一直走在她师父身边，一步都没有离开。'],

/* ================= 阎九娘 · 阿萤 ================= */
R('yan',{t:'收尸人',g:'冥',bg:'shelter',need:()=>S.stage>=13,hint:'结丹之后，夜里的废城',lines:[
 ['','夜里的废城，有人在收尸。'],['','黑衣的鬼卒一具一具地把尸体抬上车，没有声音。车边站着一个女人，撑着一把黑伞。'],
 ['yan','看什么？'],['','幽冥殿主，阎九娘。化神圆满，江湖上排得进前十的魔头。'],
 ['yan','你身上有丹香。寿元丹？还是别的什么延寿的东西？'],['yan','卖给我。多少灵石都行。'],

  {t:'卖给她一颗寿元丹',need:()=>S.lifeP>0,fx:()=>{S.lifeP--;rwAtt('yan',15);S.stones+=zsAt(maxZone(),45);},r:[['yan','好。'],['','她扔给你一袋灵石，比市价多了一倍。'],['yan','以后有，都卖给我。']]},
  {t:'「魔修收尸，能有什么好事？」',fx:()=>{rwAtt('yan',-10);},r:[['yan','对。没什么好事。'],['','黑伞下的人笑了一下。车轮碾过碎石，走远了。']]}])]});

  {t:'「……去吧。」',fx:()=>{rwSyDie();},r:[['','那天夜里，东海上空亮起了一轮比月亮还大的镜子。'],['','镜子碎的时候，像下了一场银色的雨。'],['mo','……小师妹。'],['','裂隙合上了。玄水门的大殿里，只剩一个空空的镜架。']]},
  {t:'拦住她',fx:()=>{rwAtt('shuiyue',-10);kar(-1);news('东海灵源裂隙扩大，沿岸又有两座城空了。',1);rwEnd('shuiyue','你拦住了她。她活着，东海又死了两座城。');},r:[['shuiyue','……你以为你在救我？'],['','她没有再说话。那一年，东海沿岸又空了两座城。']]}])]});

 ['gu','别紧张。我只是来说几句话。'],['gu','灵潮来了几十年，死了多少人？可活下来的人里，能修仙的，不到万分之一。'],

R('gu',{t:'遗愿',g:'愿',bg:'pit',gap:3,need:()=>S.stage>=25&&S.seen.includes('fallen'),hint:'炼虚之后，且已知晓堕仙往事',lines:[

function ceremony(old,r,yrs,L,done){const nw=stats(),el=$('#cer')||(()=>{const d=document.createElement('div');d.id='cer';document.body.appendChild(d);return d;})();el.hidden=false;sfx('rise');

  <div class="cer-t"><small>破境</small><b>${REALMS[r]}</b><span>${STAGES[S.stage].name}</span></div>
  <p class="cer-o">天地异象 · ${OMEN_TXT[r]||'天地共鸣'}</p>
  <div class="cer-box"><div class="cjs">${row('攻',old.atk,nw.atk)}${row('防',old.def,nw.def)}${row('血',old.hp,nw.hp)}</div>
  <div class="cer-u">${unlockList(r).map(u=>`<div><b>解锁 · ${u[0]}</b><small>${u[1]}</small></div>`).join('')}<div><b>寿元 · ${lifeText(myLife())}</b><small>当前 ${S.age} 岁</small></div></div>
  ${yrs?`<div class="cer-y"><b>闭关 ${yrs} 年 · ${yearName()}</b>${imp.length?imp.map(n=>`<p>${esc(sub(n.t))}</p>`).join(''):'<p>江湖上风平浪静。</p>'}</div>`:''}</div>
  <button class="btn gold" id="cerOk">出关</button></div>`;
 CER={t:0,last:performance.now(),r,bolts:[],parts:[],flash:0};const cv=$('#cerCv');
 const fit=()=>{const dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;CER.dpr=dpr;};fit();
 const loop=t=>{if(!CER||el.hidden)return;const dt=Math.min(.05,(t-CER.last)/1000);CER.last=t;CER.t+=dt;cerDraw(cv,dt);requestAnimationFrame(loop);};requestAnimationFrame(loop);
 $('#cerOk').onclick=()=>{el.hidden=true;el.innerHTML='';CER=null;done&&done();};}
function cerDraw(cv,dt){const x=cv.getContext('2d'),d=CER.dpr,W=cv.width/d,H=cv.height/d,t=CER.t;x.setTransform(d,0,0,d,0,0);
 const col=S.root?EL[S.root].c:'#c9a8ff';x.drawImage(sceneCanvas('leijie',W,H),0,0,W,H);
 const cx=W/2,cy=H*.5;x.globalCompositeOperation='lighter';
 for(let i=0;i<4;i++){const rr=60+i*26+Math.sin(t*2+i)*5;x.strokeStyle=rgba(col,.4-i*.08);x.lineWidth=2.4;x.beginPath();x.ellipse(cx,cy-52,rr,rr*.42,Math.sin(t*.6+i)*.35,0,6.283);x.stroke();}
 let g=x.createRadialGradient(cx,cy-70,0,cx,cy-70,120);g.addColorStop(0,rgba(col,.5));g.addColorStop(1,rgba(col,0));x.fillStyle=g;x.fillRect(cx-130,cy-200,260,260);
 if(Math.random()<dt*2){const bx=cx+(Math.random()-.5)*W*.9;CER.bolts.push({pts:bolt(bx,0,Math.random()<.5?cx+(Math.random()-.5)*50:bx+(Math.random()-.5)*80,Math.random()<.5?cy-60:H*.45),age:0});CER.flash=.45;sfx('thunder');}
 CER.bolts=CER.bolts.filter(b=>(b.age+=dt)<.35);CER.bolts.forEach(b=>{x.strokeStyle='rgba(200,170,255,'+(1-b.age/.35)*.7+')';x.lineWidth=5;x.shadowColor='#b48aff';x.shadowBlur=18;x.beginPath();b.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.lineWidth=1.4;x.strokeStyle='rgba(255,255,255,'+(1-b.age/.35)+')';x.stroke();x.shadowBlur=0;});
 if(Math.random()<.7)CER.parts.push({x:cx+(Math.random()-.5)*160,y:cy+10,vy:-20-Math.random()*40,life:2+Math.random()*2,age:0});CER.parts=CER.parts.filter(p=>(p.age+=dt)<p.life);CER.parts.forEach(p=>{p.y+=p.vy*dt;x.fillStyle=rgba(col,(1-p.age/p.life)*.9);x.beginPath();x.arc(p.x,p.y,1.4,0,6.283);x.fill();});
 x.globalCompositeOperation='source-over';if(CER.flash>0){x.fillStyle='rgba(235,225,255,'+CER.flash*.45+')';x.fillRect(0,0,W,H);CER.flash-=dt*2.5;}}
function bolt(x0,y0,x1,y1){const P=[[x0,y0]];const n=12;for(let i=1;i<=n;i++){const k=i/n;P.push([x0+(x1-x0)*k+(i<n?(Math.random()-.5)*36:0),y0+(y1-y0)*k]);}return P;}

function toast(t,a,b){let act=null,fn=null,cls='';if(typeof b==='function'){act=a;fn=b;}else if(a==='big'||a==='bad')cls=a;if(cls==='big'&&t.length>16)cls='big2';
  const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();const d=document.createElement('div');d.className='toast '+cls;d.textContent=t;
  if(fn){const bt=document.createElement('button');bt.textContent=act;bt.onclick=()=>{d.remove();fn();};d.appendChild(bt);}
  box.appendChild(d);setTimeout(()=>d.remove(),fn?7000:2800);}

    lose:()=>{rwSyDie();return '你没能撑住。\n最后是水月仙子推开了你。镜子碎成了千万片，裂隙合上了。\n她留下的最后一句话是：“替我告诉墨师兄——这一次，是我关上的。”';}})},
  {t:'「……去吧。」',fx:()=>{rwSyDie();},r:[['','那天夜里，东海上空亮起了一轮比月亮还大的镜子。'],['','镜子碎的时候，像下了一场银色的雨。'],['mo','……小师妹。'],['','裂隙合上了。玄水门的大殿里，只剩一个空空的镜架。']]},
  {t:'拦住她',fx:()=>{rwAtt('shuiyue',-10);kar(-1);news('东海灵源裂隙扩大，沿岸又有两座城空了。',1);rwEnd('shuiyue','你拦住了她。她活着，东海又死了两座城。');},r:[['shuiyue','……你以为你在救我？'],['','她没有再说话。那一年，东海沿岸又空了两座城。']]}])]});
function rwSyDie(){rwKill(P_('shuiyue'),'玄水门主水月仙子以水镜封住东海灵源裂隙，镜碎人亡。');rwEnd('shuiyue','她用水镜封住了东海的裂隙。镜碎，人亡。');kar(1);}

/* ================= 顾长风 · 遗愿 ================= */
R('gu',{t:'会首',g:'穹',bg:'tianting',need:()=>S.stage>=17,hint:'元婴之后',lines:[
 ['','你回到住处的时候，屋里已经坐着一个人。'],['','灰白长衫，紫色的眼睛。天穹会首，顾长风。合体境，江湖榜上数一数二的人物。'],
 ['gu','别紧张。我只是来说几句话。'],['gu','灵潮来了几十年，死了多少人？可活下来的人里，能修仙的，不到万分之一。'],
 ['gu','剩下的，只能等死，或者等着被修士保护。'],['gu','天穹会要做的，是让每一个凡人都能吸一口灵气。'],
 ['gu','这是我师祖——你们叫他堕仙——没做完的事。来天穹会吧。你会是我的左右手。'],
 rwC([
  {t:'「为此，你们封了多少城？」',fx:()=>{rwAtt('gu',5);S.flags.rw_guQ=1;},r:[['gu','……三座。我不否认。清理灵脉，要死人。'],['gu','可如果不清，死的会是三十座。'],['','他站起来，推门出去。'],['gu','你会明白的。']]},
  {t:'「我考虑一下。」',fx:()=>{rwAtt('gu',15);S.rep.tq+=1;},r:[['gu','很好。我等你。']]},
  {t:'「滚。」',fx:()=>{rwAtt('gu',-15);S.rep.tq-=1;},r:[['gu','……年轻人。'],['','他走了。桌上留下一只茶盏，杯底刻着天穹会的纹章。']]}])]});

R('gu',{t:'白石城',g:'城',bg:'shelter',gap:2,need:()=>S.stage>=21,hint:'化神之后',lines:[
 ['','东边的白石城被天穹会封了。城外站着一排灰衣修士，城里的人出不来。'],
 ['','你看见一个老人趴在结界上，拍着透明的墙，嘴一张一合，听不见声音。'],
 ['gu','你来了。'],['gu','这座城底下有一条灵脉，三天之后会炸。炸了，方圆百里寸草不生。'],
 ['gu','我们要把灵脉抽干。抽的时候……城里的人，会跟着一起干掉。'],['gu','十万人，换方圆百里一百万人。你说，该不该？'],
 rwC([
  {t:'「把人先放出来。」',fx:()=>rwFight({title:'白石城',bg:'market',foes:()=>[sectFoe('tianqiong',1),sectFoe('tianqiong',0)],
    win:()=>{rwAtt('gu',-10);kar(2);S.flags.rw_guSave=1;news(S.name+'破开天穹会的结界，放出了白石城十万人。',1);return '结界碎了。人群像潮水一样涌出来。\n顾长风站在远处看着，没有出手。\n三天后，灵脉炸了。白石城没了——但城里的人，一个都没少。\n他托人带来一句话：“……是我想错了。”';},
    lose:()=>{kar(-1);news('白石城被天穹会抽干，十万人没有出来。',1);return '你没能破开结界。\n三天后，白石城的灯，一盏一盏地灭了。';}})},
  {t:'「你说得对。」',fx:()=>{rwAtt('gu',25);kar(-2);news('白石城被天穹会抽干。方圆百里的灵脉稳住了。',1);},r:[['gu','……谢谢。'],['','那天你没有走。你站在结界外，看着城里的灯一盏一盏灭掉。'],['gu','我每一次都看完。这是我欠他们的。']]},
  {t:'「你师祖，真的想要这样？」',fx:()=>{S.flags.rw_guDoubt=1;rwAtt('gu',10);const p=P_('gu');p.st=Math.max(0,p.st-1);kar(1);news('天穹会首顾长风独自压下白石城灵脉，修为大损。',1);},r:[
    ['','他第一次没有马上回答。'],['gu','我没见过师祖。我只见过他留下的东西。'],['gu','……把人放了。我再想想别的法子。'],
    ['','结界撤了。顾长风一个人留在城里，三天三夜，用自己的修为把那条灵脉一寸一寸地压回了地底。']]}])]});

R('gu',{t:'遗愿',g:'愿',bg:'pit',gap:3,need:()=>S.stage>=25&&S.seen.includes('fallen'),hint:'炼虚之后，且已知晓堕仙往事',lines:[
 ['','顾长风约你去天坑。堕仙倒下的地方。'],['gu','我在这里守了七十年，等的就是师祖的遗愿。'],
 ['gu','分灵气给天下人。天穹会三百年，就为了这一句话。'],['mo','……孩子。'],['','玉简亮了。顾长风猛地抬头。'],
 ['mo','我是你师祖的师弟。'],['mo','他最后想做的，不是「分」，是「关」。他用身子堵住了灵源。'],
 ['mo','他倒下的时候，说的是「灵源……关不上了」。他是在后悔。'],
 ['gu','……不可能。'],['gu','天穹会三百年……白石城……那些城……'],
 rwC([
  {t:'「错的不是你，是传话的人。现在改，还来得及。」',need:()=>F('rw_guDoubt')||F('rw_guSave')||rwP('gu').att>=10,fx:()=>rwGuTurn(),r:[
    ['','顾长风跪在天坑边上，很久很久。'],['gu','……天穹会，从今天起不清理灵脉了。'],['gu','我们去关灵源。用三百年的人，还三百年的债。'],['gu','到时候，你来不来？']]},
  {t:'「你不信，那就打一场。」',fx:()=>rwFight({title:'天坑',bg:5,noFlee:1,pid:'gu',m:1.8,boss:1,el:'lei',p2:1,n2:'顾长风·雷霆真身',
    win:()=>{rwGuTurn();return '他倒在天坑边上，看着天，笑了。\n“……原来输是这种感觉。”\n“好。我信你一次。天穹会，不清理灵脉了。”';},
    lose:()=>{rwAtt('gu',-10);rwEnd('gu','顾长风没有回头。天穹会还在清理灵脉。');return '你败了。\n顾长风收了手，背对着你站了很久。\n“……我会自己去查。如果你说的是假的，下次见面，我不会留手。”';}})}])]});
function rwGuTurn(){const p=P_('gu');if(p){p.goal='关上灵源';rwAtt('gu',50);}rwAlly('tianqiong');S.rep.tq+=3;rwEnd('gu','他知道了师祖真正的遗愿。天穹会不再清理灵脉，转而去关灵源。');news('天穹会首顾长风宣布：天穹会停止清理灵脉。',1);const t=xfGet('sects');if(t)toast(t.trim(),'big');}

/* ================= 莫问 · 故乡 ================= */
R('mowen',{t:'卖图的老人',g:'图',bg:'market',need:()=>S.stage>=3,hint:'修到炼气四层，去坊市逛逛',lines:[
 ['','坊市的角落里，一个老散修在卖地图。图画得很细，连哪栋楼塌了几层都标着。'],
 ['mowen','后生，买张图吧。旧城的、港口的、妖林的，都是我一步一步走出来的。'],
 ['','他的摊子上，有一张图是不卖的。画的是一座临江的小镇，镇口有一座钟楼。'],
 ['mowen','那张啊……那是临江镇。我老家。'],['mowen','灵潮那年，海涨了十米。镇子沉了。我跑出来了，我娘没有。'],
 ['mowen','我这把年纪，炼气八层，到头了。就想死前，再看一眼那座钟楼。'],['mowen','可港口那片雾……我这点修为，进去就出不来了。'],
 rwC([
  {t:'买一张港口的图',need:()=>S.stones>=zsAt(maxZone(),1),fx:()=>{S.stones-=zsAt(maxZone(),1);rwAtt('mowen',10);},r:[['mowen','好，好。这张图你收好。上面那个红圈，就是临江镇。']]},
  {t:'「等我能去港口了，带你去。」',fx:()=>{rwAtt('mowen',20);S.flags.rw_mwP=1;},r:[['mowen','……'],['mowen','后生，你可别骗老头子。我等不了太久的。']]},
  {t:'听他讲讲临江镇',fx:()=>{rwAtt('mowen',12);},r:[['','他讲了一下午。讲镇上的米糕，讲钟楼每天敲几下，讲他娘在江边洗衣服的样子。'],['','你走的时候，天已经黑了。他还坐在摊子后面，看着那张不卖的图。']]}])]});

R('mowen',{t:'临江镇',g:'钟',bg:'linjiang',gap:1,need:()=>maxZone()>=3,hint:'能去沉没港口之后',lines:[
 ['mowen',()=>F('rw_mwP')?'你还记得！你真的还记得！':'后生……听说你能去港口了？'],['mowen','带我去吧。就看一眼。'],
 rwC([
  {t:'带他去',fx:()=>rwFight({title:'雾海',bg:3,many:[{look:'雾鲨',name:'雾鲨',z:3,m:1.1,beast:1},{look:'溺魂',name:'溺魂',z:3,m:1.1,beast:1}],
    win:()=>{rwAtt('mowen',40);S.flags.rw_mwSee=1;P_('mowen').goal='已经看过故乡了';return '雾散的时候，你们看见了它。\n钟楼的顶露在海面上，铜钟还挂着，长满了青苔。\n莫问在船头跪下来，对着钟楼磕了三个头。\n“娘。我回来了。”';},
    lose:()=>{rwAtt('mowen',15);const p=P_('mowen');p.lifeB=(p.lifeB||0)-5;return '雾里的东西太多了。你护着他退了出来。\n莫问受了伤，却一直在笑：“我看见了……我看见钟楼的影子了。够了，够了。”';}})},
  {t:'替他去看，画下来',fx:()=>{rwAtt('mowen',25);S.flags.rw_mwDraw=1;P_('mowen').goal='已经看过故乡了';},r:[
    ['','你一个人穿过雾海，找到了那座钟楼，在船上画了一整天。'],
    ['','你把画交给他。他捧着看了很久，用袖子擦了一遍又一遍——画上没有灰，他擦的是自己的眼睛。'],['mowen','钟楼……还在啊。']]}])]});

R('mowen',{t:'归处',g:'归',bg:'linjiang',gap:3,need:()=>true,hint:'几年之后',lines:[
 ['','莫问托人带信，说他快走了。'],['','他躺在坊市后面那间漏雨的屋子里，瘦得只剩一把骨头。'],
 ['mowen',()=>F('rw_mwSee')||F('rw_mwDraw')?'后生，这辈子最后一件心事，是你替我了的。':'后生……临江镇，我还是没能回去。'],
 ['mowen','我这一辈子，攒下的就是这些图。最底下那张……是我在废城里捡的，看不懂。也许你看得懂。'],
 rwC([
  {t:'「我把你葬在临江镇。」',fx:()=>{rwMwDie('你把他的骨灰撒在了临江镇的钟楼底下。');},r:[['','你把他的骨灰撒在了钟楼底下。'],['','那天海上没有雾。风一吹，那口长满青苔的铜钟，响了一声。']]},
  {t:'「葬在坊市吧。你的摊子在这里。」',fx:()=>{rwMwDie('你把他葬在了坊市后山，坟前插着一张地图。');},r:[['','你把他葬在了坊市后山。坟前插着一张地图。'],['','后来坊市里多了一个卖图的年轻人，说是他的徒弟。没人知道真假。']]}]),
 {fn:()=>{const t=xfGet('cave');toast((t||gS(zsAt(maxZone(),10))).trim(),'big');}}]});
function rwMwDie(t){rwKill(P_('mowen'),'散修莫问坐化，享年'+rwP('mowen').age+'岁。');rwEnd('mowen',t);}

/* ================= 人间篇：结婴之后、飞升之前的人间 =================
   十二段主线。每段之间至少隔一个历练年（通过闭关推进，与现实日期独立）。走完「人间·别」，天门才肯放你过去。
   青石站的老朋友们会老、会死；你在每一段里的选择，最后都会在「别」里回来。 */
const RJ_IDS=[];
const rjAlive=k=>{const p=(S.ppl||[]).find(x=>x.fr===k);return p?p.alive:!F('dead_'+k);};
const rjP=k=>(S.ppl||[]).find(x=>x.fr===k);
function rjKill(k,t){const p=rjP(k);if(p&&p.alive){p.alive=false;p.dy=S.year;}S.flags['dead_'+k]=1;if(t)news(t,1);}
function RJ(o){const prev=RJ_IDS[RJ_IDS.length-1];const id=o.id||'rj'+(RJ_IDS.length+1);RJ_IDS.push(id);
 STORY.push({id,title:'人间篇·'+o.t,g:o.g,bg:o.bg||'shelter',hint:o.hint,lines:o.lines,
  cond:()=>(!prev||S.seen.includes(prev))&&S.year>=(S.flags.rjY||0)+(prev?1:0)&&o.need(),
  after:()=>{S.flags.rjY=S.year;S.flags.rjN=(S.flags.rjN||0)+1;try{o.after&&o.after();}catch(e){console.error(e);}save();rwFlush(0);}});}
const rjR=()=>realmIdx();

RJ({t:'青石城',g:'城',bg:'city',need:()=>rjR()>=3&&S.seen.includes('jindan'),hint:'结成元婴',lines:[
 ['','结婴之后，你回了一趟青石站。'],
 ['','站已经不是站了。地铁口外盖起了一圈矮房子，又一圈，再一圈。有人在一块废铁上刷了三个字：青石城。'],
 ['tie',()=>rjAlive('tie')?'回来啦。城里如今住了两万多人，凡人居多。修士也来，来了就不想走——这里有你的名字镇着。':''],
 ['he',()=>rjAlive('tie')?'':'{bro}，你回来了。铁叔走了以后，城里的事是大伙一起商量着办的。'],
 ['',()=>rjAlive('tie')?'铁叔搓着手：“大伙商量了好几个晚上，想请你当城主。”':'阿禾说，大伙商量了好几个晚上，想请你当城主。'],
 ['','人群里有人在喊「城主」。也有人不说话，只是盯着你腰上的剑。'],
 rwC([
  {t:'「好。这城我来守。」',fx:()=>{S.flags.rjCity='lord';S.rep.station+=2;},r:[['','那天夜里，城里放了一夜的鞭炮。'],['','你站在站台上，看见远处有几户人家收拾了行李，往城外走——他们怕修士。而你，也是修士。']]},
  {t:'「城主让凡人自己选。我只管妖兽。」',fx:()=>{S.flags.rjCity='council';kar(1);S.rep.station+=1;},r:[['','第二个月，青石城选出了第一位城主——一个开面馆的女人。'],['','她上任第一天，把城门的岗哨从修士换成了凡人。']]},
  {t:'「我不常在，别等我。」',fx:()=>{S.flags.rjCity='away';},r:[['','没有人勉强你。'],['','后来青石城换了三任城主，都是修士。凡人在城里，越来越像客人。']]}])]});

RJ({t:'灵税',g:'税',bg:'city',need:()=>rjR()>=3,hint:'一年之后',lines:[
 ['','天穹会的执事进了青石城。'],['','他们要收「灵税」：每户每年一块灵石。交不起的，拿家里有灵根的孩子抵。'],
 ['','一个男人跪在城门口，怀里搂着一个八九岁的女孩。女孩手里还攥着半个馒头。'],
 ['tq','规矩是会主定的。灵气是天下人的，修行的种子，也该归天下。'],
 ['',()=>S.flags.rjCity==='lord'?'所有人都在看你。你是城主。':S.flags.rjCity==='council'?'面馆女人城主站在门口，攥着围裙，回头看你。':'城里的人，都回头看你。'],
 rwC([
  {t:'替全城交税',need:()=>S.stones>=zsAt(maxZone(),20),fx:()=>{S.stones-=zsAt(maxZone(),20);S.flags.rjTax='pay';S.rep.station+=1;},r:[['','执事点完灵石，走了。女孩被她爹抱回了家。'],['','你知道明年他们还会来。后年也会。']]},
  {t:'「天穹会的手，伸得太长了。」',fx:()=>{S.flags.rjTax='fight';rwFight({title:'城门',bg:'town',foes:()=>[mkCustom(maxZone(),{look:'天穹追兵',name:'天穹执事',m:1.7,boss:true}),mkCustom(maxZone(),{look:'天穹追兵',name:'天穹门人',m:1})],
    win:()=>{S.rep.tq-=2;S.rep.station+=2;kar(1);news(S.name+'在青石城门口打跑了天穹会收税的执事。',1);return '执事捂着肩膀跑了。\n城门口的男人抱着女儿，给你磕了三个头。\n你知道，天穹会记下了青石城这个名字。';},
    lose:()=>{S.flags.rjTax='lost';return '你败了。\n执事带走了那个女孩，还多收了一倍的灵税。“这是替你交的罚金。”';}});},r:[['tq','……你确定？']]},
  {t:'教全城人布一座聚灵阵，自己产灵石',need:()=>S.forms.length>0||S.ups.juling>=1,fx:()=>{S.flags.rjTax='array';kar(1);S.rep.station+=2;},r:[
    ['','你在城下布了一座聚灵阵，教会了十几个凡人怎么添灵石、怎么守阵眼。'],['','阵成的那天，城里第一次自己攒下了灵石。'],['','第二年天穹会来收税，凡人自己交了，交得起。']]}])]});

RJ({t:'老站台',g:'站',bg:'metro',need:()=>rjR()>=4,hint:'修成化神',lines:[
 rwIf(()=>rjAlive('tie'),[
  ['','铁叔老了。'],['tie',()=>'我今年'+(rjP('tie')?rjP('tie').age:'七十多')+'了。这辈子，没出过七号线。'],
  ['tie','想坐一回车。从青石站坐到终点站，就一回。'],['','地铁早就不通了。铁轨上长满了草，隧道里住着这些年没清干净的老鼠。'],
  rwC([
   {t:'背着他，沿着铁轨走到终点',fx:()=>{aff('tie',15,true);S.flags.rjTie='walk';},r:[['','你背着他走了一整夜。他比你记忆里轻了很多。'],['tie','这一站叫「人民公园」……那会儿门口有卖糖葫芦的。'],['tie','这一站……这一站叫什么来着……'],['','走到终点站的时候，他睡着了。你没有叫醒他，在站台的长椅上坐到了天亮。']]},
   {t:'以灵力催动，让那列车再跑一回',need:()=>rjR()>=4,fx:()=>{gQi(-.3);aff('tie',20,true);S.flags.rjTie='train';},r:[['','锈死的车厢亮了。车灯照进隧道，照出一片惊飞的蝙蝠。'],['','铁叔坐在第一节车厢里，扒着窗户，像个孩子。'],['tie','……开慢点。让我多看两眼。']]},
   {t:'塞给他一颗寿元丹',need:()=>S.lifeP>0,fx:()=>{S.lifeP--;const p=rjP('tie');if(p)p.life=(p.life||79)+15;aff('tie',15,true);S.flags.rjTie='dan';},r:[['tie','你这孩子……这东西金贵，留着自己用。'],['','你硬塞进他嘴里。他嚼了两下，骂了你一句，眼圈红了。'],['tie','那……那就再多看你十五年。']]}])],
 [['','铁叔走了很多年了。'],['','站台上还挂着他那块写「今日补给」的小黑板。每天早上，都有人去写上新的数字。'],
  ['','你在黑板前站了很久，拿起粉笔，在角落里写了一行小字：「叔，城还在。」'],{fn:()=>{S.flags.rjTie='grave';}}])]});

RJ({t:'灵疫',g:'疫',bg:'city',need:()=>rjR()>=4,hint:'一年之后',lines:[
 ['','城南起了怪病。人身上长出青色的斑，三天就能把一个壮汉耗干。'],
 ['he','是灵疫。灵气太浓的地方，凡人的身子受不住。'],['he','我能配药，可要妖林深处的「青冥草」，很多很多。'],

/* 飞升关口：没走完人间篇，天门不开 */

/* ================= 感悟 · 赠丹 · 宗门（拜入、晋升、任职、任务、宝库、宗主之争）· 天下宗门大比 ================= */

/* ---------- 感悟：破大境界的门槛。只能从「做事」里来，光打坐攒不到 ---------- */
const WU_NEED=[0,0,30,60,100,150,210,280,360,450,550,650,760,880];
const wuNeed=r1=>WU_NEED[Math.min(r1,WU_NEED.length-1)]||0;
function wuAdd(n,quiet){if(!S||!S.started||!n)return;S.wu=(S.wu||0)+n;if(!quiet)toast('感悟 +'+n);}
const _wuES=endStory;endStory=function(){const ch=SC&&SC.ch;const first=ch&&!S.seen.includes(ch.id);_wuES.apply(this,arguments);if(first&&ch.id!=='prologue')wuAdd(ch.rw||ch.side?3:5);};
const _wuMG=mgEnd;mgEnd=function(win,quit){if(MG&&!MG.done&&!quit)wuAdd(win?6:2);return _wuMG.apply(this,arguments);};

/* ---------- 赠丹：选丹药、选人 ---------- */
const GIFT_PILLS=[
 {k:'lifeP',n:'寿元丹',ic:'shouyuan',d:'凡人 +15 年；修士 +30 年寿元'},
 {k:'jz',n:'九转金丹',ic:'jiuzhuan',d:'凡人 +40 年；修士 +80 年寿元',has:()=>(S.jzDan||0)+(F('rw_jz')?1:0)},
 {k:'pills',n:'破境丹',ic:'pojing',d:'修士：小境界必破，大境界六成'},
 {k:'zjDan',n:'筑基丹',ic:'zhuji',d:'凡人：三成机会生出灵根；修士：+好感'},
 {k:'qiPills',n:'聚气丹',ic:'juqi',d:'修士：三成机会破一个小境界'},
 {k:'meds',n:'疗伤药',d:'一点心意'},
 {k:'hhDan',n:'还魂丹',ic:'huanhun',d:'起死回生（只能给已故之人）',dead:1}
];
const pillHave=g=>g.has?g.has():(S[g.k]||0);
function pillUse(g){if(g.k==='jz'){if((S.jzDan||0)>0)S.jzDan--;else S.flags.rw_jz=0;}else S[g.k]--;}
function giftWho(dead){const P=S.ppl.filter(p=>p.known&&(dead?!p.alive&&!p.bg:p.alive&&(!p.bg||p.lead||p.att))).map(p=>({t:'p',o:p,n:p.n,sub:(p.alive?realmOf(p.st)+' · '+p.age+'/'+lifeText(pLife(p))+' 岁':'已故')+' · '+attName(p)}));
 const D=dead?[]:(S.dis||[]).filter(d=>d.alive&&!d.gone).map(d=>({t:'d',o:d,n:d.n,sub:'弟子 · '+realmOf(d.st)+' · '+d.age+'/'+lifeText(lifeOf(d.st)+(d.lifeB||0))+' 岁'}));return D.concat(P);}
function giftOpen(pid){const L=GIFT_PILLS.filter(g=>pillHave(g)>0);if(!L.length){toast('身上没有能送人的丹药。丹铺、丹房、宗门宝库里能弄到','bad');return;}
 modal(`<h3>赠丹</h3><p>选一种丹药。${pid?'':'下一步再选送给谁。'}</p>`,L.map(g=>({t:ico(g.ic)+g.n+'（'+pillHave(g)+'）· '+g.d,fn:()=>pid?giftGive(g,pid):giftPickWho(g)})).concat([{t:'算了',cls:'ghost'}]));}
function giftPickWho(g){const W=giftWho(g.dead);if(!W.length){toast(g.dead?'没有可以救回的人':'没有可以送的人','bad');return;}
 modal(`<h3>${g.n} · 送给谁</h3><p class="note">${g.d}</p>`,W.slice(0,40).map(w=>({t:w.n+'<small style="display:block;opacity:.7;font-size:11px">'+esc(w.sub)+'</small>',fn:()=>giftGive(g,(w.t==='d'?'d':'')+w.o.id)})).concat([{t:'算了',cls:'ghost'}]));}
function giftGive(g,id){const isD=String(id).startsWith('d')&&!P_(id),o=isD?(S.dis||[]).find(d=>'d'+d.id===String(id)):P_(id);if(!o||pillHave(g)<=0)return;
 if(g.dead&&o.alive){toast('还魂丹只能给已故之人','bad');return;}if(!g.dead&&!o.alive)return;
 const mortal=!isD&&o.st<0;let t='';

function ceremony(old,r,yrs,L,done){const nw=stats(),el=$('#cer')||(()=>{const d=document.createElement('div');d.id='cer';document.body.appendChild(d);return d;})();el.hidden=false;sfx('rise');

  <div class="cer-u">${unlockList(r).map(u=>`<div><b>解锁 · ${u[0]}</b><small>${u[1]}</small></div>`).join('')}<div><b>寿元 · ${lifeText(myLife())}</b><small>当前 ${S.age} 岁</small></div></div>

  <button class="btn gold" id="cerOk">出关</button></div>`;
 CER={t:0,last:performance.now(),r,bolts:[],parts:[],flash:0};const cv=$('#cerCv');
 const fit=()=>{const dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;CER.dpr=dpr;};fit();
 const loop=t=>{if(!CER||el.hidden)return;const dt=Math.min(.05,(t-CER.last)/1000);CER.last=t;CER.t+=dt;cerDraw(cv,dt);requestAnimationFrame(loop);};requestAnimationFrame(loop);
 $('#cerOk').onclick=()=>{el.hidden=true;el.innerHTML='';CER=null;done&&done();};}
function cerDraw(cv,dt){const x=cv.getContext('2d'),d=CER.dpr,W=cv.width/d,H=cv.height/d,t=CER.t;x.setTransform(d,0,0,d,0,0);
 const col=S.root?EL[S.root].c:'#c9a8ff';x.drawImage(sceneCanvas('leijie',W,H),0,0,W,H);
 const cx=W/2,cy=H*.5;x.globalCompositeOperation='lighter';
 for(let i=0;i<4;i++){const rr=60+i*26+Math.sin(t*2+i)*5;x.strokeStyle=rgba(col,.4-i*.08);x.lineWidth=2.4;x.beginPath();x.ellipse(cx,cy-52,rr,rr*.42,Math.sin(t*.6+i)*.35,0,6.283);x.stroke();}
 let g=x.createRadialGradient(cx,cy-70,0,cx,cy-70,120);g.addColorStop(0,rgba(col,.5));g.addColorStop(1,rgba(col,0));x.fillStyle=g;x.fillRect(cx-130,cy-200,260,260);
 if(Math.random()<dt*2){const bx=cx+(Math.random()-.5)*W*.9;CER.bolts.push({pts:bolt(bx,0,Math.random()<.5?cx+(Math.random()-.5)*50:bx+(Math.random()-.5)*80,Math.random()<.5?cy-60:H*.45),age:0});CER.flash=.45;sfx('thunder');}
 CER.bolts=CER.bolts.filter(b=>(b.age+=dt)<.35);CER.bolts.forEach(b=>{x.strokeStyle='rgba(200,170,255,'+(1-b.age/.35)*.7+')';x.lineWidth=5;x.shadowColor='#b48aff';x.shadowBlur=18;x.beginPath();b.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.lineWidth=1.4;x.strokeStyle='rgba(255,255,255,'+(1-b.age/.35)+')';x.stroke();x.shadowBlur=0;});
 if(Math.random()<.7)CER.parts.push({x:cx+(Math.random()-.5)*160,y:cy+10,vy:-20-Math.random()*40,life:2+Math.random()*2,age:0});CER.parts=CER.parts.filter(p=>(p.age+=dt)<p.life);CER.parts.forEach(p=>{p.y+=p.vy*dt;x.fillStyle=rgba(col,(1-p.age/p.life)*.9);x.beginPath();x.arc(p.x,p.y,1.4,0,6.283);x.fill();});
 x.globalCompositeOperation='source-over';if(CER.flash>0){x.fillStyle='rgba(235,225,255,'+CER.flash*.45+')';x.fillRect(0,0,W,H);CER.flash-=dt*2.5;}}
function bolt(x0,y0,x1,y1){const P=[[x0,y0]];const n=12;for(let i=1;i<=n;i++){const k=i/n;P.push([x0+(x1-x0)*k+(i<n?(Math.random()-.5)*36:0),y0+(y1-y0)*k]);}return P;}

/* ---------- 一 · 灵潮之夜 ---------- */
v1Set('prologue',{title:'青石·灵潮之夜',lines:[
 {fn:()=>{S.flags.v1=1;}},
 {fn:()=>cgShow('lingchao')},
 {bg:'overpass'},
 ['','天是铁锈色的。高架桥断成三截，最长的那截斜插进一栋写字楼里，楼顶长出一棵碗口粗的槐树，叶子泛着青光。'],
 ['','灵潮之后第三年。你二十岁，五行杂灵根，觉醒三年，一直卡在炼气一层。在青石站，你是拾荒的。'],
 ['','天黑前要带回三件物资。胶带，一件。保险丝，算半件。'],
 ['','社区诊所的药柜早被翻过二十遍。你拆下第三格的背板，后面卡着一瓶阿莫西林。'],
 ['@','……二。'],
 ['','脚下的地砖「咔」地一响。砖缝里渗出一缕蓝光，像水，又像烟。你撬开地砖——底下躺着半块青白的玉简，断口参差，纹路里流着光。'],
 ['','你隔着布把它捡起来。洞口的土是新翻的，旁边有半个比你大一圈的鞋印。'],
 {bg:'metro'},
 ['','回站的路上，一只铁背狼从车壳后面绕了出来。它把你扑倒在地，撬棍横在它嘴里，牙离你的脸只有一拳。'],
 ['','胸口一烫。贴身口袋里的玉简在发热。一个苍老、沙哑的声音在你脑子里响起来——'],
 ['mo','……左边。它左眼是瞎的。'],
 ['','你一拳砸向狼的左眼。它看不见，没有躲。'],
 ['','狼不动了。你跪在地上喘气，浑身是汗。'],
 ['@','……刚才说话的，是谁？'],
 ['mo','吵什么。老夫睡了三百年，刚醒，头疼。'],
 {bg:'shelter'},
 ['zhou','六点四十七。拾荒的，你知道规矩，六点半关门。'],
 ['','站口的灯泡下，周烈扛着开了刃的消防斧，斧刃上隐隐有火光。他是站里第一个觉醒的人，炼气五层。'],
 ['tie','行了。（拿起药瓶，眼睛亮了一下）药收了，算你三天的粥。进去吧。'],
 ['zhou','下次再晚，门不开。我不是开玩笑。'],
 ['','车厢门口，阿禾抱着膝盖在油灯下画画。她十一岁，是你捡回来的。你把半支红蜡笔放在她面前。'],
 ['he','……谢谢{bro}。'],
 ['','夜里，你把玉简举到眼前。断口那一侧，光是断的。'],
 ['mo','这玉简原本是一整块。另一半，是被人刚刚掰走的。断口还是新的。'],
 ['mo','拿走它的人，今晚就在你捡到它的地方。老夫看见了他的背影。他也看见了老夫。'],
 ['@','那我该怎么办？'],
 {c:[
  {t:'「我凭什么信你？」',k:0,fx:{flags:{proDoubt:1},aff:{mo:-5}},r:[['mo','不信也行。等你下回被狼按在地上，再来求老夫。'],['','你没有扔掉玉简。']]},
  {t:'「教我。我要护住站里的人。」',k:1,fx:{flags:{proGuard:1},aff:{mo:10,tie:5}},r:[['mo','好。心里有要护的人，道心就稳。']]},
  {t:'「修仙，能让我比周烈还强吗？」',k:-1,fx:{flags:{proPower:1},aff:{mo:-3}},r:[['mo','比他强？那是最不值钱的目标。……不过，有野心是好事。']]}
 ]},
 ['mo','拼完整的玉简，才是完整的东西。半块，谁都不甘心。他会来找你的。'],
 ['','【江湖页点地面行走、点人物交谈；碰到妖兽会进入回合制战斗。修为只靠历练和丹药：打妖兽、做委托直接涨修为；服下聚气丹得药力，到「修炼」页点画面炼化。去地铁站斩妖三只，下一章就会来。】']
]});

/* ---------- 二 · 粥棚 ---------- */
v1Set('mock',{title:'青石·粥棚',cond:()=>S.seen.includes('prologue')&&((S.kills[0]||0)>=3||S.stage>=1),hint:'在废弃地铁站斩妖三只',lines:[
 ['','粥棚搭在站厅中央，就是以前的安检口。黑板上写着今天的数：「存米 412 斤。距冬至 61 天。」'],
 ['qin','（勺子往锅底多沉了一寸）来。铁叔说你那瓶药是好东西。小的多吃点，长个子。'],
 ['','你端着碗要走。周烈靠在闸机上，身后是护卫队的三个人。'],
 ['zhou','秦婶，护卫队一天吃两顿，干的是拼命的活。他呢？捡点破烂，粥比我们还稠。'],
 ['zhou','拾荒的，三年了，站里五十多个觉醒的人，就你一个还在一层。你自己不臊吗？'],
 ['','他一根手指戳在你的碗沿上。一缕火光窜出来，碗里的粥「滋」地沸了。你的手指烫红了，没有松手。'],
 {c:[
  {t:'放下碗：「那这碗，给护卫队。」',k:1,fx:{flags:{endure:1,zlFace:'轻视'},aff:{zhou:5,tie:5,qin:10}},r:[['zhou','……没意思。'],['','他转身走了。那碗粥没人动。'],['mo','能忍，好。忍不是怕，是还没到时候。']]},
  {t:'「周烈。一年之内，我会走到你前面。」',k:0,fx:{flags:{vow:1,zlFace:'较劲'},aff:{zhou:10}},r:[['','粥棚周围一下子安静了。然后整个队伍都在笑。'],['','周烈没有笑。他把手指从碗沿上拿开。'],['zhou','好。我记着。']]},
  {t:'把滚烫的粥扣在他手背上',k:-1,fx:{flags:{punch:1,zlFace:'敌视'},aff:{zhou:-15,tie:-5}},r:[['','粥水还没贴上去就被他手背上的火光蒸干了。下一秒，你被一拳打在小腹上，弯腰跪了下去。'],['zhou','（拍了拍手）炼气一层。'],['tie','周烈！']]}
 ]},
 {bg:'clan'},
 ['','站长室。墙上挂着二号线的线路图，红笔圈了几个站，叉了更多的站。铁叔把一个缠了铁丝的罐头盒推到桌子中间。'],
 ['tie','周烈那孩子，爸妈都死在灵潮那天。他最怕的不是妖兽，是有一天他不是站里最强的那个，就没人记得他了。'],
 ['','盒子里垫着棉花。棉花上躺着一颗土黄色的丹药，龙眼大小，三道细细的金纹。你体内那点灵力，不由自主地朝它涌去。'],
 ['mo','……筑基丹。三纹，下品。居然还有人炼得出这东西。'],
 ['tie','灵潮前一个月，一个穿道袍的老头在站台上晕倒了。我给他喂了口水，他把这个塞给我，说「马上要用得着了」。'],
 ['tie','给周烈吃了，站里就有一个真正护得住的人。拿去坊市卖了，听说能换十几吨米，全站过冬。我想了三年了。所以我想听听一个会拆药柜背板的人怎么想。'],
 {bg:'shelter'},
 ['@','墨老。筑基丹是什么？'],
 ['mo','炼气修到头，体内的灵力是一池水。筑基，就是给这池水修一道堤。筑基丹是修堤的石头。'],
 ['mo','你问怎么从一层往上走。打坐没用，杂灵根吸进来的灵气，五成漏掉。你只有两条路：杀妖兽，妖兽的灵核里有现成的灵力；或者吃丹。'],
 ['mo','老夫的眼睛借你，你的手借老夫。先把你弄到三层。'],
 ['','【墨老指点：战斗中会提示敌人的弱点。夜里出站猎妖，是这一卷最主要的修为来源。】']
]});

/* ---------- 三 · 另一半（萧尘初见在「宿敌·另一半」，这里接着跟踪） ---------- */

v1Add({id:'v1_east',title:'青石·东郊',g:'郊',bg:'overpass',cond:()=>F('v1')&&S.seen.includes('rv1')&&(S.kills[0]||0)>=6,hint:'见过萧尘之后，在地铁站再斩妖几只',lines:[
 ['','七个夜晚。编织袋里的灵核从一颗变成了七颗，米粒大小，发着淡绿的光。灵核在你掌心化开，渗进去五分，漏掉三分。'],
 ['mo','别急。漏三分已经比头一天好了。头一天你漏八分。'],
 ['','第七夜，你远远看见一件长到膝盖的黑大衣。萧尘。你没有叫他，跟了上去。'],
 ['','四公里。他一次都没有回头。终点是东郊避难所——一年前它和青石站差不多，穷、乱，每天死人。'],
 ['','现在它外面立起了一圈三米高的水泥墙，墙上每隔十米就有一盏发着淡金色光的石头灯。墙上挂着旗子，白底，绣着一颗七角星。站岗的守卫，是炼气五层。'],
 ['xiao','我住这里。七〇二。你上周一给我登记的。你叫吴刚，还给我发了一支烟。'],
 ['','守卫翻了半天本子，很困惑：「……是有这个号。我给你发过烟？」门开了。萧尘进去了。'],
 ['','门关上之后，两个守卫对视了一眼：「刚才进去了一个人？」「……好像是。」'],
 ['mo','那半块玉简在吃他。先吃别人记得他的那一部分。'],
 ['@','那我这半块呢？'],
 ['mo','你这半块里住的是老夫。老夫不吃人。他那半块里住的，不是老夫。'],
 ['','墙里传来整齐的口号声，几十个人在晨练，每一拳都带着灵力的破空声。你想起青石站黑板上的那两个数：四百一十二斤。六十一天。'],
 {fx:{flags:{v1East:1}}}
]},'ahe');

/* ---------- 四 · 阿禾的蓝光 ---------- */
v1Set('ahe',{title:'青石·阿禾的蓝光',cond:()=>F('v1')?S.seen.includes('v1_east'):S.stage>=4,hint:'跟着萧尘去一趟东郊',lines:[
 ['','你从东郊回来，天已经亮了。车厢门口没有人，阿禾的画板扔在地上。最上面一张：轨道下面有一道裂缝，裂缝里涂满了蓝色。角上写着「地底下有星星」。'],
 {bg:'metro'},
 ['','站台尽头，秦婶跪在地上，怀里抱着阿禾。她的右手从指尖到手肘爆出一条条细细的蓝线，像叶脉，一点一点往肩膀爬。'],
 ['he','{bro}……我看到星星了。就在轨道下面。我想拿一颗给你……你天天晚上在外面，外面太黑了……'],
 ['zhou','灵毒。都让开，别碰她的手。（压低声音）我见过三次，都是凡人碰了地里渗出来的灵液。没一个活过三天。'],
 {bg:'shelter'},
 ['tie','上回商队来，我用两箱罐头换了一颗「清灵丸」。他们说是仿的，药效不到三成。大概能拖两天。'],
 ['mo','……有一个办法。这玉简里有一方洞天，太一观的丹炉只剩个底座，但炉底能「温养」：把丹放进去睡一夜，杂质烧掉，药力沉下来。三成的药，带得出五成。'],
 ['mo','代价是灵核，你那一袋，一半要喂进去。还有——它发力的时候会发光。'],
 {bg:'dongtian'},
 ['','你把车厢的窗全用纸板封了，闭上眼睛。黑暗里亮起一片灰蒙蒙的空间，青石地碎了一半，中央一个三足石座。石座边坐着一个老人的影子，灰袍，很瘦。'],
 ['@','……墨老？'],
 ['mo','看什么看。丹。灵核，一颗一颗来。'],
 ['','灵核投进去，石座的裂纹里亮起红光，在空中勾出半个炉身。灰褐的药丸剥落一层灰，又一层，露出淡绿的芯。纸板缝里，漏出一丝青光。'],
 {bg:'shelter'},
 ['','阿禾吃下那颗淡绿的丹。蓝线停在肩膀下面一寸，一点点往回退，退到手腕，不动了。'],
 ['mo','毒压住了，拔不出来。凡人没有经脉，毒没有路走。两个办法：你用自己的灵力给她开一条路，把毒引到你身上——你五天七夜打下来的修为，就没了。或者去隐道里猎蓝鳞蛇，蛇胆能溶灵毒。慢，一来一回要一天，毒在她骨头里多渗一分。'],
 {c:[
  {t:'渡灵气给她',k:1,fx:{qiMul:.5,pills:1,flags:{saveHe:1},aff:{he:30,tie:15}},r:[
   ['','你把阿禾的右手平放在掌心，把那一池浅浅的灵力探进她的手腕。蓝线像水遇到了低处，一股脑涌向你。冷，比冬天的轨道还冷。'],
   ['','天亮的时候，阿禾的手腕上只剩一个淡淡的蓝点，像一颗痣。'],
   ['he','{bro}，你的手好冰。'],
   ['mo','……笨。但是是个好笨蛋。'],['','（修为散去一半）']]},
  {t:'下隐道猎蓝鳞蛇',k:0,fx:()=>{S.flags.heScar=1;aff('he',-10,true);aff('tie',-5,true);rwFight({title:'蓝鳞蛇',bg:0,many:[{look:'污水蛭',name:'蓝鳞蛇',beast:1,st:Math.max(2,S.stage+1),m:1.4,boss:true}],noFlee:1,
    win:()=>{gQi(.4);return '蛇胆带回来了。温养一夜，阿禾的蓝线退得干干净净。\n可每逢阴天下雨，她那只手都会疼。';},
    lose:()=>{gQi(.1);return '你被蛇尾抽回了栅栏边。周烈一言不发地下去，带回了蛇胆。\n阿禾好了，可每逢阴天下雨，她那只手都会疼。';}});},r:[
   ['','你拿起撬棍走到站台尽头的栅栏前。周烈靠在栅栏上，在等你。'],
   ['zhou','隐道里的东西，护卫队三个人下去过一次，回来两个。'],
   ['@','那你闪开。'],
   ['','他盯着你看了很久，把腰上的军用手电筒解下来扔给你。'],
   ['zhou','蛇怕光。别照它的眼睛，照它的尾巴。它会回头咬自己。']]}
 ]},
 ['','几天后的夜里，阿禾坐在车厢门口画画。这次她画的是你：一个很瘦的小人，胸口涂了一块蓝色。'],
 ['he','{bro}，你胸口也有星星。我那天晚上从纸板缝里看到了。我谁也没告诉。……这是不是不能告诉别人的？'],
 ['@','……对。谁也不能说。'],
 ['','她认真地点头，把那张画撕下来，折成小块，放进油灯的火苗里。你第一次意识到：秘密是会漏的。而这一次，它漏给了一个十一岁的孩子。']
]});

/* ---------- 五 · 玉简洞天 ---------- */
v1Set('dongtian',{title:'青石·玉简洞天',cond:()=>F('v1')?S.seen.includes('ahe'):(S.stage>=6||S.kills[0]>=6),hint:'阿禾的事过去之后',lines:[
 ['','站口的门框上蹲着一只乌鸦。比普通乌鸦大一圈，羽毛里夹着几根银白，眼睛是金色的。它一动不动，盯着你的胸口。'],
 ['tie','第三天了。赶不走。周烈拿石头砸，它飞走，过一会儿又回来。'],
 ['mo','……灵鸦。别看它，从它下面走过去，当它不存在。'],
 {bg:'dongtian'},
 ['','洞天里，墨老坐在碎裂的边缘，双腿悬在虚空里。虚空里漂着碎瓦、半块写着字的木牌、一只空笔筒。'],
 ['mo','今天老夫给你立规矩。第一：这块玉简，全名「太一聚宝简」，太一观的镇山之宝，里面有五重。温养是最浅的一重。后面四重什么时候开，是它说了算。你变强一点，它就醒一点。'],
 ['mo','第二：它每发一次力，就漏一点光。灵鸦看得见。三百年前，有一种人专门养灵鸦——猎宝人。'],
 ['','虚空里那块木牌翻了个面，上面一个字：「封」。'],
 ['mo','太一观就是这么没的。一只灵鸦，两只，一百只。然后是人。'],
 ['mo','第三，三不。一不在人前用。二不替别人温养——你手里的丹突然比别人的好，这本身就是一道光。三不让它饿着。你不喂它灵核，它就吃你。'],
 ['@','萧尘那半块……饿着？'],
 ['mo','他那半块里住着的东西，永远都饿。'],
 {fx:{qiPills:2,flags:{dongtian:1}}},
 ['','【「玉简」页开启：玉台温养能让丹药、灵石、法器翻倍或升品。每温养完一样，灵光外泄就涨一截，满了天穹会的人会找上门。修习「敛息诀」可以少漏一些。获得 聚气丹 ×2。】']
]});

v1Add({id:'v1_ma',title:'青石·桥洞',g:'草',bg:'port',side:1,cond:()=>F('v1')&&S.seen.includes('dongtian')&&(S.kills[0]||0)>=12,hint:'玉简洞天之后，在地铁站多走走',lines:[
 ['mo','漏光堵不住，只能少漏。长在水边阴处的隐灵草，叶子背面是黑的。灵潮三年，地上该长出来了。'],
 ['','护城河桥洞下搭着一个广告牌拼的棚子。七十多岁的马奶奶弯着腰，用一个戳了洞的可乐瓶给一小片黑叶子的草浇水。'],
 ['ma','（头也不回）盐带了？放那儿，草自己拔。拔叶子大的，留根。'],
 ['ma','这草啊，我奶奶的奶奶就种。祖上传下来一句话：三百年前有个穿灰袍子的人来要过这草，给了一个铜钱，说「以后还会有人来要」。'],
 ['ma','（第一次正眼看你）你身上有味儿。和我奶奶说的一样，像下过雨的石头。还你。我们家等这一天等了三百年，等得快烦死了。'],
 ['','她从兜里摸出一枚铜钱，字磨得快看不见了。玉简里，墨老一句话也没有说。'],
 {fn:()=>{S.flags.taiyiCoin=1;if(S.ups.lianxi<6)S.ups.lianxi++;}},
 ['','【隐灵草：敛息诀 +1 重（温养外泄更少）。获得「太一铜钱」，墨老不肯说它是什么。】'],
 {bg:'dongtian'},
 ['@','穿灰袍子的人，是你。'],
 ['mo','……不是。是我师兄。'],['@','你师兄呢？'],['mo','（把铜钱的影子往虚空里一抛）在另一半里。']
]});

/* ---------- 六 · 隐道尽头（炼气三层瓶颈：身关） ---------- */
v1Add({id:'v1_tunnel',title:'青石·隐道尽头',g:'隧',bg:'dongtian',cond:()=>F('v1')&&S.seen.includes('dongtian')&&S.stage>=2,hint:'修到炼气三层',lines:[
 ['@','又不动了。三天了。灵力进来，转一圈，又出去。像撞在一堵墙上。'],
 ['mo','本来就是墙。三层是炼气第一道关。单灵根的人，一条经脉一种灵气，顺着流。你体内五条路五种水，各流各的，谁也不让谁。'],
 ['mo','可你听清楚：木生火，火生土，土生金，金生水，水生木。你要是能让它们排起队，一个推着一个转——那就是一个没有尽头的轮子。单灵根的水会流完，你的不会。'],
 ['mo','没有书可以教。太一观收过两个杂灵根的弟子，一个疯了，一个在生死关头自己摸到了。你身后那条黑洞洞的隐道，尽头是白塔站，一年前就断了联系。'],
 {bg:'metro'},
 ['','凌晨三点。铁叔坐在栅栏边的工具箱上，他没睡。他从怀里掏出一张折了又折的手绘图，铅笔画的，每一处通风井、检修门都标了数字。'],
 ['tie','我在这条隐道走了十一年。一千二百米有个检修门，能从里面关上。白塔站的站长是我徒弟，许建国。我一直想知道他们怎么样了。'],
 ['','一千二百米。检修门半开着。地上一套地铁制服，里面只剩骨头，骨头上全是细小的牙印。名牌：白塔站·站长·许建国。'],
 ['','他手里攥着一个笔记本：「第 39 天。有一只特别大的，头上长着像王冠的东西，会发光。它在指挥。」「第 40 天。我把剩下的人送到地面上，往东走，东郊有人收。我留下来关门。」「师父，如果你看到这个——」'],
 ['mo','东郊的墙，是一年前开始建的。'],
 {bg:'metro'},
 ['','白塔站的站台上，帆布山被咬得全是洞，每个洞口都有一双眼睛在反光。几百双，都在睡觉。站长室门口，墙上的爪痕组成一个七个角的图案。'],
 ['','一只狗那么大、背上露出石头一样灰皮的老鼠跳下轨道，挡在你和退路之间。它没有叫。它想一个人吃。'],
 ['mo','守门的，炼气四层。今天老夫不告诉你弱点。老夫告诉你弱点，它就不是生死关头了。记住那个圆。'],
 {fx:{flags:{xuNote:1}}},
 ['','【瓶颈·身关：修为攒满后，到修炼页「闯关历练」迎战守门的石皮鼠。按五行相生的顺序出招，伤害会越叠越高。】']
],after:()=>{setTimeout(()=>{const ni=nextInfo();if(ni.bn&&S.qi>=needQ()&&OV_FREE())bnFight();},500);}},'ratking');

v1Add({id:'v1_wheel',title:'青石·五行轮',g:'轮',bg:'metro',cond:()=>F('v1')&&S.seen.includes('v1_tunnel')&&S.stage>=3,hint:'闯过炼气三层的身关',lines:[
 ['','你倒在轨道上，左肩被咬穿了。灵力在体内乱撞：木的往上窜，火的往外烧，水的往下沉。'],
 ['mo','不是你在转它们。'],
 ['','你不再去拽。你只是让木的那一丝，轻轻碰了一下火。火亮了，余热落在土上，土挤出一点金，金冷出了水，水又浇回木上。一个圆。'],
 ['','你的拳头上裹着五种颜色，互相追着转。一拳，石皮鼠的头骨翻了一半。站台上，几百双眼睛同时睁开了。'],
 ['mo','跑。'],
 ['','你照着铁叔的图跑回检修门，铁门在身后哐地关上。门外是潮水一样的抓挠声。过了很久，安静了。你和许建国的骨头并排坐着。'],
 ['mo','它们还会来的。你杀了守门的，你的血一路滴到了这里。不是今天，是它们的王下令的那天。'],
 {fx:{flags:{ratTimer:1}}},
 ['','【五行轮：按五行相生的顺序出招，伤害递增。站里从今天起很安静——太安静了。】']
]},'ratking');

/* ---------- 七 · 红鹞的商队 ---------- */
v1Add({id:'v1_caravan',title:'青石·红鹞的商队',g:'商',bg:'shelter',cond:()=>F('v1')&&S.seen.includes('v1_wheel')&&S.stage>=3,hint:'闯过身关之后',lines:[
 ['','先是声音，一种很久没听到过的声音：引擎。一辆外面焊了钢板的公交车开到站口，车身上红漆写着「老驴」。车顶上跳下来一个穿砖色皮夹克的女人，腰上一把开山刀、一把旧手枪。'],
 ['hong','铁叔！还活着呢？狼不吃我，嫌我骨头硬。今年的货带了：盐、抗生素、种子、电池。你们拿什么换？'],
 ['','你把三颗铁背狼的灵核放在她的托盘天平上。她对着光看了看。'],
 ['hong','离体不超过三天，自己杀的？……你是这站里拾荒的那个。上回来你还是一层。我叫红鹞，叫我红姐。干这行的，不记人会死。'],
 ['hong','（压低声音）三个月前开始，有人在坊市放话，收一种会发光的古玉，价钱随便开。你们挖到了什么古怪东西，先别拿出来卖，先来问我。'],
 ['@','谁在收？'],
 ['','她用指尖敲了敲天平旁边那叠纸条。每张纸条上都印着一颗七角星。天穹券。'],
 {bg:'clan'},
 ['hong','三纹下品。坊市一颗五百块下品灵石，换成粮，大概十二吨。可我说实话：上个月有个散修拿出来一颗，当晚尸体就在下水道里。硬通货就是硬危险。'],
 ['','门「砰」地被推开。周烈站在门口，看见了桌上的罐头盒。他的灵力朝那颗丹涌去，桌上的水杯「咔」地裂了。'],
 ['zhou','……三年。我带着护卫队死了六个人。小张是挡在我前面死的，因为我只有五层，我护不住他。你要是早一年给我——'],
 ['','他看到了门外的你。三层。一个月前你还是一层。'],
 ['zhou',()=>V1('zlFace')==='敌视'?'（一拳砸在门框上，门框裂了）你也知道。':V1('zlFace')==='较劲'?'所以你说一年——你早就知道会有人帮你。':'（慢慢地）你……也知道？'],
 ['tie','因为我知道你会怎么选。我不知道他会怎么选。'],
 {bg:'shelter'},
 ['','当晚，全站大会。黑板上：「存米 360 斤。距冬至 42 天。」铁叔站在砖灶上说完了这件事：给周烈，他筑基；卖了，十二吨粮。'],
 ['tie','我不做决定。商队下回来之前，大家想一想。'],
 ['','人群里，有人开始看向你。一个月前，你是站里少一个不少、多一个不多的拾荒的。'],
 {c:[
  {t:'「卖。一个人筑基护不住一百四十人，十二吨粮护得住。」',k:0,fx:{flags:{sellVote:'sell'},aff:{zhou:-20,hong:10,tie:5}},r:[['hong','（在人群后面）你会算账。']]},
  {t:'「不卖。粮吃完就没了，一颗丹是种子，不是米。」',k:0,fx:{flags:{sellVote:'keep'},aff:{zhou:15,hong:10}},r:[['hong','（在人群后面）你会看远。']]},
  {t:'「铁叔说了，商队回来之前。我还没想好。」',k:0,fx:{flags:{sellVote:'none'},aff:{hong:10}},r:[['','人群里一阵嘘声。'],['hong','（在人群后面）你会等。']]}
 ]},
 {bg:'overpass'},
 ['','夜里，「老驴」车顶。红鹞给自己倒了一杯不知道是什么的酒，你翻上来在她旁边坐下。天上没有星星，只有一种很淡的紫。'],
 ['hong','你身上有个东西。我不问是什么。我只告诉你：我看得出来，别人也看得出来。'],
 ['hong','我爸是跑长途的，教我的第一件事：路上见到的人，只卖货，不卖人。灵潮那天他的车在高速上，我还没找到。所以我一直开车，开到哪算哪。'],
 ['hong','东郊再往东三百公里是坊市，坊市再往东，有人说是海。我没见过海。等你筑了基，等我的车还能开——以后一起去看看。'],
 {fx:()=>{S.flags.v1hong=1;S.flags.v1cY=S.year;aff('hong',10,true);}},
 ['','【红姐登场：之后可以在站里找她说话、接委托。商队一年后回来，那时候要定下筑基丹的去处。】']
]},'ratking');

/* ---------- 八 · 鼠潮（炼气六层瓶颈：生死关） ---------- */
v1Add({id:'v1_rats',title:'青石·鼠潮',g:'潮',bg:'metro',cond:()=>F('v1')&&S.seen.includes('v1_caravan')&&S.stage>=5,hint:'修到炼气六层',lines:[
 ['','半个月来，你每天夜里都听得到地板下面那种声音，很轻，很密，像下雨。今天晚上，雨停了。'],
 ['@','阿禾，去站长室，把门关上。谁叫也别开。'],
 ['','栅栏在发抖。手电筒往里一照：从地面到拱顶全是老鼠，叠在一起，像一堵在流动的墙。你拉响了废车站铃改的警报。三年里只响过一次。'],
 ['zhou','（冲下楼梯，斧子上已经烧起了火）……多少？'],
 ['@','数不清。白塔站的所有。三周前我杀了它们守门的。'],
 ['zhou',()=>V1('zlFace')==='轻视'?'你把它们引来的？（揪住你的领子）你知不知道这里有多少人！':V1('zlFace')==='较劲'?'（咬着牙笑了一下）你一个人去的。你真是个疯子。':'等打完了，我和你算。'],
 ['','栅栏哐地一声倒了。第三波里，一只牛那么大的铁骨鼠一尾巴扫碎了大刘的车门盾牌。大刘是护卫队里最老的，炼气二层，永远站在最前面。'],
 ['@','周烈！它的左前脚，关节是空的！尾巴扫过来之前，它的耳朵会往后贴！'],
 ['','这一句没有墨老的提示，是你自己看出来的。周烈没有问为什么。你们背靠着背。'],
 ['','你的灵力快耗尽了，五行轮越转越慢。你的手伸进口袋，摸到了玉简。只要你想，炉底就能把剩下的灵核烧成灵力灌进你的经脉。但那会发光，当着周烈、十一个护卫队员、楼梯口一百三十个人的面。'],
 {c:[
  {t:'握紧玉简，当众用',k:0,fx:{flags:{ratJade:'use'},aff:{zhou:5}},r:[['','一道青白色的光从你指缝里爆出来，照亮了半个站台。所有人都看见了。包括周烈。']]},
  {t:'松开手，只靠自己',k:1,fx:{flags:{ratJade:'self'},aff:{zhou:10}},r:[['','你把手从口袋里拿出来。闭上眼睛，让五行轮继续转。转得很慢，像一个推了很久很久的石磨。']]}
 ]},
 ['','【瓶颈·生死关：修为攒满后，到修炼页「闯关历练」迎战鼠潮。】']
],after:()=>{setTimeout(()=>{const ni=nextInfo();if(ni.bn&&S.qi>=needQ()&&OV_FREE())bnFight();},500);}},'ratking');

v1Add({id:'v1_rats2',title:'青石·大刘',g:'刘',bg:'shelter',cond:()=>F('v1')&&S.seen.includes('v1_rats')&&S.stage>=6,hint:'闯过炼气六层的生死关',lines:[
 [ '',()=>V1('ratJade')==='use'?'光灌进经脉，六层的墙像纸一样被撞破。铁骨鼠两回合就倒了。大刘活了下来，丢了一条腿。':'石磨转完了最后一圈。六层。没有光，只有你自己。可这多出来的三回合里，大刘倒下了，没有再起来。'],
 ['','铁骨鼠倒下的那一刻，隐道深处传来一声尖叫。太长，太有节奏，像一声口哨。所有老鼠同时停住，同时转身，潮水一样退回了黑暗里。'],
 ['','黑暗深处，很远很远的地方，有一点光亮了一下。金色的。七个角。然后灭了。'],
 ['mo','那是它们的王。它在看你。'],
 ['zhou','……那是什么？'],['@','你在东郊的旗子上见过吗？'],
 ['','周烈没有回答。他也没有走。两个人就这么站着看着黑暗，直到天亮。'],
 ['','清晨，秦婶给每个人的碗里都多倒了半勺。黑板上：「存米 341 斤。距冬至 27 天。」'],
 ['',()=>V1('ratJade')==='use'?'大刘拄着一根拐在粥棚前排队，对你点了个头。一天之内，站里开始有人私下管你叫「发光的那个」。':'在数字下面，有人用很小的字加了一行：「大刘。」'],
 {fx:()=>{aff('zhou',20,true);if(V1('ratJade')!=='use')S.flags.daliuDead=1;}},
 ['mo','白塔站再往前还有一站，水闸站，在河底下。王在那里。王死了，鼠群自己就散。'],
 ['','【去废弃地铁站深处，斩杀「鼠王·裂齿」。】']
]},'ratking');

/* ---------- 九 · 鼠王·裂齿 ---------- */
v1Set('ratking',{title:'青石·鼠王·裂齿',cond:()=>S.bossDown.includes(0)&&(!F('v1')||S.seen.includes('v1_rats2')),hint:'斩杀「鼠王·裂齿」',after:()=>{S.flags.duel_zhou=1;},lines:[
 ['','裂齿倒在水闸站的骨头堆上。它有一辆小汽车那么大，灰白的长毛像一个老人的头发，一只眼睛红，一只眼睛金。'],
 ['','王冠碎了一半。碎骨里露出一枚铜钱大小的金色令牌，刻着七角星，边缘长进了骨头里——很久以前被嵌进去，一直在喂它。'],
 ['zhou','（声音发干）有人在养它。有人把它养大了，放在白塔站。'],
 ['@','白塔站的人逃去了东郊。东郊就是从那时候开始建墙的。'],
 ['','一道黑影从隐道另一头走出来，拍了拍黑大衣上的水。萧尘。'],
 ['xiao','你们打得太慢了。王冠发光的时候打王冠，这都看不出来？'],
 ['zhou','你……是谁？'],['xiao','你记不住的。别问了。'],
 ['xiao','我是三天前才知道的。不是所有穿白衣服的人都知道。有了这枚令牌，我能在东郊里往上走一级。拿着它去问一个人这是谁的——他会记住我。至少会记住一会儿。'],
 ['','他的声音里第一次有了一点东西。不是情绪，是饿。'],
 {c:[
  {t:'「拿去。然后告诉我你问到了什么。」',k:1,fx:{flags:{token:'give'},aff:{zhou:-10}},r:[['xiao','……你会记得你对我做过的事。我也会。'],{fn:()=>{try{rwAtt(XIAO,20);}catch(e){}}}]},
  {t:'「它属于青石站。大刘的命是它拿走的。」',k:0,fx:{flags:{token:'keep'}},r:[['xiao','好。那你就拿着它。等有人来找你要的时候，你就知道你拿的是什么了。'],{fn:()=>{try{rwAtt(XIAO,-10);}catch(e){}S.expo=Math.min(99,(S.expo||0)+10);}}]},
  {t:'一拳把令牌砸碎在骨堆里',k:0,fx:{flags:{token:'break'},aff:{zhou:10}},r:[['xiao','……你把一个答案砸碎了。'],['@','我不要它的答案。我要它不再喂任何东西。'],['','萧尘看了你很久：「你是我见过最不贪的人。」']]}
 ]},
 ['xiao','你们站里的那颗丹——别那么看我。东郊里早就有人知道，商队里有人卖消息。先想好它给谁，在别人替你们想好之前。'],
 ['','他走进了黑暗里。周烈站在水里：「……他叫什么来着？」你张了张嘴，也想不起来了。'],
 ['mo','（很轻）萧尘。他叫萧尘。老夫替你记着。']
]});

/* ---------- 十 · 谁吃这颗丹（炼气九层的心关） ---------- */
const V1_PILL_C=[
 {t:'「给我。」',k:0,fx:()=>{S.flags.pill='self';S.pills+=2;aff('zhou',-40,true);},r:[
  ['@','我是站里升得最快的人。我筑基，可以去坊市、去更远的地方，换更多的粮、更多的丹。我会回来。'],
  ['','周烈一句话也没说，转身上了楼梯，经过董文庭身边时没有停。'],['','（获得 筑基丹，冲击筑基时 +25%）']]},
 {t:'「给周烈。」',k:1,fx:()=>{S.flags.pill='zhou';aff('zhou',40,true);},r:[
  ['zhou','（声音都哑了）……你另想什么办法？这世上只有这一颗！'],['@','你欠我一次。记着就行。']]},
 {t:'「卖。让红姐带去坊市卖，不卖给天穹会。」',k:1,fx:()=>{S.flags.pill='sell';S.stones+=zsAt(maxZone(),40);rep('station',3);aff('tie',20,true);aff('qin',20,true);aff('hong',10,true);},r:[
  ['','董文庭的笑容在一瞬间挂不住了。秦婶哭了，铁叔闭上了眼睛。'],

 ['','她剪断铁丝，掀开一块地砖取出小铝锅。米只有两把，掺着晒干的薯片。你想用火灵力点柴，指尖亮了两次，火都灭了。'],
 ['hong','省着。'],
 ['','她划着一根火柴，往地上摆了三个搪瓷碗。两个活人，一口锅。第三只碗缺了一角，里面落着一片干叶子。'],
 ['@','老潘的？'],
 ['hong','（脸沉下来，把碗拿起，又放下）不知道。拿的时候觉得该拿三个。'],
 ['mo','（很虚弱）……后面。'],
 ['','收费站的柱子旁站着一个黑衣青年，大衣下摆湿透，右袖划开一道长口。他递过来一张纸，是红鹞撕下的旧收据：东去，一人，车钱欠。下面另写了两个字。'],
 ['','萧尘。水闸站的水声一下子涌回来——王冠上的金光，踹开鼠王的一脚。'],
 ['xiao','我敲过车窗，你还让我上车了。你在第二个匝道接的我，说带一个也是带，两个也是带。然后你问我会不会开车。'],
 ['hong','你怎么答的？'],['xiao','不会。'],['hong','……那难怪我没印象。'],
 ['','她把第三只碗里的叶子拣掉，盛了粥。萧尘没有立即接。他似乎很久没见过一个人发现异常之后，首先做的事是把碗洗干净。'],
 ['hong','端着。下次有人问你吃过没有，碗在手里，总好作证。'],
 ['@','令牌呢？'],
 ['xiao','换了。'],
 ['','他从大衣里取出一个沾血的油纸包。半页名单，十三个名字，每个后面写着原居地、死亡日期和一枚朱红小印。最上面的原居地：白塔站。'],
 ['xiao','册上写他们死了。前天我见过其中两个。活的。在往坊市运灵砂的车上。'],
 ['','他解开右袖，那道伤从肘弯一直划到肩后，深处能看见白色的筋。昨夜那一剑以后，他从所有人的目光里退了出去，你甚至没有问他伤没伤。'],
 ['@','昨夜——'],['xiao','先说今天。今天你还记得我。这就够用。'],
 ['','你把名单夹进阿禾那张画里。画里公交车的座位，一个都没有空着。'],
 ['hong','到坊市前，再告诉我一次名字。这张收据我留着。车钱欠着，人可别欠没了。'],
 {fx:{flags:{v2Xiao:1}}}
]});

/* 二 · 门里的价钱 */
V2({t:'门里的价钱',g:'门',kills:5,hint:'在城外斩妖五只，攒些进城的钱',lines:[
 ['','南街坊市的墙用旧楼砌成，楼顶拉着铁索，索上悬着铜铃。风吹不响；有东西翻墙进去，铃才会响。门楣的木匾写着「南街」，底下还露着原来的蓝牌：国际家居建材城。'],
 ['@','一张饼多少钱？'],
 ['hong','普通的半张小额粮券，掺灵麦的两张。到了城里，先别总往米上算。……四两。今天没涨的话。'],
 ['','右边的桌子查入城牌。灰袍老修士把来人的手按在白石上，按光的颜色收钱。不发光的人另排一队，那一队最长。'],
 ['menl','商路保单停了。两辆皮卡逾期不归，旧押货没交。'],
 ['hong','那两辆车在西边被袭击了。'],
 ['menl','我知道。（抽出一张西路损失核报，落款比你们逃进青石站还早半天）'],
 ['','你看见其中一栏：随车人员六名，散失。'],
 ['hong','谁报的？我问谁看见的。'],
 ['menl','红老板，我收门钱的。你要查，去保运房。别堵后面的人。'],
 ['','队伍里有婴儿哭了，一个背柴的老人蹲下去揉膝盖。红鹞把攥起的拳头松开。新商牌要三十灵石，她身上只剩十一块。'],
 ['menl','（看着你手下亮了一圈的白石）筑基可以做担保。'],
 {c:[
  {t:'「我来担保。」',k:0,fx:{aff:{hong:5}},r:[['hong','（翻到背面，指着一行细字：担保期内货损债务，保人连坐）你还没进城，就想替我坐牢？'],['','她把纸推了回去。']]},
  {t:'「临时卸货能进吗？」',k:1,fx:{aff:{hong:8}},r:[['menl','车不能，人可以。一个两块，筑基四块。上个月两个筑基打了一架，墙到现在没修完。']]}
 ]},
 ['','红鹞把老驴停在城外货场，钥匙穿在细绳上贴身挂好。走出十几步，你停下了。'],
 ['@','三个人。'],
 ['','萧尘还站在桌前。白石在他手下亮出淡淡的灰。老修士把他的名字写进册子，写到「尘」字最后一笔，笔停了。'],
 ['menl','你叫什么？'],['xiao','萧尘。'],
 ['','他又写了一遍，写在同一行。字没有消失，人却像被一道看不见的门挡住了。'],
 ['mo','叫他收手。那石头会往册里留气息，留一次，另一半就抹一次。'],
 ['hong','（把收费站的收据拍在桌上）按随车短工入。临时名，三天有效，三个人互证。你们有这条规矩。'],
 ['','萧尘拿到一块薄木牌，没有姓名，只有三条刻痕。你想起青石站每晚点人头，秦婶拿锅勺敲桌，让每个人自己答一声。那时你嫌吵。'],
 ['','红鹞买了一张热饼，掰成三份。她那一份最薄，拿在手里很久没吃。萧尘站在门内，低头摸了一遍木牌上的三条痕。']
]});

/* 三 · 死人的号 */
V2({t:'死人的号',g:'号',gap:1,lines:[
 ['','李婶的药铺在南街最里面，隔壁卖棺材。褪成浅粉色的红十字下面添了三个小字：不赊丹。门却一直开着。'],
 ['li','又捡人了？'],['hong','收车钱的。'],['li','你那些车钱加起来，够给我换一张门板。'],
 ['','墙边躺着一个少年，脚踝肿得像发面馒头，指甲缝里一层银白的粉。他忽然抽搐起来。'],
 ['li','别用灵力碰。灵砂烙过经脉，越催越紧。'],
 ['xulu','别送……乙四十一……'],
 ['','你的手僵住了。名单里第七个名字后面的编号就是乙四十一。徐芦，十五岁，死亡日期是二十七天前。'],
 ['li','（把帘子往下多拽了半尺）上个月有个女人替她男人领药，问能不能迟两天付钱，我答应了。第五天有穿白衣服的来，拿着她男人的号问我收没收留过没登记的人。你知道我现在认什么？认床上的人还喘不喘气。'],
 ['@','我可以干活。药钱从工里扣。拆柜子，修门，搬水，没筑基以前会的。'],
 ['','后院的门轴下陷，开一次刮一道地。你取出缝里的碎砖，磨平旧铜垫片，补了一层油。红鹞缝好伤口出来时，门已经一指就能推开。'],
 ['','院里有一座小丹炉。拆风箱的年轻人左耳缺了一角，手背全是烫伤。'],
 ['li','陈默，修炉子的。少问他话，问了也不大答。'],
 ['cm','（递来一枚裂开的垫圈）这个能磨么？撑过明晚就行。炼让他走路的东西。'],
 ['','夜里，萧尘睡靠墙的一侧，把木牌压在枕头底下。'],
 ['@','为什么从东郊追到这里？'],
 ['xiao','那天我拿令牌进去，他们没有叫我编号，问我想要什么。我想说名字。可我站在那里，先说出来的是赏钱。'],
 ['','隔壁传来红鹞拆布包的声音，和一声压得很低的抽气。你把水壶放到她门边，没有敲门。'],
 ['','回屋后，你在门板上铺开名单，把徐芦的死亡日期轻轻划掉，旁边写了两个字：见过。'],
 {fx:{flags:{v2Xulu:1},aff:{cm:5}}}
]});

/* 四 · 墨老的第一句话 */
V2({t:'墨老的第一句话',g:'墨',bg:'dongtian',lines:[
 ['','那天夜里你没有炼化灵核。玉简放进遮光匣，用布包住匣缝。'],
 ['@','到坊市了。你在青石站说，到了这里就从头讲。'],
 ['','墨老慢慢显在石座旁边。他的袖口比先前更淡，手伸出来时能看见手后面的裂纹。强开第二重损去的东西，没有因为醒来就长回来。'],
 ['mo','老夫原来叫墨闻山。太一观丹房的弟子，后来管炉。三百年前外面的灵气已经很薄，有灵脉的地方关门，没灵脉的地方求人开门。太一观有一口炉，能把不同来处的灵力炼到一处，再分出去。'],
 ['@','和现在的天穹会一样？'],
 ['mo','（第一次没有立即反驳）像。像得叫老夫睡不着。……后来炉不够用。掌观要守山，师兄要开山，老夫只知道炉子不能停。三个人，各觉得自己在救人。'],
 ['@','你们争的那颗东西是什么？谁吃了？'],
 ['mo','归炉丹。能让一个快死的人再扛一次炉心。只有一颗。……（身影闪了一下）我。'],
 ['@','你吃了，活下来的人却在另一半里吃别人。你师兄叫什么？'],
 ['mo','谢照临。'],
 ['','这个名字一落，洞天深处响了一声，像有人用指甲碰了一下碗沿。'],
 ['@','你在大会上不告诉我能点化，是想看我怎么选，还是想再看一次你们当年怎么选？'],
 ['mo','（每一条细纹都静了下来）……都有。'],
 {c:[
  {t:'「以后别这么做。你知道退路，告诉我；不知道，就告诉我不知道。」',k:1,fx:{aff:{mo:10},flags:{v2Mo:'honest'}},r:[
   ['mo','小子——'],['@','你想救我，也不能拿站里的人试我。'],
   ['','说完这几句，你后背出了一层汗。对着乌衡你知道自己在拼命；对着墨老，你像亲手挪开了最后一堵挡风的墙。'],
   ['mo','（看了你很久，点头）好。']]},
  {t:'「我不怪你。」',k:0,fx:{aff:{mo:3},flags:{v2Mo:'soft'}},r:[['mo','……你该怪的。老夫三百年前就该有人这么说。']]}
 ]},
 ['','第二重的炉纹亮了一道。墨老逐一指给你看：材料怎么相合，哪里会生废渣，哪里是借魂力暂时撑起来的。点化不是把石头变成金子；少一味材料，就要用别的东西抵；抵不起，炉就向持有者取。那夜他抵进去的，是自己的魂力。'],
 ['mo','照那夜的法子再做两颗，老夫未必还记得自己的名字。你不问十三个人怎么救？'],
 ['@','我刚进门，还不知道他们在哪。'],
 ['mo','（笑了一声，很短）这句话，比老夫三百年前明白。'],
 {bg:'market'},
 ['','回屋时萧尘还没睡。他在纸上写名字，写完一行就用手掌遮住，再凭记忆写下一行。最上面一行是萧尘，第二行也是，后面开始出现错字。'],
 ['@','你今晚用了它？'],['xiao','去看了一眼保运房。三天。我只有三天。'],
 ['','你在对面坐下，拿笔在自己手背上写了那两个字，写得很大。'],
 ['xiao','（似乎想笑）洗手就没了。'],['@','明天再写。']
]});

/* 五 · 借火 */
V2({t:'借火',g:'火',kills:8,hint:'到城外再斩妖八只',lines:[
 ['','一声砸锅响。陈默脚边是拆成两截的风箱，李婶骂了半天，最重的一句是「你知道这东西现在多难买」。'],
 ['cm','里面结了砂，再烧，会炸。'],
 ['','给徐芦的药要细火熬两个时辰，借丹铺的炉要十二块灵石，还得排到后日。炉壁三道阵纹，两道熄了。'],
 ['@','我能试试。'],
 ['cm','火灵根？……五行。（感受了一下）火不够稳。能稳多久？'],
 ['','你把火压成针尖大的一点。半盏茶后，火尖晃了。陈默说这话时并没有看不起你，只像看见一颗不合尺寸的螺丝。'],
 ['cm','那就每半盏茶换一次。别往里加火，给这条木纹续气。它生火，废热从土纹走，金纹收口。水纹堵了，你修。'],
 ['@','你也会五行轮？'],['cm','我会修炉。'],
 ['','缺一味寒萤草，在西渠浅井里有。李婶雇的采药人不敢下去——井里来了两只吃灵砂的钳虫。'],
 {c:[
  {t:'在井口吊一块热砖，等它们爬上来再冻住脚下的泥',k:1,fx:()=>{S.flags.v2Well='trick';v2Fight({title:'西渠浅井',bg:'port',many:[{look:'鬼面蟹',name:'吃砂钳虫',beast:1,st:Math.max(9,S.stage-1),m:.9},{look:'鬼面蟹',name:'吃砂钳虫',beast:1,st:Math.max(9,S.stage-1),m:.9}],
    win:()=>{wuAdd(3);return '两只钳虫争着攀上热砖，你用水灵力冻住它们脚下的薄泥。最后一脚踏空，是陈默给的绳子拉住了你。\n寒萤草采到了。';},
    lose:()=>{return '钳虫的壳比你想的硬。你被夹伤了手，还是抓着一把寒萤草爬了上来。';}});},r:[['','你借了棺材铺的凿子下井。']]},
  {t:'硬破它们的壳',k:0,fx:()=>{S.flags.v2Well='force';v2Fight({title:'西渠浅井',bg:'port',many:[{look:'鬼面蟹',name:'吃砂钳虫',beast:1,st:S.stage,m:1.2},{look:'鬼面蟹',name:'吃砂钳虫',beast:1,st:S.stage,m:1.2}],
    win:()=>'壳碎了，你的掌心也少了一块皮。寒萤草采到了。',lose:()=>'你被钳虫逼回井口，陈默把绳子扔下来，拖你上去。寒萤草只抓到一半，够用。'});},r:[['','你借了棺材铺的凿子下井。']]}
 ]},
 ['','李婶接药时，先把你的手拉过去看：「下次用布包着。」红鹞也说过这句话。你笑了一下。'],
 ['','炉子在午后点起来，五行灵气沿旧阵纹慢慢流动，第一次合拢时，墨老在匣里轻轻「嗯」了一声。'],
 ['cm','第三道弯别抢。它自己会过。'],
 ['','缺门牙的瘦男人从后门探进脑袋，把一包炭塞在门槛边：「赊的，不算还账。」李婶没看他：「钱三，把门带上。」'],
 ['','傍晚，徐芦终于能说完整的话。许站长把人送出地面时，给了他一只装工具的布包，叫他跟住前头穿黄衣服的女人。到了东郊，吃上第一顿热饭，三天后领到一床被子。'],
 ['xulu','后来让干活，挖沟、洗砂，都能干。后来换地方，叫我们把旧牌交了，说换新的。新的一直没发。'],
 ['','他脚踝上有一圈淡黑的环痕。你运起灵力，看见细小的符纹仍在皮下收紧。'],
 ['mo','禁行符。碰到界桩就会发作。'],
 ['xulu','新工头说过一句话：「你们的饭钱，早有人付过了。」'],
 ['','夜里你把今天花掉的东西一项项记下：炭、草药、绳索、一颗灵核。你想问墨老这样是不是太慢。话到嘴边，看见徐芦的脚趾动了一下。慢归慢，今天这孩子能动了。'],
 {fx:{aff:{cm:10}}}
]});

/* 六 · 两本账 */
V2({t:'两本账',g:'账',gap:1,lines:[
 ['','红鹞回来时天已经黑了。她放到你面前的半块饼缺着一个很规矩的月牙——不是咬的，是掰给别人了。'],
 ['hong','保运房承认停单是他们开的。老潘没找到，检验员只看了货。'],
 ['','她拿回的抄件上，六个人的生死压在最下面一行，前面是车、轮胎、钢板、灵砂。三人对着萧尘的名单一栏一栏核，过了一会儿，都不说话了。'],
 ['','十三个人的口粮没有停。东郊账上，他们死于运送途中，救济被销掉；南街保运房的账上，他们作为一批「承工人员」出现，粮食由一间叫长庚的商号领取。人活着做工，抵救出来时的路费、床铺、药和伙食。照那种算法，到死也抵不完。'],
 ['hong','贺长庚。以前跟我一起跑西路，嫌路上死人多，转去做保运。'],
 ['@','拿这个去告呢？'],
 ['hong','告得了账目不合，告不了人在谁手里。没有活人作证，两边都能说是对方抄错了。'],
 ['@','徐芦就是活人。'],
 ['','帘子里很轻地一响。徐芦攥住被角，脚上的黑环开始发紧。李婶按住他：「没人现在送你去。」'],
 ['qian','（不知什么时候蹲在后门）不如先看旧账。你们门板薄。这趟路的钱，保运房去年秋天还领过一次——白塔站撤人，坊市拨了安置款。我做过那本账。'],
 ['li','你不是说你以前在钱庄扫地？'],
 ['qian','后来扫地。账做错了一次，人家就不让我做了。'],
 ['hong','真错了？'],
 ['','他不答。灯焰晃了晃，照见这个赌鬼眼角的细纹。旧安置账封在公库，当事人可以申请调卷，要有名字、原籍，最好还有当年离开白塔站的凭据。'],
 {fn:()=>{if(F('xuNote'))SC.q.unshift(['','你想到许建国的笔记本。离站前你抄过末尾几页，和铁叔的线路图折在一起：队伍分三批，每批出发的时刻，交给几个年轻人的工具。']);else SC.q.unshift(['','你想起铁叔说过，许建国把人分三批送出了地面。你托货车给铁叔捎了信，三天后，几页抄件跟着菜车回来了。']);}},
 ['xulu','（慢慢抬起头）黄把的钳子。包里还有六枚钉子，一块布。许站长给我的，说路上谁鞋底掉了，就帮人钉。'],
 ['','他伸手摸了摸「许建国」三个字，把脸埋进被子里。你没有劝。你终于知道铁叔收到笔记本以后为什么合着本子坐了那么久。没写完的后半句，会由还活着的人一点一点找回来。'],
 {fx:{aff:{qian:10}}}
]});

/* 七 · 姓名以外 */
V2({t:'姓名以外',g:'名',kills:5,hint:'到城外再斩妖五只',lines:[
 ['','三天临时籍的第二个夜晚，萧尘去了公库。他只想抄下拨款批号。值夜人的茶水里映出一个淡淡的黑影，手按在了铃上。'],
 ['','另一半玉简在他胸前发凉。一个温和得像给夜归的孩子留门的声音贴着心口响起：「你让他忘记，就可以了。这一次只收一件小东西——你第一次见到林舟的地方。」'],
 ['','他想起诊所，碎玻璃门，那个瘦青年握着撬棍说打不过，所以让他来拿。'],
 ['xiao','（在心里）换一样。'],
 ['','「不是你每次都有东西可换。」'],
 ['xiao','……走错门了。'],
 ['','铃声响起来，屋檐下落下几道细光，割开了他的肩。他翻墙落地时撞翻了卖栗子的炉子，滚烫的沙泼在小腿上。满街的人都看过来，忽然间他清清楚楚，像一件不合时宜的东西摆在众人面前。'],
 ['','你从街口来。先看见血，再看见黑大衣，脚步顿了半拍。那半拍对他太熟悉了。他伸手去怀里摸写着名字的纸——'],
 {c:[
  {t:'抬起左手，念出手背上洗淡了的两个字',k:1,fx:{flags:{v2Name:1}},r:[['@','萧尘。'],['','你拉起他，拐进窄巷。']]},
  {t:'接过他递来的纸，念出来',k:0,r:[['@','……萧尘。'],['','你拉起他，拐进窄巷。']]}
 ]},
 ['','你们在李婶后院的门里停下来，外头巡夜人在问：「看没看见一个穿黑衣服的年轻人？」'],
 ['@','要去，叫我。'],['xiao','你会拦我。'],['@','会。'],['xiao','那叫你有什么用？'],
 ['@','（替他挑出小腿伤口里的粗砂）你可以跟我吵。吵完再一起去。'],
 ['xiao','（把头抵在墙上，很久）以前有个人，每晚给我留灯。后来我想不起来她的脸了。纸上写的是姐姐。我知道那是我的字，可我看着「姐姐」，心里什么也没有。你不用替我难过。难过也要先记得。'],
 ['','你在他的纸上，名字下面添了一句：第一次见面，在十字街诊所。'],
 ['xiao','（眼眶一点一点红了）……这次还在。'],
 {fx:()=>{try{rwAtt(XIAO,15);}catch(e){}}}
]});

/* 八 · 旧信 */
const V2_ZHOU_LETTER={zhou:['丹还在。没乱吃。','铁叔逼我把五层以后的路重练。我知道不能拿丹当饭吞。你别担心这个。'],
 self:['你吃了那颗丹。我没去送你。','铁叔逼我把五层以后的路重练。我自己能走上去。'],
 sell:['粮到了。今年冬天，站里没饿死人。','铁叔逼我把五层以后的路重练。没有丹，我也会走上去。'],
 tq:['丹被拿走了。天穹会的粮只来了一次。','铁叔逼我把五层以后的路重练。'],duel:['你赢了。','我在练。']};
V2({t:'旧信',g:'信',gap:1,lines:[
 ['','第三天上午，来查药铺的是个年轻女吏，姓姚，带着两名巡街人，手里的册子还很新。'],
 ['yao','有人报失一名工役，逐家验籍。'],['li','病人也验？'],['yao','尤其病人。'],
 ['','红鹞递上书面申诉、许建国笔记的抄页和徐芦口述的撤离经过。女吏读得很慢。'],
 ['yao','工契在案，我不能凭这些放人。可归属既有争议，报失方也不能先带走。三日内审，三日内人不能离坊市。谁担保他不跑？'],
 ['li','我。'],['yao','要能赔工契的钱。'],
 ['','李婶的脸红了。红鹞的商牌已经停了。最后是你按了手印——这次写得明白，只保徐芦按期到场，不承认他欠工契上的债。红鹞逐字看完，才让你落指。'],
 ['yao','（收纸时往里屋望了一眼）药照常吃。验籍不禁看病。'],
 ['','她在门柱上贴了一道灰符，符中有细细的水纹。不是封门，是留气息。'],
 ['','午后，一封信跟着菜车、又换了两个人的手到了后门。信封背面歪歪扭扭写着「药铺红姐姐转」。'],
 ['tie','（信里）站口重新封好了，周烈守夜，秦婶照旧开粥棚。董文庭派人送来一张「育灵收徒」的帖子，说要接阿禾去东郊，包吃住，包教功法。我没收。人留了帖子，约十日后再来。'],
 ['he','（第二页是画：三只碗，一只锅）{bro}，不要光买我的东西。你也要吃。'],
 ['zhou',()=>(V2_ZHOU_LETTER[v2P()]||V2_ZHOU_LETTER.zhou)[0]],
 ['zhou',()=>(V2_ZHOU_LETTER[v2P()]||V2_ZHOU_LETTER.zhou)[1]],
 ['zhou',()=>S.flags.daliuDead?'大刘的坟边，阿禾种了一棵小树。':'大刘说他的新拐杖比你那根破撬棍直。'],
 ['zhou','阿禾我看着。……你给她写封信。别只给我留一句等着。'],
 ['','最后一行笔尖戳破了纸。红鹞把一支笔推过来：「天黑前有往西的车。」'],
 ['','你写了很多，划掉更多。不愿告诉阿禾城里有人在找她，又怕写得一切都好，她会真觉得外面只剩热饼和漂亮灯笼。'],
 {c:[
  {t:'「有人要带你走，先等我的信。你不想去，就说不想去。这件事该听你的。」',k:1,fx:{aff:{he:15},flags:{v2Letter:'choice'}}},
  {t:'「别跟他们走。等我回去。」',k:0,fx:{aff:{he:5},flags:{v2Letter:'wait'}}}
 ]},
 ['','红鹞把信折好，又拿出一小块银色的药布，让送信人带给'+'站里。'],
 ['@','记我账上。'],
 ['hong','已经记了。'],
 ['','她翻开小本子，果然有一页写着你的名字：车钱、饼钱、邮脚、今天的药布。至少在这本账上，你欠的每一笔都有来处。'],
 {fx:{aff:{hong:8}}}
]});

/* 九 · 西堤有雪 */
V2({t:'西堤有雪',g:'雪',kills:10,st:9,bg:'port',hint:'到城外再斩妖十只（需已筑基）',lines:[
 ['','西堤没有下雪。那些白色的东西，是从洗砂池里吹出来的粉。粉落在荒草上，草茎先变亮，随后弯折，根部发黑。'],
 ['','六排工棚中央一座矮塔日夜发光，光顺着地下的铜管流向坊市。陈默说那是转砂炉，把碎灵砂熔成稳定灵材。只要炉不停，城里的人就看得见灯。'],
 ['','你和红鹞藏在送炭车底混了进去。卸货处，一个女人弯腰推料，左手只剩三根手指，脚踝上的符环和徐芦一样。'],
 ['','车夫倒车碰翻了料斗，那女人去扶，袖子被传料轮卷住，半边身子拖向滚烫的砂槽。'],
 {c:[
  {t:'从车底伸出手，让水灵力沾湿皮带',k:1,fx:{flags:{v2Save:1}},r:[['','皮带打滑，齿轮空转。女人拔出手臂，连滚带爬地躲开。车下的空气忽然一紧。']]},
  {t:'按住不动——你们只是来确认人还活着',k:-1,fx:{flags:{v2Save:0}},r:[['','红鹞先你一步扑了出去。女人得救了，你们也暴露了。']]}
 ]},
 ['hui','哪位道友？'],
 ['','灰衣修士没有筑基，可他身后的阵纹亮起来，气息几乎盖过了你。被借来的力量——鼠王头上的王冠也是这样。他袖底飞出一面小盾，盾背嵌着七角星，中央刻的却是一个「庚」字。'],
 ['','【迎战：西堤灰衣修士。他借着炉阵的力，铜索带电。】']
],after:()=>{v2Fight({title:'西堤',bg:'port',many:[{look:'天穹追兵',name:'西堤灰衣修士',st:S.stage+1,m:1.4,el:'lei'}],
  win:()=>{S.flags.v2Dike='win';wuAdd(4);return '木气托起湿绳缠住铜索关节，金气震开接合处，水气钻进裂隙，铜索结霜绷断。\n你们沿排水沟奔出去。桥洞外，那个三指女人拉开了送炭车的后板。\n“车走北边，别往南，南边有桩。”\n“我叫顾春。里面还有十一个。徐芦跑出去了——告诉他别回来。”\n她朝追兵扬了一把炭，大喊“他们抢车！”，举起了两只手。缺指的那一只举得更高。';},
  lose:()=>{S.flags.v2Dike='lose';return '铜索打在你肩上，五行堤猛地一震。红鹞喊“往下！”，你们跳进排水沟。\n桥洞外，那个三指女人拉开了送炭车的后板：“我叫顾春。里面还有十一个。告诉徐芦别回来。”\n她朝追兵扬了一把炭，举起了两只手。';}});}});

/* 十 · 一张空契 */
V2({t:'一张空契',g:'契',lines:[
 ['','回到药铺，你把十二个名字排开，在顾春后面添了一句：她让徐芦别回去。'],
 ['yao','（站在灰符下面）西堤承认名单有误，愿意补录移籍，徐芦的旧籍一起恢复。条件是不再追究旧账，工契继续有效。'],
 ['li','那跟没改有什么两样？'],
 ['yao','（看着你）你们今天去了西堤？他们愿意自己来申诉吗？'],['@','脚上有符。'],
 ['','她把回执翻过去，背面另写了一行小字：明日午前，西堤换炉，人员可能迁出。'],
 ['yao','我只能扣住徐芦这一份。其他十二份，没人替他们提出争议。'],
 ['@','我能代。'],['yao','你和他们是什么关系？'],
 ['','你一时答不上。同是地铁站逃出来的，不算。见过许建国的遗骨，不算。顾春给过你们一条活路，也不算。'],
 ['yao','坊市认亲籍、师门、雇契，还认联保户。最后一种，要每个人愿意落名，不能替人按。'],
 ['','棋桌旁，钱三在输最后两个铜钱。对面的年轻人一边下棋，一边用炭笔在地上画路。'],
 ['qian','沈棋。闲人。'],
 ['shen','去西堤，别走你们来时的桥，巡街人已经守上了。……你鞋底的灰。'],
 ['qian','找得到愿意按印的人，账能递进去。可要接走十二个工人，对方一定追旧债，你们要拿东西压住。'],
 ['','红鹞把停掉的商牌、老驴的车籍、几张旧货契一件一件放在棋桌上，像从自己身上拆东西。你按住了那张车籍。'],
 ['@','车不能押。押了，你还能去找你爸吗？'],
 ['hong','（把车籍推回自己这边）能。慢一点。'],
 ['qian','车只能抵一部分。剩下的缺口，可以由筑基修士立偿约。若走修士的血誓，连躲都躲不开。'],
 ['mo','别拿自己的神魂给这群人作账。'],
 {c:[
  {t:'一条一条问清血誓的条件，再一条一条改',k:1,fx:{flags:{v2Oath:'amend'},aff:{qian:10,hong:5}},r:[
   ['','你问会不会转到十二个人身上，死后怎么算，查出工契造假是否自动撤誓。钱三听到最后，慢慢把纸铺平：「得改。好几处都得改。」'],
   ['','暮色落下来，沈棋替你们挡住被风掀起的纸角。最后留下的，是一张没有任何人姓名的空契：只写一起担责的范围、退出的法子、未成年的孩子不计债，以及任何一人不能替别人决定去留。']]},
  {t:'按下血誓，先把人保下来',k:0,fx:()=>{S.flags.v2Oath='blood';S.lifeB=(S.lifeB||0)-10;aff('mo',-10,true);},r:[
   ['mo','（冷冷地）……你会后悔。'],['','血珠落在纸上，渗进去就没了。你觉得身体里有一小段时间被借走了。（寿元 -10）']]}
 ]},
 ['','纸很薄。你拿在手里，却觉得它比在青石站看见的那颗丹重得多。']
]});

/* 十一 · 鸦落南街 */
V2({t:'鸦落南街',g:'鸦',gap:1,lines:[
 ['','乌衡进坊市的时候，没有带鸦群。他穿一身普通的黑衣，坐在茶摊最里面。肩上的银鸦只剩一只完整的翅膀，另一只用细细的铜骨撑着，不能飞。'],
 ['wuh','孩子不在这里。育灵的帖子，是董文庭自己的主意。'],['@','你觉得我会信？'],
 ['wuh','你信不信，并不改变他已经递了帖子。把你那半块交出来，西堤的人我替你解契，青石站我让文庭撤人。你不必再拿一辆车、一间药铺去凑。'],
 ['@','你取不了。你在站口试过。'],
 ['wuh','取得了玉，未必取得了里面的东西。你愿意松手，和我掰开你的手，是两回事。'],
 ['@','我交了，会怎样？'],['wuh','要解开你和它的牵连。修为可能保不住。'],
 ['','巡街人从茶摊外走过，看了乌衡一眼。他在城外可以追杀人，在这里必须把双手摆在桌上——城里不只他一个筑基。'],
 {c:[
  {t:'坐下来：「你也认识墨闻山。」',k:0,fx:{flags:{v2Wu:'talk'}},r:[
   ['','银鸦的喙忽然张开。乌衡按住它，第一次收起笑意。'],
   ['wuh','他肯把名字给你了？那他有没有告诉你，太一观开山门时，先放进来的是什么人？……他会说的。等到他认为你不会离开的时候。'],
   ['','他用手指梳了梳银鸦胸前的羽毛。指节上裂出一道细口，血落进羽毛里，很快没了。'],
   ['wuh','你是不是觉得我靠它找宝，所以它是我的畜生？每个人都得喂养一点什么。你已经知道这道理。']]},
  {t:'「不交。」转身就走',k:0,fx:{flags:{v2Wu:'leave'}},r:[['wuh','（没有拦）会再见的。']]}
 ]},
 ['','晚饭里有一小碟咸鱼。萧尘的临时木牌今天失效了。每次外面响起脚步，他都会把筷子放下。你夹了一块鱼放进他碗里。'],
 ['@','明天要去西堤。你能帮忙，但先说要付什么。'],
 ['','他看着你，半晌才点头。'],
 ['mo','（只有你听得见）先放进去的，是肯签寿契的人。……剩下的，今晚讲。不等你离不开老夫。'],
 {fx:{aff:{mo:5}}}
]});

/* 十二 · 红鹞卖过的消息 */
V2({t:'红鹞卖过的消息',g:'路',kills:6,hint:'到城外再斩妖六只',lines:[
 ['','二更，有人敲门。运输行的年轻伙计小阮，一进门就跪下。'],
 ['ruan','工棚今夜就走，走水路！明日午前换炉是假的！'],
 ['hong','谁让你来的？'],
 ['','小阮掏出一张油污的票据。上面是红鹞的字：两个月前，她把西路沿线能通车的地方卖给了保运房——哪里有水，哪里能过冬，哪里有修士，哪里能用盐换粮。商队之间常做的买卖，不卖人名，只卖道路。'],
 ['','票据背面添了新批注：青石，护卫火属，取水依赖内渠。先断西口，再议收编。'],
 ['ruan','贺长庚要烧旧票，我把你这张扣了。我哥在你的皮卡上。'],
 ['','老潘不是那次唯一没回来的人。红鹞像忽然听见了所有没能开口的名字。她把票据折好，放在你面前。'],
 ['hong','是我卖的。当时不知道他们会用来做什么。后来东郊开始收站，我觉得不对，停卖了。可我没回去给每一个站送信，也没告诉你们。……我怕你们以后不让我的车进门。'],
 ['','你想起粥棚边她那句「只卖货，不卖人」。那原来既是她的规矩，也是她不肯回头看的一道线。'],
 ['@','你该告诉铁叔。不是等以后。'],
 ['','她当着你的面写信：卖过的地方、时间、收到的钱，最后写会赔，但眼下还赔不起。没写自己多无奈，也没写别人怎样骗她。她写完，你仍没说没关系。'],
 ['ruan','船过子时就装完！'],
 ['hong','我带路。你若不愿坐我的车——'],
 {c:[
  {t:'「坐。现在先去，回来再说。」',k:1,fx:{aff:{hong:15},flags:{v2Hong:'ride'}},r:[
   ['','副驾驶的椅背旁夹着一张旧照片：戴鸭舌帽的中年男人，身后一辆蓝色货车。照片背面的车牌，最后两个数字被摸得几乎看不见。'],
   ['','你找来一小片透明塑料，把最薄的角包住，夹回原处。红鹞盯着前方，握方向盘的手紧了一下。两个人谁都没有说话。']]},
  {t:'「我自己走过去。」',k:0,fx:{aff:{hong:-10},flags:{v2Hong:'walk'}},r:[['hong','……好。'],['','老驴的车灯一直跟在你身后三十步。']]}
 ]}
]});

/* 十三 · 请你自己写 */
V2({t:'请你自己写',g:'写',bg:'port',lines:[
 ['','西堤的码头藏在转砂炉后面。三条窄船首尾相接，船舷贴着禁行符。工人沿木板往下走，脖子上挂着新编号。顾春走在最后，搀着一个眼睛被灵砂灼伤的男人。'],
 ['','你从车顶数了一遍。十二个。再数一遍，仍是十二个。'],
 ['','陈默在车尾摆开铜管、旧风箱和几块阵板。钱三去找姚女吏。萧尘从上游旧渡口下水，拖着一根湿绳往船底游，右臂的伤没长好，游到一半抓住桥桩换气。你看见了，没有催。'],
 ['@','停船。'],
 ['','你把空契铺在装砂的木箱上。守门人伸手来抢，指尖被一圈五色细光弹开。你不是在等他们允许，你是在让船上的人看见。'],
 ['@','顾春。徐芦活着，在药铺，他的脚能动了。我们能带你们去申诉，但没人能保证最后赔多少、住在哪里。愿意的，自己过来写名。不愿意跟我们走，也可以只作证。'],
 ['','灰衣修士赶来，铜铃一响，码头的符桩亮起。顾春的脚还没迈出船舷，整个人便跪了下去。'],
 ['','船底轻轻一晃。一条湿绳绕住了最近的符桩，河水截断了半条阵纹。萧尘抱着桥桩，嘴唇冻得青白，抬手比了一个很短的手势：一刻。'],
 ['@','写。'],
 ['','顾春抓住笔，手一直抖。她只会写一个「顾」字，写到一半又涂掉。'],
 ['hong','按指印也行。'],
 ['gc','（咬着牙把那个字写完）……春怎么写？'],
 ['','你在挡铜索，没法回头。红鹞在另一张纸上写给她看。'],
 ['','十二个人一个接一个从船上下来。有一个只肯作证，不愿加入联保，红鹞把他的纸单独夹好，没有劝。'],
 ['','被灼伤眼睛的男人问：「我媳妇没在这儿，她算不算？」'],
 ['@','她自己来了再算。先算你。'],
 ['','铜铃第三次响起。灯火一暗，河面的水纹向两侧分开。一个穿锦袍的中年男人从炉门后走出来。'],
 ['hcg','红鹞，你这笔买卖，做得太亏了。'],
 ['hong','贺老板。你这回卖的，也不该是你的货。'],
 ['','【迎战：灰衣修士，替船上的人挡住铜索。】']
],after:()=>{v2Fight({title:'码头',bg:'port',many:[{look:'天穹追兵',name:'西堤灰衣修士',st:S.stage+1,m:1.3,el:'lei'},{look:'废铁傀儡',name:'铜索桩',beast:1,st:S.stage,m:1}],
  win:()=>{S.flags.v2Dock='win';return '最后一道铜索被你挡在木箱前。十二个名字都落在了纸上。';},
  lose:()=>{S.flags.v2Dock='lose';return '铜索在你的小臂上留下一道深红的印。你没退，木箱上的纸一张也没少。';}});}});

/* 十四 · 炉心 */
V2({t:'炉心',g:'炉',bg:'port',lines:[
 ['hcg','（先看你，再看老驴，最后看远处城墙的灯）筑基初期，堤还没养稳。红鹞，你从哪儿捡到的？'],
 ['hong','捡破烂的地方。'],
 ['','贺长庚抬起右手，码头上所有铜索同时绷紧。你胸口一窒，五行堤上浮出第一道细痕。上次在水闸站你借的是水，这一次他借的是整座炉。'],
 ['hcg','你们损坏坊市供阵的转砂炉，我替城里拿人。'],
 ['','炉塔深处一声闷响，排水口的水忽然滚热。萧尘被白汽逼得松开桥桩，你扑过去把他拖上来，手臂烫掉一层皮。'],
 ['cm','他关了散热道。半刻就会开裂。城里会缺半夜热，可我们站的地方会炸。'],
 ['','贺长庚不需要杀人。他只要这里失一次火，让契书、禁行符和工人的脚，一起变成解释不清的东西。'],
 ['mo','别硬撞。那炉有四根承柱，你先断他借力的路。'],
 ['@','哪根？'],
 ['mo','（停住了。三百年前的炉，和这座被修过不知多少次的炉不一样）……我不知道。'],
 {fn:()=>{if(S.flags.v2Mo==='honest')SC.q.unshift(['','他说了「不知道」。你想起药铺院子里那夜，他答应过你。']);}},
 ['cm','（在地上画了一条歪斜的线）左边是废的，右边才受力，他把标记换了。打那根标着排水的铜柱，贴地三尺。'],
 ['hui','（死死盯住陈默）你在内炉待过？'],
 ['','陈默没答。他把一只冷却水阀递给顾春，叫她找两个人拖开被砂堵死的水沟。顾春看看越来越亮的炉塔，又看看没人守的北路。她本来可以走。下一刻，她拉过身旁的高个工人，一起扛住了水阀。'],
 ['gc','沟底有横木。别踩右边，踩过会塌。'],
 ['','红鹞倒车撞开废料棚，露出底下的铜柱；车轮空转——后轴被铜索缠住了。贺长庚朝她抬手，半空中凝出一道铁色的刃。'],
 ['','你甩出一袋湿砂，金灵力贯进袋中，砂粒撞上刃口碎成白雾。刃擦着车窗过去，削掉了副驾驶的椅背。旧照片从碎玻璃里飘出来。'],
 ['','红鹞下意识伸手。下一刻，她把手收回，死死握住方向盘。'],
 ['hong','车尾！'],
 ['','【迎战：贺长庚。他借着整座转砂炉的力。撑住，等后轴的铜索被拆开。】']
],after:()=>{v2Fight({title:'炉心',bg:'port',many:[{look:'天穹长老',name:'贺长庚',st:S.stage+3,m:1.7,boss:true,el:'jin'}],
  win:()=>{S.flags.v2Boss='win';wuAdd(8);return '你一拳砸在他借力的那根铜柱上。贺长庚周身的灵光晃了一晃。\n不够。可空隙出来了。';},
  lose:()=>{S.flags.v2Boss='lose';return '你被铁刃砸进砂袋堆，喉咙里涌上血腥。\n可你挡住的那几息，萧尘已经爬上了后轴。';}});}});

/* 十五 · 冷水过堤 */
V2({t:'冷水过堤',g:'水',bg:'port',lines:[
 ['','割绳刀切不断铜索。萧尘知道。他把刀尖插进索节，只撬那枚转向用的销钉。你修门时说过，受力再大的东西，总有一处必须留给人拆。'],
 ['hcg','（终于看见了他，那声音里的惊喜比见到你时深得多）……另一半。'],
 ['','萧尘胸口的玉简骤然变冷。「让我来，」谢照临说，「只要片刻，他们都会看不见你。」'],
 ['','萧尘没有回答。他双手握刀，整个人向后坠，伤口重新裂开。销钉拔出，铜索失力，老驴撞向铜柱。第一声是钢板变形，第二声是阵纹断裂。'],
 ['','你等到了那道空隙。你没有朝贺长庚扑去，而是钻进了炉下的检修口。'],
 ['','五条输灵管交错着探入炉底，像五条被勒住的经脉。木气推火，火气积土，最后一道回水却被人钉死。这也是一个轮子，只是转到最后，没有路回来。'],
 ['mo','你不能拿自己的经脉接它！'],
 ['','你没有接。你把陈默带来的铜管卡在断口，金气固定两头，土气填实缝隙，再催木气，一点一点打开火门。铜管撑了两息，开始发红。水还没来。'],
 ['','外面，顾春用断指的手掌撑着地，把烤硬的砂袋推开，直到沟底淌进第一股浑水。陈默用体重压住风箱的阀口，把水引向炉底。'],
 ['','冷与热碰在一起，你耳边所有声音都断了。五行堤上的裂纹往下延伸。多一点，热息会沿手臂倒灌；少一点，铜管会在眼前炸开。'],
 ['','你想起青石站的药柜背板。那时可以慢慢摸一格，再摸一格。现在也只能这样。第三道弯，别抢。让它自己过。'],
 ['','水过来了。白汽高高升起，罩住整座码头。坊市西墙上的灯暗了一排，又在更远处依次亮起。陈默没有算错。'],
 ['','炉外，贺长庚的铁刃第二次劈向红鹞。她攥着断掉的铜索绕过车尾，狠狠一拉，缠上了他的脚踝。只能拦一瞬。萧尘等的就是这一瞬——割绳刀扎进对方握着炉牌的右手，炉牌脱手。'],
 ['','落地前，被一只灰靴踩住。'],
 ['yao','保运房贺长庚。自行迁走争议人员，私闭散热道。现在把手放下。'],
 ['hcg','你们听谁说我私闭——'],
 ['gc','我。（举起那枚被拔出来的闭水钉）你每天叫谁做哪件事，我们都在。今天也在。'],
 ['','不止她一个。上夜班的说炉水何时变热，看桩的说是谁先收紧禁行符，推料的说旧契藏在哪块砖后。'],
 ['','陈默把你从检修口拖出来时，你最后听见的，是一个男人反复说：「我叫蒋照生。我没死。别再写错。」'],
 ['','你把那个名字记了一遍，才彻底失去意识。'],
 {fx:()=>{S.injury=Date.now()+5*60*1000;wuAdd(6);aff('cm',15,true);try{rwAtt(XIAO,10);}catch(e){}}}
]});

/* 十六 · 活人的账 */
V2({t:'活人的账',g:'活',gap:1,lines:[
 ['','你醒来时，发现自己又欠了李婶钱。'],
 ['li','幸亏只是堤受了震，经脉没裂。半个月内不许催大术，连修门都不许把灵力往掌心放。'],
 ['@','炉呢？'],['li','没炸。'],['@','人呢？'],['li','活着。'],['@','……几个？'],
 ['li','（把药碗硬塞进你手里）十三个。连那个先跑到我后门的，都给你算着。'],
 ['','床边的凳子上睡着红鹞，右手还攥着车钥匙。钥匙弯了。门框边站着一个人，你第一眼没认出来。他把木牌递过来，等你读完名字，才坐到床边。饭前点一遍名字、见面先递一张纸，已经成了这间小屋里没人觉得多余的规矩。'],
 ['','案子没有当天结。东郊回函说死亡名册可能误抄，保运房说工契由前任经手。每一处都肯认一点小错，每一处都不肯认最后的人去了哪里。'],
 ['','钱三第二次去公库时，没带酒。他当着姚女吏的面，找出白塔安置款的拨付批号。账页角落留着一个很小的改数记号。'],
 ['qian','是我改的。欠钱，他们让我改，改了能销一笔。后来他们说账错了，让我走。我走了，觉得自己吃了亏。……我一直这么想。'],
 ['','作证不能免掉他自己的责任。他从公库出来，李婶在台阶下等，手里提着一包治老咳的药。'],
 ['qian','还赊？'],['li','照价。'],
 ['','十二人的工契暂停执行，脚踝上的符由坊市供奉拆去。顾春拿到临时住籍，第一件事不是哭，是问今天能不能自己买米。最普通的米，不要工棚里掺灰的那种。'],
 ['','老驴押在了货场。红鹞认了自己愿意认的部分，其余留待审。她没在别人塞来的总账上按印，也没让你签一纸无底的血誓。'],
 ['gc','（把一袋米送到药铺，袋口扎了一个很结实的结，里面还有两枚铜钱）他们让放的。不够你们花出去的。先算一点。'],
 ['','你想说不用，李婶在旁边咳了一声。你把话咽回去，接过米，认真记到账上。这是他们自己的钱，也该由他们决定怎么花。'],
 {fx:()=>{aff('qian',10,true);S.stones+=zsAt(maxZone(),12);}}
]});

/* 十七 · 青石两个字 */
const V2_ZHOU17={zhou:'筑基丹仍封着。他说这些天才想明白，就算早一年拿到丹，不会用，也是白费。',self:'他没提那颗丹。他说他这些天才想明白，丹给了谁，路都得自己走。',sell:'他说站里今年没人饿死。丹换来的粮，他一粒一粒都看着入了库。',tq:'他说天穹会的粮只来过一次。他没骂你，只是说了很久的路。',duel:'他说那一架他输得服气。'};
V2({t:'青石两个字',g:'青',gap:1,kills:10,hint:'过些日子，在城外再斩妖十只',lines:[
 ['','入冬以后，药铺后院挂起了一块新木牌，是棺材铺的边角料。你磨了半天，李婶嫌你磨得太细，说又不是拿来当镜子。'],
 ['','大家坐在院里商量名字。有人想叫十三行，有人说明明不止十三个人。红鹞说叫驴行，大家笑了一阵，谁都没同意。你本来不敢提青石。是徐芦先问：青石是不是许站长师父住的地方？'],
 {c:[
  {t:'「是。」——就叫青石行社',k:1,fx:{flags:{v2She:'青石行社'}}},
  {t:'「叫驴行吧。」',k:0,fx:{flags:{v2She:'驴行'},aff:{hong:5}},r:[['hong','……你认真的？'],['','最后大家还是在木牌上写了青石行社。红鹞说，驴行留给她的车。']]}
 ]},
 ['','在坊市的册子里，你们登记在「家族联保」一栏。你不喜欢其中「家主可代定众事」那一条，带着红鹞去改了三次：凡借公款、迁居、接纳新户，须由当事人与轮值管事共同署名。书吏嫌烦，说没见过这么小的家族写这么长的约。'],
 ['gc','（把三根手指放在桌上，一行一行认）小才念得完。'],
 ['','你白天出城猎妖，夜里给陈默帮工。修为没有像在青石站那样飞涨。每用完一颗灵核，都得想一想，下一颗是留着自己炼化，还是卖掉换炉料。温养只在收紧遮光匣、查过四周之后进行。救了西堤的人，并没有让这些规矩失效。'],
 ['','墨老把温养的几条炉纹画在纸上，删去只能靠玉简完成的部分，剩下能教人的，让陈默试着刻进普通丹炉。试坏了三块炉板。第四块，只能把一锅药的杂质少去一点。'],
 ['li','一个病人少吐两回，也算本事。'],
 {bg:'dongtian'},
 ['mo','太一观的寿契：自愿签的人，可以先住进有灵气的院子，代价是每年借出一小部分寿元，维持山门和丹炉。起初没有强逼。后来山外冷下来，凡人走出去便没有粮、没有药，签与不签，只剩纸上两个字。'],
 ['mo','师兄要停，掌观不让——炉一停，山里的人也会死。我说再等一等，等我把炉修好。等死了第一个，第二个，我还是这么说。'],
 ['@','后来是谁把猎宝人的路引送到山门外的？'],
 ['mo','我没看见。有人告诉我是师兄。老夫信了三百年。现在……我只敢说，我没看见。'],
 ['','你没有安慰他。你把当天失败的三块炉板并排放好，分别记下出错的地方。这一次，老人也没有催你快点变强。'],
 {bg:'market'},
 ['','又过了十几天，周烈来了。扛着一袋晒干的菌子，身后跟着两个轮休的护卫。'],
 ['zhou','你还真把站名偷来了。'],
 ['','你替他接袋子，被他用肩膀撞了一下，不重，也不轻。两个人站了一会儿，忽然都笑了。'],
 ['',()=>'周烈已到炼气六层，气息比以前稳。'+(V2_ZHOU17[v2P()]||V2_ZHOU17.zhou)],
 ['he','（四页的信。第三页）天穹会来的人，我问了能不能带秦婶、能不能回来、学不会会怎样。他们起先答得快，后来嫌我问题多，就让我找大人谈。我说我也是要去的那个人。'],
 ['he',()=>S.flags.v2Letter==='choice'?'{bro}说这件事该听我的。我想好了，先不去。':'我听{bro}的，等你回来。'],
 ['','第四页全是画。站口的沙袋，旧车厢，三个人合抬的铁锅。画角写：不是每个星星都要摘。留在地上也好看。'],
 ['','你把画挂在药铺的墙上。顾春抬头看了很久，说那扇门画得真好，一看就知道能关，也能开。'],
 {fx:()=>{aff('zhou',15,true);aff('he',10,true);S.flags.v2Clan=1;}}
]});

/* 十八 · 东边的水 */
V2({t:'东边的水',g:'海',gap:1,st:10,hint:'修到筑基四层（闯过筑基的身关）',lines:[
 ['','贺长庚的案子在冬至后有了第一批结果：重复收取的运费撤销，十三人的死亡记录更正，非法加在工契上的债大半剔去。他失去西堤经营权，押在坊市候审。'],
 ['','东郊没有跟着倒下。董文庭仍在回函上签字，天穹会也仍向很多真正缺粮的避难所送东西。南街的人谈论这件事，有人骂贺长庚，有人说幸好天穹会愿意查，也有人抱怨那一夜西街冷得厉害。'],
 ['','那夜喊冷的人里，有个老人刚做完截腿，靠炉热熬冬。也是真的。青石行社接下了西街三户散热管的修缮。一条管修好，大家就去下一条。'],
 ['','乌衡在审案前离开了南街，城门的夜簿记着他奉召去了雾港。你没有把它当作平安。'],
 ['','老驴赎回来了。后轴换过，车尾凹了一块，副驾驶椅背用两块不同颜色的板补起来。红鹞嫌新后视镜照人显胖。'],
 {bg:'overpass'},
 ['','出发前一夜，你在车顶找到她。她面前放着修补过的照片，照片下面是一张从保运房旧档里抄出的回收记录：灵潮那年，有一辆蓝色货车被拖到雾港，尾号和她父亲的车相同，驾驶室里有一只刻着名字的铁饭盒。'],
 ['hong','记录不能证明人还活着。……我还是要去看。'],
 ['@','我也去。'],
 ['hong','十三个人的事已经完了，你用不着再跟我的车。'],
 ['@','只完了一本账。'],
 ['','西堤库房里还有一份调运单，列着未曾登记为人的「货物」。其中一件从雾港送出，后来退回，写着「零号，需活体封存」。陈默看到那行字，沉默了整整一天，把一枚旧工牌放在你桌上。他的名字确实签在那项工程的检修记录里。他说，到船上就讲，不再等人追问。'],
 ['hong','我卖过路。'],['@','我记得。'],
 ['hong','铁叔回信了。让我以后到站里，当着大家的面说。……你现在还敢睡在我车上？'],
 {c:[
  {t:'「敢。可以后你觉得不对，先告诉我。」',k:1,fx:{aff:{hong:20},flags:{v2HongEnd:'trust'}},r:[
   ['hong','（指尖蹭过钥匙上新缠的布，那是你白天缠的）……行。'],
   ['','风比青石站那夜冷。她把外衣扯开一点，盖住两个人挨着的手。你没有趁机握紧，也没有躲。你们在车顶坐了一阵，直到街上最后一盏灯熄了。']]},
  {t:'「敢。」',k:0,fx:{aff:{hong:8}},r:[['hong','……嗯。'],['','你们在车顶坐到街上最后一盏灯熄了。']]}
 ]},
 {bg:'market'},
 ['','第二天清早，药铺前来了很多人。周烈带第一批米和药回青石站，你们往东。青石行社留顾春、李婶和两名轮值管事照看，公款分成三份，账册留了副本。'],

/* 一 · 过河的人 */
V3({t:'过河的人',g:'渡',kills:6,hint:'往东去：到城外再斩妖六只',lines:[
 ['','去雾港的路，在第三天断了。跨江大桥只剩六根墩，涨起来的水淹过两岸滩地，像一面被风揉皱的铁皮。渡口有一条平底船，每次只驮一辆车。'],
 ['','红鹞把老驴开上船，车轮停住以后，还在下意识地踩刹车。'],
 ['shenm','松松。水底没有路给你踩。'],
 ['','掌舵的女人叫沈湄，四十来岁，耳垂冻掉了一小块。江雾从她背后卷上来，连岸边的人都看不清了。陈默拿出那枚旧工牌，放在四个人中间。牌面上还认得出：雾港联合安置所，设备维护。'],
 ['cm','我说过到船上讲。灵潮以后第二个月，我进那里干活。最早收的是碰过灵液、活不了太久的人。后来多出一栋楼，楼里的人不能出来，我们进去修东西要蒙眼。后来拆管道要看接口，就不蒙了。'],
 ['cm','管道一头接着炉，一头接着床。我以为是把药送进去。后来知道，也会把东西抽出来。'],
 ['hong','（一直盯着车轮的木楔）你什么时候知道的？'],['cm','第二年春天。'],['hong','什么时候走的？'],['cm','秋天。'],
 ['@','中间半年，你还在修。'],
 ['cm','他们说停了炉，普通病区的灯也会灭。我信过。可不全是因为信。我母亲那时在普通病区，我不敢丢那份工。……她后来病死了，没进那栋楼，药和饭也没断。不能把她的死也算给他们。'],
 ['cm','我走的时候，签过一次全部设备合格。其实三号支路有问题，那个阀我拧不开，也没找人修。签了，我才能拿最后一笔工钱出门。'],
 ['','你想起药铺那只被他亲手砸开的旧风箱。你以前只觉得陈默谨慎，现在才知道，每拆开一个还能用的东西，他也许都在重新回到那扇门前。'],
 ['xiao','零号是谁？'],
 ['cm','我只见过编号。她那一间离炉心最近。调运单写她还活着。'],
 ['','上游漂来一片车壳，草间有东西一闪，像一只睁开的眼睛。陈默抓住栏杆，掌心沾了铁锈。'],
 ['cm','你们现在叫我下船，也可以。'],
 {c:[
  {t:'（看红鹞）',k:0,r:[['hong','船都开到这里了。（把工牌推回去）到了以后，该找谁，你自己带路。遇见你签过字的人，自己说。']]},
  {t:'「船都开到这里了。」',k:1,fx:{aff:{cm:5}},r:[['hong','（把工牌推回去）到了以后，该找谁，你自己带路。遇见你签过字的人，自己说。']]}
 ]},
 ['','对岸显出一座楼。楼上挂着巨大的船锚标志，下面的标语掉了几个字，只剩「平安」「回家」。一股陌生的气味，潮，腥，带着盐。'],
 ['@','是海吗？'],
 ['shenm','（笑了一声）还没到。这是海先来接你们了。']

/* 二 · 没有下一班 */
V3({t:'没有下一班',g:'班',gap:1,lines:[
 ['','雾港的街道有两层。旧的一层泡在水里，路灯只露出灯罩；新的一层搭在楼与楼之间，用船板、铁架和绳桥相连。'],
 ['shenm','老板做饭咸，床却干净。夜里不要朝广播声走。'],
 ['','太阳沉下去以后，声音果然响起来。一阵沙沙的杂音，然后是一个很悦耳的女声：「请前往南岛的旅客，到三号口验票。」声音来自被淹掉的客运大楼，早就没有电。'],
 ['','一只小船朝声音驶过去，船上的人伸长脖子往楼里张望。雾里露出一片湿漉漉的背脊，嘴藏在三号口的屋檐下面。'],
 {c:[
  {t:'跳上浮桥，帮沈湄把那只小船顶开',k:1,fx:()=>{S.flags.v3Eel='help';v3Fight({title:'回声鳗',many:[{look:'雾鲨',name:'回声鳗',beast:1,st:S.stage,m:1.2}],

    lose:()=>'它一尾巴把你扫回浮桥。沈湄的长篙重重敲在水面，船头亮起一团黄火，它才沉下去。\n等水面平复，广播又开始了。同一句，一个字都不差。'});}},
  {t:'站在阳台上看',k:0,fx:{flags:{v3Eel:'watch'}},r:[['','沈湄的船从侧面冲来，把小船顶偏了。她用长篙狠狠敲水，船头亮起一团黄火。妖物往下一沉。等水面平复，广播又开始了。同一句，一个字都不差。']]}
 ]},
 ['mo','回声鳗。吃了浸过灵气的发声物，会反复学。它不知道自己在说什么。'],
 ['xiao','（听了很久）像真的。'],
 ['','楼里的几块指示牌，居然还被擦得很亮。有人真的相信过下一班船会来，也有人利用这种相信，把灯点到了妖物的嘴边。'],
 {bg:'port'},
 ['','第二天，红鹞去修船场查那辆蓝色货车。车在废料坡上，驾驶室斜压着一根钢梁。她在泥里爬上去，抹掉车门的锈——门上是别家运输公司的名字。'],
 ['','不是。她在车里待了很久，下来时手里多了一把掉漆的塑料梳子。'],
 ['hong','别人家的东西。要是有人来找这车，给他们留着。'],
 ['lu','（管场的老陆，盯着她带来的照片）右边撞角补过？'],
 ['hong','（猛地抬头）……补过。焊歪了一点。'],
 ['lu','那我可能见过。不是这一辆。你等我翻旧的。'],
 ['','老陆进屋去了。红鹞没有追进去，指缝里都是潮湿的铁锈。你递给她一块布。'],
 ['hong','我刚才其实松了口气。不是他的，就还能往下找。']

/* 三 · 白箱 */
V3({t:'白箱',g:'箱',kills:5,lines:[
 ['','老陆翻账的下午，陈默带你们去了原来的安置所。病区改成了装卸场，几艘船贴着二楼窗户停泊。维修门焊死了，旁边多了一条结着白霜的排气管。你摸了一下，指尖立刻没了知觉。'],

 {c:[
  {t:'伸手去扳旋钮',k:0,r:[['cm','（按住你的手腕）要先关左支路，不能直接开。'],['','你看着他，没动。']]},

 ]},

 ['','箱盖只开了一线，一股浓重的药味涌出来。里面躺着一个成年女人，短发贴在额头上，颈侧连着两根细管。她的眼睛是清醒的，清醒得近乎愤怒。她先抬手拔掉一根管，按住伤口。'],

 ['chuyi','（看了他很久）我认得你的手。'],
 ['','她没有说认识他的脸。过去每次抬头，她看见的都是床底伸进来的两只手。拧紧，试压，敲一下，说可以了。然后灯就会亮，管道里的东西开始流。']

/* 四 · 初一 */
V3({t:'初一',g:'一',lines:[
 ['','箱子周围站着七个修士，远处还有一股更深的灵压。一旦动手，箱里的人会先承受那些断裂的管道。'],
 ['','红鹞借沈湄的船叫来港务巡查。她没有先争箱里的人归谁，只让来人看破损的封运环、没有说明的目的地变更，和还在往水面泄漏的寒气。白箱被留在码头医棚，等技术复核。'],
 ['','暂存手续上写的仍是「零号」。她看见了，要求借笔。'],
 ['@','你叫什么？'],
 ['chuyi','唐迟。以前叫这个。灵潮时我二十七岁，在港口做电工。吸了灵雾，肺慢慢像结了一层冰。有人来病区招募，问我愿不愿意试一种新法子，可能死，也可能活。我愿意。'],
 ['chuyi','他们写零号，我不在意，一个床号而已。后来我想出去，他们拿那张纸给我看。同意治疗是我签的。后面附的长期留置、转运、材料采集，我没见过。……我现在还会修电。可他们不让我碰灯，说我就是灯，不能让灯随便走。'],
 ['chuyi','（看向门边的陈默）三号阀没修好，是不是？'],['cm','是。'],
 ['chuyi','我拍过床板。你听见了吗？'],['cm','（喉结动了一下）听见了。'],
 ['chuyi','那你出去。'],
 ['','陈默低下头，走了出去。'],
 {c:[
  {t:'不替他说话',k:1,fx:{flags:{v3Cm:'silent'}}},
  {t:'「他这回是来认的。」',k:0,fx:{flags:{v3Cm:'spoke'},aff:{cm:5}},r:[['chuyi','那是他的事。我让他出去，是我的事。']]}
 ]},
 ['','她把写着旧名的纸放在膝上，过了一会儿，另起一行，写了「初一」。'],
 ['chuyi','不是说唐迟死了。她是我，签过的字也是我。可我不想以后每次有人叫我，都先以为是叫我回床上。就从初一开始。'],
 ['xiao','（低头看自己的木牌）名字……也可以自己选？'],
 ['chuyi','（好像这是今晚听过最奇怪的问题）不然呢？'],
 ['hong','（笑了，拿笔在旁边写了两个字）祝遥。我爹起的。后来跑车，同行说我像只红鹞子，就那么叫开了。两个都用，看谁叫。'],
 {c:[
  {t:'念一遍：「祝遥。」',k:0,fx:{flags:{v3Zhuyao:1},aff:{hong:10}},r:[['','红鹞看了你一眼，没有纠正，也没有让你再念。']]},
  {t:'「我还叫你红姐。」',k:0,fx:{aff:{hong:3}},r:[['hong','行。']]}
 ]},
 ['','医棚的灯有些晃。初一习惯性地伸手想去拧，手腕被床边一条软带拦住。你先去问医师：带子有没有治疗用途？只是防止病人自己拔管。'],
 ['chuyi','这根可以撤，医棚的监测已经接上了。'],
 ['','医师检查过，点了头。你这才把带扣打开。初一揉了揉手腕，下床，踩上木凳，自己把灯拧正了。'],
 {fx:()=>{S.flags.zeroName='初一';S.flags.zeroSaved=1;if(!S.seen.includes('zero'))S.seen.push('zero');aff('zero',20,true);}}
]});

/* 五 · 一碗热汤 */
V3({t:'一碗热汤',g:'汤',gap:1,lines:[
 ['','闻策到医棚时，初一正在喝汤。旅店煮的鱼汤，腥，咸。她把碗托在手里，先闻，再很小心地抿一口。你没想到一个人会为了这么普通的一口东西，停这么久。'],

 ['chuyi','一口。'],
 ['','闻策三十多岁，袖口洁白，身上有草药和酒精混在一起的气味。他看着初一颈侧升起的白霜，取出一枚细长的银针压住她腕上的灵气。她的手指松开，汤碗滑下去，被你接住。'],
 ['','那一刻你不得不承认，闻策比你们都更知道怎样让她活着。'],
 ['wence','她的肺原本已经不能用。我们用寒髓替她稳住了灵息，她多活了这几年。别拿一碗热汤证明你们比我对她好。'],
 ['chuyi','你救过我。但我没答应去你们新说的地方，也没答应一直装在箱子里。'],
 ['wence','离了那个箱子，你在外面撑不了六个时辰。'],
 ['chuyi','那告诉我六个时辰以后怎么办。'],['wence','回来。'],['chuyi','回来以后还能走吗？'],
 ['','闻策终于没有马上回答。棚外，陈默翻开一本被翻得发黑的旧检修册，某一页画着一只可以背在身后的冷却匣，图还没画完。当年他提过这个改法，材料批了，又被挪给了别的工程。后来他没再催。'],
 ['wence','（认出了字）你回来了。……做得出来，也只能撑两个时辰。'],
 ['chuyi','先做两个时辰。'],
 ['','闻策看向她。那种神情像一个人忽然发现，多年来被自己计算为误差的东西，会开口要求成为结果。他拿起笔，在图上划了两处。'],
 ['wence','这里要换材，这里不能照旧尺寸。缺一味寒萤粉，价钱高。另外两样不稀有。'],
 {c:[

  {t:'「我去城外猎几只海妖换。」',k:1,fx:()=>{S.flags.v3Box='hunt';v3Fight({title:'寒萤粉',many:[{look:'鬼面蟹',name:'寒壳蟹',beast:1,st:S.stage,m:1.1},{look:'雾鲨',name:'雾鲨',beast:1,st:S.stage,m:1}],win:()=>{aff('zero',10,true);return '寒萤粉换回来了。';},lose:()=>'你狼狈地回来，红鹞把她攒的灵石塞进了闻策的药箱。'});}}
 ]},
 ['chuyi','（闻策要走时，叫住他）汤凉了能喝吗？'],
 ['wence','（看见那碗被你一直端着的鱼汤）半碗。慢一点。'],

/* 六 · 宁玄 */
V3({t:'宁玄',g:'玄',kills:6,st:10,hint:'修到筑基四层，再到城外斩妖六只',lines:[
 ['','港里最亮的楼不在研究所，在粮站。宁玄来见你们时，外衣还沾着米粉。他刚让人把霉粮筛开，霉透的单独封存，不许混进好米里发。不到四十，眉眼平静，手背有很旧的烧伤。'],
 ['','你原以为天穹会主会更老，或者更像乌衡。眼前的人却很像灵潮前停电时带头下去修闸的那一种人。'],
 ['ning','青石站，{name}。南街的申诉我看了。'],
 ['@','你看的是哪一份？'],
 ['ning','（把两份纸放上桌：东郊的解释在上，姚女吏的合卷在下）两份都看了。'],
 ['@','那你会撤董文庭吗？'],
 ['ning','查明他签过什么、知道多少，再定。不能因为他是我的人不查，也不能为了让你信我，先拿他的人头。'],
 ['','这句话你反驳不了。你更不愿因此就相信，他做的每件事都同样周全。'],
 ['ning','（对初一）你改名了？我会让他们改记录。治疗可以继续，迁往新所的计划暂缓。但你现在不能彻底离开雾港，寒髓需要这里的潮阵稳定。'],
 ['chuyi','我有不接受治疗的权利吗？'],
 ['ning','有。我会要求你明白可能发生什么。'],['chuyi','我问的是明白以后。'],['ning','也有。'],
 ['','初一把这两句一字一句写下来，让他落名。宁玄没有拒绝。'],
 ['ning','（指着墙上港区图里的一条弧线）灵潮后的海不是过去的海。潮里有灵压，深处的妖物追着灵脉迁移，船和人都靠雾港的潮阵避开最凶的水道。安置所最早不是为了造什么活体，是为了让快死的人有别的路。后来有些人把这条路走成了不许人回头。我有责任。'],
 ['@','哪一种责任？'],
 ['ning','任命、拨款、没问够。之后还要看，有没有我已经知道，却觉得可以忍的事。'],
 ['','他让人把档案查阅凭照放在桌上。凭照背面，有他亲笔划掉的一项：港闸风险测报。'],
 ['ning','这个现在不给。春潮将近，未核实的数字传出去，船主会提前停航，粮运也会断。'],
 ['hong','住在低处的人呢？'],['ning','测实以后统一通知。'],
 ['','红鹞看着被划掉的那一行，没有把凭照合上。宁玄也没有让步。'],
 ['','离开粮站时，乌衡站在楼梯拐角。银鸦的铜翅已经修好，抬起来发出细碎的声响。'],
 ['wuh','他跟你说什么了？'],['@','让我们看档案。'],
 ['wuh','（侧身让路）那就看仔细些。会主说的每句话，通常都是真的。'],
 {fx:{aff:{ning:5}}}
]});

/* 七 · 下潜 */
V3({t:'下潜',g:'潜',gap:1,lines:[
 ['','初一自己的检修记录，有半年的缺页。原件在旧所地下库，水淹以后没有搬出来。陈默记得那里：管线图、材料领取册和早期病区的机械记录，锁在同一排防水柜里。'],
 ['','初一留在船上，背着刚做好的冷却匣。匣子比想的笨重，肩带磨得疼，她却不许人替她背。她要试试一个人究竟能走到哪里，哪一步必须停。'],
 ['','沈湄掌船，红鹞守绳。你、陈默、萧尘各含一枚避水符，从二楼窗口下去。'],
 ['','水里漂着纸。有张灵潮前的儿童保健宣传图，图上的孩子咧嘴笑着，鼻尖停着一只透明的小虾。陈默每到拐角都摸一下墙，手伸到开关的位置，才想起灯早已不会亮。'],
 ['','地下库的门上伏着一只背甲长满铜锈的妖物，八条足扣住门框。它没有眼睛。萧尘最先退开——无名没有用，那东西凭水流和热息找猎物，根本不需要记住谁。'],
 ['','第一钳擦过陈默的脚，血在水里散成很细的一线。你想冻住门口的水，冰刚结就被咸水里的杂灵冲碎。'],
 ['mo','别跟水争。看它壳下。'],
 ['','【迎战：铜锈甲蟹。它每次挥钳，背甲下会露出白色软膜。】']
],after:()=>{v3Fight({title:'下潜',many:[{look:'鬼面蟹',name:'铜锈甲蟹',beast:1,st:S.stage+2,m:1.5,boss:true}],
  win:()=>{S.flags.v3Dive='win';wuAdd(5);return '金灵力凝进断裂的门栓，借水流推过去，刺进软膜。妖物猛地翻身。\n陈默拧开门边的手动泄压阀，萧尘用绳套住它一条钳足，把它拖进空着的电梯井。你放下了铁栅。\n避水符开始发烫。你撕掉最后一道柜锁，把整个小柜推向窗口，拖着陈默往上游。绳子收紧了——红鹞在水面另一头，一寸一寸把你们拉回去。\n初一蹲下来，替你取出嘴里化黑的符纸，递来凉水：“别急着说话。”\n档案只写她被治疗，没有写她照顾过谁。';},
  lose:()=>{S.flags.v3Dive='lose';return '你被它的钳足砸在门框上。是陈默拧开了泄压阀，水压一变，它被吸离门框。\n你们只抢出了一只小柜。避水符烫得发黑，红鹞一寸一寸把你们拉回去。\n初一替你取出嘴里的符纸，递来凉水：“别急着说话。”';}});}});

/* 八 · 旧驾驶室 */
V3({t:'旧驾驶室',g:'车',lines:[
 ['','从水下取出的柜子里，有一张车辆移交单。蓝色货车，右前撞角修焊，驾驶室内遗留搪瓷饭盒一只。时间在灵潮之后第九日。驾驶员一栏没有名字，只有手写的「祝师傅，见殓册」。'],
 ['hong','（把那张纸平放到桌上）殓册在哪？'],
 ['','是老陆来认的字。他看见「祝师傅」三个字，扶着椅背坐了下来。焊口、饭盒、日期都齐了，他没法再说也许。'],
 ['lu','车在北坡。我带你去。'],
 {bg:'overpass'},
 ['','驾驶室单独搁在坡上，没有轮子，蓝漆褪得发白。右边的焊口确实歪了一点。红鹞的指腹停在凸起的焊疤上。'],
 ['hong','我那次跟他吵架，说他修什么都图省事。'],
 ['lu','（摘下帽子）他来那天，车上坐了十八个人。公路断了，前头起雾，他把人往高处送。第二次水上来，他回去接滞在桥头的人。前轮掉进裂缝，他让人从后厢爬，我在另一边拉绳。最后那一下，横梁砸下来，他没出来。'],
 ['lu','两天后水退，我们把人抬出来，埋在北坡后面。那时候不知道家里还有谁，记了车号，照过一张相，想留给以后来找的人。'],
 ['','他递来一只油纸包。红鹞没有当着你们打开。她坐进空驾驶室，手搭在方向盘上。方向盘转不动了，她还用力转了一下，然后就那样坐着，背很直。'],
 ['','仪表台下有一道她小时候用小刀刻的线。她爸发现以后罚她擦车，又怕划到手，拿砂纸把边磨圆了。那道线还在。'],
 ['hong','（很小声）你不是说，等路修好了，带我跑海边么。'],
 ['','说完，她自己摇了一下头。那是很多年前的话。她父亲没有留下藏着答案的密信，没有做过什么别人不知道的大事。只是一次没能开回来的车，一句来不及兑现的话，和十八个后来各自去了别处的人。'],
 {c:[
  {t:'站在车外等',k:1,fx:{aff:{hong:10}},r:[['','她在驾驶室里坐到天快黑。']]},
  {t:'坐到副驾驶的滑轨上陪她',k:0,fx:{aff:{hong:5}},r:[['','她没有赶你，也没有说话。你们在空驾驶室里坐到天快黑。']]}
 ]},
 ['','出来时，她抱着那只旧饭盒。饭盒底下刻着「祝仲平」，旁边还有一个歪歪扭扭的小「遥」字，是她小时候坚持加上去的。'],
 ['hong','明天去看他。'],
 ['','她走了两步，又回头，把车门轻轻关上。']
]});

/* 九 · 潮声 */
V3({t:'潮声',g:'潮',gap:1,bg:'port',lines:[
 ['','北坡的坟没有碑。最初的木牌朽了，半截埋在泥里。老陆从殓册里找到位置，又叫来当年一起下葬的两个人。三个人走到同一个地方，谁都没再指向别处。'],
 ['','红鹞从废驾驶室旁取了一截结实的木板，锯好，刨平，自己刻字。最后一笔偏了，她盯着看，没磨掉重刻。'],
 ['hong','他自己写字也歪。'],
 ['','墓前没有酒。她拆开一小袋炒豆，放在饭盒盖里。祝仲平开长途时爱嚼这个，说能提神，吃多了又骂口干。'],
 ['','你把水放在她手边，走到坡下去等。她没有叫你一起留在墓前，你便没有把自己的陪伴变成另一个必须回应的东西。'],
 ['','坡下的石阶走到底，就能看见海。灰绿的水从视野尽头推过来，一层接一层。你看了许久，才发现自己根本找不到水结束的地方。'],
 ['hong','（下来，站到你身边，眼角还红，忽然笑了一下）原来这么吵。'],
 ['','青石站车顶上说起海时，你们都以为它宽阔、干净，也许很安静。真正走到这里，先闻到的是烂海草，脚下是碎贝壳，风把眼泪吹干，还会把盐留在嘴唇上。'],
 ['hong','（倒出一点炒豆递给你）我找了这么久，想的是找到他以后先骂他两句。没想过今天中午吃什么，明天车往哪里开。'],
 {c:[
  {t:'「中午旅店有饭。明天的事，你明天再想。」',k:1,fx:{aff:{hong:15},flags:{v3Sea:'live'}},r:[['hong','你倒是会过。'],['@','以前只能这么过。']]},
  {t:'「你还有我们。」',k:0,fx:{aff:{hong:8},flags:{v3Sea:'us'}},r:[['hong','……嗯。']]}
 ]},
 ['','她伸手把你的袖口卷下来，遮住还没长好的伤。'],
 ['hong','我以后还会来这儿。但不会一直待在这儿。'],
 ['','她的手在你袖口停了片刻，收回去了。你没有问那个将来里面有没有自己。你把没吃完的豆子拢回饭盒，盖好，递给她。'],
 {fn:()=>{try{if(F('v2HongEnd')==='trust'||avOf('hong')>=60)S.flags.hongSea=1;}catch(e){}}},
 ['','回城时，沈湄正把船往高处牵，眉头一直没松。'],
 ['shenm','今年的春潮来得早。'],
 ['','码头的水位尺上，一片刚才还露着的青苔，已经沉进了水里。']
]});

/* 十 · 三号阀 */
V3({t:'三号阀',g:'阀',kills:8,st:11,hint:'修到筑基七层，再到城外斩妖八只',lines:[
 ['','缺掉的半年记录，夹在一份旧管线图中间。它没有被藏进什么机关，只是整理的人见它背面也画着线，以为是废图。'],
 ['','记录显示：三号阀失灵以后，本该排进冷却池的杂灵，沿旁路回灌进了初一体内。她那一年突然更怕热、喘得更重，并不全是治疗必然的后果。闻策四个月后发现了异常，改了用药，没有告诉她原因。'],
 ['','检修记录上的最后签名，是陈默。'],
 ['chuyi','（背着冷却匣在医棚门口换潮灯的线，慢慢读完）你知道这些？'],
 ['cm','今天才知道具体是哪条路。'],['chuyi','可你知道它没修好。'],['cm','知道。'],
 ['chuyi','我去年写过一张纸，说治疗没用，别再浪费药。我以为是我自己撑不住。……修得回来吗？'],
 ['cm','阀能修。你身上的伤，我不知道。'],
 ['chuyi','那先别说会补偿。'],
 ['','她把纸夹进自己的小册子，接着修灯。过了一会儿问：「有没有更细的铜线？」陈默打开工具包，递过去一卷。接不接受这个人的帮助，和原不原谅他，是两件事。初一没有替他把两件事合在一起。'],
 {bg:'port'},
 ['','傍晚，所有人去了潮阵控制楼。早期图纸显示，港区原本有四条独立的缓冲支路，后来为了省灵材，合并成一条。初一体内的寒髓能感应细微的潮压，研究所就用她校准那条共同支路。每一次「常规复查」，实际上都在为全港调一次潮阵。'],
 ['ning','（在图纸前站了很久）合并的批复，是我签的。当时的申请写「保持同等稳定性，节出的灵材供普通病区过冬」。我只问了供多少床，没有问同等稳定性从哪里来。'],
 ['@','现在能接回去吗？'],
 ['cm','能。材料要从外墙的永久阵基上拆。拆了，内港以后就不能全年保住现在的水位。'],
 ['','楼下那些刚修好的铺子、悬在低处的菜园、每一家费力钉牢的门板，都会重新回到潮水能碰到的地方。'],
 ['','窗外，测潮铜盘响了一声。看盘的人抹去表面的水，脸色逐渐变白：预测的下一次大潮，提前了。前两日已经出现过偏差，送上去后被批作「继续复核」，没有传给船主和低区住户。宁玄认出了自己的批示。'],
 ['ning','（把两张纸交还）原测报一并挂出去。先挂，别等我的新批文。'],
 {fx:{aff:{ning:5}}}
]});

/* 十一 · 两个时辰以外 */
V3({t:'两个时辰以外',g:'时',lines:[
 ['','第一声警报响起时，港里的人没有立刻跑。春潮每年都来。许多人先关窗，给盆里的菜加绳子，再抱着孩子往高处走。等警报灯由黄变红，街上才忽然乱起来。'],
 ['','沈湄把航线画在一张湿木板上：避风坳在内河上游，抱孩子的人可以挤，担架不能叠，药不能全放一条船。能开船的人和能在涌潮里开船的人，不是同一个数。分到第三轮时，她的手停了——最慢的两条船来不及回来。'],
 ['','宁玄没有立刻下令。他把两个办法写在控制楼的墙上：按旧计划全力维持港区，保住大部分住屋，压力全压在老化的中枢；或者先拆外墙阵基重建副炉，撤离窗口缩短，低处的货场和房子很快保不住。'],
 ['','有人骂这时候还开会，也有人问：不让我们知道，等水来了才说吗。'],
 ['','初一站在人群外，背上的匣子发出很低的嗡声。她知道很多人在看她。'],
 ['wence','照旧法，你能延长窗口。'],['chuyi','多久？'],['wence','不好估计。'],
 ['chuyi','那不能写进撤离表。'],
 ['shenm','（直接把木板上那一块擦掉）按没有她来排。先知道最坏会剩下谁。'],
 ['','那句话让初一慢慢松开了握紧的手。'],
 ['','最坏的情形：放弃货船，只运人，拆掉低区浮桥借桥板做筏子。即便如此，第三轮船仍要顶着回流出去。多出的风险，不能靠写在某个人的身体上就算解决。'],
 {c:[
  {t:'去帮红鹞把老驴的柴油卸给备用泵',k:1,fx:{aff:{hong:5}},r:[['','红鹞把老驴开到高坡，卸下剩余的柴油，给车轮加了楔子。她没有向谁保证洪水过后这车一定还在。']]},
  {t:'去低区帮人拆门板',k:1,fx:{flags:{v3Low:1}},r:[['','一个老人站在水边看着自家门槛，半天不肯动。你和他的邻居一起卸下门板，抬上了船。']]}
 ]},
 ['','宁玄最终决定先拆外墙阵基。消息传下去时，低区有人摔了碗。那是他们这几年一块板一块板重新搭起来的地方。'],
 ['chuyi','（向陈默要了新副炉的图纸，指着一个接口）这里只测潮，不把回流接到我身上，能不能做？'],
 ['','陈默把管路分开画，闻策在旁边核算。半个时辰后，他们得出一个很窄的范围：初一可以自愿提供三次短测，每次不超过十息，帮新副炉定向；就算她中途停下，撤离也按原来的最坏方案继续。'],
 ['chuyi','断口留在我这边。红灯亮，我自己能拔。'],
 ['','她拿起工具，开始改那个扣子。'],
 {fx:{aff:{zero:10,cm:5}}}
]});

/* 十二 · 白脊（剧本写到这里） */
V3({t:'白脊',g:'脊',lines:[
 ['','傍晚，海雾忽然散开一道。不是风吹的。一道很长的背脊从水下浮起来，白色骨刺一节节露出，顺着外墙阵基泄出的灵息游过，身后拖着几道小一点的影子。'],
 ['shenm','熄灯！'],
 ['','装卸场的潮灯依次灭下去。白脊鲛没有走，它在通往内河的航道最窄处停了下来。它体内的灵气比你深得多，隔着码头，你都觉得五行堤被压住了。这里是它的海，后面还有群鲛。'],
 ['','第一轮船正要经过那里。'],
 ['','宁玄抽出一柄旧剑，刃上有几个细小缺口。他踏上水面，每一步都留下一个短暂的金色圆环。白脊追着那片金光抬头，巨大的水柱撞向他。他被震退，靴底在水面划出一道白线，又重新站稳。会主、商队、拾荒者，到了这里，仍得找一块能站住脚的地方。'],
 ['shenm','他只能引走大的。小的会追船底。'],
 ['hong','（解开一包旧线和小灯）灵核能不能分几次点亮，不是一下全烧掉？'],
 ['','你和墨老定下最简单的次序：木气先引，火气后亮，再用土气压住散开的尾息。一颗灵核装进漂浮的木匣，不是新法宝，只是会先后亮起的诱饵。'],
 ['shenm','（指着旧客运楼）那边水够深，离航道远。'],
 ['','广播仍在响：请前往南岛的旅客，到三号口验票。海浪盖过了后半句。'],

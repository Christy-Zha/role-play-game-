<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灵潮修仙录">
<meta name="theme-color" content="#16140f">
<title>灵潮修仙录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-screen phone game — status header, painted stage per tab, bottom tab rail; ink-and-ash wasteland. Single dark look by choice. */
:root{
  --bg:#16140f; --panel:#1f1c15; --panel2:#29251c; --line:#3a3427;
  --bone:#ece3cf; --mist:#c2b7a1; --dim:#b2a68f;
  --jade:#8fd6b5; --jade-d:#2c6652; --cin:#cf4a3c; --cin-d:#5e231d; --gold:#e3b862;
  --r-fan:#bdb5a4; --r-ling:#7cc6e3; --r-bao:#c9a0f0; --r-xian:#e3b862; --r-chuan:#ff9a4a;
  --good:#8fd6b5; --bad:#e0705f;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:dark;
}
html{height:100%;height:100dvh;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
b,.num{font-variant-numeric:tabular-nums}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 6px}
.who{min-width:0}
.who .nm{font-size:12px;color:var(--mist);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .rl{font-family:var(--f-brush);font-size:25px;line-height:1.1;white-space:nowrap}
.res{display:flex;gap:14px;text-align:right;flex-shrink:0}
.res .lbl{display:block;font-size:11px;color:var(--dim);letter-spacing:.12em}
.res b{font-size:15px}
#hStones{color:var(--gold)}
.qi{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.qif{height:100%;width:0;background:linear-gradient(90deg,var(--jade-d),var(--jade));transition:width .2s}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:12px 18px;-webkit-overflow-scrolling:touch;min-height:0}

.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);padding-block:5px 3px}
.tab{position:relative;background:none;border:0;padding:3px 0;display:flex;flex-direction:column;align-items:center;color:var(--dim);min-width:0}
.tab .g{font-family:var(--f-brush);font-size:23px;line-height:1.15}
.tab .l{font-size:10.5px;letter-spacing:.12em;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--jade)}
.tab:disabled{opacity:.5}
.dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--cin);box-shadow:0 0 8px var(--cin)}

h2.sec{font-family:var(--f-brush);font-weight:400;font-size:22px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;text-wrap:balance;flex-wrap:wrap}
h2.sec small{font-family:var(--f-body);font-size:12px;color:var(--dim);letter-spacing:.04em}
h2.sec:first-child{margin-top:0}
.btn{border:1px solid var(--jade);background:var(--jade-d);color:var(--bone);padding:9px 16px;border-radius:4px;font-size:15px;letter-spacing:.08em}
.btn:disabled{opacity:.38;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mist)}
.btn.red{background:var(--cin-d);border-color:var(--cin)}
.btn.gold{background:rgba(227,184,98,.08);border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:var(--jade);color:var(--bg)}

/* 画面舞台 */
.stage{position:relative;width:100%;border-radius:6px;overflow:hidden;background:#0d0c09;border:1px solid var(--line);isolation:isolate}
.stage>canvas.bgc{position:absolute;inset:0;width:100%;height:100%;display:block}
.cstage{aspect-ratio:1/1;max-height:54vh;margin-inline:auto}
.hp{height:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;transition:width .2s}
.hp.p i{background:linear-gradient(90deg,var(--jade-d),var(--jade))}
.hp.e i{background:linear-gradient(90deg,#8a2a20,var(--cin))}
.b.r .hp i{margin-left:auto}
.banner{display:flex;align-items:center;gap:12px;border:1px solid var(--cin);background:linear-gradient(90deg,rgba(207,74,60,.18),transparent);padding:10px 12px;border-radius:6px;margin-bottom:10px}
.banner .t{flex:1;font-size:14px}
.banner .t small{display:block;font-size:12px;color:var(--mist)}

/* 修炼 */
.cult{display:flex;flex-direction:column;align-items:center;text-align:center}
.cstage{width:100%;cursor:pointer;touch-action:manipulation}
.sit{position:absolute;left:50%;bottom:8%;width:44%;transform:translateX(-50%);pointer-events:none}
.sit img{width:100%;height:auto;display:block}
.ring{position:absolute;left:50%;bottom:8%;width:74%;aspect-ratio:1;transform:translateX(-50%);pointer-events:none}
.ring svg{width:100%;height:100%;overflow:visible}
.spin{transform-origin:100px 100px;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cstage.full .sit{filter:drop-shadow(0 0 14px rgba(227,184,98,.7))}
.plus{position:absolute;pointer-events:none;font-family:var(--f-brush);font-size:22px;color:#c8ffe6;animation:up .9s ease-out forwards;white-space:nowrap;text-shadow:0 2px 4px #000}
.cname{position:absolute;top:10px;left:0;right:0;font-family:var(--f-brush);font-size:30px;text-shadow:0 2px 8px #000}
.ctap{position:absolute;bottom:10px;left:0;right:0;font-size:12px;color:rgba(236,227,207,.7);text-shadow:0 1px 3px #000}
.qi-num{color:var(--mist);font-size:14px;margin-top:10px}
.qi-num b{color:var(--bone)}
.rates{display:flex;gap:18px;justify-content:center;font-size:13px;color:var(--mist)}
.rates b{color:var(--jade)}
.break{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel)}
.break .t{font-size:13px;color:var(--mist);margin-bottom:8px}
.break .t em{font-style:normal;color:var(--bone)}
.break .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.gate{color:var(--cin)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mist)}
.pill input{accent-color:var(--jade);width:18px;height:18px}
.tip{font-size:12px;color:var(--dim);margin-top:12px;max-width:30em}

/* 玉简 */
.jstage{aspect-ratio:16/9}
.jinfo{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;text-shadow:0 1px 3px #000}
.expo{width:46%}
.expo .l{font-size:12px;color:var(--bone)}
.expo .hp i{background:linear-gradient(90deg,#8a6a2a,var(--cin))}
.jslots{display:grid;gap:10px;margin-top:12px}
.jslot{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel);display:flex;gap:12px;align-items:center}
.jslot .ic{width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-family:var(--f-brush);font-size:24px;border:1px solid var(--jade-d);background:radial-gradient(circle,rgba(143,214,181,.18),transparent);color:var(--jade)}
.jslot.ready .ic{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(227,184,98,.4)}
.jslot .in{flex:1;min-width:0}
.jslot .nm{font-size:15px}
.jslot .sub{font-size:12px;color:var(--mist)}
.jslot .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.jslot .bar i{display:block;height:100%;background:var(--jade)}
.picker{border:1px dashed var(--jade-d);border-radius:6px;padding:8px 12px;margin-top:-4px}
.picker .row2:last-child{border-bottom:0}

/* 列表 */
.karma{font-size:13px;color:var(--mist);margin-bottom:12px}
.karma b{color:var(--bone)}
.ch{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ch .th{width:52px;height:38px;border-radius:4px;overflow:hidden;position:relative;background:#0d0c09;border:1px solid var(--line)}
.ch .th canvas{position:absolute;inset:0;width:100%;height:100%}
.ch .th span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-brush);font-size:20px;text-shadow:0 1px 4px #000}
.ch .ct{font-size:15px}
.ch .ch-h{font-size:12px;color:var(--dim)}
.ch.new .ct{color:var(--gold)}
.ch.lock .ct{color:var(--dim)}
.ch.lock .th{filter:grayscale(1) brightness(.35)}
.ch.side .ct{font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:6px;padding:10px 8px;background:var(--panel);min-width:0;min-height:86px}
.slot .sl{font-size:11px;color:var(--dim);letter-spacing:.15em}
.slot .sn{font-size:14px;line-height:1.35;margin:2px 0}
.slot .ss{font-size:11px;color:var(--mist);line-height:1.4}
.r-fan .iname,.r-fan .sn{color:var(--r-fan)}
.r-ling .iname,.r-ling .sn{color:var(--r-ling)}
.r-bao .iname,.r-bao .sn{color:var(--r-bao)}
.r-xian .iname,.r-xian .sn{color:var(--r-xian)}
.r-chuan .iname,.r-chuan .sn{color:var(--r-chuan)}
.row2{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row2 .in{flex:1;min-width:0}
.row2 .iname{font-size:15px}
.row2 .istat{font-size:12px;color:var(--mist)}
.row2 .ibtn{display:flex;gap:6px;flex-shrink:0}
.up{color:var(--good);font-size:11px;margin-left:4px}
.empty{color:var(--dim);font-size:13px;padding:14px 0}
.lv{font-size:12px;color:var(--jade);margin-left:6px}
.save textarea{width:100%;height:84px;background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;resize:vertical;-webkit-user-select:text;user-select:text}
.save .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:13px;color:var(--dim);margin:6px 0}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--line);color:var(--bone);font-size:13px;padding:7px 14px;border-radius:4px;max-width:440px;display:flex;gap:10px;align-items:center;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.big{border-color:var(--gold);color:var(--gold);font-family:var(--f-brush);font-size:20px}
.toast.bad{border-color:var(--cin)}
.toast.big2{border-color:var(--gold);color:var(--gold)}
.toast button{background:none;border:1px solid var(--jade);color:var(--jade);border-radius:3px;padding:2px 8px;font-size:12px}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* 视觉小说 */
#ov{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:rgba(10,8,6,.92)}
#ov.vn{background:#000}
#ov .vbg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .4s}
#ov .inner{position:relative;width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--bone);letter-spacing:.1em;text-shadow:0 1px 4px #000;position:relative;z-index:3}
.st-top .tt{font-family:var(--f-brush);font-size:20px}
.st-skip{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:var(--bone);border-radius:3px;padding:3px 10px;font-size:12px}
.st-sp{flex:1}
#ov .inner>.st-top,#ov .inner>.st-choices,#ov .inner>.st-box,#ov .inner>.modal,#ov .inner>.intro{flex-shrink:0}
.port{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);height:min(52vh,420px);aspect-ratio:200/240;transition:opacity .3s,transform .3s;pointer-events:none;z-index:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.port svg{width:100%;height:100%;display:block}
.port.l{left:-4%}
.port.r{right:-4%}
.port.hide{opacity:0}
.port.l.hide{transform:translateX(-12%)}
.port.r.hide{transform:translateX(12%)}
.port.dim{filter:brightness(.45) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.st-choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;position:relative;z-index:3}
.st-choices button{text-align:left;border:1px solid var(--jade);background:rgba(20,40,32,.88);color:var(--bone);padding:12px 14px;border-radius:4px;font-size:15px;animation:tin .3s ease-out both}
.st-box{position:relative;z-index:2;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(18,15,11,.88),rgba(10,8,6,.96));border-radius:6px;padding:12px 16px 18px;min-height:136px}
.st-s{position:absolute;top:-16px;left:14px;font-family:var(--f-brush);font-size:20px;line-height:1;color:var(--bg);background:var(--jade);padding:6px 14px 5px;border-radius:3px}
.st-s.cin{background:var(--cin);color:var(--bone)}
.st-s.gold{background:var(--gold)}
.st-x{font-size:16.5px;line-height:1.85;max-width:34em;white-space:pre-wrap;margin-top:8px}
.st-x.narr{color:#cfc6b2}
.st-more{position:absolute;right:12px;bottom:4px;color:var(--dim);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.modal{margin:auto 0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:22px 18px;text-align:center;position:relative;z-index:2}
.modal h3{font-family:var(--f-brush);font-weight:400;font-size:30px;margin:0 0 8px;color:var(--gold)}
.modal p{color:var(--mist);margin:6px 0;font-size:14px}
.modal p b{color:var(--bone)}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.intro{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:2}
.intro h1{font-family:var(--f-brush);font-weight:400;font-size:clamp(50px,17vw,80px);line-height:1;margin:0;text-shadow:0 4px 20px #000}
.intro h1 span{color:var(--jade)}
.intro p{color:#d8cfbb;margin:0;max-width:22em;font-size:14px;text-shadow:0 1px 4px #000}
.intro input{background:rgba(0,0,0,.4);border:0;border-bottom:1px solid var(--jade);color:var(--bone);font:inherit;font-size:20px;text-align:center;padding:6px;width:min(220px,80vw);-webkit-user-select:text;user-select:text}
.intro .yr{font-size:12px;letter-spacing:.3em;color:var(--mist)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:rgba(0,0,0,.4);border:0;padding:6px 18px;color:var(--mist)}
.seg button[aria-pressed="true"]{background:var(--jade-d);color:var(--bone)}

@media (prefers-reduced-motion:reduce){
  .spin,.st-more,.wl .mk{animation:none}
  .plus,.pt,.toast,.st-choices button,.healfx,.bpop{animation-duration:.01s}
}

.qcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.qcard.ready{border-color:var(--gold)}
.qcard .in{flex:1;min-width:0}
.qcard .iname{font-size:15px}
.qcard .istat{font-size:12px;color:var(--mist)}
.qcard .qp{color:var(--jade)}
@media (prefers-reduced-motion:reduce){.reach{animation:none}}


/* 江湖：等距地图 */
#view.full{padding:0;overflow:hidden;margin-left:calc(-1 * max(12px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(12px,env(safe-area-inset-right,0px)))}
.wv{position:relative;width:100%;height:100%;overflow:hidden;background:#050605}
#wc{touch-action:none}
.wv canvas,#bt canvas,.travel canvas{position:absolute;display:block}
.travel canvas{image-rendering:pixelated}
.wlab{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wl{position:absolute;left:0;top:0;width:0;height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;will-change:transform}
.wl span{white-space:nowrap}
.wl>span:not(.bub):not(.pl):not(.bn){font-size:11px;color:var(--bone);background:rgba(8,7,5,.7);border-radius:3px;padding:0 5px;line-height:1.5;text-shadow:0 1px 2px #000}
.wl .mk{width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:13px;line-height:18px;text-align:center;box-shadow:0 0 10px rgba(227,184,98,.8);animation:mkb 1.2s ease-in-out infinite;font-weight:700}
.wl .mk.rd{background:var(--jade);box-shadow:0 0 10px rgba(143,214,181,.8)}
@keyframes mkb{50%{translate:0 -3px}}
.wl .pl{font-size:10.5px;color:var(--jade);background:rgba(8,7,5,.72);border:1px solid rgba(143,214,181,.45);border-radius:10px;padding:0 7px;line-height:1.55}
.wl .pl.g{color:var(--gold);border-color:rgba(227,184,98,.6)}
.wl .bn{font-family:var(--f-brush);font-size:15px;color:#ff8a70;text-shadow:0 0 6px rgba(255,60,40,.7),0 1px 2px #000}
.wl .bub{font-size:12px;color:#1b1712;background:#ece3cf;border-radius:8px;padding:3px 9px;max-width:200px;white-space:normal;text-align:center;line-height:1.4;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.5);animation:tin .2s ease-out;width:max-content}
.wl .bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#ece3cf;border-bottom:0}
.wl.b{z-index:2}
.whud{position:absolute;top:8px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none;text-shadow:0 1px 3px #000;max-width:58%}
.wloc b{display:block;font-family:var(--f-brush);font-weight:400;font-size:22px;line-height:1.1}
.wloc small{font-size:11px;color:var(--mist)}
.wbars{display:grid;gap:3px;width:132px}
.wb{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mist)}
.wb>i,.bb>i{flex:1;display:block;height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.wb>i>i,.bb>i>i,.li .hb>i{display:block;height:100%;transition:width .25s}
.hb>i{background:linear-gradient(90deg,#3f8a5a,#9ae0a0)}
.mb>i{background:linear-gradient(90deg,#2e5a8a,#7cc6e3)}
.wmeds{font-size:10.5px;color:var(--mist)}
.wbtns{position:absolute;top:8px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-height:calc(100% - 52px);overflow-y:auto;touch-action:pan-y;padding-left:4px}
.wbtns .btn{background:rgba(20,40,32,.85);backdrop-filter:blur(2px);flex-shrink:0}
.wbtns .btn.ghost{background:rgba(10,8,6,.75)}

<script>
(function(){
/* ================= ART：场景、立绘、精灵 ================= */
const INK='#1b1712';
function rng(seed){let s=(seed*2654435761)>>>0||1;return ()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function lg(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,col])=>g.addColorStop(o,col));return g;}
function rg(c,x,y,r0,r1,st){const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach(([o,col])=>g.addColorStop(o,col));return g;}
function skyG(c,w,h,top,bot,mid){c.fillStyle=lg(c,0,0,0,h,mid?[[0,top],[.55,mid],[1,bot]]:[[0,top],[1,bot]]);c.fillRect(0,0,w,h);}
function ridge(c,w,h,base,amp,col,R,freq){freq=freq||2;c.beginPath();c.moveTo(0,h);const p=[R()*6,R()*6,R()*6];
  for(let x=0;x<=w+4;x+=4){const t=x/w;const y=base-amp*(.5+.3*Math.sin(t*freq*6.28+p[0])+.15*Math.sin(t*freq*2.3*6.28+p[1])+.08*Math.sin(t*freq*5.1*6.28+p[2]));c.lineTo(x,y);}
  c.lineTo(w,h);c.closePath();c.fillStyle=col;c.fill();}
function skyline(c,w,h,base,minH,maxH,col,R,o){o=o||{};let x=-10;const bwB=o.bw||w*.05;
  while(x<w+10){const bw=bwB+R()*bwB*1.6,bh=minH+R()*(maxH-minH);c.fillStyle=col;c.beginPath();c.moveTo(x,h);c.lineTo(x,base-bh);
    if(o.broken&&R()<.55){const n=3+Math.floor(R()*3);for(let i=1;i<=n;i++)c.lineTo(x+bw*i/n,base-bh+(R()-.25)*bh*.4);}else c.lineTo(x+bw,base-bh);
    c.lineTo(x+bw,h);c.closePath();c.fill();
    if(o.win){c.fillStyle=o.win;for(let wy=base-bh+8;wy<base-6;wy+=9)for(let wx=x+5;wx<x+bw-5;wx+=8)if(R()<(o.lit||.06))c.fillRect(wx,wy,3,4);}
    x+=bw+(o.gap?R()*o.gap:0);}}
function fog(c,w,y,hh,col){c.fillStyle=lg(c,0,y-hh,0,y+hh,[[0,'rgba(0,0,0,0)'],[.5,col],[1,'rgba(0,0,0,0)']]);c.fillRect(0,y-hh,w,hh*2);}
function motes(c,w,h,n,col,R,rmax,y0,y1){c.fillStyle=col;y0=y0||0;y1=y1||h;for(let i=0;i<n;i++){c.globalAlpha=.15+R()*.75;c.beginPath();c.arc(R()*w,y0+R()*(y1-y0),.5+R()*(rmax||2),0,6.283);c.fill();}c.globalAlpha=1;}
function vign(c,w,h,a){c.fillStyle=rg(c,w/2,h*.45,Math.min(w,h)*.25,Math.max(w,h)*.78,[[0,'rgba(0,0,0,0)'],[1,'rgba(6,5,3,'+(a||.6)+')']]);c.fillRect(0,0,w,h);}
function glow(c,x,y,r,col){c.fillStyle=rg(c,x,y,0,r,[[0,col],[1,'rgba(0,0,0,0)']]);c.fillRect(x-r,y-r,r*2,r*2);}
function person(c,x,y,s,col){c.fillStyle=col;c.beginPath();c.arc(x,y-s*.85,s*.16,0,6.283);c.fill();c.beginPath();c.moveTo(x-s*.22,y);c.quadraticCurveTo(x-s*.24,y-s*.66,x,y-s*.68);c.quadraticCurveTo(x+s*.24,y-s*.66,x+s*.22,y);c.fill();}
function arch(c,cx,by,wid,hei){c.beginPath();c.moveTo(cx-wid/2,by);c.lineTo(cx-wid/2,by-hei*.5);c.quadraticCurveTo(cx-wid/2,by-hei,cx,by-hei);c.quadraticCurveTo(cx+wid/2,by-hei,cx+wid/2,by-hei*.5);c.lineTo(cx+wid/2,by);c.closePath();}
function mix(a,b,t){const pa=a.match(/\w\w/g).map(x=>parseInt(x,16)),pb=b.match(/\w\w/g).map(x=>parseInt(x,16));return 'rgb('+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')+')';}

const SCN={
 sky(c,w,h,R){skyG(c,w,h,'#07100f','#26352e','#12201c');
  const cx=w*.56;glow(c,cx,h*.18,h*.75,'rgba(143,214,181,.32)');glow(c,cx,h*.1,h*.3,'rgba(220,255,240,.35)');

  c.shadowColor='#8fd6b5';c.shadowBlur=40;c.fillStyle='#effff8';c.fill();c.shadowBlur=0;
  c.strokeStyle='rgba(200,255,230,.18)';c.lineWidth=2;for(let i=0;i<9;i++){c.beginPath();c.moveTo(cx+(R()-.5)*20,h*.15);c.lineTo(cx+(R()-.5)*w*1.2,h);c.stroke();}

  skyline(c,w,h,h*.8,h*.12,h*.42,'#17221e',R,{broken:1,bw:w*.04});
  skyline(c,w,h,h*.9,h*.05,h*.26,'#0c1210',R,{broken:1,win:'rgba(240,190,110,.5)',lit:.03});
  c.fillStyle='#080b0a';c.fillRect(0,h*.92,w,h);vign(c,w,h,.5);},
 shelter(c,w,h,R){skyG(c,w,h,'#0e1210','#1a1e19');
  c.fillStyle='#232823';c.beginPath();c.moveTo(0,h*.78);c.lineTo(0,h*.32);c.quadraticCurveTo(w/2,-h*.18,w,h*.32);c.lineTo(w,h*.78);c.fill();
  c.strokeStyle='rgba(255,255,255,.04)';c.lineWidth=1;for(let x=0;x<w;x+=Math.max(10,w/30)){c.beginPath();c.moveTo(x,h*.05);c.lineTo(x,h*.74);c.stroke();}
  for(let y=h*.12;y<h*.74;y+=h*.06){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}
  c.fillStyle='#244236';c.fillRect(w*.37,h*.17,w*.26,h*.08);c.strokeStyle='#4f8a73';c.lineWidth=2;c.strokeRect(w*.37,h*.17,w*.26,h*.08);
  c.fillStyle='#d6eee2';c.font=Math.round(h*.05)+'px "Ma Shan Zheng","Noto Serif SC",serif';c.textAlign='center';c.textBaseline='middle';c.fillText('青 石 站',w*.5,h*.212);
  c.strokeStyle='rgba(60,50,40,.9)';c.lineWidth=1.5;c.beginPath();c.moveTo(0,h*.33);for(let i=0;i<=8;i++)c.quadraticCurveTo(w*(i/8-.06),h*.4,w*i/8,h*.34);c.stroke();
  for(let i=0;i<8;i++){const lx=w*(.06+i*.125),ly=h*.375;glow(c,lx,ly,h*.16,'rgba(240,160,80,.22)');c.fillStyle='#f3b766';c.beginPath();c.arc(lx,ly,Math.max(2,h*.013),0,6.28);c.fill();}
  c.fillStyle='#141814';c.fillRect(0,h*.74,w,h);c.fillStyle='#2b302a';c.fillRect(0,h*.74,w,h*.014);
  const cols=['#4a4436','#3b4a44','#5a3b32','#454a52','#52482e'];
  for(let i=0;i<7;i++){const tx=R()*w,tw=w*(.09+R()*.09),th=h*(.13+R()*.07),by=h*(.77+R()*.04);c.fillStyle=cols[i%5];c.beginPath();c.moveTo(tx-tw/2,by);c.lineTo(tx,by-th);c.lineTo(tx+tw/2,by);c.fill();
    c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.moveTo(tx,by-th);c.lineTo(tx+tw/2,by);c.lineTo(tx+tw*.08,by);c.fill();}
  for(let i=0;i<4;i++){const bx=R()*w,bs=h*(.05+R()*.04);c.fillStyle='#3a3226';c.fillRect(bx,h*.86-bs,bs*1.3,bs);c.strokeStyle='#241e16';c.strokeRect(bx,h*.86-bs,bs*1.3,bs);}
  glow(c,w*.3,h*.86,h*.18,'rgba(255,140,60,.18)');
  for(let i=0;i<6;i++)person(c,R()*w,h*(.84+R()*.1),h*.1,'#090b09');
  vign(c,w,h,.65);},
 metro(c,w,h,R){c.fillStyle='#050707';c.fillRect(0,0,w,h);const vx=w*.5,vy=h*.5;
  for(let i=0;i<11;i++){const s=Math.pow(.78,i),wid=w*1.4*s,hei=h*1.35*s,by=vy+h*.62*s;arch(c,vx,by,wid,hei);
    c.fillStyle=mix('#1d2a27','#040606',i/10);c.fill();c.strokeStyle='rgba(120,160,150,'+(.18-i*.014)+')';c.lineWidth=Math.max(1,3*s);c.stroke();
    if(i>0&&i<8){const ly=by-hei*.48;[vx-wid*.47,vx+wid*.47].forEach(lx=>{glow(c,lx,ly,h*.12*s+4,'rgba(110,210,190,.25)');c.fillStyle='#a8f0dd';c.fillRect(lx-2*s-1,ly-1,4*s+2,2*s+2);});}}
  c.strokeStyle='#3a4643';c.lineWidth=3;[[.28,-.012],[.72,.012]].forEach(([x,d])=>{c.beginPath();c.moveTo(w*x,h);c.lineTo(vx+w*d,vy+h*.02);c.stroke();});
  c.lineWidth=2;c.strokeStyle='#202826';for(let i=1;i<9;i++){const t=Math.pow(i/9,1.8),y=vy+h*.02+(h-vy)*t,hw=(w*.22)*t+3;c.beginPath();c.moveTo(vx-hw*1.05,y);c.lineTo(vx+hw*1.05,y);c.stroke();}
  c.fillStyle='rgba(110,190,180,.10)';for(let i=0;i<5;i++){c.beginPath();c.ellipse(R()*w,h*(.85+R()*.12),w*(.05+R()*.08),h*.012,0,0,6.28);c.fill();}
  for(let i=0;i<4;i++){const ex=vx+(R()-.5)*w*.22,ey=vy-h*.02+(R()-.5)*h*.08;c.fillStyle='#ff4a3a';c.shadowColor='#ff3020';c.shadowBlur=6;c.beginPath();c.arc(ex,ey,1.6,0,6.28);c.arc(ex+5,ey,1.6,0,6.28);c.fill();c.shadowBlur=0;}

 overpass(c,w,h,R){skyG(c,w,h,'#24161a','#d07a42','#7a3a2c');
  glow(c,w*.72,h*.62,h*.6,'rgba(255,190,120,.35)');c.fillStyle='#ffd9a8';c.beginPath();c.arc(w*.72,h*.62,h*.09,0,6.28);c.fill();

  c.beginPath();c.moveTo(w*.6,h*.46);c.lineTo(w+10,h*.4);c.lineTo(w+10,h*.49);c.lineTo(w*.62,h*.53);c.lineTo(w*.58,h*.5);c.fill();
  [.06,.24,.4,.7,.88].forEach(px=>{const top=px<.5?h*(.465+px*.04):h*(.5-(px-.6)*.12);c.fillRect(w*px-w*.018,top,w*.036,h);});
  c.strokeStyle=dk;c.lineWidth=2;for(let i=0;i<7;i++){c.beginPath();c.moveTo(w*.45,h*(.44+i*.008));c.lineTo(w*(.47+R()*.04),h*(.43+i*.02+R()*.03));c.stroke();c.beginPath();c.moveTo(w*.61,h*(.47+i*.008));c.lineTo(w*(.58-R()*.04),h*(.46+i*.02+R()*.03));c.stroke();}

 const cv=g.canvas();o={cv,ax:cx+(D.organic?1:0),ay:by+(D.organic?1:0),w:cv.width,h:cv.height,tall:H>46};PCC.set(id,o);return o;}

const SPK={mo:'墨老',tie:'铁叔',he:'阿禾',hong:'红姐',zero:'零号',zhou:'周烈',zhou2:'周烈',tq:'天穹会执事',sx:'堕仙'};
const F=k=>!!(S.flags&&S.flags[k]);
const STORY=[
 {id:'prologue',title:'序章·灵潮',g:'潮',bg:'leijie',cond:()=>true,hint:'',lines:[
  {fn:()=>cgShow('dujie')},
  ['','很多年以后，你站在九霄雷劫之下。'],
  ['','第九道雷落下来之前，你回头看了一眼人间——那座叫「青石」的城，灯火还亮着。'],
  ['','你想起了一切开始的那一天。想起那块只有一半的玉。想起那个永远比你快半步的人。'],
  {bg:'sky'},{fn:()=>cgShow('lingchao')},
  ['','二〇四九年七月，天空裂开了一道口子。'],
  ['','裂缝里流出来的光，后来被叫作“灵潮”。沉睡了三千年的灵气，一夜之间灌回了人间。'],
  ['','城市塌了。草木疯长成林，野兽长出獠牙和鳞甲，开始吃人。'],
  {bg:'shelter'},
  ['','三年后。地铁七号线，青石站。两百多个活下来的人挤在站台上。'],
  ['tie','{name}，今天轮到你去B出口拾荒。天黑前必须回来，听见没有？'],
  ['zhou','铁叔，让这个拾荒的去有什么用？上回背回来半袋土豆，一半是烂的。'],
  ['zhou','我周烈一个人，一天能打三只变异鼠。你呢？'],
  ['tie','周烈，少说两句。'],
  ['','周烈是站里第一个觉醒灵根的人。他说话的时候，掌心有一簇火苗在跳。'],
  {bg:'metro'},
  ['','B出口的检票闸塌了一半。你在碎水泥下面，摸到一块冰凉的东西。'],
  ['','一枚青色的玉简，表面爬满了裂纹——只有半块。断口很新，像是刚刚才被人掰开。'],
  ['','指尖碰到它的瞬间，一个苍老的声音直接在你脑子里响了起来。'],
  ['mo','……三百年了。总算等到一个有灵根的娃娃。'],
  ['@','谁？谁在说话？'],
  ['mo','别怕。老夫姓墨，你叫我墨老就行。'],
  ['mo','……另外半块呢？'],
  ['','你回过头。隧道深处，有个人影一闪而过，手里有一点和你掌心一样的青光。'],
  ['mo','……算了。先活下去。'],
  ['mo','你身上是五行杂灵根。按老规矩，是最差的那一等。'],
  ['mo','可老夫当年见过的天才，大多死在了半路上。灵根好坏，从来不是修行的全部。'],
  {c:[
   {t:'「我凭什么信你？」',k:0,r:[['mo','不信也行。等变异鼠钻进避难所那天，你再来求我。'],['','你没有扔掉玉简。']]},
   {t:'「教我。我要护住站里的人。」',k:1,r:[['mo','好。心里有要护的人，道心就稳。']]},
   {t:'「修仙，能让我比周烈还强吗？」',k:-1,r:[['mo','哈哈哈哈。比他强？那是最不值钱的目标。不过，有野心是好事。']]}
  ]},
  ['mo','先学《吐纳术》。闭眼，呼吸，去找空气里那些游动的光点。'],
  ['','你第一次看见了灵气。它们像萤火，绕着你的指尖打转，然后钻进了你的身体。'],
  ['','【「江湖」页：点地面行走，点人物交谈，从站台东头的楼梯出站探索；碰到妖兽会进入回合制战斗。修为靠历练和丹药：打妖兽、做委托直接涨修为；服下聚气丹得药力，到「修炼」页点画面炼化。每三层一道瓶颈要去闯关，跨大境界要亲手冲关。】']
 ]},
 {id:'mock',title:'第一章·粥棚',g:'粥',bg:'shelter',cond:()=>S.stage>=2,hint:'修炼至炼气三层',lines:[
  ['','晚上七点，站台尽头的粥棚前排着长队。每人一勺稀粥，半块压缩饼干。'],
  ['zhou','哟，拾荒的回来了。'],
  ['','周烈从队伍前面走过来，一脚踢翻了你手里的碗。'],
  ['zhou','听说你最近天天躲在通风道里打坐？学我修仙？'],
  ['zhou','灵根这东西，有就是有，没有就是没有。你这种人，一辈子就是捡破烂的命。'],
  ['','周围有人笑了，也有人别过脸去。'],
  ['mo','这小子是火灵根，单灵根，资质不错。可惜心浮气躁，底子打得太急。'],
  {c:[
   {t:'捡起饼干，一句话也不说',k:1,fx:{flags:{endure:1}},r:[['','你弯腰把饼干捡起来，拍掉上面的灰。'],['zhou','……没劲。'],['mo','能忍，好。忍不是怕，是还没到时候。']]},
   {t:'「三个月。三个月后，你会把碗捡起来还我。」',k:0,fx:{flags:{vow:1}},r:[['zhou','哈！行，我等着。'],['','周烈走了。他掌心的火苗跳得更凶了。'],['mo','话放出去了，就得做到。']]},
   {t:'一拳砸在他脸上',k:-1,fx:{flags:{punch:1}},r:[['','你的拳头比你想的还快。周烈踉跄了两步，鼻血流了下来。'],['zhou','你……你找死！'],['tie','都给我住手！'],['','铁叔把你们拉开。周烈盯着你，眼神像要吃人。']]}
  ]}
 ]},
 {id:'ahe',title:'第二章·阿禾',g:'禾',bg:'shelter',cond:()=>S.stage>=4,hint:'修炼至炼气五层',lines:[
  ['','你回到站台时，铁叔在通风口下面等你，脸色很难看。'],
  ['tie','阿禾烧了两天了。不是普通的烧，她身上在冒蓝光。'],
  ['','帐篷里，七岁的阿禾缩在毯子下面。她的手背上，细细的血管泛着荧蓝。'],
  ['tie','她妈妈去年冬天出去找药，再也没回来。这孩子要是再出事……'],
  ['mo','灵毒入体。这么小的娃娃扛不住浓灵气，经脉会被撑裂。'],
  ['mo','以你现在的修为，可以渡一缕灵气进去，把毒引出来。代价是你丹田里的灵气要散掉一半。'],
  ['he','{bro}……我是不是要变成外面那些怪物了？'],
  {c:[
   {t:'渡灵气给她',k:1,fx:{qiMul:.5,pills:1,flags:{saveHe:1}},r:[['','你握住她的手腕，把丹田里的灵气一点一点渡过去。蓝光熄了。'],['he','……不烫了。{bro}的手好暖。'],['mo','修为丢了还能再修，人丢了就没了。这颗破境丹，算老夫给你的。'],['','获得 破境丹 ×1']]},
   {t:'「我先去隧道深处猎妖，换药回来」',k:-1,fx:{stones:30},r:[['','你把阿禾交给铁叔，独自下了隧道。'],['','你带回了药，还有一袋多出来的灵石。阿禾的烧退了，可她看你的眼神里，多了一点害怕。'],['','获得 灵石 ×30']]}
  ]}
 ]},
 {id:'dongtian',title:'第三章·玉简洞天',g:'玉',bg:'shelter',cond:()=>S.stage>=6||S.kills[0]>=6,hint:'修炼至炼气七层，或在地铁站斩妖六只',lines:[
  ['','这天夜里，贴身放着的玉简烫得厉害。'],
  ['mo','闭眼。进来。'],
  {bg:'dongtian'},
  ['','你眼前一黑，再睁眼时，站在一片青色的雾里。脚下是一座悬空的小岛，岛中央立着一方玉台。'],
  ['mo','这是玉简里的洞天。三百年前，老夫靠它温养丹药。'],
  ['mo','东西放上玉台，借洞天的灵气慢慢养着。丹药一颗变两颗，兵器脱胎换骨，灵石也会自己长。'],
  ['@','这么好的东西，为什么现在才告诉我？'],
  ['mo','因为你之前太弱，养不起它。洞天要靠持有者的修为才转得动。'],
  ['mo','还有一件事，你给我记牢了。'],
  ['mo','洞天每转一次，都会漏出一丝灵光。漏得多了，会被人闻到味道。'],
  ['mo','这世上，有人专门在找这种味道。'],
  {fx:{qiPills:2,flags:{dongtian:1}}},
  ['','获得 聚气丹 ×2'],
  ['','【「玉简」已开启：放入丹药、装备或灵石温养，按现实时间成熟。每次收取都会让灵光外泄。】']
 ]},
 {id:'ratking',title:'第四章·鼠王',g:'王',bg:'metro',cond:()=>S.bossDown.includes(0),hint:'击败「鼠王·裂齿」',lines:[
  ['','鼠王倒下的时候，整条隧道都安静了。'],
  {bg:'shelter'},
  ['','你拖着鼠王的獠牙回到青石站。站台上没有一个人说话。'],

  ['tie','{name}，从今天起，你就是青石站的仙师。'],
  ['he','{bro}好厉害！'],
  ['','人群后面，周烈的脸涨得通红。'],
  ['zhou','一只老鼠而已，谁杀不了？'],
  ['zhou','敢不敢跟我打一场？就在站台上，让大家都看看，谁才是青石站最强的。'],
  {c:[

  ]},
  ['mo','这小子底子是虚的。打他，别留情，也别下死手。'],
  ['','【约战：周烈。他在青石站的站台中央等你，走过去和他说话即可迎战。】']
 ],after:()=>{S.special='zhou';}},
 {id:'zhouleave',title:'第五章·你等着',g:'烈',bg:'shelter',cond:()=>F('duel_zhou'),hint:'约战中击败周烈',lines:[
  ['','周烈跪在站台的水泥地上。掌心的火苗，灭了。'],
  ['zhou','……不可能。你明明是杂灵根。'],
  ['',()=>F('vow')?'你把一只空碗放在他面前。三个月前，他踢翻的就是这只。':F('endure')?'你什么都没说，转身去扶被震倒的帐篷。':'你看着他。上一回，是他看着你。'],
  ['zhou','你等着。'],
  ['','当天夜里，周烈背着包离开了青石站。没人知道他去了哪里。'],
  ['tie','由他去吧。这世道，有本事的人留不住。'],
  ['mo','……那小子走的时候，眼神不对。'],
  ['mo','好了。往北走，锈蚀高架上有一支商队，专门倒卖妖兽材料。你要筑基，得去那里换资源。'],
  {fx:{pills:1,stones:40}},
  ['','铁叔塞给你一个布包。获得 破境丹 ×1、灵石 ×40。']
 ]},
 {id:'z1',title:'行路·锈蚀高架',g:'桥',bg:'overpass',side:1,cond:()=>S.visited.includes(1),hint:'前往锈蚀高架',lines:[
  ['','断掉的高架桥悬在半空，像一条被斩断的龙。'],
  ['','桥墩上挂着锈透的汽车。风一吹，钢筋就嗡嗡地响，像有人在远处吹哨。'],

 {id:'caravan',title:'第六章·锈色商队',g:'商',bg:'overpass',cond:()=>S.bossDown.includes(1),hint:'击败「钢骨百足」',lines:[
  ['','钢骨百足的尸体卡在两段断桥之间。几辆改装卡车从桥另一头的灰尘里开了出来。'],
  ['hong','好身手。我是红姐，红鹞商队管事的。那条百足的甲壳，卖不卖？'],
  ['hong','顺便提醒你一句。你这种身上带灵光的人，天黑以后最好别落单。'],
  ['hong','有一伙人叫“天穹会”，专抓有灵根的活人。听说是拿去炼丹。'],
  ['hong','前几天我还看见一个小子，手上冒火，跟着他们的人走了。'],
  ['@','……周烈。'],
  ['mo','天穹会。他们居然还在。'],
  {c:[
   {t:'把玉简的事告诉红姐',k:1,fx:{stones:120,flags:{trustHong:1}},r:[['hong','带着前辈残魂的玉简？你心可真大。行，这份信任我记下了。'],['hong','以后在我这儿买东西，给你打九折。'],['','获得 灵石 ×120']]},
   {t:'什么都不说，卖掉甲壳就走',k:0,fx:{stones:80},r:[['hong','嘴严是好事。这世道，嘴严的人活得久。'],['','获得 灵石 ×80']]}
  ]},
  ['','卡车开远了。你问墨老天穹会是什么，他很久都没有回答。']
 ]},
 {id:'exposed',title:'第七章·灵光',g:'眼',bg:'shelter',cond:()=>F('dongtian')&&S.expo>=100,hint:'温养时灵光外泄满盈',lines:[
  ['','你从洞天里取出温养好的东西时，玉简的裂纹里漏出一缕青光，直冲隧道顶。'],
  ['mo','糟了。'],

  ['tq','天穹会只找一个人。身上带着洞天法宝的那一位。'],
  ['','执事身后站着一个人。他脸上戴着半张白色面具，面具中间，画着一只眼睛。'],
  ['zhou2','好久不见啊，拾荒的。'],
  ['@','周烈？'],
  ['zhou2','天穹会给了我新的功法。现在，该轮到你跪了。'],
  {c:[
   {t:'「冲我来，别碰站里的人。」',k:1},
   {t:'「上次没打够？」',k:0},
   {t:'「正好。你的灵根，我也拿来温养一下。」',k:-1}
  ]},
  ['','【迎战：天穹追兵。追兵就在青石站站台东侧，走过去迎战。】']
 ],after:()=>{S.special='hunter';}},
 {id:'hunted',title:'第八章·面具',g:'面',bg:'shelter',cond:()=>F('hunter1'),hint:'击退天穹追兵',lines:[
  ['','面具裂成了两半。周烈捂着脸，退进了黑暗的隧道里。'],
  ['zhou2','天穹会不会放过你的。你那块玉简，长老们找了三百年。'],
  ['','他走了。那个执事，早就不见了。'],
  ['@','墨老，你认识天穹会？'],
  ['mo','……以后再说。'],
  ['mo','从今往后，洞天少用。用了，就别怕他们找上门。'],
  ['','【灵光外泄满盈后，天穹追兵会再次找上门，击退即可清零。修习「敛息诀」能减少外泄。】']
 ]},
 {id:'z2',title:'行路·旧城妖林',g:'林',bg:'forest',side:1,cond:()=>S.visited.includes(2),hint:'前往旧城妖林',lines:[
  ['','人民公园不见了。原地长出一片你叫不出名字的森林，树干粗得十个人都抱不过来。'],
  ['','一栋商场被藤蔓整个吞了下去，橱窗里还摆着三年前的假人。'],
  ['mo','这里的灵气……太浓了。浓得不对劲。']
 ]},
 {id:'locust',title:'第九章·槐下旧事',g:'槐',bg:'forest',cond:()=>S.bossDown.includes(2),hint:'击败「千年槐妖」',lines:[
  ['','千年槐妖的根系一寸寸枯死，露出埋在地下的一块石碑。'],
  ['','碑上刻着一个篆字：墨。'],
  ['mo','……'],
  ['mo','这棵槐树，是老夫三百年前亲手种下的。'],
  ['mo','那时候这里还是一座道观，叫太一观。我和师兄常在树下论道。'],
  ['mo','师兄说，修仙不该只是少数人的事。他想让天下人都能修。'],
  ['mo','我信了他。然后我们一起，做了一件蠢事。'],
  ['','他没有再说下去。玉简上的裂纹，好像又深了一点。'],
  {fx:{pills:1}},
  ['','你在石碑下找到一个陶罐。获得 破境丹 ×1。']
 ]},
 {id:'zhuji',title:'第十章·筑基',g:'基',bg:'shelter',cond:()=>S.stage>=9,hint:'突破至筑基期',lines:[
  ['','灵气在丹田里旋转、压缩，最后凝成一座看不见的台基。你筑基了。'],
  ['mo','好。从今天起，你才算真正踏上了这条路。'],
  ['','你回到青石站时，站台上摆了一桌菜。说是一桌，其实是几个罐头和一锅野菜汤。'],
  ['tie','站里的人凑的。别嫌寒碜。'],
  ['he','{bro}，这个给你！'],
  ['','阿禾塞给你一个歪歪扭扭的平安结，红绳编的，还缠着一根她自己的头发。'],
  ['he','我编了好几天。戴着它，就不会受伤了。'],
  {fx:{gift:'平安结'}},
  ['','获得 佩饰「平安结」。']
 ]},
 {id:'z3',title:'行路·沉没港口',g:'港',bg:'port',side:1,cond:()=>S.visited.includes(3),hint:'前往沉没港口',lines:[
  ['','海平面涨了十米。原来的港口只剩下吊机的上半截，从雾里伸出来。'],
  ['','雾里有船灯在晃。可这一带，早就没有渔船了。'],
  ['mo','那盏灯……是白色的。']
 ]},
 {id:'port',title:'第十一章·雾港',g:'雾',bg:'port',cond:()=>S.bossDown.includes(3),hint:'击败「海眼蛟」',lines:[
  ['','海眼蛟沉下去之后，雾散了。港口里停着一艘挂白旗的船。'],
  ['','旗上是一只眼睛，天穹会的标记。船舱里关着二十几个人，手腕上都烙着编号。'],
  ['','你认出了其中一个。是阿禾的妈妈，李婶。去年冬天，她出门找药，就再也没回来。'],
  ['mo','他们在收集灵根。船上那几箱灵石，够你修很久。'],
  ['mo','船员马上就回来了。你只来得及做一件事。'],

 {id:'jindan',title:'第十二章·金丹',g:'丹',bg:'dongtian',cond:()=>S.stage>=13,hint:'突破至金丹期',lines:[

  ['mo','金丹成了。三百年前，太一观里能结丹的，不超过十个人。'],
  ['@','那你师兄呢？'],

 {id:'z4',title:'行路·坠星研究所',g:'星',bg:'lab',side:1,cond:()=>S.visited.includes(4),hint:'前往坠星研究所',lines:[

 {id:'zero',title:'第十三章·零号',g:'零',bg:'lab',cond:()=>S.bossDown.includes(4),hint:'击败「零号」',lines:[

  ['zero','你……打赢了我。'],
  ['zero','天穹会造了我。他们想用我当钥匙，打开灵源。'],
  ['zero','我不想当钥匙。可除了这个，我没有别的用处。'],

   {t:'吞噬金丹',k:-2,fx:{qiFill:1},r:[['','光熄灭了。那股力量冲进你的经脉，滚烫，发苦。'],['mo','……你终究还是走了这条路。'],['','丹田灵气已满。']]}

 {id:'z5',title:'行路·天坑',g:'坑',bg:'pit',side:1,cond:()=>S.visited.includes(5),hint:'前往天坑',lines:[
  ['','市中心塌出了一个直径两公里的坑。坑底在发光，像一只烧红的眼睛。'],

 {id:'zhoufate',title:'第十四章·火灭',g:'灰',bg:'pit',cond:()=>F('hunter1')&&S.kills[5]>=5,hint:'击退天穹追兵后，在天坑斩妖五只',lines:[
  ['','坑壁上的一处岩洞里，你找到了周烈。'],
  ['','他的半边身体已经变成了石头，裂缝里渗着天坑的红光。面具碎了一地。'],
  ['zhou2','……哈。拾荒的。'],
  ['zhou2','天穹会给的功法，是拿人当炉子烧的。我才是那颗被炼的丹。'],
  ['zhou2','我输给你一次，他们就把我扔进了这里。'],
  ['mo','他的灵根快烧干了。要救，得耗你大半灵气；不救，他撑不过今晚。'],
  {c:[
   {t:'救他',k:2,fx:{qiMul:.4,flags:{zhouSaved:1}},r:[['','你把手按在他胸口，把灵气一点点渡过去。石化停了。'],['zhou2','……为什么？我以前那样对你。'],['@','因为青石站的人，不该死在这种地方。'],['','周烈没再说话。很久以后，他低声说了一句：“谢了。”']]},
   {t:'给他一个痛快',k:0,r:[['','你拔出剑。周烈闭上了眼睛。'],['zhou2','……挺好。比烧干了强。'],['','你在坑边给他堆了一座石头坟。']]},
   {t:'吸走他残余的火灵根',k:-2,fx:{qiFill:1},r:[['','火灵根离体的时候，他叫了一声，然后就安静了。'],['mo','……'],['','丹田灵气已满。玉简一整夜都没有再说话。']]}
  ]}
 ]},
 {id:'fallen',title:'第十五章·堕仙',g:'堕',bg:'pit',cond:()=>S.bossDown.includes(5),hint:'击败「堕仙残躯」',lines:[

  ['mo','师兄……'],
  ['sx','……墨……师弟……'],
  ['sx','灵源……关不上了……'],
  ['','他的身体碎成了灰。'],
  ['mo','{name}，是时候告诉你了。'],
  ['mo','三百年前，我和师兄想把灵源里的灵气引出来，分给天下人。'],
  ['mo','我们失败了。灵源反噬，师兄成了堕仙，我只剩一缕残魂，被封进了玉简。'],
  ['mo','我们留下的封印撑了三百年。二〇四九年，它裂开了。'],
  ['mo','天穹会，就是当年师兄的门人。他们想做完他没做完的事。'],
  ['mo','灵潮，是我们闯的祸。'],
  {c:[
   {t:'「你想补救，我就陪你走完」',k:1,r:[['mo','……谢谢你，娃娃。']]},
   {t:'「那些死掉的人，你拿什么还？」',k:0,r:[['mo','还不了。所以我才要你走到最后。']]},
   {t:'「那灵源，就由我来拿」',k:-1,r:[['mo','你和当年的我，真像。']]}
  ]}
 ]},
 {id:'z6',title:'行路·灵源核心',g:'源',bg:'core',side:1,cond:()=>S.visited.includes(6),hint:'前往灵源核心',lines:[
  ['','空气浓得像水。每呼吸一口，丹田都在发烫。'],
  ['','碎石悬在半空，绕着一道通天的光柱慢慢转动。'],
  ['',()=>F('zeroSaved')?'光柱下面站着一个白发的身影。零号回过头，朝你点了点头：“我来带路。”':'光柱下面空无一人。你突然有点想念那个白头发的少女，虽然你没能留住她。'],
  {fx:()=>F('zeroSaved')?{stones:Math.ceil(4*Math.pow(2.6,6))}:null},
  ['',()=>F('zeroSaved')?'零号把一袋灵石塞给你：“天穹会的仓库，我知道在哪。”':'你握紧剑，独自走了进去。']
 ]},
 {id:'finale',title:'终章·灵源',g:'源',bg:'core',cond:()=>S.bossDown.includes(6),hint:'击败「灵潮之主」',lines:[
  ['','灵潮之主化作光尘。灵源就在你面前，像一颗跳动的心脏。'],
  ['mo','走到这一步了。封了它，灵气会慢慢退去，世界会变回原样。'],
  ['mo','或者，你可以成为它的主人。'],
  {c:[
   {t:'封印灵源',k:1,r:[['','你把手按在灵源上。墨老的残魂从玉简里飘出来，挡在你前面。'],['mo','封印，用我来补。你还年轻，修为留着，替我看看以后的世界。'],['mo','还有……谢谢你，没让老夫的三百年白等。'],['','玉简碎了。']]},
   {t:'驯服灵源，让灵气留在人间',k:0,r:[['','你没有封它，也没有占它。你在灵源四周布下阵法，让灵气一点点流出去。'],['mo','让天下人都能修仙……三百年前我和师兄想做的事，你做成了。']]},
   {t:'吞下灵源',k:-2,r:[['','灵源涌进你的身体。那一刻，你听见了全城所有妖物的心跳。'],['mo','{name}——！'],['','玉简在你掌心沉默了。']]}
  ]},
  {bg:'shelter'},
  ['',()=>S.karma>=3?'后来，青石站的孩子们都学会了吐纳。阿禾成了站里第一个筑基的人，她说是跟{name}学的。':S.karma<=-3?'后来，城里的人提起{name}这个名字，都会压低声音。':'后来，废墟上长出了一座新的城。很少有人记得灵潮那年发生过什么，你也不常提起。'],

  ['','—— 灵潮平息 ——'],
  ['','可是灵源之下，还有一道更深的裂缝。'],
  ['','【「灵源深渊」已开启：层数无尽，越深越强。修到渡劫圆满后可以飞升轮回，带着仙缘重修。】']

 ['','摆摊的老头头发全白，一个人对着棋盘下。下一步，叹一口气。'],
 ['tie','那是沈老头。灵潮前在少年宫教棋，前天跟着流民进的站。脾气怪，人不坏。'],
 ['shen','小友，会下五子棋吗？'],

  lose:[['shen','输了不打紧。棋盘上输，总比战场上输好。'],['shen','记着：先堵住别人的四，再想自己的五。剑也是一样。']]}},
 ['shen','我每天都在这儿。想下棋就来。下得好，老头子有好东西给你。'],
 ['mo','这老头……身上有股味道。不是灵气，是“算”。他算了一辈子。'],
 ['','【青石站新增人物「沈棋」：可以和他对弈五子棋，初、中、高三阶，赢了按难度给奖励。】']

stIns('ratking',{id:'qiansan',title:'插曲·赌鬼',g:'骰',bg:'shelter',cond:()=>S.seen.includes('ratking'),hint:'击败鼠王',lines:[

  {t:'「把米还回去。现在。」',k:1,r:[['qian','凭什么？……行行行，看在仙师的面子上。'],['','他把米扛走的时候，嘴里一直在嘀咕。你听见一句：“又欠一个人情。”']]},
  {t:'「我也来两把。」',k:-1,fx:{flags:{qianFriend:1}},r:[['qian','爽快！就喜欢仙师这样的！'],['','你们一直玩到半夜。钱三喝多了，说他灵潮前在澳门当过荷官，欠了一屁股债，才逃到这城里。']]}
 ]},
 ['qian','您往后要是想碰碰运气，随时来找我钱三。押大小，比点数，我这儿都有。'],
 ['','【青石站新增人物「钱三」：可以押大小、比点数。】']
],after:()=>{S.flags.metQian=1;}});

stIns('caravan',{id:'xiaoman',title:'插曲·小满',g:'满',bg:'shelter',cond:()=>S.seen.includes('caravan'),hint:'红鹞商队来过之后',lines:[

 ]},

 ['','【青石站新增人物「林小满」。】']

stIns('zhuji',{id:'lizu',title:'家族·立族',g:'族',bg:'clan',cond:()=>S.seen.includes('zhuji')&&S.seen.includes('xiaoman'),hint:'筑基之后',lines:[
 ['','筑基之后第三天，铁叔把你叫到了站台尽头。'],

stIns('port',{id:'guishi',title:'插曲·鬼市',g:'鬼',bg:'market',cond:()=>S.bossDown.includes(3),hint:'击败海眼蛟',lines:[

 ['gui','送你一句话，不收钱：天上的人，比地上的妖兽可怕。'],

],after:()=>{S.flags.metGui=1;}});

stIns('jindan',{id:'ningxuan',title:'插曲·白衣会主',g:'玄',bg:'sky',cond:()=>S.seen.includes('hunted')&&S.seen.includes('jindan'),hint:'结成金丹',lines:[

 ['','你拔剑。剑还没出鞘，你已经跪在了地上。'],
 ['','不是被打的，是被压的。他只是看了你一眼。'],
 ['mo','（声音发抖）……化神？不对……这股气，不是这个世界的……'],
 ['ning','金丹。很好，比我想的快。'],
 ['ning','我不杀你。那块玉简，迟早会自己回到我们手里。我只是来看看，这一次的“钥匙”长什么样。'],
 ['ning',()=>F('metShen')?'替我问沈老师好。告诉他，那盘棋，我还没下完。':'这座站里，有个下棋的老头吧。替我问他好。'],

 ['','后来你才知道，那一眼，碎了你七层护体灵光。'],
 ['shen','（在棋摊前坐了一整夜）……宁玄。我最好的学生。'],
 ['','【人外有人。天穹会会主宁玄，比你见过的任何敌人都强。】']
],after:()=>{S.flags.metNing=1;}});

stIns('ningxuan',{id:'canju',title:'插曲·残局',g:'局',bg:'shelter',cond:()=>S.seen.includes('ningxuan')&&qDone('shen2'),hint:'赢下沈棋的中阶对局',lines:[
 ['shen','坐吧。今天不下快棋。'],
 ['shen','宁玄十二岁跟我学棋。他是我教过最好的孩子。'],
 ['shen','灵潮那天，一群穿白衣服的人来少年宫，说他有仙缘，把他带走了。'],
 ['shen','十年后他回来过一次。他说：“老师，下棋的人，从来不是棋子。”然后他看着我，就像看一颗棋子。'],
 ['shen','我追着天穹会走了半座城，才走到这里。'],

  lose:[['shen','还差一点。'],['shen','这本《凌波微步》先拿着。高阶这一盘，什么时候赢了，什么时候再来找我。']],loseFx:{book:'lingbo'}}}
]});

stIns('fallen',{id:'suwan',title:'插曲·云上的人',g:'云',bg:'pit',cond:()=>S.seen.includes('fallen'),hint:'击败堕仙残躯',lines:[
 ['','堕仙倒下的那一刻，天坑上方的云裂开了一道缝。'],

 ['','那天你从野外回来，库房的门开着。'],

stIns('finale',{id:'tianmen',title:'插曲·天门',g:'门',bg:'core',cond:()=>S.seen.includes('finale'),hint:'走完终章',lines:[
 ['','灵潮平息后的第七天，灵源上方的天空开了一扇门。'],

 ['','【第二卷「天外天」：修至渡劫后，在「修炼」页点「飞升 · 破天门」。】']

stIns('z7',{id:'feisheng',title:'第二卷·飞升',g:'升',bg:'starsea',cond:()=>F('feisheng'),hint:'破开天门',lines:[{fn:()=>cgShow('feisheng')},
 ['','天门在你身后合上了。'],
 ['','没有仙宫，没有云海。只有星海——碎掉的星辰，漂在没有边的黑里。'],
 ['','你低头。你的世界在脚下，小得像一颗灰扑扑的豆子。一根发光的管子从它身上伸出来，扎进更深的黑暗。'],
 ['',()=>F('finSeal')?'怀里有什么在发烫。玉简的碎片，正在自己拼回去。':''],
 ['mo',()=>F('finSeal')?'咳……咳咳。小子，老夫说过，三百年都等了，不差这一回。':'……原来天外，是这个样子。'],
 ['su','欢迎来到天外。这里没有天庭，只有牧场。'],
 ['su','管子那头的东西，我们叫它“牧者”。它放牧了上千个世界。我的世界……上一季被收割了。'],
 ['su','你在下界是最强的。在这里，你只是一只刚睁开眼的羊。'],
 ['','远处，一头比山还大的鲸鱼游过星海，张开嘴，吞下了一整颗碎星。'],
 ['su','那是噬星鲸，牧者养的狗。先活下来吧。'],
 ['','【「星海残域」已开启（地图右上角切换「天外」）。新境界：真仙、玄仙、金仙、太乙、大罗。】']
]});

{id:'tianting',title:'第二卷·天庭',g:'庭',bg:'tianting',cond:()=>S.bossDown.includes(9),hint:'击败断戟天将',lines:[

{id:'tw3',title:'行路·归墟',g:'墟',bg:'guixu',side:1,cond:()=>S.visited.includes(10),hint:'前往归墟',lines:[

Object.assign(NPC_IDLE,{
 shen:[()=>'下棋和打架一样。最怕的不是对手强，是自己急。',()=>'我教过的孩子里，最好的那个……算了，不提他。',()=>'五子棋，先手占优。可先手的人，也最容易贪。'],
 qian:[()=>'仙师，我跟您说，骰子这东西有灵性的。……真的。',()=>'我戒了。……这把不算。',()=>F('qianLost')?'上回输给您，我回去琢磨了一宿。您那手法，没法学。':'下回您再来，我让您三点。'],
 man:[()=>'{bro}，墨爷爷今天又在玉简里打呼噜了。',()=>'我晚上做梦，梦见天上有好多好多眼睛。',()=>'阿禾姐姐教我认字了！我会写“满”了！'],
 gui:[()=>'今天的货，明天就没了。',()=>'别问我从哪儿进的货。问了，价钱翻倍。',()=>'你身上的玉简……卖不卖？开个玩笑。'],
 su:[()=>'这颗星上的人，吃饭会一起吃。我们那里……已经没有人一起吃饭了。',()=>'牧者不吃人。它只吃人修出来的东西。所以它从来不急。',()=>'那个孩子，小满，眼睛像我妹妹。']
});
QUESTS.push(
 {id:'shen1',npc:'shen',title:'残谱',desc:'在旧城妖林找回沈棋的棋谱',unlock:()=>maxZone()>=2,obj:{type:'node',z:2,g:'谱',ev:'q_qipu'},

 {id:'shen3',npc:'shen',title:'最后一局',desc:'赢下沈棋一盘高阶五子棋',unlock:()=>S.seen.includes('canju')&&!F('shenWin'),obj:{type:'game',g:'gomoku',lv:3},

  offer:'仙师……救命。鬼市的人来讨债了，就在外头。我、我欠了他们一大笔。',done:'您……您真帮我了了？钱三这辈子没欠过这么大的人情。',reward:()=>kar(1)+gS(zsAt(maxZone(),3))},
 {id:'qian2',npc:'qian',title:'长命锁',desc:'在沉没港口找到钱三押出去的长命锁',unlock:()=>qDone('qian1')&&maxZone()>=3,obj:{type:'node',z:3,g:'锁',ev:'q_lock'},

 {id:'man1',npc:'man',title:'灵目',desc:'和小满玩一局翻牌',unlock:()=>true,obj:{type:'game',g:'memory',lv:1},
  offer:'{bro}，墨爷爷说我眼睛好，记性也好。我们来比翻牌吧！',done:'嘿嘿，{bro}也好厉害！',reward:()=>gQi(.3)+kar(1)},
 {id:'man2',npc:'man',title:'会飞的鱼',desc:'去沉没港口找小满梦里的那条鱼',unlock:()=>qDone('man1')&&maxZone()>=3,obj:{type:'node',z:3,g:'鱼',ev:'q_fish'},
  offer:'我梦见港口有一条会飞的鱼。它说它认识我妈妈。',done:'它说……我妈妈在天上。{bro}，天上是哪里？',reward:()=>gGem('h',3)+flag('manDream')},
 {id:'man3',npc:'man',title:'星图',desc:'在星海残域找到小满家乡的星图',unlock:()=>F('manOrigin'),obj:{type:'node',z:8,g:'图',ev:'q_xingtu'},
  offer:'{bro}，我想知道我是从哪里来的。苏绾姐姐说，星海里有一张图。',done:'原来……我家在那么远的地方。我不哭。我现在的家，在这里。',reward:()=>gBook('xingchen')+kar(1)},
 {id:'cm1',npc:'tie',title:'地牢',desc:'去天坑救出陈默的妹妹',unlock:()=>F('chenmoStay')&&maxZone()>=5,obj:{type:'node',z:5,g:'牢',ev:'q_jail'},
  offer:'陈默那孩子，这几天一句话没说。他妹妹关在天坑东边的地牢里。{name}，帮帮他。',done:'人救回来了。陈默说，这条命以后是家族的。',reward:()=>{if(S.clan)S.clan.fame+=10;return gS(zsAt(5,5))+' 家族声望 +10。';}},

 {id:'su1',npc:'su',title:'她的故乡',desc:'在天庭遗迹找到苏绾故乡的遗物',unlock:()=>maxZone()>=9,obj:{type:'node',z:9,g:'乡',ev:'q_suhome'},
  offer:'天庭的台阶下面，压着我故乡的一块碑。我一个人……不敢去看。',done:'谢谢。我以为我早就不会哭了。',reward:()=>gBook('guiyuan')+kar(1)},
 {id:'su2',npc:'su',title:'闭眼',desc:'斩杀牧者之眼 8 只',unlock:()=>maxZone()>=10,obj:{type:'kill',mob:'牧者之眼',n:8},
  offer:'归墟里那些眼睛，每一只都在数羊。去，让它们少数几只。',done:'它们会记住你的。……这是好事，也是坏事。',reward:()=>gGem('c',5)}
);
Object.assign(EVENTS,{
 q_qipu:{title:'凉亭',g:'谱',spk:'shen',lines:['藤蔓把凉亭缠成了一只绿色的茧。石桌上，一本泛黄的本子被压在一枚黑子下面。','本子的封皮上写着：《残局百解》·沈。'],
  choices:[{t:'收好残谱',act:()=>'你把残谱揣进怀里。凉亭外，有什么东西在藤蔓里窸窣作响。'+gQi(.1)}]},
 q_debt:{title:'讨债',g:'债',lines:['两个黑衣人把钱三堵在站台东头。领头的那个脸上有道疤，手里掂着一把刀。','“钱三，鬼市的账，拖了三年了。今天要么还钱，要么还手。”'],
  choices:[
   {t:()=>`替他还（${fmt(zsAt(maxZone(),4))} 灵石）`,need:()=>S.stones>=zsAt(maxZone(),4),act:()=>{S.stones-=zsAt(maxZone(),4);return '你把灵石扔了过去。疤脸掂了掂，咧嘴一笑：“仙师爽快。”他们走了。钱三在你身后，抖得像一片叶子。';}},
   {t:'跟债主赌一把：比点数，赢了一笔勾销',act:()=>({game:{k:'duel',lv:2,title:'和疤脸赌债',onWin:()=>'疤脸盯着骰子看了半天，把欠条撕了。“行，算你狠。”',onLose:()=>{const c=Math.min(S.stones,zsAt(maxZone(),6));S.stones-=c;return '你输了。疤脸收走了 '+fmt(c)+' 灵石，加倍。钱三的债，算是了了，只是是你替他付的。';}}})},
   {t:'把他们打出去',act:()=>({text:'疤脸冷笑一声，拔出了刀。',fight:{look:'黑市打手',name:'鬼市疤脸',m:1.6}})}
  ]},
 q_lock:{title:'沉没的当铺',g:'锁',lines:['当铺的招牌斜插在淤泥里。柜台后面的保险柜被撬开过，又被海水灌满。','你在一堆烂掉的票据里，摸到一枚冰凉的小东西。银子打的长命锁，正面刻着“岁岁平安”。'],
  choices:[{t:'带回去给钱三',act:()=>'你把长命锁擦干净，用布包好。'+kar(1)}]},
 q_fish:{title:'会飞的鱼',g:'鱼',spk:'man',lines:['雾里真的有一条鱼在飞。鳞片是半透明的，像一块浮在空中的玻璃。','它绕着你转了三圈，停在你面前。你听见一个声音，直接响在脑子里：“告诉那个孩子……她的妈妈，在天上看着她。”'],
  choices:[{t:'伸手去碰它',act:()=>'你的指尖碰到它的一瞬间，它化成了一颗碧绿的晶石。'+gQi(.2)},{t:'问它“天上”是哪里',act:()=>'鱼没有回答。它朝天上游去，一直游进了云里。'+gQi(.3)}]},
 q_jail:{title:'天穹地牢',g:'牢',lines:['地牢的入口藏在一块焦黑的岩石后面。两个白衣守卫靠在墙边打盹。','往里走，铁笼子一个挨一个。最里面那个笼子里，一个瘦小的女孩抱着膝盖，抬头看你。'],
  choices:[{t:'杀进去',act:()=>({text:'守卫惊醒了。整座地牢的灯一起亮了起来。',fight:{look:'天穹追兵',name:'地牢看守',m:2,boss:true}})},
   {t:'悄悄撬锁',act:()=>chance(.5)?'锁开了。你背起女孩，从守卫身边溜了出去。'+kar(1):({text:'锁“咔嗒”一声。守卫睁开了眼睛。',fight:{look:'天穹追兵',name:'地牢看守',m:2.2,boss:true}})}]},
 q_xingtu:{title:'星图',g:'图',spk:'man',lines:['一块碎星上，刻满了发光的线。线连着点，点连着更多的线。','在星图的一个角落，有一个小小的手印。和小满掌心的胎记一样。'],
  choices:[{t:'把星图拓下来',act:()=>'你用灵力把星图拓在一张薄绢上。碎星上的光，慢慢暗了下去。'+gQi(.2)}]},
 q_suhome:{title:'故乡的碑',g:'乡',spk:'su',lines:['台阶下面压着一块黑色的碑。碑上的字你不认识，可你看得懂碑顶刻着的东西——一只眼睛，被一把剑劈成了两半。'],
  choices:[{t:'把碑扶起来',act:()=>'碑很沉。你把它扶正的时候，碑底下滚出来一枚小小的玉簪。'+gQi(.2)+kar(1)}]},
 gamble_den:{title:'地下赌坊',g:'赌',zones:[0,1,3,5],lines:['一扇生锈的卷帘门后面，灯火通明。几十个人围着一张桌子，骰盅摇得哗哗响。','庄家抬头看了你一眼：“生面孔。玩两把？”'],
  choices:[
   {t:'押大小',act:()=>({game:{k:'sicbo',title:'地下赌坊',stake:1,onWin:()=>'你揣着赢来的灵石走出了赌坊。身后有人在骂娘。',onLose:()=>'你走出赌坊的时候，口袋轻了不少。'}})},
   {t:()=>`和庄家单挑比点数（押 ${fmt(zs(4))}）`,need:()=>S.stones>=zs(4),act:()=>{const b=zs(4);S.stones-=b;return {game:{k:'duel',lv:2,title:'和庄家单挑',onWin:()=>'庄家脸色铁青。'+gS(b*2),onLose:()=>'庄家笑眯眯地收走了你的灵石。'}};}},
   {t:'掀了他的桌子',act:()=>{kar(-1);return {text:'桌子翻了。打手们从四面八方围了上来。',fight:{look:'黑市打手',name:'赌坊打手',m:1.4}};}},
   {t:'转身离开',act:()=>'赌坊的喧哗被关在了卷帘门后面。'}
  ]},
 three_box:{title:'三只匣子',g:'匣',zones:'any',lines:['路边摆着三只一模一样的木匣子。旁边坐着一个戴斗笠的人，一言不发。','地上用炭写着一行字：“三选一，不收钱。”'],
  choices:[{t:'挑一只',act:()=>({game:{k:'boxes',title:'三只匣子',onWin:()=>{EVZ=maxZone();return '匣子里躺着'+(chance(.5)?gGem(null,gemTierFor(EVZ)+1):gItem(rollRar(true))).replace(/^ 获得 /,'');},onLose:()=>chance(.3)?{text:'匣子是空的。斗笠人站了起来——那根本不是人。',fight:{look:'宝箱怪',name:'匣中妖',m:1.6}}:'匣子是空的。再抬头，斗笠人已经不见了。'}})},
   {t:'不碰',act:()=>'你走远了才回头。路边什么都没有，连匣子都不见了。'}]},
 chess_ghost:{title:'棋鬼',g:'棋',zones:[2,5,6,9],lines:['一张石桌，一盘没下完的棋。对面坐着一个半透明的老人，指了指你面前的空位。','“陪老鬼下一盘。赢了，有赏；输了……留下一点灵气就好。”'],
  choices:[
   {t:'下初阶',act:()=>({game:{k:'gomoku',lv:1,title:'棋鬼 · 初阶',onWin:()=>'老鬼点点头。'+gQi(.15)+gS(zs(2)),onLose:()=>'老鬼伸手在你额头一点。'+gQi(-.08)}})},
   {t:'下中阶',act:()=>({game:{k:'gomoku',lv:2,title:'棋鬼 · 中阶',onWin:()=>'老鬼笑了。'+gQi(.35)+gGem(null,gemTierFor(EVZ)),onLose:()=>'老鬼伸手在你额头一点。'+gQi(-.15)}})},
   {t:'下高阶',act:()=>({game:{k:'gomoku',lv:3,title:'棋鬼 · 高阶',onWin:()=>'老鬼愣了很久，然后对你行了一个礼。'+gQi(.6)+gBook(),onLose:()=>'老鬼伸手在你额头一点。'+gQi(-.25)}})},
   {t:'不下',act:()=>'老鬼叹了口气，连同石桌一起淡去了。'}
  ]},
 memory_stele:{title:'记忆石碑',g:'碑',zones:[1,4,6,8,9],lines:['一块石碑上刻着许多符号。你一靠近，符号就一个接一个地翻了过去，背面朝外。','碑底有一行小字：“记得住的人，才配拿走。”'],
  choices:[{t:'试一试',act:()=>({game:{k:'memory',lv:2,title:'记忆石碑',onWin:()=>'石碑裂开，里面藏着一个小匣子。'+(chance(.4)?gBook():gGem(null,gemTierFor(EVZ)))+gQi(.15),onLose:()=>'符号重新翻了回来。石碑上多了一道裂痕，再也翻不动了。'}})},
   {t:'走开',act:()=>'你记性不好，你知道。'}]},
 jianke:{title:'无名剑客',g:'剑',zones:'any',need:()=>maxZone()>=2,lines:['一个白发的剑客坐在路中间，膝上横着一把没有鞘的剑。','“你就是那个拿着玉简的人？”他没睁眼，“拔剑。让我看看你配不配。”'],
  choices:[
   {t:'拔剑',act:()=>({text:'剑客睁开眼睛的那一瞬间，你才明白——他比这一片所有的妖兽加起来都强。',fight:{look:'无名剑客',name:'无名剑客',m:3.2,boss:true,z:Math.min(10,ZORD[Math.min(ZORD.length-1,ZORD.indexOf(maxZone())+1)]),after:()=>{S.flags.beatJianke=(S.flags.beatJianke||0)+1;return '剑客收剑：“不错。这个，是你的了。”'+gBook()+gGem('c',gemTierFor(maxZone())+1);}}})},
   {t:'行礼，问他的名字',act:()=>'“名字？早忘了。”他起身，从你身边走过。“你的剑太干净。等它脏了，再来找我。”'+gQi(.2)},
   {t:'绕路',act:()=>'你绕了很远的路。回头时，他还坐在那里，像一块石头。'}
  ]},
 lost_kid:{title:'迷路的少年',g:'童',zones:'any',need:()=>!!S.clan,lines:['一个十来岁的少年蹲在废墟里，手里攥着半块发霉的饼。','他看见你身上的剑，眼睛亮了：“你是修仙的吗？能……能带我走吗？”'],
  choices:[{t:'带他回家族',act:()=>{const m=clRecruit(true);return m?'少年说他叫'+m.name+'。他一路上都在问修仙是不是能飞。':'祠堂住不下了。你把他送到了青石站，托铁叔照顾。'+kar(1);}},
   {t:'给他一些灵石',act:()=>{S.stones=Math.max(0,S.stones-zs(1));return '他攥着灵石，朝你磕了个头。'+kar(1);}},{t:'走开',act:()=>'他没有追上来。'}]},
 beggar:{title:'讨饭的老头',g:'丐',zones:'any',once:1,lines:['一个衣衫褴褛的老头靠在墙根，伸出一只破碗。','“小哥，赏口吃的吧。老头子三天没吃饭了。”'],
  choices:[{t:'把干粮全给他',act:()=>{kar(1);S.flags.beggarFed=1;return '老头狼吞虎咽地吃完，抹了抹嘴，忽然在你肩上拍了一下。“好心有好报。”你只觉得一股热流直冲丹田——再看时，墙根已经空了。'+gQi(.6)+gBook();}},
   {t:'丢下一枚灵石',act:()=>'老头看了看灵石，又看了看你，笑了。'+gQi(.1)},{t:'不理',act:()=>{kar(-1);return '你走过去的时候，听见身后一声轻笑。那笑声，一点也不像饿了三天的人。';}}]},
 meteor:{title:'天外陨石',g:'陨',zones:[8,9,10],lines:['一块拳头大的陨石落在你脚边，还在冒烟。里面嵌着一颗晶莹的石头。'],

function bfsAll(M,s){const set=new Set([s[0]+','+s[1]]);const q=[s];while(q.length){const [c,r]=q.shift();for(const [dc,dr] of DIRV){const nc=c+dc,nr=r+dr,k=nc+','+nr;if(set.has(k)||!passable(M,nc,nr))continue;set.add(k);q.push([nc,nr]);}}return set;}
function bfsPath(M,sc,sr,goal){const W=M.W,prev=new Int32Array(W*M.H).fill(-2),occ=new Set();M.ents.forEach(e=>{if(e.kind==='npc'&&!e.dead)occ.add(gi(M,Math.round(e.x),Math.round(e.y)));});
 const s0=gi(M,sc,sr);const q=[s0];prev[s0]=-1;let h=0,found=-1;
 while(h<q.length){const i=q[h++],c=i%W,r=(i/W)|0;if(goal(c,r)){found=i;break;}for(const [dc,dr] of DIRV){const nc=c+dc,nr=r+dr;if(!inMap(M,nc,nr))continue;const j=gi(M,nc,nr);if(prev[j]!==-2||!passable(M,nc,nr)||occ.has(j))continue;prev[j]=i;q.push(j);}}
 if(found<0)return null;const out=[];let i=found;while(prev[i]!==-1){out.push([i%W,(i/W)|0]);i=prev[i];}return out.reverse();}

 BT.cur=a;a.defd=false;btParty();{const sk=stTick(a);if(sk){if(sk!=='dead')btMsg((a.n||a.name)+' '+sk);setTimeout(()=>{if(BT)btNext();},560/btSpd());return;}}if(a.side==='e'){if(a.frozen>0){a.frozen--;btMsg(a.n+' 被冻住了，动弹不得');setTimeout(()=>{if(BT)btNext();},520/btSpd());return;}btDo(a,btFoeAI(a));return;}if(a.key==='hero'&&!BT.auto){btCmdMain();return;}btDo(a,btAI(a));}
function btCheck(){if(!BT.foes.some(f=>f.alive)){btWin();return true;}if(!BT.party[0].alive){btLose();return true;}return false;}
function btCmdMain(){BT.phase='cmd';BT.pend=null;btMsg('「'+BT.cur.name+'」要怎么做？');
 btSetCmd(`<button data-b="atk"><b>攻击</b><small>普通一击</small></button><button data-b="sk"><b>法术</b><small>灵力 ${Math.floor(BT.cur.mp)}</small></button><button data-b="shen" ${realmIdx()>=2?'':'disabled'}><b>神通</b><small>${realmIdx()>=2?'境界之力':'金丹后开启'}</small></button><button data-b="it"><b>道具</b><small>丹药 ${S.meds+S.mps} · 符 ${Object.values(S.fu).reduce((a,b)=>a+b,0)}</small></button><button data-b="def"><b>防御</b><small>减伤并回灵</small></button><button data-b="flee" ${BT.opt.noFlee?'disabled':''}><b>逃跑</b><small>${BT.opt.noFlee?'无法逃离':'有机会脱身'}</small></button>`,'main');}
function btCmdTap(b){const a=BT.cur;if(!a||BT.phase!=='cmd')return;
 if(b==='back'){btCmdMain();return;}
 if(b==='atk'){BT.pend={type:'atk'};btTargets();return;}
 if(b==='shen'){shenMenu();return;}
 if(b.startsWith('n:')){btDo(a,{type:'shen',k:b.slice(2)});return;}
 if(b.startsWith('f:')){btDo(a,{type:'fu',k:b.slice(2)});return;}
 if(b==='sk'){const L=SKILLS.filter(skOk);btSetCmd(L.map(s=>`<button class="li" data-b="s:${s.k}" ${a.mp<skCost(s)?'disabled':''}><b>${s.el?'<i class="elg" style="--ec:'+EL[s.el].c+'">'+EL[s.el].n+'</i>':''}${s.n}</b><small>${s.d} · 灵力 ${skCost(s)}</small></button>`).join('')+`<p class="hint">${SKILLS.find(s=>!s.book&&S.stage<s.lv)?'境界提升后会领悟更多法术；研读秘籍还能学到别的。':''}</p><button class="li back" data-b="back">返回</button>`,'list');return;}
 if(b.startsWith('s:')){const sk=SKILLS.find(s=>s.k===b.slice(2));if(sk.ty==='one'){BT.pend={type:'sk',sk};btTargets();}else btDo(a,{type:'sk',sk});return;}
 if(b==='it'){btSetCmd(`<button class="li" data-b="i:meds" ${S.meds?'':'disabled'}><b>疗伤药 ×${S.meds}</b><small>恢复生命最低的同伴 50% 生命</small></button><button class="li" data-b="i:mps" ${S.mps?'':'disabled'}><b>清心丹 ×${S.mps}</b><small>恢复 60% 灵力</small></button>${Object.keys(FU).filter(k=>S.fu[k]>0).map(k=>`<button class="li" data-b="f:${k}"><b>${ico('fu_'+k)}${FU[k].n} ×${S.fu[k]}</b><small>${FU[k].d}</small></button>`).join('')}<button class="li back" data-b="back">返回</button>`,'list');return;}
 if(b.startsWith('i:')){btDo(a,{type:'it',k:b.slice(2)});return;}
 if(b==='def'){btDo(a,{type:'def'});return;}
 if(b==='flee'){btDo(a,{type:'flee'});return;}
 if(b.startsWith('t:')){const f=BT.foes[+b.slice(2)];if(f&&f.alive)btExec(f);}}
function btTargets(){const fs=BT.foes.filter(f=>f.alive);if(fs.length===1){btExec(fs[0]);return;}btMsg('选择目标，也可以直接点妖兽');
 btSetCmd(fs.map(f=>`<button class="li tg" data-b="t:${f.idx}"><b>${esc(f.n)}</b><i class="hb"><i style="width:${f.hp/f.max*100}%"></i></i></button>`).join('')+'<button class="li back" data-b="back">返回</button>','list');}
function btExec(t){const p=BT.pend;BT.pend=null;if(!p)return;p.t=t;btDo(BT.cur,p);}
function btAI(a){const fs=BT.foes.filter(f=>f.alive),ps=BT.party.filter(p=>p.alive);const weak=fs.reduce((m,f)=>f.hp<m.hp?f:m,fs[0]);
 if(a.key==='hero'){const sk=k=>SKILLS.find(s=>s.k===k&&skOk(s)&&a.mp>=s.mp);const boss=fs.find(f=>f.boss);
  {const cf=fs.find(f=>f.chg&&f.weak);if(cf){const ws=SKILLS.find(s=>s.el===cf.weak&&skOk(s)&&a.mp>=skCost(s)&&(s.ty==='one'||s.ty==='all'));if(ws)return {type:'sk',sk:ws,t:cf};if(cf.weak==='lei'&&S.fu.lei>0)return {type:'fu',k:'lei'};if(cf.weak==='huo'&&S.fu.huo>0)return {type:'fu',k:'huo'};}}
  if(fs.some(f=>f.chg)&&!a.mw&&!(a.buf>0)&&!(a.sh>a.max*.2)){if(sk('mingwang'))return {type:'sk',sk:sk('mingwang')};return {type:'def'};}

  if(ps.some(p=>p.hp<p.max*.4)&&sk('huichun'))return {type:'sk',sk:sk('huichun')};if(a.hp<a.max*.3&&S.meds>0)return {type:'it',k:'meds'};

 if(a.key==='su'&&Math.random()<.4)return {type:'call',n:'星落',fx:'bolt',pow:1.3};if(a.key==='ning'&&Math.random()<.45)return {type:'csk',n:'黑白子',fx:'orb',pow:2.2,t:pick(fs)};
 if(a.key==='cm'&&Math.random()<.4)return {type:'csk',n:'开山斧',fx:'orb',pow:1.9,t:pick(fs)};if(a.key==='hong'&&(ps.some(p=>p.hp<p.max*.6)||Math.random()<.2))return {type:'cheal',n:'药雾'};
 if(a.key==='zero'&&Math.random()<.4)return {type:'csk',n:'灵弹',fx:'orb',pow:1.8,t:pick(fs)};

 return {type:'atk',t:pick(fs)};}
function btFoeAI(a){const ps=BT.party.filter(p=>p.alive);if(a.jie)return {type:'jie'};a.cnt=(a.cnt||0)+1;
 if(a.boss&&!a.enr&&a.hp<a.max*.3){a.enr=1;a.atk*=1.3;btPop(a,'狂暴','st burn');btMsg(a.n+'狂暴了！攻击大增');}
 if(a.boss&&a.chg&&ps.length){a.chg=0;if(a.mech==='tide')return {type:'etide'};return {type:'eheavy',t:ps.find(p=>p.key==='hero')||ps[0]};}

 else if(act.type==='csk'){btMsg(a.name+' 使出「'+act.n+'」');await btCast(a,'#7ff0ff');const [x0,y0]=ctr(a),[x1,y1]=ctr(act.t);BT.fx.push({k:'proj',x0,y0,x1,y1,col:a.el?EL[a.el].c:'#7ff0ff',orb:1,t0:BT.t,dur:.3});await bwait(300);elStrike(a,act.t,a.el,dmgF(a.atk*act.pow,act.t.def*.6),{st:{huo:'burn',lei:'shock',jin:'brk',tu:'stun',mu:'root'}[a.el],stn:a.el==='jin'?2:1,chance:a.el==='tu'||a.el==='mu'?.3:1});}

const GN_N=11;
function gmInit(){MG.b=new Array(GN_N*GN_N).fill(0);MG.turn=1;MG.last=-1;
 $('#mgArea').innerHTML=`<canvas id="gmc" class="gmc"></canvas>`;$('#mgCtl').innerHTML=`<button class="btn sm ghost" id="gmGive">认输</button>`;
 $('#gmGive').onclick=()=>{if(MG.done)return;mgMsg('你投子认输。','bad');mgEnd(false);};
 mgMsg('轮到你落子。');requestAnimationFrame(gmDraw);const cv=$('#gmc');
 cv.onpointerdown=e=>{if(MG.done||MG.turn!==1)return;const r=cv.getBoundingClientRect(),cell=r.width/GN_N;const x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);
  if(x<0||y<0||x>=GN_N||y>=GN_N||MG.b[y*GN_N+x])return;gmPut(x,y,1);if(MG.done)return;MG.turn=2;mgMsg('对手在想……');setTimeout(()=>{if(!MG||MG.done)return;const m=gmAI(MG.lv);gmPut(m%GN_N,Math.floor(m/GN_N),2);if(!MG.done){MG.turn=1;mgMsg('轮到你落子。');}},380+Math.random()*300);};}
function gmPut(x,y,c){const i=y*GN_N+x;MG.b[i]=c;MG.last=i;gmDraw();if(gmWin(x,y,c)){mgMsg(c===1?'五子连珠，你赢了！':'对手连成五子。','',);if(c===1)$('#mgMsg').classList.add('good');else $('#mgMsg').classList.add('bad');mgEnd(c===1);return;}
 if(MG.b.every(v=>v))mgMsg('棋盘下满了，和棋。'),mgEnd(false);}
function gmWin(x,y,c){const B=MG.b;for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(const s of [1,-1]){let k=1;while(true){const X=x+dx*k*s,Y=y+dy*k*s;if(X<0||Y<0||X>=GN_N||Y>=GN_N||B[Y*GN_N+X]!==c)break;n++;k++;}}if(n>=5)return true;}return false;}
function gmDraw(){const cv=$('#gmc');if(!cv)return;const r=cv.getBoundingClientRect(),dpr=Math.min(3,devicePixelRatio||1),W=Math.round(r.width*dpr);cv.width=W;cv.height=W;const x=cv.getContext('2d'),c=W/GN_N;
 x.fillStyle='#c9a46a';x.fillRect(0,0,W,W);x.strokeStyle='#5a3e1e';x.lineWidth=Math.max(1,dpr*.8);
 for(let i=0;i<GN_N;i++){x.beginPath();x.moveTo(c/2,c/2+i*c);x.lineTo(W-c/2,c/2+i*c);x.stroke();x.beginPath();x.moveTo(c/2+i*c,c/2);x.lineTo(c/2+i*c,W-c/2);x.stroke();}
 [[2,2],[8,2],[5,5],[2,8],[8,8]].forEach(([a,b])=>{x.fillStyle='#5a3e1e';x.beginPath();x.arc(c/2+a*c,c/2+b*c,c*.09,0,6.28);x.fill();});
 MG.b.forEach((v,i)=>{if(!v)return;const cx=c/2+(i%GN_N)*c,cy=c/2+Math.floor(i/GN_N)*c,g=x.createRadialGradient(cx-c*.12,cy-c*.12,c*.05,cx,cy,c*.44);
  if(v===1){g.addColorStop(0,'#5a5a5a');g.addColorStop(1,'#0a0a0a');}else{g.addColorStop(0,'#ffffff');g.addColorStop(1,'#c8c2b4');}
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,c*.42,0,6.28);x.fill();if(i===MG.last){x.fillStyle='#cf4a3c';x.beginPath();x.arc(cx,cy,c*.1,0,6.28);x.fill();}});}
function gmLine(B,x,y,c){let tot=0;for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1,open=0;
  for(const s of [1,-1]){let k=1;while(true){const X=x+dx*k*s,Y=y+dy*k*s;if(X<0||Y<0||X>=GN_N||Y>=GN_N)break;const v=B[Y*GN_N+X];if(v===c){n++;k++;continue;}if(v===0)open++;break;}}
  tot+=n>=5?1e6:n===4?(open===2?5e4:open===1?6e3:0):n===3?(open===2?4e3:open===1?300:0):n===2?(open===2?260:open===1?40:0):(open===2?12:2);}return tot;}
function gmCands(B){const out=[];for(let i=0;i<B.length;i++){if(B[i])continue;const x=i%GN_N,y=(i/GN_N)|0;let near=false;
  for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<GN_N&&Y<GN_N&&B[Y*GN_N+X]){near=true;break;}}if(near)out.push(i);}
 if(!out.length)out.push(Math.floor(GN_N*GN_N/2));return out;}
function gmScore(B,i,lv){const x=i%GN_N,y=(i/GN_N)|0;const a=gmLine(B,x,y,2),d=gmLine(B,x,y,1);return lv===1?a+d*.55:lv===2?a+d*.95:a*1.1+d;}
function gmAI(lv){const B=MG.b,C=gmCands(B);let sc=C.map(i=>({i,s:gmScore(B,i,lv)})).sort((a,b)=>b.s-a.s);
 if(lv===1){if(Math.random()<.28)return pick(C);const top=sc.slice(0,5);return pick(top).i;}
 if(lv===2){const top=sc.filter(o=>o.s>=sc[0].s*.9);return pick(top).i;}
 if(sc[0].s>=1e6)return sc[0].i;const block=sc.find(o=>gmLine(B,o.i%GN_N,(o.i/GN_N)|0,1)>=1e6);if(block)return block.i;
 let best=sc[0].i,bv=-1e18;sc.slice(0,9).forEach(o=>{B[o.i]=2;let rep=0;gmCands(B).forEach(j=>{const v=gmLine(B,j%GN_N,(j/GN_N)|0,1)+gmLine(B,j%GN_N,(j/GN_N)|0,2)*.5;if(v>rep)rep=v;});B[o.i]=0;const v=o.s-rep*.75;if(v>bv){bv=v;best=o.i;}});return best;}

  if(p.st>=0){const r=STAGES[Math.min(p.st,LAST)].r,nx=Math.min(p.st+1,LAST),major=STAGES[nx].r>r;
   if(p.st<LAST&&(!major?Math.random()<p.tal*.6/(1+r*.7):Math.random()<p.tal*.2/(1+r*.35))){p.st++;if(major&&p.known&&(!p.bg||STAGES[p.st].r>=4))news(p.n+'突破至'+REALMS[STAGES[p.st].r]+'。'+(p.att<=-40?'——那个恨你的人，又强了一截。':''),p.att<=-40||p.att>=40);}

function retreatApply(id){const o=RETREATS.find(x=>x.id===String(id));if(!o||BT||o.days/365>=myLife()-S.age||S.qi>=needQ())return;

const years=Math.floor(S.retreatRemainder/365);S.retreatRemainder%=365;
S.yearsClosed=1;const age0=S.age,L=years?simYears(years):[];if(S.path==='yin'&&years)S.age=age0+Math.ceil(years/2);S.yearsClosed=0;

    ['shuiyue','我不许你找，是怕你知道了，会觉得是自己害了她。'],['','云漪站在原地，一句话都说不出来。']]}])]});
function rwYunCold(){const p=P_('yun');if(p&&!F('rw_yunC')){S.flags.rw_yunC=1;p.lifeB=(p.lifeB||0)+(p.age+14-pLife(p));}}

R('yun',{t:'冥池',g:'池',bg:'youming',gap:1,need:()=>F('rw_luoFree')||S.stage>=21,hint:'化神之后——或者先解开阎九娘的心结（她的寒毒等不了太久）',lines:[
 rwIf(()=>F('rw_luoFree'),[
  ['','阎九娘守了约定。冥池的门开了。'],['','一个白发的女人被人扶着走出来。她的眼睛已经看不太清了，却一下子认出了站在门口的人。'],
  ['luo','……漪儿？'],['yun','师父。'],['','云漪跪了下去。'],['luo','长这么高了。……寒毒呢？'],
  ['','洛清霜从袖子里摸出一只玉瓶，塞进她手里。'],['luo','这些年，九娘逼着我想办法给她女儿续命。续命的法子没想出来，解寒毒的，倒让我想出来了。'],['luo','服了它。你会活得比师父长。'],

  ['yan',()=>{const y=P_('yan');return y&&y.alive?'站住。':'';}],

      lose:()=>{S.flags.rw_luoDead=1;const p=P_('yun');if(p){p.lifeB=0;rwAtt('yun',30);p.goal='替师父活下去';}rwEnd('yun','云漪的寒毒解了。她的师父死在了冥池里。');news('玄水门长老洛清霜死于幽冥殿冥池。',1);
       return '你们败了。\n洛清霜在池心挣断了锁链。她用最后的力气，把一只玉瓶扔到云漪脚边。\n“漪儿……活下去。”\n冥池的水合上了。云漪抱着那只玉瓶，一直没有哭。';}})},
    {t:'「她欠你的，我替她还。」（一颗寿元丹）',need:()=>S.lifeP>0,fx:()=>{S.lifeP--;S.flags.rw_luoFree=1;rwAtt('yan',15);rwYunCure('你用一颗寿元丹，从阎九娘手里换回了洛清霜。');},r:[
      ['yan','……寿元丹。'],['','她接过去，攥在手心里，很久没有松开。'],['yan','带她走吧。'],['','洛清霜被扶出冥池，把一只玉瓶塞进云漪手里。'],['luo','漪儿。寒毒……能解了。']]}])],
  [['','冥池没有人守。幽冥殿的殿主已经不在了。'],['','你们砸开了锁链。洛清霜醒过来的第一件事，是摸索着把一只玉瓶塞进云漪手里。'],['luo','漪儿……寒毒能解了。'],{fn:()=>{S.flags.rw_luoFree=1;rwYunCure('云漪找回了师父。寒毒已解。');}}])]),
 ['',()=>F('rw_luoDead')?'':'那天回玄水门的路上，云漪一直走在她师父身边，一步都没有离开。'],
 ['yun',()=>F('rw_luoDead')?'':'{name}。玄水门欠你一个人情。不，是我欠你的。']]});

/* ================= 阎九娘 · 阿萤 ================= */
R('yan',{t:'收尸人',g:'冥',bg:'shelter',need:()=>S.stage>=13,hint:'结丹之后，夜里的废城',lines:[
 ['','夜里的废城，有人在收尸。'],['','黑衣的鬼卒一具一具地把尸体抬上车，没有声音。车边站着一个女人，撑着一把黑伞。'],
 ['yan','看什么？'],['','幽冥殿主，阎九娘。化神圆满，江湖上排得进前十的魔头。'],
 ['yan','你身上有丹香。寿元丹？还是别的什么延寿的东西？'],['yan','卖给我。多少灵石都行。'],
 rwC([
  {t:'「你要延谁的寿？」',fx:()=>{rwAtt('yan',10);},r:[['','她第一次正眼看你。'],['yan','你这人，问得太多了。'],['','她转身走了。第二天，你的门口多了一只匣子，里面是两株百年血参。'],{fn:()=>toast(gMat('xue',2).trim())}]},
  {t:'卖给她一颗寿元丹',need:()=>S.lifeP>0,fx:()=>{S.lifeP--;rwAtt('yan',15);S.stones+=zsAt(maxZone(),45);},r:[['yan','好。'],['','她扔给你一袋灵石，比市价多了一倍。'],['yan','以后有，都卖给我。']]},
  {t:'「魔修收尸，能有什么好事？」',fx:()=>{rwAtt('yan',-10);},r:[['yan','对。没什么好事。'],['','黑伞下的人笑了一下。车轮碾过碎石，走远了。']]}])]});

R('yan',{t:'阿萤',g:'萤',bg:'huatian',gap:1,need:()=>S.stage>=13,hint:'过些时候',lines:[
 ['','幽冥殿后山，有一片和这座魔窟格格不入的花田。'],['','一个白发的老太太蹲在田里拔草。她看见你，笑着招手。'],
 ['ying','你是来找九娘的吧？她出门了。进来喝碗水？'],['','屋里很干净。墙上挂着一张小女孩的画像。'],
 ['ying','那是我小时候。九娘画的。'],['ying','我是她女儿。没有灵根，是个凡人。今年……六十三了吧。'],
 ['ying','她总是很着急。到处找延寿的法子，到处跟人抢。我跟她说，人都会老的，不要紧。她不听。'],
 ['','门外响起脚步声。阎九娘站在门口，黑伞上落满了雨。'],['yan','……谁让你来的。'],
 rwC([
  {t:'「我什么都没看见。」',fx:()=>{rwAtt('yan',25);},r:[['','她让开了门。你走出去的时候，听见身后很轻的一句——「多谢」。']]},
  {t:'「我帮你找延寿的法子。」',fx:()=>{rwAtt('yan',20);S.flags.rw_yanH=1;},r:[['yan','你？'],['yan','我找了四十年。丹药、换寿、夺舍、玄水门的「镜中寿」……能试的都试了。'],['yan','……你要是真找得到，幽冥殿欠你一条命。']]},
  {t:'「堂堂幽冥殿主，原来有这么一个软肋。」',fx:()=>{rwAtt('yan',-50);S.stones+=zsAt(maxZone(),30);S.flags.rw_yanT=1;kar(-1);seedAdd('revenge','yan',S.year+8,{why:'你拿我女儿要挟我的那天，就该想到今天。'});},r:[['','你开了个价。她给了。'],['','她给的时候，一个字都没有说。'],['','你知道，这件事没有完。']]}])]});

R('yan',{t:'寿',g:'寿',bg:'huatian',gap:2,need:()=>S.stage>=17,hint:'元婴之后',lines:[
 ['','阎九娘派人来请你。来的鬼卒说，殿主的女儿快不行了。'],['','花田荒了。阿萤躺在床上，比上一次见时又小了一圈。'],['ying','你来啦。'],
 ['yan',()=>F('rw_yanT')?'……你也配来？是她非要见你。':'她一直说，想再见你一面。'],
 ['yan',()=>F('rw_luoFree')||F('rw_luoDead')?'':'我抓了一个玄水门的人，关了很多年，逼她给我想办法。还是没用。'],['yan','凡人的寿元，就像漏了底的碗。补不上的。'],
 rwC([
  {t:'喂阿萤服下一颗寿元丹',need:()=>S.lifeP>0,fx:()=>{S.lifeP--;rwYanSave();},r:[['','药力化开。阿萤的白发里，冒出了几根黑的。'],['ying','九娘，你看，我又能去拔草了。'],['','阎九娘转过身去。你从没见过魔头哭，也不打算告诉任何人。'],['yan',()=>F('rw_luoHeld')?'冥池里那个女人，我放了。':''],['yan','幽冥殿欠你的，记着。']]},
  {t:'把林小苗的九转金丹给她',need:()=>F('rw_jz'),fx:()=>{S.flags.rw_jz=0;rwYanSave();},r:[['','九转金丹化开的时候，屋里飘起一股草木的香。'],['','阿萤坐了起来，脸上有了血色。'],['ying','这是……谁炼的丹？好香。'],['','你说，是百草谷一个总炸炉子的小姑娘。'],['yan','……百草谷。'],['yan','幽冥殿从此不动百草谷一根草。'],['yan',()=>F('rw_luoHeld')?'冥池里那个女人，我也放了。':'']]},
  {t:'「让她走得安稳些吧。」',fx:()=>{rwYanLet();},r:[['','你坐在床边，陪阿萤说了一下午的话。说的都是花田里的事。'],['','黄昏的时候，她睡着了，没有再醒。'],['',()=>F('rw_luoHeld')?'阎九娘坐了一整夜。第二天早上，她去了冥池，砸开了锁链。':'阎九娘在床边坐了一整夜，没有说一句话。'],['yan',()=>F('rw_luoHeld')?'……抓着她，也没用了。':'']]}])]});
function rwYanHold(){S.flags.rw_luoHeld=F('rw_luoFree')||F('rw_luoDead')?0:1;if(F('rw_luoHeld'))news('幽冥殿主阎九娘放出了关押多年的玄水门长老洛清霜。',1);S.flags.rw_luoFree=F('rw_luoDead')?0:1;}
function rwYanSave(){rwAtt('yan',60);rwYanHold();rwAlly('youming');const p=P_('yan');if(p)p.goal='陪女儿多看几年花';rwEnd('yan','阿萤多活了二十年。幽冥殿从此不再收活人。');}
function rwYanLet(){rwAtt('yan',15);rwYanHold();const p=P_('yan');if(p)p.goal='守着女儿的坟';rwEnd('yan','阿萤寿终。阎九娘独自守着那片花田。');news('幽冥殿主阎九娘之女病逝。幽冥殿挂白七日。',1);}

R('lin',{t:'采药的小丫头',g:'草',bg:'forest',need:()=>S.stage>=3,hint:'修到炼气四层，去林子边上转转',lines:[

 rwC([

R('lin',{t:'第七炉',g:'炉',bg:'baicao',gap:2,need:()=>S.stage>=9,hint:'筑基之后',lines:[
 ['','百草谷的人说，林小苗这个月已经炸了第七炉。'],['','你找到她的时候，她蹲在炸黑的丹炉前面，脸上全是灰。'],

  {t:'「也许你该换条路走。」',fx:()=>{rwAtt('lin',-10);S.flags.rw_linQ=1;P_('lin').goal='让师父看得起我';},r:[['lin','……你也这么觉得啊。'],['','她把丹炉擦干净，收进了柜子里。'],['','那天之后，百草谷的人说，林小苗再也没进过丹房。']]}])]});

 rwIf(()=>F('rw_linQ'),[

  ['','你去看过一次。她认出了你，点了点头，没有说话。'],['','她的腰上，还挂着那只小小的药篓。'],
  {fn:()=>{const p=P_('lin');p.st=Math.min(LAST,p.st+3);p.goal='守好百草谷的山门';rwEnd('lin','她放下了丹炉，成了百草谷守山门的人。');}}],

   {t:'以自身灵力替她护炉（耗去四成灵气）',fx:()=>{gQi(-.4);rwLinOk();}},

const rwLiu=()=>S.flags.rw_liu&&P_(S.flags.rw_liu);
R('huagu',{t:'谷主的考题',g:'谷',bg:'baicao',need:()=>S.stage>=9||!!(S.sects.baicao&&S.sects.baicao.beat>=1),hint:'筑基之后，百草谷会请你去',lines:[
 ['','百草谷的谷主是个爱笑的老太太。'],['huagu',()=>F('rw_lin')?'你就是救过小苗的那个人？那丫头回来念叨了半个月。':'你就是最近江湖上冒出来的那个？'],
 ['huagu','老婆子活了一百五十年，就剩一桩心事——找个传人。'],
 ['huagu','谷里有两个孩子。一个叫柳含烟，天资是我这辈子见过最好的，心却冷。一个叫林小苗，笨，可是肯下死功夫。'],
 ['huagu','考考你：三味药，「断肠草」「甘草」「忘忧花」。哪一味，最能毒死人？'],

  {t:'断肠草',r:[['huagu','错啦。断肠草名字吓人，煎透了是止痛的好药。']]},
  {t:'甘草',fx:()=>{rwAtt('huagu',20);S.flags.rw_hgOk=1;},r:[['huagu','……你倒是明白人。'],['huagu','甘草什么药都能配，什么方子都能调，人人都信它。毒，最怕的就是人人都信。']]},
  {t:'忘忧花',fx:()=>{rwAtt('huagu',8);},r:[['huagu','有点意思。忘忧花杀不死人，只会让人忘了为什么活着。……也算一种毒吧。']]}]),

 {fn:()=>{if(!rwLiu()){const p=mkPerson({n:'柳含烟',sect:'baicao',st:14,age:31,tal:.75,att:0,goal:'接任谷主',ch:'p_gen3'});S.flags.rw_liu=p.id;}toast(gMat('cao',2).trim());}}]});

R('huagu',{t:'两个徒弟',g:'徒',bg:'baicao',gap:2,need:()=>S.stage>=13,hint:'结丹之后',lines:[
 ['','花姑请你喝茶。这一次，她没笑。'],
 ['huagu',()=>F('rw_jzOk')?'小苗那丫头，居然把九转金丹炼出来了。老婆子活了一百五十年，没见过这么倔的孩子。':F('rw_linQ')?'小苗不炼丹了。是我把话说重了。':'含烟上个月炼成了五品丹。小苗……还在炸炉子。'],
 ['huagu','我得定下来了。我老了，眼也花了。你替我选一个吧。'],['','门外，柳含烟端着药盘，停了一下脚步。'],
 rwC([
  {t:'「柳含烟。百草谷要的是本事。」',need:()=>{const l=rwLiu();return l&&l.alive;},fx:()=>{S.flags.rw_heir='liu';const l=rwLiu();l.att=Math.min(100,l.att+30);},r:[['huagu','……也好。也好。'],['','门外的脚步声，轻快地走远了。']]},
  {t:'「林小苗。百草谷要的是心。」',need:()=>rwP('lin').alive,fx:()=>{S.flags.rw_heir='lin';rwAtt('lin',20);const l=rwLiu();if(l)l.att-=40;},r:[['huagu','……我也是这么想的。只是需要有人替我说出来。'],['','门外的药盘，轻轻响了一声。']]},
  {t:'「阿禾。她是我看着长大的。」',need:()=>{const h=P_('he');return h&&h.alive&&h.sect==='baicao';},fx:()=>{S.flags.rw_heir='he';const l=rwLiu();if(l)l.att-=30;},r:[['huagu','那孩子啊……确实是我这辈子见过最肯吃苦的。好。'],['','门外的药盘，轻轻响了一声。']]}])]});

R('huagu',{t:'传灯',g:'灯',bg:'baicao',gap:2,need:()=>S.stage>=13,hint:'再过两年',lines:[
 rwIf(()=>S.flags.rw_heir==='liu'||!S.flags.rw_heir,[
  ['','花姑传位给柳含烟的第二年，病倒了。'],['','百草谷的人说是寿元到了。可她才一百五十出头，金丹修士少说能活五百年。'],
  ['','你去看她的时候，屋里有一股很淡的甜味。'],['huagu','……甘草。'],['','她握着你的手，笑了一下，没有再说话。'],
  rwC([
   {t:'去找柳含烟',fx:()=>rwFight({title:'百草谷',bg:2,pid:S.flags.rw_liu,m:1.6,boss:1,
     win:()=>{const l=rwLiu();if(l){l.sect=null;l.lead=0;l.att=-80;l.goal='让百草谷付出代价';seedAdd('revenge',l.id,S.year+12,{why:'百草谷是我的。你凭什么管？'});}const h=P_('huagu');rwSetLead('baicao',h);rwAtt('huagu',40);rwAlly('baicao');rwEnd('huagu','你逼柳含烟交出了解药。花姑活了下来，重新掌了百草谷。');news('百草谷柳含烟毒害谷主事败，叛出百草谷。',1);
      return '柳含烟败了。她把解药扔在地上，跑进了林子里。\n花姑醒过来的第一句话是：“……是我没教好她。”\n“百草谷的人情，老婆子记下了。”';},
     lose:()=>{rwKill(P_('huagu'),'百草谷谷主花姑「寿终」。');const l=rwLiu();if(l)l.att=-50;rwEnd('huagu','她没有等到解药。百草谷换了一个心冷的主人。');return '你败了。\n第二天，百草谷挂了白。\n柳含烟穿着素衣站在灵前，哭得比谁都伤心。';}}),r:[['','你没有说话，推门出去了。']]},
   {t:'装作什么都不知道',fx:()=>{kar(-1);rwKill(P_('huagu'),'百草谷谷主花姑「寿终」。');rwEnd('huagu','她死在了自己选的传人手里。你什么都没有说。');},r:[['','三天后，百草谷挂了白。'],['','柳含烟穿着素衣站在灵前，哭得比谁都伤心。'],['','你远远看了一眼，转身走了。']]}])],
 [['','传位大典那天，柳含烟没有来。'],['','她带着一半的长老，堵在了百草谷的山门口。'],
  ['liu','师父偏心。百草谷的规矩，强者为尊。'],['liu','{name}，这是我们谷里的事。你让开。'],
  rwC([
   {t:'「这件事，我管定了。」',fx:()=>rwFight({title:'百草谷山门',bg:2,many:[{pid:S.flags.rw_liu,m:1.6,boss:1},{look:'百草长老',name:'随她反出的长老',st:SECTS.baicao.st,m:1.1}],
     win:()=>{rwBaiHeir();rwAtt('huagu',30);const l=rwLiu();if(l){l.sect=null;l.lead=0;l.att=-70;l.goal='让百草谷付出代价';seedAdd('revenge',l.id,S.year+12,{why:'百草谷是我的。你凭什么管？'});}rwAlly('baicao');S.books.baicao=(S.books.baicao||0)+1;
      return '柳含烟败了。她看了花姑一眼，什么都没说，带着剩下的人走进了林子。\n传位大典照常进行。新谷主接过那盏青灯的时候，手在抖。\n花姑把一卷经塞给你：“《青帝长生功》。百草谷的东西，给百草谷的恩人。”';},
     lose:()=>{const l=rwLiu();rwSetLead('baicao',l);const h=P_('huagu');if(h)h.goal='看着百草谷，别走歪了';rwEnd('huagu','柳含烟夺了谷主之位。花姑退居后山，再没出来。');news('柳含烟夺百草谷谷主之位。',1);return '你败了。\n柳含烟当上了谷主。花姑搬去了后山，再没出来。\n'+(S.flags.rw_heir==='lin'?'林小苗':'阿禾')+'被赶出了百草谷。';}})},
   {t:'「让她们自己了结。」',fx:()=>{const h=S.flags.rw_heir==='he'?P_('he'):P_('lin');const l=rwLiu();if(h&&l&&(h.st>=l.st-2||Math.random()<.25)){rwBaiHeir();if(l){l.sect=null;l.lead=0;l.att=-40;}S.flags.rw_hgSelf=1;}else{rwSetLead('baicao',l);rwEnd('huagu','柳含烟夺了谷主之位。花姑退居后山。');}},r:[
     ['',()=>F('rw_hgSelf')?'那一战打了一天一夜。最后站着的，是花姑选的那个人。':'那一战没打多久。柳含烟的天资，是花姑这辈子见过最好的。'],
     ['huagu',()=>F('rw_hgSelf')?'……你没帮忙，是对的。这个位子，得她自己打下来。':'……罢了。是我老了。']]}])]),
 ]});
function rwBaiHeir(){const h=S.flags.rw_heir==='he'?P_('he'):P_('lin');if(h&&h.alive){rwSetLead('baicao',h);if(h.fr==='he')S.flags.heLead=1;h.goal='把百草谷撑起来';}const hg=P_('huagu');if(hg)hg.goal='在后山种花';rwEnd('huagu','她把那盏青灯传给了自己选的人。');news((h?h.n:'新人')+'继任百草谷谷主。花姑退居后山。',1);}

/* ================= 石铁山 · 结丹 ================= */
R('shi',{t:'铁骨',g:'骨',bg:'market',need:()=>S.stage>=9||!!(S.sects.tiegu&&S.sects.tiegu.beat>=1),hint:'筑基之后',lines:[
 ['','铁骨帮的帮主亲自来坊市找你。一个四十多岁的汉子，膀大腰圆，嗓门比铜锣还响。'],
 ['shi','你就是{name}？来，跟我打一场！'],['shi','不是寻仇。我卡在筑基圆满二十年了，想找个人，看看我到底差在哪。'],
 rwC([{t:'「请。」',fx:()=>rwFight({pid:'shi',m:1.4,boss:1,title:'铁骨',
   win:()=>{rwAtt('shi',15);return '你的剑在他胸口停住。他低头看了看，哈哈大笑。\n“看见了！我这一身铁骨，把丹田也一起箍死了！”\n他笑着笑着，忽然不笑了。\n“……横练伤寿。我这身子，最多再撑十来年。”';},
   lose:()=>{rwAtt('shi',10);return '你没能破开他的金身。\n他扶你起来，自己却叹了口气：“连你也破不开……那我自己，更破不开了。”\n“横练伤寿。我这身子，最多再撑十来年。”';}})}])],
 after:()=>{const p=P_('shi');if(p&&!F('rw_shiL')){S.flags.rw_shiL=1;p.lifeB=(p.lifeB||0)+(p.age+12-pLife(p));}}});

R('shi',{t:'地心火莲',g:'莲',bg:'pit',gap:1,need:()=>S.stage>=9,hint:'一年之后',lines:[
 ['shi','我打听到了。天坑底下长着一株地心火莲，能把箍死的丹田烧开。'],['shi','可那地方，我这身子下不去了。'],
 ['shi','……我不是来求你的，是来跟你做买卖。'],
 rwC([
  {t:'「成交。我去天坑。」',fx:()=>rwFight({title:'地心火莲',bg:5,many:[{look:'赤焰狼',name:'守莲赤焰狼',z:Math.min(maxZone(),5),m:1.2,beast:1},{look:'石魔',name:'守莲石魔',z:Math.min(maxZone(),5),m:1.5,boss:1,beast:1}],
    win:()=>{S.flags.rw_shiLian=1;rwAtt('shi',20);return '你把火莲带回来的时候，石铁山的手抖得接不住。\n“……我石铁山这辈子，没欠过谁。今天欠你了。”'+gMat('huo',2);},
    lose:()=>{return '你没能摘下火莲。\n石铁山听完，只说了一个字：“命。”';}})},
  {t:'把自己的寿元丹给他',need:()=>S.lifeP>0,fx:()=>{S.lifeP--;const p=P_('shi');p.lifeB=(p.lifeB||0)+15;S.flags.rw_shiLife=1;rwAtt('shi',25);},r:[['shi','……你这是做什么。'],['','他攥着那颗丹，眼眶红了。'],['shi','多十五年。……够我再试一次了。']]},
  {t:'「散功重修吧。慢，但稳。」',fx:()=>{S.flags.rw_shiSan=1;rwAtt('shi',5);},r:[['shi','散功？二十年的铁骨，说散就散？'],['shi','……你说得对。可我舍不得。让我想想。']]}])]});

R('shi',{t:'结丹',g:'丹',bg:'market',gap:2,need:()=>true,hint:'两年之后——别让他等太久',lines:[
 ['','铁骨帮的人说，帮主今天闭关冲击金丹。'],['','演武场上站满了人，没有一个说话。'],
 {fn:()=>{const ok=F('rw_shiLian')||(F('rw_shiLife')&&Math.random()<.7)||(F('rw_shiSan')&&Math.random()<.5);S.flags.rw_shiOk=ok?1:0;}},
 rwIf(()=>F('rw_shiOk'),[
  ['','午时，关门炸开。一道金光冲上天，把半个坊市都照亮了。'],['shi','哈哈哈哈——老子结丹了！！'],
  ['shi','{name}！铁骨帮这辈子欠你的！以后谁跟你过不去，就是跟我石铁山过不去！'],
  {fn:()=>{const p=P_('shi');p.st=Math.max(p.st,13);p.lifeB=0;rwAtt('shi',50);p.goal='看看金丹之上是什么';rwAlly('tiegu');rwEnd('shi','他在寿元耗尽之前结了丹。铁骨帮成了你的盟友。');news('铁骨帮帮主石铁山结丹成功。坊市放了一夜的炮仗。',1);toast('铁骨帮成为盟友'+(learnForm('jingang')||''),'big');}}],
 [['','黄昏的时候，关门开了。走出来的是他的儿子，石小虎。'],['','他手里捧着一把卷了刃的刀。'],
  ['','“我爹说，这把刀给你。他说你是唯一一个认真跟他打过的人。”'],
  {fn:()=>{rwKill(P_('shi'),'铁骨帮帮主石铁山冲击金丹失败，坐化于关中。');const k=mkPerson({n:'石小虎',sect:'tiegu',st:9,age:22,tal:.55,att:30,goal:'把铁骨帮撑下去',ch:'p_gen4'});rwSetLead('tiegu',k);rwEnd('shi','他没能结丹。他把刀留给了你。');toast(gItemNamed('w',3,'铁山刀',maxZone()).trim(),'big');}}])]});

/* ================= 水月仙子 · 水镜 ================= */
R('shuiyue',{t:'水镜',g:'镜',bg:'xuanshui',need:()=>S.stage>=17||!!(S.sects.xuanshui&&S.sects.xuanshui.beat>=1),hint:'元婴之后',lines:[
 ['','玄水门的大殿里没有灯。正中一面水镜悬在半空，映着月亮。'],['shuiyue','你来了。'],
 ['','水月仙子背对着你。她的头发是白的，声音却像少女。'],
 ['shuiyue','这面镜子，能照见人心里最怕的东西。三百年来，看过它的人，有一半疯了。'],['shuiyue','你要看吗？'],
 rwC([
  {t:'看',fx:()=>{gQi(.6);rwAtt('shuiyue',15);},r:[['','你看见了。'],
    ['',()=>S.path==='mo'?'镜子里是你自己，站在一片尸山上，正在吞下最后一个人的修为。你在笑。':S.path==='yin'?'镜子里是一座空山。你坐在山顶，所有认识的人都老死了，只剩你。':S.path==='zong'?'镜子里是一座宗门，弟子三千。可匾额上的名字，不是你取的。':'镜子里是青石站。站台空了，铁轨上长满了草。你回来得太晚了。'],
    ['','你退了一步。镜面平静下来。'],['shuiyue','你没有疯。很好。看过了，才知道该往哪边走。']]},
  {t:'不看',fx:()=>{rwAtt('shuiyue',5);},r:[['shuiyue','聪明人。也是胆小的人。'],['shuiyue','……这两样，在江湖上都能活得长。']]}])]});

R('shuiyue',{t:'镜中人',g:'忆',bg:'xuanshui',gap:2,need:()=>S.stage>=21&&S.seen.includes('fallen'),hint:'化神之后，且已知晓堕仙往事',lines:[
 ['','水月仙子的信只有一句：「把你怀里的玉简，带来。」'],
 ['shuiyue','三百年了。我听得出他的声音。'],['shuiyue','墨师兄。你还要躲多久？'],['mo','……小师妹。'],
 ['','大殿里很久没有声音。'],
 ['shuiyue','当年太一观的事，我都知道。大师兄成了堕仙，你成了一块玉。只剩我，活到了今天。'],
 ['shuiyue','我参了三百年水镜，就想看明白一件事——那天，灵源里到底发生了什么。'],['mo','……是我拉着师兄进去的。错的是我。'],
 rwC([
  {t:'「墨老，说完吧。三百年了。」',fx:()=>{rwAtt('shuiyue',35);S.flags.rw_syMo=1;},r:[
    ['mo','……师兄想把灵源的灵气分给天下人。我想关上它。'],['mo','我们在灵源里争执的时候，它裂开了。'],
    ['mo','师兄最后用自己的身子堵住了裂口。他说的最后一句话是——'],['mo','「关上它」。'],
    ['','水镜里，落下了一滴水。'],['shuiyue','原来是这样。……我恨了你三百年。'],
    ['shuiyue','这卷经，本该传给你们两个的。拿去吧。'],{fn:()=>{S.books.xuanshuij=(S.books.xuanshuij||0)+1;toast('获得《玄冥真水经》（在「囊」里研读）','big');}}]},
  {t:'「墨老不想说，就别逼他。」',fx:()=>{rwAtt('shuiyue',10);},r:[['shuiyue','……你护着他。'],['shuiyue','也好。三百年都等了，不差这几年。'],{fn:()=>toast(gMat('ru',1).trim())}]}])]});

R('shuiyue',{t:'破镜',g:'破',bg:'xianshan',gap:3,need:()=>S.stage>=25,hint:'炼虚之后',lines:[
 ['','东海的灵源裂隙又开了。一夜之间，三座城没了声音。'],
 ['shuiyue','水镜能封住它。镜碎，人也碎。'],['shuiyue','我活够了。三百四十年，等的就是这一天。'],
 rwC([
  {t:'「我替你去。」',fx:()=>rwFight({title:'东海裂隙',bg:6,many:[{look:'灵潮化身',name:'裂隙里爬出的东西',z:Math.min(maxZone(),6),m:1.6,boss:1,beast:1},{look:'虚空蝠鲼',name:'虚空蝠鲼',z:Math.min(maxZone(),6),m:1.1,beast:1}],

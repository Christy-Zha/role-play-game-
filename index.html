<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灵潮修仙录">
<meta name="theme-color" content="#16140f">
<title>灵潮修仙录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-screen phone game — status header, painted stage per tab, bottom tab rail; ink-and-ash wasteland. Single dark look by choice. */
:root{
  --bg:#16140f; --panel:#1f1c15; --panel2:#29251c; --line:#3a3427;
  --bone:#ece3cf; --mist:#a0967f; --dim:#6d6555;
  --jade:#8fd6b5; --jade-d:#2c6652; --cin:#cf4a3c; --cin-d:#5e231d; --gold:#e3b862;
  --r-fan:#bdb5a4; --r-ling:#7cc6e3; --r-bao:#c9a0f0; --r-xian:#e3b862;
  --good:#8fd6b5; --bad:#e0705f;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
b,.num{font-variant-numeric:tabular-nums}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 6px}
.who{min-width:0}
.who .nm{font-size:12px;color:var(--mist);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .rl{font-family:var(--f-brush);font-size:25px;line-height:1.1;white-space:nowrap}
.res{display:flex;gap:14px;text-align:right;flex-shrink:0}
.res .lbl{display:block;font-size:11px;color:var(--dim);letter-spacing:.12em}
.res b{font-size:15px}
#hStones{color:var(--gold)}
.qi{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.qif{height:100%;width:0;background:linear-gradient(90deg,var(--jade-d),var(--jade));transition:width .2s}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:12px 18px;-webkit-overflow-scrolling:touch;min-height:0}

.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);padding-block:5px 3px}
.tab{position:relative;background:none;border:0;padding:3px 0;display:flex;flex-direction:column;align-items:center;color:var(--dim);min-width:0}
.tab .g{font-family:var(--f-brush);font-size:23px;line-height:1.15}
.tab .l{font-size:10.5px;letter-spacing:.12em;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--jade)}
.tab:disabled{opacity:.3}
.dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--cin);box-shadow:0 0 8px var(--cin)}

h2.sec{font-family:var(--f-brush);font-weight:400;font-size:22px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;text-wrap:balance;flex-wrap:wrap}
h2.sec small{font-family:var(--f-body);font-size:12px;color:var(--dim);letter-spacing:.04em}
h2.sec:first-child{margin-top:0}
.btn{border:1px solid var(--jade);background:var(--jade-d);color:var(--bone);padding:9px 16px;border-radius:4px;font-size:15px;letter-spacing:.08em}
.btn:disabled{opacity:.38;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mist)}
.btn.red{background:var(--cin-d);border-color:var(--cin)}
.btn.gold{background:rgba(227,184,98,.08);border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:var(--jade);color:var(--bg)}

/* 画面舞台 */
.stage{position:relative;width:100%;border-radius:6px;overflow:hidden;background:#0d0c09;border:1px solid var(--line);isolation:isolate}
.stage>canvas.bgc{position:absolute;inset:0;width:100%;height:100%;display:block}
.cstage{aspect-ratio:1/1;max-height:54vh;margin-inline:auto}
.fstage{aspect-ratio:16/11}
.spr{position:absolute;bottom:3%;aspect-ratio:1}
.spr svg{width:100%;height:100%;overflow:visible;display:block}
.spr .in{width:100%;height:100%}
.bob .in{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3%)}}
.spr.h{left:3%;width:40%}
.spr.e{right:2%;width:44%}
.spr.e.boss{width:54%;right:-2%}
.spr.e .in{transform:scaleX(1)}
.aura{position:absolute;inset:8% 6% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(207,74,60,.45),transparent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5;transform:scale(.92)}}
.lunge{animation:lunge .3s ease-out}
@keyframes lunge{45%{transform:translateX(42%)}}
.lungeL{animation:lungeL .3s ease-out}
@keyframes lungeL{45%{transform:translateX(-36%)}}
.hurt{animation:hurt .32s}
@keyframes hurt{0%{filter:brightness(2.6) saturate(.4)}30%{transform:translateX(5%)}60%{transform:translateX(-4%)}100%{filter:none}}
.die{animation:die .7s forwards}
@keyframes die{to{opacity:0;transform:scale(.7) translateY(8%);filter:blur(5px) brightness(2)}}
.appear{animation:appear .45s ease-out}
@keyframes appear{from{opacity:0;transform:translateX(18%) scale(.9);filter:blur(4px)}}
.slash{position:absolute;pointer-events:none;width:46%;aspect-ratio:1;right:2%;bottom:8%}
.slash path{stroke-dasharray:220;stroke-dashoffset:220;animation:slash .32s ease-out forwards}
@keyframes slash{60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.flysw{position:absolute;left:30%;bottom:42%;width:22%;pointer-events:none;animation:flysw .42s ease-in forwards}
@keyframes flysw{from{transform:translateX(0) rotate(0)}to{transform:translateX(190%) rotate(8deg);opacity:.2}}
.healfx{position:absolute;left:3%;bottom:3%;width:40%;aspect-ratio:1;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(143,214,181,.65),transparent);animation:heal .7s ease-out forwards}
@keyframes heal{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:linear-gradient(180deg,rgba(10,8,6,.75),transparent)}
.hud .b{width:44%;min-width:0}
.hud .b.r{text-align:right}
.hud .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.hud .n.boss{color:var(--gold)}
.hp{height:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;transition:width .2s}
.hp.p i{background:linear-gradient(90deg,var(--jade-d),var(--jade))}
.hp.e i{background:linear-gradient(90deg,#8a2a20,var(--cin))}
.b.r .hp i{margin-left:auto}
.hpn{font-size:10.5px;color:var(--mist);text-shadow:0 1px 2px #000}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;font-family:var(--f-brush);font-size:24px;color:var(--bone);animation:up .85s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.9);white-space:nowrap}
.dmg.crit{color:var(--gold);font-size:33px}
.dmg.hurt2{color:var(--bad)}
.dmg.heal{color:var(--jade)}
@keyframes up{to{transform:translateY(-55px);opacity:0}}
.bp{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:bp .7s ease-out forwards}
@keyframes bp{to{transform:translate(var(--x),var(--y));opacity:0}}
.pt{position:absolute;width:6px;height:6px;border-radius:50%;background:#c8ffe6;box-shadow:0 0 10px var(--jade);pointer-events:none;animation:pt .75s ease-in forwards}
@keyframes pt{from{transform:translate(var(--x),var(--y));opacity:0}20%{opacity:1}to{transform:translate(0,0);opacity:.2}}
.idle-msg{position:absolute;right:6%;bottom:30%;width:40%;text-align:center;font-family:var(--f-brush);font-size:20px;color:var(--mist);text-shadow:0 2px 4px #000}
.bmsg{min-height:2.6em;font-size:13px;color:var(--mist);padding:8px 2px;text-align:center}
.bmsg b{color:var(--gold)}
.bctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bctl .wide{grid-column:1/-1}
.mystats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;font-size:12px;color:var(--dim);text-align:center}
.mystats b{display:block;font-size:15px;color:var(--bone)}
.banner{display:flex;align-items:center;gap:12px;border:1px solid var(--cin);background:linear-gradient(90deg,rgba(207,74,60,.18),transparent);padding:10px 12px;border-radius:6px;margin-bottom:10px}
.banner .t{flex:1;font-size:14px}
.banner .t small{display:block;font-size:12px;color:var(--mist)}

/* 地图 */
.map{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x proximity}
.map::-webkit-scrollbar{display:none}
.zc{position:relative;flex:0 0 auto;width:112px;height:72px;border:1px solid var(--line);border-radius:5px;padding:0;overflow:hidden;background:#0d0c09;text-align:left;scroll-snap-align:start}
.zc canvas{position:absolute;inset:0;width:100%;height:100%}
.zc .lab{position:absolute;left:0;right:0;bottom:0;padding:14px 7px 4px;background:linear-gradient(180deg,transparent,rgba(8,6,4,.9))}
.zc .zn{font-size:12.5px;white-space:nowrap;text-shadow:0 1px 3px #000}
.zc .zs{font-size:10.5px;color:var(--mist)}
.zc[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.zc:disabled{filter:grayscale(1) brightness(.4)}
.zc.done .zs{color:var(--jade)}
.zinfo{font-size:13px;color:var(--mist);margin:8px 0 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.zinfo .d{flex:1 1 100%;color:var(--bone)}
.kbar{flex:1;height:4px;background:var(--line);border-radius:2px;min-width:80px;overflow:hidden}
.kbar i{display:block;height:100%;background:var(--cin)}

/* 修炼 */
.cult{display:flex;flex-direction:column;align-items:center;text-align:center}
.cstage{width:100%;cursor:pointer;touch-action:manipulation}
.sit{position:absolute;left:50%;bottom:4%;width:56%;transform:translateX(-50%)}
.sit svg{width:100%;display:block;overflow:visible}
.ring{position:absolute;left:50%;bottom:8%;width:74%;aspect-ratio:1;transform:translateX(-50%);pointer-events:none}
.ring svg{width:100%;height:100%;overflow:visible}
.spin{transform-origin:100px 100px;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cstage.full .sit{filter:drop-shadow(0 0 14px rgba(227,184,98,.7))}
.plus{position:absolute;pointer-events:none;font-family:var(--f-brush);font-size:22px;color:#c8ffe6;animation:up .9s ease-out forwards;white-space:nowrap;text-shadow:0 2px 4px #000}
.cname{position:absolute;top:10px;left:0;right:0;font-family:var(--f-brush);font-size:30px;text-shadow:0 2px 8px #000}
.ctap{position:absolute;bottom:10px;left:0;right:0;font-size:12px;color:rgba(236,227,207,.7);text-shadow:0 1px 3px #000}
.qi-num{color:var(--mist);font-size:14px;margin-top:10px}
.qi-num b{color:var(--bone)}
.rates{display:flex;gap:18px;justify-content:center;font-size:13px;color:var(--mist)}
.rates b{color:var(--jade)}
.break{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel)}
.break .t{font-size:13px;color:var(--mist);margin-bottom:8px}
.break .t em{font-style:normal;color:var(--bone)}
.break .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.gate{color:var(--cin)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mist)}
.pill input{accent-color:var(--jade);width:18px;height:18px}
.tip{font-size:12px;color:var(--dim);margin-top:12px;max-width:30em}

/* 玉简 */
.jstage{aspect-ratio:16/9}
.jinfo{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;text-shadow:0 1px 3px #000}
.expo{width:46%}
.expo .l{font-size:12px;color:var(--bone)}
.expo .hp i{background:linear-gradient(90deg,#8a6a2a,var(--cin))}
.jslots{display:grid;gap:10px;margin-top:12px}
.jslot{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel);display:flex;gap:12px;align-items:center}
.jslot .ic{width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-family:var(--f-brush);font-size:24px;border:1px solid var(--jade-d);background:radial-gradient(circle,rgba(143,214,181,.18),transparent);color:var(--jade)}
.jslot.ready .ic{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(227,184,98,.4)}
.jslot .in{flex:1;min-width:0}
.jslot .nm{font-size:15px}
.jslot .sub{font-size:12px;color:var(--mist)}
.jslot .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.jslot .bar i{display:block;height:100%;background:var(--jade)}
.picker{border:1px dashed var(--jade-d);border-radius:6px;padding:8px 12px;margin-top:-4px}
.picker .row2:last-child{border-bottom:0}

/* 列表 */
.karma{font-size:13px;color:var(--mist);margin-bottom:12px}
.karma b{color:var(--bone)}
.ch{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ch .th{width:52px;height:38px;border-radius:4px;overflow:hidden;position:relative;background:#0d0c09;border:1px solid var(--line)}
.ch .th canvas{position:absolute;inset:0;width:100%;height:100%}
.ch .th span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-brush);font-size:20px;text-shadow:0 1px 4px #000}
.ch .ct{font-size:15px}
.ch .ch-h{font-size:12px;color:var(--dim)}
.ch.new .ct{color:var(--gold)}
.ch.lock .ct{color:var(--dim)}
.ch.lock .th{filter:grayscale(1) brightness(.35)}
.ch.side .ct{font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:6px;padding:10px 8px;background:var(--panel);min-width:0;min-height:86px}
.slot .sl{font-size:11px;color:var(--dim);letter-spacing:.15em}
.slot .sn{font-size:14px;line-height:1.35;margin:2px 0}
.slot .ss{font-size:11px;color:var(--mist);line-height:1.4}
.r-fan .iname,.r-fan .sn{color:var(--r-fan)}
.r-ling .iname,.r-ling .sn{color:var(--r-ling)}
.r-bao .iname,.r-bao .sn{color:var(--r-bao)}
.r-xian .iname,.r-xian .sn{color:var(--r-xian)}
.row2{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row2 .in{flex:1;min-width:0}
.row2 .iname{font-size:15px}
.row2 .istat{font-size:12px;color:var(--mist)}
.row2 .ibtn{display:flex;gap:6px;flex-shrink:0}
.up{color:var(--good);font-size:11px;margin-left:4px}
.empty{color:var(--dim);font-size:13px;padding:14px 0}
.lv{font-size:12px;color:var(--jade);margin-left:6px}
.save textarea{width:100%;height:84px;background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;resize:vertical;-webkit-user-select:text;user-select:text}
.save .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:12px;color:var(--dim);margin:6px 0}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--line);color:var(--bone);font-size:13px;padding:7px 14px;border-radius:4px;max-width:440px;display:flex;gap:10px;align-items:center;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.big{border-color:var(--gold);color:var(--gold);font-family:var(--f-brush);font-size:20px}
.toast.bad{border-color:var(--cin)}
.toast button{background:none;border:1px solid var(--jade);color:var(--jade);border-radius:3px;padding:2px 8px;font-size:12px}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* 视觉小说 */
#ov{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:rgba(10,8,6,.92)}
#ov.vn{background:#000}
#ov .vbg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .4s}
#ov .inner{position:relative;width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--bone);letter-spacing:.1em;text-shadow:0 1px 4px #000;position:relative;z-index:3}
.st-top .tt{font-family:var(--f-brush);font-size:20px}
.st-skip{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:var(--bone);border-radius:3px;padding:3px 10px;font-size:12px}
.st-sp{flex:1}
.port{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);height:min(52vh,420px);aspect-ratio:200/240;transition:opacity .3s,transform .3s;pointer-events:none;z-index:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.port svg{width:100%;height:100%;display:block}
.port.l{left:-4%}
.port.r{right:-4%}
.port.hide{opacity:0}
.port.l.hide{transform:translateX(-12%)}
.port.r.hide{transform:translateX(12%)}
.port.dim{filter:brightness(.45) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.st-choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;position:relative;z-index:3}
.st-choices button{text-align:left;border:1px solid var(--jade);background:rgba(20,40,32,.88);color:var(--bone);padding:12px 14px;border-radius:4px;font-size:15px;animation:tin .3s ease-out both}
.st-box{position:relative;z-index:2;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(18,15,11,.88),rgba(10,8,6,.96));border-radius:6px;padding:12px 16px 18px;min-height:136px}
.st-s{position:absolute;top:-16px;left:14px;font-family:var(--f-brush);font-size:20px;line-height:1;color:var(--bg);background:var(--jade);padding:6px 14px 5px;border-radius:3px}
.st-s.cin{background:var(--cin);color:var(--bone)}
.st-s.gold{background:var(--gold)}
.st-x{font-size:16.5px;line-height:1.85;max-width:34em;white-space:pre-wrap;margin-top:8px}
.st-x.narr{color:#cfc6b2}
.st-more{position:absolute;right:12px;bottom:4px;color:var(--dim);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.modal{margin:auto 0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:22px 18px;text-align:center;position:relative;z-index:2}
.modal h3{font-family:var(--f-brush);font-weight:400;font-size:30px;margin:0 0 8px;color:var(--gold)}
.modal p{color:var(--mist);margin:6px 0;font-size:14px}
.modal p b{color:var(--bone)}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.intro{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:2}
.intro h1{font-family:var(--f-brush);font-weight:400;font-size:clamp(50px,17vw,80px);line-height:1;margin:0;text-shadow:0 4px 20px #000}

.intro input{background:rgba(0,0,0,.4);border:0;border-bottom:1px solid var(--jade);color:var(--bone);font:inherit;font-size:20px;text-align:center;padding:6px;width:min(220px,80vw);-webkit-user-select:text;user-select:text}
.intro .yr{font-size:12px;letter-spacing:.3em;color:var(--mist)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:rgba(0,0,0,.4);border:0;padding:6px 18px;color:var(--mist)}
.seg button[aria-pressed="true"]{background:var(--jade-d);color:var(--bone)}

@media (prefers-reduced-motion:reduce){
  .spin,.st-more,.bob .in,.aura{animation:none}
  .dmg,.plus,.pt,.bp,.toast,.st-choices button,.lunge,.lungeL,.hurt,.appear,.slash path,.flysw,.healfx,.shake{animation-duration:.01s}
}

 {id:'prologue',title:'序章·灵潮',g:'潮',bg:'sky',cond:()=>true,hint:'',lines:[

 {id:'ahe',title:'第二章·阿禾',g:'禾',bg:'shelter',cond:()=>S.stage>=4,hint:'修炼至炼气五层',lines:[

  let atk=8*g*(1+.12*u.yujian),hp=60*g*(1+.12*u.jingang),def=3*g*(1+.12*u.jingang),crit=.08;
  for(const k of ['w','a','j']){const it=S.gear[k];if(it){atk+=it.atk||0;def+=it.def||0;hp+=it.hp||0;crit+=it.crit||0;}}
  if(S.karma<=-3)crit+=.07;return {atk,hp,def,crit:Math.min(crit,.6),heal:S.karma>=3?.45:.35};}
function nextInfo(){const s=S.stage;if(s>=LAST)return {final:true};
  const r0=STAGES[s].r,r1=STAGES[s+1].r,major=r1>r0;let gate=null,ch=1;
  if(major){const need=Math.min(r1-1,6);if(!S.bossDown.includes(need))gate=ZONES[need].boss;
    ch=.6-.03*r1;if(S.karma>=3)ch+=.05;if(S.usePill&&S.pills>0)ch+=.25;ch=Math.min(ch,.95);}
  return {major,gate,ch,name:STAGES[s+1].name};}
function addQi(x,quiet){S.qi+=x;let moved=false;
  for(;;){const need=req(S.stage);if(S.qi<need)break;const ni=nextInfo();if(ni.final||ni.major){S.qi=need;break;}S.qi-=need;S.stage++;moved=true;}
  if(moved){if(!quiet)toast('突破至 '+STAGES[S.stage].name);checkStory(quiet);if(TAB==='cult')render();}}
function breakthrough(){const need=req(S.stage);if(S.qi<need)return;const ni=nextInfo();if(ni.final)return ascend();
  if(ni.gate){toast('瓶颈：需先击败「'+ni.gate+'」','bad');return;}
  const used=ni.major&&S.usePill&&S.pills>0;if(used)S.pills--;
  if(Math.random()<ni.ch){S.qi-=need;S.stage++;toast('破境！踏入 '+STAGES[S.stage].name,'big');flashStage('gold');checkStory();}
  else{S.qi=Math.floor(S.qi*.6);toast('冲关失败，灵气溃散了四成。'+(used?'破境丹已耗去。':''),'bad');flashStage('red');}
  if(S.pills<=0)S.usePill=false;render();save();}
function ascend(){modal(`<h3>飞升</h3><p>你已修至渡劫圆满，天门在头顶打开。</p><p>飞升后轮回重修：境界、灵石、功法、装备与历练进度清空，剧情、温养等级与深渊记录保留。</p><p>获得 <b>仙缘 +1</b>：修为、攻防、生命永久 <b>+25%</b>（当前 ${S.rebirth} 重）。</p>`,
  [{t:'再等等',cls:'ghost'},{t:'飞升轮回',cls:'gold',fn:()=>{const keep={name:S.name,gender:S.gender,seen:S.seen,flags:S.flags,karma:S.karma,abyss:S.abyss,rebirth:S.rebirth+1,uid:S.uid,started:true,slain:S.slain,taps:S.taps,dt:{lv:S.dt.lv,slots:[]},visited:[0]};
    S=Object.assign(fresh(),keep);C.on=false;C.auto=false;C.e=null;C.z=0;toast('第 '+(S.rebirth+1)+' 世，重入凡尘。','big');render();save();}}]);}

/* ---------- 战斗 ---------- */
const C={z:0,e:null,php:0,on:false,auto:false,cdS:0,cdH:0,acc:0,wait:0,msg:'选一处险地，点「斩妖」开战。'};
const zoneUnlocked=i=>i===7?S.bossDown.includes(6):(i===0||S.bossDown.includes(i-1));
function mkEnemy(z,boss,special){const sc=zScale(z);let n,m=1,tint=false;
  if(special==='zhou'){const s0=zScale(0);return {n:'周烈',look:'周烈',hp:40*s0*3.6,max:40*s0*3.6,atk:6*s0*1.4,def:2*s0*1.2,boss:true,z:0,stones:60,special};}
  if(special==='hunter'){const mz=maxZone(),s1=zScale(mz)*1.15,first=!F('hunter1');const hp=40*s1*(first?3.2:3.6);
    return {n:first?'天穹追兵·周烈':'天穹追兵',look:'天穹追兵',hp,max:hp,atk:6*s1*1.4,def:2*s1*1.2,boss:true,z:mz,stones:Math.ceil(4*Math.pow(2.6,mz)*8),special};}
  if(z===7){n='深渊·第'+(S.abyss+1)+'层';boss=true;tint=true;}else if(boss)n=ZONES[z].boss;else{n=pick(ZONES[z].mobs);m=.8+Math.random()*.4;}
  const look=z===7?ABYSS_POOL[S.abyss%ABYSS_POOL.length]:n;
  const hm=boss?(z===7?3.2:4.5):1,am=boss?1.6:1,hp=40*sc*m*hm;
  let st=4*Math.pow(2.6,Math.min(z,6))*m*(boss?10:1);if(z===7)st=4*Math.pow(2.6,6)*12*Math.pow(1.1,S.abyss);
  return {n,look,tint,hp,max:hp,atk:6*sc*m*am,def:2*sc*m*(boss?1.3:1),boss,z,stones:Math.ceil(st)};}
const dmgF=(a,d)=>a*a/(a+d)*(.9+Math.random()*.2);
function startFight(boss,special){if(!special&&!zoneUnlocked(C.z))return;
  C.e=mkEnemy(C.z,boss||C.z===7,special);C.php=stats().hp;C.on=true;C.acc=0;C.cdS=Math.min(C.cdS,2);C.wait=0;
  C.msg=special?'<b>'+C.e.n+'</b> 拦住了你的去路！':(C.e.boss?'首领现身：':'遭遇 ')+'<b>'+C.e.n+'</b>';
  if(TAB==='fight'){drawEnemy(true);updateFight(true);}}
function step(){const st=stats(),e=C.e;let d=dmgF(st.atk,e.def);const cr=Math.random()<st.crit;if(cr)d*=1.8;e.hp-=d;
  anim('hero','lunge');setTimeout(()=>{anim('enemy','hurt');slashFx(cr);fxNum(d,'e',cr?'crit':'');},120);
  if(e.hp<=0)return win();
  const d2=dmgF(e.atk,st.def);C.php-=d2;
  setTimeout(()=>{if(!C.e||C.e!==e)return;anim('enemy','lungeL');setTimeout(()=>{anim('hero','hurt');fxNum(d2,'p','hurt2');},120);},300);
  if(C.php<=0)return lose();
  if(C.auto){if(C.cdS<=0)sword();if(C.php<st.hp*.45&&C.cdH<=0)heal();}}
function sword(){if(!C.on||C.cdS>0)return;const st=stats(),e=C.e;const d=dmgF(st.atk*3,e.def*.5);e.hp-=d;C.cdS=6;
  if(TAB==='fight'&&!reduce){const st0=$('#fstage');if(st0){const s=document.createElement('div');s.className='flysw';s.innerHTML='<svg viewBox="0 0 100 20"><path d="M2 10 L84 10" stroke="#e8fff4" stroke-width="5" stroke-linecap="round"/><path d="M84 4 L98 10 L84 16 Z" fill="#e8fff4"/><path d="M14 4 L14 16" stroke="#8a6a3a" stroke-width="4"/></svg>';st0.appendChild(s);setTimeout(()=>s.remove(),450);}}
  setTimeout(()=>{anim('enemy','hurt');fxNum(d,'e','crit','御剑 ');shakeStage();},380);if(e.hp<=0)win();updateFight();}
function heal(){if(!C.on||C.cdH>0)return;const st=stats(),h=st.hp*st.heal;C.php=Math.min(st.hp,C.php+h);C.cdH=14;
  if(TAB==='fight'){const st0=$('#fstage');if(st0){const s=document.createElement('div');s.className='healfx';st0.appendChild(s);setTimeout(()=>s.remove(),720);}}fxNum(h,'p','heal','+');updateFight();}
function win(){const e=C.e;C.on=false;S.slain++;S.stones+=e.stones;let extra='';
  setTimeout(()=>{anim('enemy','die');burstAt('enemy',e.boss?26:14);},160);
  if(e.special==='zhou'){S.flags.duel_zhou=1;S.special=null;extra=' · 周烈败了';toast('击败周烈','big');checkStory();}
  else if(e.special==='hunter'){S.expo=0;S.hunts++;if(!F('hunter1')){S.flags.hunter1=1;checkStory();}S.special=null;extra=' · 灵光外泄已清零';toast('击退天穹追兵','big');}
  else{if(e.z<7)S.kills[e.z]++;if(e.boss&&e.z<7&&!S.bossDown.includes(e.z)){S.bossDown.push(e.z);extra=' · 新的险地已开启';toast('击败首领「'+e.n+'」','big');checkStory();}if(e.z===7)S.abyss++;}
  if(S.kills[e.z]===5||S.kills[e.z]===6)checkStory();
  let dropTxt='';if(Math.random()<(e.boss?1:.22)){const it=mkItem(e.z,e.boss);
    if(S.bag.length>=40){S.stones+=it.sell;dropTxt=' · 行囊已满，'+it.n+' 自动售出';}
    else{S.bag.push(it);dropTxt=' · 掉落 <span style="color:var(--r-'+RAR[it.r].c+')">'+it.n+'</span>';if(it.r>=2||better(it))toast('获得 '+it.n+(better(it)?'（更强）':''));}}
  C.msg='斩杀 '+e.n+'，灵石 <b>+'+fmt(e.stones)+'</b>'+dropTxt+extra;if(C.auto&&!e.special)C.wait=1100;updateFight(true);}
function lose(){C.on=false;C.auto=false;C.php=0;C.msg='败退……'+C.e.n+' 太强了。回去闭关，或者换身装备再来。';setTimeout(()=>anim('hero','hurt'),400);updateFight(true);}
function battleUpdate(dt){C.cdS=Math.max(0,C.cdS-dt);C.cdH=Math.max(0,C.cdH-dt);
  if(!C.on&&C.auto&&C.wait>0){C.wait-=dt*1000;if(C.wait<=0){const b=C.z<7&&S.kills[C.z]>=KB&&!S.bossDown.includes(C.z);startFight(b);}}
  if(!C.on)return;C.acc+=dt;while(C.acc>=.65&&C.on){C.acc-=.65;step();}}

/* ---------- 装备 ---------- */
function rollRar(boss){const r=Math.random();if(boss)return r<.08?3:r<.35?2:r<.75?1:0;return r<.015?3:r<.09?2:r<.32?1:0;}
function mkItem(z,boss,forced){const r=forced?forced.r:rollRar(boss),slot=forced?forced.slot:pick(['w','a','j']),sc=zScale(z)*RAR[r].m*(.85+Math.random()*.3);
  const it={id:S.uid++,slot,r,ref:0,n:forced&&forced.n?forced.n:(r?RAR[r].n+'·':'')+GN[slot][Math.min(z,7)]+(z===7?' +'+S.abyss:''),z,sell:Math.ceil(2*Math.pow(2.6,Math.min(z,6))*RAR[r].m*(z===7?Math.pow(1.1,S.abyss)*2:1))};
  if(slot==='w')it.atk=Math.round(5*sc);else if(slot==='a'){it.def=Math.round(2.4*sc);it.hp=Math.round(18*sc);}else{it.hp=Math.round(12*sc);it.atk=Math.round(1.5*sc);it.crit=+(.01+.015*r).toFixed(3);}
  return it;}
const power=it=>it?(it.atk||0)+(it.def||0)*1.6+(it.hp||0)*.15+(it.crit||0)*stats().atk*2:0;
const better=it=>power(it)>power(S.gear[it.slot]);
function statText(it){const p=[];if(it.atk)p.push('攻 +'+fmt(it.atk));if(it.def)p.push('防 +'+fmt(it.def));if(it.hp)p.push('血 +'+fmt(it.hp));if(it.crit)p.push('暴击 +'+(it.crit*100).toFixed(1)+'%');return p.join('　');}
function itemName(it){return it.n+(it.ref?' +'+it.ref:'');}

/* ---------- 玉简温养 ---------- */
const jSlots=()=>1+(S.dt.lv>=2)+(S.dt.lv>=5)+(S.dt.lv>=8);
const jSpeed=()=>Math.max(.4,1-.08*S.dt.lv);
const jUpCost=()=>Math.ceil(50*Math.pow(2.2,S.dt.lv));
const jHalted=()=>S.expo>=100;
function jDur(kind,it){let base=kind==='pill'?20*60:kind==='qi'?10*60:kind==='stones'?15*60:30*60*(1+it.r*.5);if(!F('warm1'))base=30;return base*jSpeed();}
function jPut(kind,arg){if(S.dt.slots.length>=jSlots())return;let o={kind,start:Date.now()};
  if(kind==='pill'){if(S.pills<1)return;S.pills--;o.n=1;o.label='破境丹';}
  else if(kind==='qi'){if(S.qiPills<1)return;S.qiPills--;o.n=1;o.label='聚气丹';}
  else if(kind==='stones'){const amt=Math.floor(S.stones*.5);if(amt<10)return;S.stones-=amt;o.n=amt;o.label='灵石 '+fmt(amt);}
  else{const i=S.bag.findIndex(x=>x.id===+arg);if(i<0)return;o.item=S.bag.splice(i,1)[0];o.label=itemName(o.item);}
  o.dur=jDur(kind,o.item);o.left=o.dur;if(!F('warm1'))S.flags.warm1=1;S.dt.slots.push(o);JPICK=false;toast('放上玉台：'+o.label);render();save();}
function jTick(dt){if(!S.dt.slots.length)return;const rate=jHalted()?0:1;for(const o of S.dt.slots)if(o.left>0)o.left=Math.max(0,o.left-dt*rate);}
function jTake(i){const o=S.dt.slots[i];if(!o||o.left>0)return;S.dt.slots.splice(i,1);let msg='';const lv=S.dt.lv;
  if(o.kind==='pill'||o.kind==='qi'){const n=Math.random()<(lv>=3?.25:0)?3:2;if(o.kind==='pill')S.pills+=n;else S.qiPills+=n;msg=o.label+' ×'+n;}
  else if(o.kind==='stones'){const g=Math.floor(o.n*(1.6+.05*lv));S.stones+=g;msg='灵石 '+fmt(g);}
  else{const it=o.item;if(it.r<3){const k=RAR[it.r+1].m/RAR[it.r].m;it.r++;['atk','def','hp'].forEach(s=>{if(it[s])it[s]=Math.round(it[s]*k);});if(it.crit)it.crit=+(it.crit+.015).toFixed(3);it.n=RAR[it.r].n+'·'+it.n.replace(/^[凡灵宝仙]·/,'');it.sell=Math.ceil(it.sell*k);}
    else{it.ref=(it.ref||0)+1;['atk','def','hp'].forEach(s=>{if(it[s])it[s]=Math.round(it[s]*1.2);});}
    S.bag.push(it);msg=itemName(it);}
  const gain=Math.max(5,Math.round(18*(1-.12*S.ups.lianxi)));S.expo=Math.min(100,S.expo+gain);
  toast('温养完成：'+msg,'big');
  if(S.expo>=100){S.special='hunter';if(!F('hunter1')){checkStory(true);render();save();if(OV_FREE()&&!SC)playStory('exposed');return;}toast('灵光外泄满盈！天穹追兵找上门了','bad');}
  render();save();}

/* ---------- 剧情 ---------- */
function checkStory(quiet){for(const ch of STORY){if(S.seen.includes(ch.id)||S.pending.includes(ch.id))continue;
  let ok=false;try{ok=ch.cond();}catch(e){}if(ok){S.pending.push(ch.id);if(!quiet&&S.started){if(ch.side&&!SC&&OV_FREE())playStory(ch.id);else toast((ch.side?'':'新剧情：')+ch.title,'观看',()=>playStory(ch.id));}}}
  dotUpdate();}
const OV_FREE=()=>$('#ov').hidden;
function dotUpdate(){$('#dotStory').hidden=!S.pending.some(id=>{const c=STORY.find(x=>x.id===id);return c&&!c.side;});}
const bro=()=>S.gender==='f'?'姐姐':'哥哥';
const sub=t=>String(t).replaceAll('{name}',S.name).replaceAll('{bro}',bro());
let SC=null;
function applyFx(fx){if(typeof fx==='function')fx=fx();if(!fx)return;if(fx.stones)S.stones+=fx.stones;if(fx.pills)S.pills+=fx.pills;if(fx.qiPills)S.qiPills+=fx.qiPills;
  if(fx.qiMul)S.qi=Math.floor(S.qi*fx.qiMul);if(fx.qiFill)S.qi=Math.max(S.qi,req(S.stage));if(fx.flags)Object.assign(S.flags,fx.flags);
  if(fx.gift){const it=mkItem(Math.max(1,maxZone()),true,{r:2,slot:'j',n:'灵·'+fx.gift});it.n=fx.gift;it.hp=Math.round(it.hp*1.3);if(S.bag.length<40)S.bag.push(it);}}
function playStory(id){const ch=STORY.find(c=>c.id===id);if(!ch)return;
  SC={id,ch,q:ch.lines.slice(),typing:null,full:'',choice:false,bg:ch.bg};
  const ov=$('#ov');ov.hidden=false;ov.className='vn';
  ov.innerHTML=`<canvas class="vbg" id="vbg"></canvas><div class="port l hide" id="pL"></div><div class="port r hide" id="pR"></div>
   <div class="inner" id="stIn"><div class="st-top"><span class="tt">${ch.title}</span><button class="st-skip" id="stSkip">跳过</button></div><div class="st-sp"></div><div class="st-choices" id="stC"></div>
   <div class="st-box"><div class="st-s" id="stS" hidden></div><div class="st-x" id="stX"></div><div class="st-more" id="stM">▾</div></div></div>`;
  requestAnimationFrame(()=>paintTo($('#vbg'),SC.bg));
  $('#stSkip').onclick=e=>{e.stopPropagation();skipStory();};
  $('#stIn').onclick=()=>{if(!SC||SC.choice)return;if(SC.typing){finishType();return;}nextLine();};
  nextLine();}
function setBg(k){SC.bg=k;const cv=$('#vbg');if(!cv)return;cv.style.opacity=0;setTimeout(()=>{paintTo(cv,k);cv.style.opacity=1;},220);}
function showPortrait(spk){const L=$('#pL'),R=$('#pR');
  if(!spk){L.classList.add('hide');R.classList.add('hide');return;}
  const hero=spk==='@';const key=hero?(S.gender==='f'?'hero_f':'hero_m'):spk;const box=hero?L:R,other=hero?R:L;
  if(box.dataset.k!==key){box.classList.add('hide');setTimeout(()=>{box.innerHTML=(PORTRAIT[key]||PORTRAIT.mo)();box.dataset.k=key;box.classList.remove('hide','dim');},150);}else box.classList.remove('hide','dim');
  if(other.dataset.k)other.classList.add('dim');}
function nextLine(){for(;;){if(!SC.q.length)return endStory();const L=SC.q[0];
    if(!Array.isArray(L)&&L.bg){SC.q.shift();setBg(L.bg);continue;}
    if(!Array.isArray(L)&&L.fx&&!L.c){SC.q.shift();applyFx(L.fx);continue;}
    if(Array.isArray(L)&&typeof L[1]==='function'&&!L[1]()){SC.q.shift();continue;}break;}
  const L=SC.q.shift();if(!Array.isArray(L)&&L.c)return showChoices(L.c);
  const spk=L[0];const name=spk==='@'?S.name:(SPK[spk]||'');const tx=sub(typeof L[1]==='function'?L[1]():L[1]);
  const s=$('#stS'),x=$('#stX');s.textContent=name;s.hidden=!name;s.className='st-s'+(['zero','hong','tq','sx','zhou2'].includes(spk)?' cin':spk==='@'?' gold':'');
  x.className='st-x'+(name?'':' narr');x.textContent='';$('#stM').hidden=true;showPortrait(spk||null);
  SC.full=tx;let i=0;clearInterval(SC.typing);
  if(reduce){x.textContent=tx;SC.typing=null;$('#stM').hidden=false;return;}
  SC.typing=setInterval(()=>{i++;x.textContent=tx.slice(0,i);if(i>=tx.length)finishType();},28);}
function finishType(){clearInterval(SC.typing);SC.typing=null;$('#stX').textContent=SC.full;$('#stM').hidden=false;}
function showChoices(cs){SC.choice=true;$('#stM').hidden=true;showPortrait('@');
  const box=$('#stC');box.innerHTML=cs.map((c,i)=>`<button data-i="${i}" style="animation-delay:${i*80}ms">${esc(sub(c.t))}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=cs[+b.dataset.i];S.karma+=c.k||0;applyFx(c.fx);box.innerHTML='';SC.choice=false;SC.q=(c.r||[]).concat(SC.q);nextLine();});}
function skipStory(){if(!SC||SC.choice)return;clearInterval(SC.typing);SC.typing=null;
  while(SC.q.length){const L=SC.q[0];if(!Array.isArray(L)&&L.c)break;SC.q.shift();if(!Array.isArray(L)){if(L.fx)applyFx(L.fx);if(L.bg)SC.bg=L.bg;}}
  if(SC.q.length){paintTo($('#vbg'),SC.bg);$('#stS').hidden=true;$('#stX').textContent='（做出你的选择）';showChoices(SC.q.shift().c);}else endStory();}
function endStory(){const ch=SC.ch;clearInterval(SC.typing);if(!S.seen.includes(ch.id))S.seen.push(ch.id);S.pending=S.pending.filter(x=>x!==ch.id);
  const ov=$('#ov');ov.hidden=true;ov.innerHTML='';ov.className='';SC=null;
  if(ch.id==='prologue'){S.started=true;}
  if(ch.after)ch.after();checkStory(true);
  if(S.special&&(ch.id==='ratking'||ch.id==='exposed')){TAB='fight';C.z=S.special==='zhou'?0:C.z;}
  dotUpdate();render();save();
  const nx=S.pending.map(id=>STORY.find(c=>c.id===id)).find(c=>c&&c.side);if(nx)setTimeout(()=>{if(OV_FREE()&&!SC)playStory(nx.id);},400);}

/* ---------- 提示 / 弹窗 ---------- */
function modal(html,btns,bg){const ov=$('#ov');ov.hidden=false;ov.className='';
  ov.innerHTML=`${bg?'<canvas class="vbg" id="vbg"></canvas>':''}<div class="inner"><div class="modal">${html}<div class="row">${btns.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${b.t}</button>`).join('')}</div></div></div>`;
  if(bg)requestAnimationFrame(()=>paintTo($('#vbg'),bg));
  ov.querySelectorAll('.modal .row button').forEach(el=>el.onclick=()=>{ov.hidden=true;ov.innerHTML='';const b=btns[+el.dataset.i];b.fn&&b.fn();});}
function toast(t,a,b){let act=null,fn=null,cls='';if(typeof b==='function'){act=a;fn=b;}else if(a==='big'||a==='bad')cls=a;
  const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();const d=document.createElement('div');d.className='toast '+cls;d.textContent=t;
  if(fn){const bt=document.createElement('button');bt.textContent=act;bt.onclick=()=>{d.remove();fn();};d.appendChild(bt);}
  box.appendChild(d);setTimeout(()=>d.remove(),fn?6500:2600);}

function burstAt(who,n){const st=$('#fstage');if(!st||reduce||TAB!=='fight')return;const el=$(who==='enemy'?'#sprE':'#sprH');if(!el)return;
  const r=el.getBoundingClientRect(),sr=st.getBoundingClientRect(),cx=r.left-sr.left+r.width/2,cy=r.top-sr.top+r.height*.6;
  for(let i=0;i<n;i++){const p=document.createElement('span');p.className='bp';const a=Math.random()*6.28,s=30+Math.random()*70;
    p.style.cssText=`left:${cx}px;top:${cy}px;background:${pick(['#ffe8a8','#8fd6b5','#cf4a3c','#ece3cf'])};--x:${Math.cos(a)*s}px;--y:${Math.sin(a)*s-20}px`;st.appendChild(p);setTimeout(()=>p.remove(),720);}}

  $('#hName').textContent=(S.name||'无名')+(S.rebirth?' · 第'+(S.rebirth+1)+'世':'');$('#hRealm').textContent=STAGES[S.stage].name;
  $('#hStones').textContent=fmt(S.stones);$('#hKarma').textContent=karmaName();$('#hQi').style.width=Math.min(100,S.qi/need*100)+'%';
  if(TAB==='cult'){const el=$('#cQi');if(!el)return;const p=Math.min(1,S.qi/need);el.textContent=fmt(S.qi);$('#cReq').textContent=fmt(need);

    $('#dtP').setAttribute('stroke-dashoffset',540.35*(1-p));$('#cstage').classList.toggle('full',p>=1);
    const sig=[S.stage,p>=1,S.pills,S.usePill,S.bossDown.length,S.karma>=3].join();if(sig!==breakSig){breakSig=sig;$('#cBreak').innerHTML=breakHTML();}}
  if(TAB==='fight')updateFight();
  if(TAB==='jade'){S.dt.slots.forEach((o,i)=>{const t=view.querySelector(`[data-jt="${i}"]`),b=view.querySelector(`[data-jb="${i}"]`);if(!t)return;

  $('#tabJade').disabled=!F('dongtian');}

  if(e){const n=$('#eName');n.textContent=e.n;n.className='n'+(e.boss?' boss':'');$('#eHp').style.width=Math.max(0,e.hp/e.max*100)+'%';$('#eHpN').textContent=fmt(Math.max(0,e.hp))+' / '+fmt(e.max);}
  else{$('#eName').textContent='—';$('#eHp').style.width='0';$('#eHpN').textContent='';}
  if(full)$('#bMsg').innerHTML=C.msg;
  const go=$('#bGo');go.textContent=C.on?'撤退':C.z===7?'下探第 '+(S.abyss+1)+' 层':'斩妖';go.className='btn'+(C.on?' ghost':'');
  const bb=$('#bBoss'),ok=C.z<7&&S.kills[C.z]>=KB;bb.hidden=C.z===7;bb.disabled=C.on||!ok;bb.textContent=ok?(S.bossDown.includes(C.z)?'再战首领':'挑战首领'):'首领 '+Math.min(S.kills[C.z],KB)+'/'+KB;
  const sw=$('#bSword');sw.disabled=!C.on||C.cdS>0;sw.textContent=C.cdS>0?'御剑 '+Math.ceil(C.cdS)+'s':'御剑 ×3';
  const hl=$('#bHeal');hl.disabled=!C.on||C.cdH>0;hl.textContent=C.cdH>0?'回春 '+Math.ceil(C.cdH)+'s':'回春 +'+Math.round(st.heal*100)+'%';
  const au=$('#bAuto');au.className='btn wide '+(C.auto?'on':'ghost');au.textContent=C.auto?'自动斩妖中（自动施法）':'自动斩妖';
  const sp=view.querySelector('[data-act="special"]');if(sp)sp.disabled=C.on;
  if(full)$('#myStats').innerHTML=`<div>攻击<b>${fmt(st.atk)}</b></div><div>防御<b>${fmt(st.def)}</b></div><div>生命<b>${fmt(st.hp)}</b></div><div>暴击<b>${(st.crit*100).toFixed(0)}%</b></div>`;}

/* ---------- 交互 ---------- */
const ACT={
 break:()=>breakthrough(),
 zone:a=>{const z=+a;if(C.z===z)return;C.on=false;C.auto=false;C.e=null;C.php=0;C.z=z;
   C.msg=z===7?'深渊每层只有一个守关者。每过一层，它们更强。':'选一处险地，点「斩妖」开战。';
   if(!S.visited.includes(z)){S.visited.push(z);checkStory();}render();},
 go:()=>{if(C.on){C.on=false;C.auto=false;C.e=null;C.msg='你退出了战斗。';drawEnemy();updateFight(true);}else startFight(false);},
 boss:()=>startFight(true),special:()=>{if(S.special)startFight(true,S.special);},
 sword:()=>sword(),heal:()=>heal(),
 auto:()=>{C.auto=!C.auto;if(C.auto&&!C.on){const b=C.z<7&&S.kills[C.z]>=KB&&!S.bossDown.includes(C.z);startFight(b);}updateFight(true);},
 play:a=>playStory(a),
 equip:a=>{const i=S.bag.findIndex(x=>x.id===+a);if(i<0)return;const it=S.bag[i];S.bag.splice(i,1);if(S.gear[it.slot])S.bag.push(S.gear[it.slot]);S.gear[it.slot]=it;toast('装备 '+itemName(it));render();save();},
 sell:a=>{const i=S.bag.findIndex(x=>x.id===+a);if(i<0)return;S.stones+=S.bag[i].sell;S.bag.splice(i,1);render();save();},
 sellWorse:()=>{let g=0,n=0;S.bag=S.bag.filter(it=>{if(!better(it)){g+=it.sell;n++;return false;}return true;});S.stones+=g;toast('出售 '+n+' 件，灵石 +'+fmt(g));render();save();},
 buyPill:()=>{const c=pillCost();if(S.stones<c)return;S.stones-=c;S.pills++;render();save();},
 buyQi:()=>{const c=qiPillCost();if(S.stones<c)return;S.stones-=c;S.qiPills++;render();save();},
 useQi:()=>{if(S.qiPills<1)return;S.qiPills--;addQi(req(S.stage)*.25);toast('服下聚气丹');render();save();},
 up:a=>{const u=UPS.find(x=>x.k===a),c=upCost(u);if(S.stones<c||(u.max&&S.ups[a]>=u.max))return;S.stones-=c;S.ups[a]++;toast(u.n+' 精进至第 '+S.ups[a]+' 重');render();save();},
 jpick:()=>{JPICK=!JPICK;render();},
 jput:a=>{if(jHalted()){toast('洞天停转中，先击退天穹追兵','bad');return;}if(a.startsWith('item:'))jPut('item',a.slice(5));else jPut(a);},
 jtake:a=>jTake(+a),
 jup:()=>{const c=jUpCost();if(S.stones<c||S.dt.lv>=9)return;S.stones-=c;S.dt.lv++;toast('玉简洞天 第 '+S.dt.lv+' 重');render();save();},
 export:()=>{save();let code='';try{code='LC1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){}const box=$('#saveBox');box.value=code;
   const fail=()=>{box.focus();box.select();toast('已生成，请长按全选后手动复制');};try{navigator.clipboard.writeText(code).then(()=>toast('存档码已复制，粘贴到备忘录保存'),fail);}catch(e){fail();}},
 import:()=>{const v=$('#saveBox').value.trim();if(!v){toast('先把存档码粘贴进上面的框里','bad');return;}let d=null;
   try{d=JSON.parse(decodeURIComponent(escape(atob(v.replace(/^LC1\./,'')))));}catch(e){}if(!d||typeof d.stage!=='number'){toast('存档码无法识别，请检查是否复制完整','bad');return;}
   if(!importArm){importArm=true;render();$('#saveBox').value=v;return;}importArm=false;S=hydrate(d);C.on=false;C.auto=false;C.e=null;C.z=0;save();toast('存档已导入：'+STAGES[S.stage].name,'big');dotUpdate();render();},
 reset:()=>{if(!resetArm){resetArm=true;render();setTimeout(()=>{if(resetArm){resetArm=false;if(TAB==='ups')render();}},4000);return;}
   resetArm=false;try{localStorage.removeItem(KEY);}catch(e){}S=fresh();C.on=false;C.auto=false;C.e=null;C.z=0;render();intro();}
};
view.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.dataset.act!=='import')importArm=false;ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.arg,b);});
view.addEventListener('change',e=>{if(e.target.id==='usePill'){S.usePill=e.target.checked;breakSig='';live();}});
view.addEventListener('pointerdown',e=>{const st=e.target.closest('#cstage');if(!st||e.target.closest('button'))return;e.preventDefault();
  const g=tapGain();S.taps++;addQi(g);const r=st.getBoundingClientRect();
  const p=document.createElement('span');p.className='plus';p.textContent='+'+(g<10?g.toFixed(1):fmt(g));p.style.left=(e.clientX-r.left-14)+'px';p.style.top=(e.clientY-r.top-24)+'px';st.appendChild(p);setTimeout(()=>p.remove(),920);
  if(!reduce){const cx=r.width/2,cy=r.height*.62;for(let i=0;i<7;i++){const q=document.createElement('span');q.className='pt';const a=Math.random()*6.28,d=r.width*(.35+Math.random()*.2);
    q.style.cssText=`left:${cx}px;top:${cy}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;animation-delay:${i*30}ms`;st.appendChild(q);setTimeout(()=>q.remove(),900);}}
  live();});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;TAB=b.dataset.tab;resetArm=false;importArm=false;JPICK=false;view.scrollTop=0;render();}));
let rsT=0;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{paintAll();if(SC)paintTo($('#vbg'),SC.bg);},200);});

/* ---------- 主循环 ---------- */
let lastT=performance.now(),uiAcc=0;
function loop(t){const dt=Math.min(1,(t-lastT)/1000);lastT=t;if(S.started){addQi(idleRate()*dt);battleUpdate(dt);jTick(dt);}
  uiAcc+=dt;if(uiAcc>.2){uiAcc=0;live();}requestAnimationFrame(loop);}
function offline(){const now=Date.now(),sec=(now-S.last)/1000;S.last=now;if(!S.started||sec<5)return;jTick(sec);if(sec<90)return;
  const capH=8+S.ups.juling,eff=.6+.04*S.ups.juling,t=Math.min(sec,capH*3600),before=STAGES[S.stage].name,gain=idleRate()*t*eff;addQi(gain,true);
  const h=Math.floor(t/3600),m=Math.floor(t%3600/60),ready=S.dt.slots.filter(o=>o.left<=0).length;
  modal(`<h3>闭关归来</h3><p>你闭关了 <b>${h?h+' 小时 ':''}${m} 分</b>${sec>capH*3600?'（上限 '+capH+' 小时）':''}</p><p>吸纳灵气 <b>${fmt(gain)}</b></p>${before!==STAGES[S.stage].name?`<p>境界 ${before} → <b>${STAGES[S.stage].name}</b></p>`:''}${ready?`<p>玉台上有 <b>${ready}</b> 样东西温养好了。</p>`:''}${nextInfo().major&&S.qi>=req(S.stage)?'<p>丹田已满，可以冲关了。</p>':''}`,
   [{t:'出关',cls:'gold',fn:()=>{render();const p=S.pending.find(id=>{const c=STORY.find(x=>x.id===id);return c&&!c.side;});if(p)toast('有新剧情可看','观看',()=>playStory(p));}}],cultScene());save();}
function intro(){const ov=$('#ov');ov.hidden=false;ov.className='vn';let g=S.gender||'m';
  ov.innerHTML=`<canvas class="vbg" id="vbg"></canvas><div class="inner"><div class="intro"><div class="yr">二〇四九 · 灵潮</div><h1>灵潮<span>修仙</span>录</h1>
   <p>天裂之后第三年。你是地铁避难所里的一个拾荒者。</p><div class="seg"><button data-g="m" aria-pressed="${g==='m'}">少年</button><button data-g="f" aria-pressed="${g==='f'}">少女</button></div>
   <input id="nmIn" maxlength="6" placeholder="你的名字" autocomplete="off"><button class="btn gold" id="nmGo">踏入灵潮</button></div></div>`;
  requestAnimationFrame(()=>paintTo($('#vbg'),'sky'));
  ov.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{g=b.dataset.g;ov.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  const go=()=>{const v=($('#nmIn').value||'').trim().replace(/[<>&"]/g,'');S.gender=g;S.name=v||pick(g==='f'?['苏迟','沈青','林晚','顾宁']:['林砚','陆川','沈野','顾行']);save();playStory('prologue');};
  $('#nmGo').onclick=go;$('#nmIn').addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{lastT=performance.now();offline();}});
addEventListener('pagehide',save);setInterval(()=>{if(S.started)save();},5000);
function start(data){S=data&&data.S?hydrate(data.S):load();render();dotUpdate();
  if(!S.name||!S.started){if(S.name&&!S.seen.includes('prologue'))playStory('prologue');else intro();}else{offline();checkStory(true);}
  requestAnimationFrame(t=>{lastT=t;loop(t);});}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
if(location.hash==='#debug')window.__lc={get S(){return S;},set S(v){S=v;},C,ACT,playStory,checkStory,render,jTick,save};

})();
</script>
